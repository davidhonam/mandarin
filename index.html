ef":"to grab, to catch, to arrest","ex":[{"zh":"小偷被警察抓到了。","py":"Xiǎotōu bèi jǐngchá zhuādào le.","en":"The thief was arrested by police."},{"zh":"他去海边抓鱼。","py":"Tā qù hǎibiān zhuā yú.","en":"He catches fishes at the beach."}]},{"id":689,"hanzi":"全国","part":"Noun","pinyin":"quánguó","def":"whole nation, nationwide","ex":[{"zh":"全国都在庆祝新年。","py":"Quánguó dōu zài qìngzhù xīnnián.","en":"The whole country is celebrating new year."},{"zh":"全国的大学都在考试。","py":"Quánguó de dàxué dōu zài kǎoshì.","en":"Entire colleges of the country are having an exam."}]},{"id":690,"hanzi":"长城","part":"Noun","pinyin":"chángchéng","def":"the Great Wall","ex":[{"zh":"中国最有名的是长城。","py":"Zhōngguó zuì yǒumíng de shì Chángchéng.","en":"The most famous thing in China is the Great Wall."},{"zh":"大家都在排队看长城","py":"Dàjiā dōu zài páiduì kàn chángchéng.","en":"Everyone is queuing up for the Great Wall."}]},{"id":691,"hanzi":"故事","part":"Noun","pinyin":"gùshì","def":"story, tale","ex":[{"zh":"睡觉以前妈妈都会说故事给我听。","py":"Shuìjiào yǐqián māma dōu huì shuō gùshì gěi wǒ tīng.","en":"Mother used to tell me stories before I went to bed."},{"zh":"这个故事听起来很有意思。","py":"Zhègè gùshì tīng qǐlái hěn yǒuyìsi.","en":"This story sounds interesting."}]},{"id":692,"hanzi":"一下","part":"Adj","pinyin":"yīxià","def":"a bit","ex":[{"zh":"等一下，我去拿手机。","py":"Děng yīxià, wǒ qù ná shǒujī.","en":"Wait a minute, I'll get my phone."},{"zh":"这个问题虽然比较愚蠢，但是我还是要问一下。","py":"Zhègè wèntí suīrán bǐjiào yúchǔn ，dànshì wǒ háishì yào wèn yixià。","en":"Although this question is a bit stupid, I still have to ask."}]},{"id":693,"hanzi":"也","part":"Adv","pinyin":"yě","def":"and also","ex":[{"zh":"我有一本书，他也有一本书。","py":"Wǒ yǒuyī běn shū, tā yěyǒu yī běn shū.","en":"I have a book, he also has a book."},{"zh":"他不睡觉也不吃饭。","py":"Tā bú shuìjiào yě bù chīfàn.","en":"He doesn’t sleep or eat."}]},{"id":694,"hanzi":"再","part":"Adv","pinyin":"zài","def":"again, once more","ex":[{"zh":"再见！","py":"Zàijiàn!","en":"Goodbye!"},{"zh":"请您再说一次。","py":"Qǐng nín zài shuō yīcì.","en":"Can you please say it one more time?"}]},{"id":695,"hanzi":"出","part":"Adj/Adv","pinyin":"chū","def":"out, outer, outside","ex":[{"zh":"出口在哪儿？","py":"Chūkǒu zài nǎ'er?","en":"Where's the exit?"},{"zh":"我得出门去上课!","py":"Wǒ děi chū mén qù shàng kè.","en":"I have to go out to go to class."}]},{"id":696,"hanzi":"别","part":"Adv","pinyin":"bié","def":"do not, don't do sth.","ex":[{"zh":"别说话，大家都睡了。","py":"Bié shuōhuà, dàjiā dōu shuìle.","en":"Don't speak, everyone's sleeping."},{"zh":"别急！时间还没到呢！你可以慢慢来。","py":"Bié jí! Shíjiān hái méi dào ne! Nǐ kěyǐ màn man lái.","en":"Do not worry! Time is not yet up! You can do slowly."}]},{"id":697,"hanzi":"卖","part":"Verb","pinyin":"mài","def":"to sell","ex":[{"zh":"我们不卖酒。","py":"Wǒmen bù mài jiǔ.","en":"We do not sell alcohol."},{"zh":"这本杂志卖得很好。","py":"Zhè běn zázhì mài de hěn hǎo.","en":"This magazine sells well."}]},{"id":698,"hanzi":"可以","part":"Verb","pinyin":"kěyǐ","def":"to be able to, can","ex":[{"zh":"我可以去厕所吗？","py":"Wǒ kěyǐ qù cèsuǒ ma?","en":"May I go to the bathroom?"},{"zh":"你可以教我怎么说英语吗?","py":"Nǐ kěyǐ jiāo wǒ zěnme shuō yīngyǔ ma?","en":"Can you teach me how to speak English?"}]},{"id":699,"hanzi":"右边","part":"Noun/Adj","pinyin":"yòubiān","def":"right, right side","ex":[{"zh":"地铁站右边有一间饭店。","py":"Dìtiě zhàn yòubiān yǒuyī jiàn fàndiàn.","en":"There is a hotel on the right side of the subway station."},{"zh":"在我家后面以及右边都有新的大楼。","py":"Zài wǒjiā hòumiàn yǐjí yòubiān dōuyǒu xīnde dàlóu.","en":"There is a new building on the back of my house and on the right."}]},{"id":700,"hanzi":"吧","part":"Conj","pinyin":"ba","def":"Right now","ex":[{"zh":"我们一起吃中饭吧!","py":"Wǒmen yìqǐ chī zhōngfàn ba!","en":"Let’s eat lunch together."},{"zh":"这是我的学校，很漂亮吧?","py":"Zhè shì wǒ de xuéxiào, hěn piàoliang ba?","en":"This is my school. It's really pretty, isn't it?"}]},{"id":701,"hanzi":"因为…所以…","part":"Grammar","pinyin":"yīnwèi…suǒyǐ…","def":"Because Therefore…","ex":[{"zh":"因为他后天要去北京工作，所以明天晚上我们一起去酒吧喝酒聊天吧!","py":"Yīnwèi tā hòutiān yào qù Běijīng gōngzuò, suǒyǐ míngtiān wǎnshàng wǒmen yìqǐ qù jiǔbā hējiǔ liáotiān ba.","en":"He is going to work in Peking the day after tomorrow, so let’s go to the bar and have a drink tomorrow night."},{"zh":"北京的天气很冷，因为开车出门不方便，所以很多人都搭地铁。","py":"Běijīng de tiānqì hěn lěng, yīnwèi kāichē chūmén bù fāngbiàn, suǒyǐ hěn duō rén dōu dā dìtiě.","en":"The weather in Beijing is cold. Driving is not convenient therefore a lot of people take a subway."}]},{"id":702,"hanzi":"外","part":"Adj","pinyin":"wài","def":"outer, outside","ex":[{"zh":"门外有一只狗。","py":"Mén wài yǒu yī zhī gǒu.","en":"There is a dog outside the door."},{"zh":"外面下雪了，真漂亮。","py":"Wàimiàn xiàxuě le, zhēn piàoliang.","en":"It’s snowing outside, it’s very pretty."}]},{"id":703,"hanzi":"女","part":"Noun/Adj","pinyin":"nǚ","def":"female, feminine","ex":[{"zh":"王铎是女生的名字吗？","py":"Wáng duó shì nǚshēng de míngzì ma?","en":"Is Wang Duo a girl's name?"},{"zh":"你昨天跟女朋有去哪儿约会呢？","py":"Nǐ zuótiān gēn nǚ péng yǒu qù nǎ‘er yuēhuì ne？","en":"Did you have a date with your girlfriend?"}]},{"id":704,"hanzi":"它","part":"Pronoun","pinyin":"tā","def":"it","ex":[{"zh":"它三岁，名字叫小黑。","py":"Tā sān suì, míngzì jiào xiǎo hēi.","en":"It's three years old, we call him Little Blackie."},{"zh":"这张椅子坏了，把它搬出去。","py":"Zhè zhāng yǐzi huài le, bǎ tā bān chūqù.","en":"The chair is broken, take it out."}]},{"id":705,"hanzi":"完","part":"Verb","pinyin":"wán","def":"to finish","ex":[{"zh":"我写完作业了。","py":"Wǒ xiě wán zuòyèle.","en":"I finished writing my homework."},{"zh":"这件事很急，我今天一定要做完。","py":"Zhè jiàn shì hěn jí, wǒ jīntiān yídìngyào zuò wán.","en":"This is urgent, I have to finish it today."}]},{"id":706,"hanzi":"宾馆","part":"Noun","pinyin":"bīnguǎn","def":"hotel, guest house, lodge","ex":[{"zh":"师傅，我要去你好宾馆。","py":"Shīfù, wǒ yào qù nǐ hǎo bīnguǎn.","en":"Master, I want to go to your hotel."}]},{"id":707,"hanzi":"对","part":"Prep","pinyin":"duì","def":"Correct","ex":[{"zh":"你是大卫，对吗？","py":"Nǐ shì dà wèi, duì ma?","en":"You're David, right?"},{"zh":"对了，他昨天告诉我他不来学校。","py":"Duìle, tā zuótiān gàosù wǒ tā bù lái xuéxiào.","en":"By the way, he told me yesterday that he is not coming to school."}]},{"id":708,"hanzi":"左边","part":"Noun/Adj","pinyin":"zuǒbiān","def":"left, left side","ex":[{"zh":"我家的左边是银行。","py":"Wǒjiā de zuǒbiān shì yínháng.","en":"There's a bank on the left side of my house."}]},{"id":709,"hanzi":"往","part":"Prep","pinyin":"wǎng","def":"to","ex":[{"zh":"往前走，第二个路口左拐。","py":"Wǎng qián zǒu, dì èr gè lùkǒu zuǒ guǎi.","en":"Go ahead and turn left at the second intersection."},{"zh":"请往这边走，有更多的商品可以看。","py":"Qǐng wǎng zhè biān zǒu, yǒu gèng duō de shāngpǐn kěyǐ kàn.","en":"Please come this way, there are more products you can see."}]},{"id":710,"hanzi":"您","part":"Pronoun","pinyin":"nín","def":"you (polite form)","ex":[{"zh":"您好，这是我的名片。","py":"Nín hǎo, zhè shì wǒ de míngpiàn.","en":"Hello, this is my business card."},{"zh":"今天下午我给您发送了一封邮件,不知道您收到了吗？","py":"Jīntiān xiàwǔ wǒ gěi nín fāsòng le yì fēng yóujiàn, bù zhīdào nín shōudào le ma ？","en":"I sent you an email this afternoon. Don't know if you received or not?"}]},{"id":711,"hanzi":"手表","part":"Noun","pinyin":"shǒubiǎo","def":"watch, a wristwatch","ex":[{"zh":"我的手表不见了。","py":"Wǒ de shǒubiǎo bùjiànle.","en":"I can't find my watch."},{"zh":"我不喜欢收藏手表。","py":"Wǒ bù xǐhuan shōucáng shǒubiǎo.","en":"I do not like collecting watches."}]},{"id":712,"hanzi":"打篮球","part":"Verb Object","pinyin":"dǎ lánqiú","def":"to play basketball","ex":[{"zh":"星期天我都去公园打篮球。","py":"Xīngqī tiān wǒ dōu qù gōngyuán dǎ lánqiú.","en":"I'll to go to the park Sunday to play basketball."},{"zh":"你打篮球吗?","py":"Nǐ dǎ lánqiú ma?","en":"Do you play basketball?"}]},{"id":713,"hanzi":"找","part":"Verb","pinyin":"zhǎo","def":"to find","ex":[{"zh":"找您五毛，谢谢！","py":"Zhǎo nín wǔmáo, xièxiè!","en":"Here are five cents back, thank you!"},{"zh":"我忘了我的护照放在哪里，请帮我找一找。","py":"Wǒ wàng le wǒ de hùzhào fàng zài nǎlǐ, qǐng bāng wǒ zhǎo yì zhǎo.","en":"I forgot where my passport was, please help me find it."}]},{"id":714,"hanzi":"教室","part":"Noun","pinyin":"jiàoshì","def":"classroom","ex":[{"zh":"这间教室不大。","py":"Zhè jiān jiàoshì bù dà.","en":"This classroom is small."},{"zh":"教室里有二十个座位。","py":"Jiàoshì lǐ yǒu èrshí ge zuòwèi.","en":"There are twenty seats in the classroom."}]},{"id":715,"hanzi":"早上","part":"Noun","pinyin":"zǎoshang","def":"morning","ex":[{"zh":"我早上六点起床。","py":"Wǒ zǎoshang liù diǎn qǐchuáng.","en":"I wake up at six in the morning."},{"zh":"明天早上我们要去故宫参观。","py":"Míngtiān zǎoshàng wǒmen yào qù gùgōng cānguān.","en":"We will go to the Forbidden city tomorrow morning."}]},{"id":716,"hanzi":"晴","part":"Adj","pinyin":"qíng","def":"clear, sunny","ex":[{"zh":"昨天是晴天。","py":"Zuótiān shì qíngtiān.","en":"Yesterday was sunny."},{"zh":"晴天的时候，我喜欢到我家附近的公园跑一跑。","py":"Qíngtiān de shíhou, wǒ xǐhuan dào wǒjiā fùjìn de gōngyuán pǎo yī pǎo.","en":"On sunny days I like to go running in the park near my home."}]},{"id":717,"hanzi":"正在","part":"Adv","pinyin":"zhèngzài","def":"Is on","ex":[{"zh":"他正在睡觉。","py":"Tā zhèngzài shuìjiào.","en":"He's sleeping."},{"zh":"他正在争取出国念书的机会。","py":"Tā zhèngzài zhēngqǔ chūguó niànshū de jīhuì.","en":"He's striving for the chance to study abroad."}]},{"id":718,"hanzi":"每","part":"Adj/Adv","pinyin":"měi","def":"each, every","ex":[{"zh":"我每天喝茶。","py":"Wǒ měitiān hē chá.","en":"I drink tea every day."},{"zh":"每个周末我都会跟朋友去打球","py":"Měi gè zhōumò wǒ dōu huì gēn péngyou qù dǎqiú","en":"I play basketball with my friends every weekend."}]},{"id":719,"hanzi":"比","part":"Prep","pinyin":"bǐ","def":"ratio","ex":[{"zh":"她不比我高。","py":"Tā bùbǐ wǒ gāo.","en":"She isn't taller than me."},{"zh":"你的家人都比你高吗？","py":"Nǐ de jiārén dōu bǐ nǐ gāo ma?","en":"Is your family all taller than you?"}]},{"id":720,"hanzi":"洗","part":"Verb","pinyin":"xǐ","def":"to wash, to clean","ex":[{"zh":"吃饭前先洗手。","py":"Chīfàn qián xiān xǐshǒu.","en":"Wash your hands before eating."},{"zh":"洗完菜以后，下一步就是准备放到锅子里炒了。","py":"Xǐ wán cài yǐhòu, xìa yí bù jiùshì zhǔnbèi fàng dào guōzi lǐ chǎo le.","en":"After washing the vegetable, the next step is to cook it in the pan."}]},{"id":721,"hanzi":"火车站","part":"Noun","pinyin":"huǒchēzhàn","def":"train station","ex":[{"zh":"我的酒店旁边有火车站。","py":"Wǒ de jiǔdiàn pángbiān yǒu huǒchēzhàn.","en":"There is a train station next to my hotel."},{"zh":"这间房子在火车站附近，所以很吵。","py":"Zhèjiān fángzi zài huǒchēzhàn fùjìn, suǒyǐ hěnchǎo.","en":"The house is near the train station, so it is noisy."}]},{"id":722,"hanzi":"玩","part":"Verb","pinyin":"wán","def":"to play, to have fun, to hang out","ex":[{"zh":"我们常常一起去公园玩。","py":"Wǒmen chángcháng yīqǐ qù gōngyuán wán.","en":"We often go to the park to hang out together."},{"zh":"我觉得做饭很好玩儿。","py":"Wǒ juéde zuòfàn hěn hǎowánēr.","en":"I think cooking is fun."}]},{"id":723,"hanzi":"男","part":"Noun/Adj","pinyin":"nán","def":"man, male, masculine","ex":[{"zh":"请问男厕在哪儿？","py":"Qǐngwèn nán cè zài nǎ'er?","en":"Where is the male restroom?"},{"zh":"我的男朋友现在在国外工作，我非常想他。","py":"Wǒ de nánpéngyou xiànzài zài guówài gōngzuò, wǒ fēicháng xiǎng tā.","en":"My boyfriend is working abroad, I miss him so much."}]},{"id":724,"hanzi":"着","part":"Adv","pinyin":"zhe","def":"an action currently happening , -ing","ex":[{"zh":"今天我哥哥背着昨天买的新背包。","py":"Jīntiān wǒ gēgē bèizhe zuótiān mǎi de xīn bēibāo.","en":"My brother is carrying the bag which he bought yesterday."},{"zh":"你知道那里挂着什么吗?","py":"Nǐ zhīdào nàlǐ guàzhe shénme ma?","en":"Do you know what is hanging there?"}]},{"id":725,"hanzi":"票","part":"Noun","pinyin":"piào","def":"ticket","ex":[{"zh":"我有两张电影票。","py":"Wǒ yǒu liǎng zhāng diànyǐng piào.","en":"I have two movie tickets."},{"zh":"中国的车票很便宜。","py":"Zhōngguó de chēpiào hěn piányi.","en":"Train tickets in China are very cheap."}]},{"id":726,"hanzi":"离","part":"Adj/Adv","pinyin":"lí","def":"from","ex":[{"zh":"地铁站离学校三百公尺。","py":"Dìtiě zhàn lí xuéxiào sānbǎi gōng chǐ.","en":"The subway station is 300 meters from the school."},{"zh":"离我家最远的商店要走一小时。","py":"Lí wǒ jiā zuì yuǎn de shāngdiàn yào zǒu yì xiǎoshí.","en":"The most far away shop from my house take an hour by walking."}]},{"id":727,"hanzi":"穿","part":"Verb","pinyin":"chuān","def":"to wear, to dress","ex":[{"zh":"穿红色衣服的人是我哥哥。","py":"Chuān hóngsè yīfú de rén shì wǒ gēgē.","en":"The one wearing red is my older brother."},{"zh":"这件毛衣你穿起来一定很好看。","py":"Zhè jiàn máoyī nǐ chuān qǐlái yídìng hěn hǎokàn.","en":"This sweater you wear it must look good."}]},{"id":728,"hanzi":"第一","part":"Adj","pinyin":"dì yī","def":"the first, 1st, number one","ex":[{"zh":"小志每天都第一个到办公室的人。","py":"Xiǎo zhì měitiān dū dì yī gè dào bàngōngshì de rén.","en":"Xiao Zhi is the first person to the office every day."},{"zh":"这是我的父母，他们第一次来这间餐厅。","py":"Zhè shì wǒ de fùmǔ, tāmen dì yī cì lái zhè jiān cāntīng.","en":"They are my parents, it is their first time to come to this restaurant."}]},{"id":729,"hanzi":"红","part":"Adj","pinyin":"hóng","def":"red","ex":[{"zh":"红色的杯子不是小锦的。","py":"Hóngsè de bēizi bùshì Xiǎo Jǐn de.","en":"The red cup is not Xiao Jin's."},{"zh":"那位戴红色的帽子的男生是我的弟弟。","py":"Nà wèi dài hóngsè de màozi de nánshēng shì wǒ de dìdi.","en":"That man who is wearing a red hat is my younger brother."}]},{"id":730,"hanzi":"虽然…但是…","part":"Grammar","pinyin":"suīrán…dànshì…","def":"However, although…","ex":[{"zh":"她的男朋友虽然胖，但是比你高得多了！","py":"Tā de nánpéngyou suīrán pàng, dànshì bǐ nǐ gāo de duō le!","en":"Although her boyfriend is fat, he is much taller than you!"},{"zh":"虽然他住在北京这么久了，但是还是会迷路。","py":"Suīrán tā zhù zài Běijīng zhème jiǔ le, dànshì háishì huì mílù.","en":"Although he lives in Beijing for a long time, but he still gets lost ."}]},{"id":731,"hanzi":"西瓜","part":"Noun","pinyin":"xīguā","def":"watermelon","ex":[{"zh":"我要去买西瓜汁，你去不去？","py":"Wǒ yào qù mǎi xīguā zhī, nǐ qù bù qù?","en":"I'm going to buy watermelon juice, do you wanna go?"}]},{"id":732,"hanzi":"让","part":"Verb","pinyin":"ràng","def":"to let, make, allow, cause","ex":[{"zh":"他常常忘东忘西，让妈妈很生气。","py":"Tā chángcháng wàng dōng wàng xī , ràng māma hěn shēngqì.","en":"He often forgets things, making his mother angry."},{"zh":"这个工作不轻松,让我从早忙到晚。","py":"Zhège gōngzuò bù qīngsōng, ràng wǒ cóng zǎo máng dào wǎn .","en":"This job is not easy, it has me busy from morning to evening."}]},{"id":733,"hanzi":"贵","part":"Adj","pinyin":"guì","def":"expensive","ex":[{"zh":"这件衣服都很贵，但是质量很好。","py":"Zhè jiàn yīfú dōu hěn guì, dànshì zhìliàng hěn hǎo.","en":"This piece of clothing is expensive, but the quality is great."},{"zh":"这个东西真贵。","py":"Zhège dōngxi zhēn guì.","en":"This thing is really expensive."}]},{"id":734,"hanzi":"跑步","part":"Verb Object","pinyin":"pǎobù","def":"to run","ex":[{"zh":"我每天跑步六十分钟。","py":"Wǒ měitiān pǎobù liùshí fēnzhōng.","en":"I run for sixty minutes a day."},{"zh":"你跑步时听音乐吗？","py":"Nǐ pǎobù shí tīng yīnyuè ma?","en":"Do you listen to music when you go jogging?"}]},{"id":735,"hanzi":"踢足球","part":"Verb Object","pinyin":"tīzúqiú","def":"to play soccer","ex":[{"zh":"他不会踢足球，但是喜欢看足球比赛。","py":"Tā bù huì tīzúqiú, dànshì xǐhuān kàn zúqiú bǐsài.","en":"He doesn't play soccer, but likes to watch soccer matches."},{"zh":"他踢足球的技术进步多了，跟三年前完全不一样。","py":"Tā tīzúqiú de jìshù jìnbù duō le ，gēn sān nián qián wánquán bù yíyàng.","en":"He plays football with much better technique, unlike three years ago."}]},{"id":736,"hanzi":"还","part":"Adj/Adv","pinyin":"hái","def":"also, or","ex":[{"zh":"这件裤子还有别的颜色吗？","py":"Zhè jiàn kù zǐ hái yǒu bié de yánsè ma?","en":"Do you have this pair of pants in other colors?"},{"zh":"你想住在山上还是海边？","py":"Nǐ xiǎng zhù zài shānshàng háishì hǎibiān?","en":"Do you want to live in the mountains or along the seaside?"}]},{"id":737,"hanzi":"进","part":"Verb","pinyin":"jìn","def":"to enter","ex":[{"zh":"请进，请坐。","py":"Qǐng jìn, qǐng zuò.","en":"Come in, have a seat."},{"zh":"我的房东常常自己开门进来，我该怎么办？","py":"Wǒ de fángdōng chángcháng zìjǐ kāimén jìnlái, wǒ gāi zěnmebàn?","en":"My landlord often lets himself into my room. How should I deal with it?"}]},{"id":738,"hanzi":"铅笔","part":"Noun","pinyin":"qiānbǐ","def":"pencil","ex":[{"zh":"可以借我一支铅笔吗？","py":"Kěyǐ jiè wǒ yī zhī qiānbǐ ma?","en":"Can I borrow a pencil?"}]},{"id":739,"hanzi":"错","part":"Noun/Verb","pinyin":"cuò","def":"wrong, to wrong, to err, error, mistake","ex":[{"zh":"这个字我写错了。","py":"Zhège zì wǒ xiě cuòle.","en":"I wrote this character incorrectly."},{"zh":"我写错他家的地址了，所以他没有收到信。","py":"Wǒ xiě cuò tā jiā de dìzhǐ le, suǒyǐ tā méiyǒu shōudào xìn.","en":"I wrote the address of his home wrong, so he did not receive the letter."}]},{"id":740,"hanzi":"门","part":"Noun","pinyin":"mén","def":"door","ex":[{"zh":"请关门，谢谢。","py":"Qǐng guānmén, xièxiè.","en":"Please shut the door, thank you."},{"zh":"门外有一只狗。","py":"Mén wài yǒu yī zhī gǒu.","en":"There is a dog outside the door."}]},{"id":741,"hanzi":"问","part":"Verb","pinyin":"wèn","def":"to ask, to inquire","ex":[{"zh":"有没有问题？","py":"Yǒu méiyǒu wèntí?","en":"Any questions?"},{"zh":"你去服务台问一问，有没有人看见你的钱包。","py":"Nǐ qù fúwùtái wèn yí wèn, yǒu méiyǒu rén kànjiàn nǐ de qiánbāo.","en":"You go to the desk to ask to see if anyone has seen your wallet."}]},{"id":742,"hanzi":"阴","part":"Adj","pinyin":"yīn","def":"cloudy","ex":[{"zh":"这个星期每天都是阴天。","py":"Zhège xīngqī měitiān dū shì yīn tiān.","en":"This week is cloudy every day."},{"zh":"明天不会下雨，是阴天。","py":"Míngtiān bú huì xià yǔ, shì yīn tiān.","en":"It won’t rain tomorrow, it will be a cloudy day."}]},{"id":743,"hanzi":"雪","part":"Noun","pinyin":"xuě","def":"snow","ex":[{"zh":"你看，下雪了。","py":"Nǐ kàn, xiàxuě le.","en":"You see, it's snowing。"},{"zh":"外面下雪了，真漂亮。","py":"Wàimiàn xiàxuě le, zhēn piàoliang.","en":"It’s snowing outside, it’s very pretty."}]},{"id":744,"hanzi":"零","part":"Numeral","pinyin":"líng","def":"zero","ex":[{"zh":"今年是二零一七年。","py":"Jīnnián shì èr líng yīqī nián.","en":"This year it is 2017."},{"zh":"谁能想到他二零一一年的时候竟然意外死亡了。","py":"Shéi néng xiǎngdào tā èr líng yīyī nián de shíhòu jìngrán yìwài sǐwángle.","en":"Who would've thought that in two thousand and eleven he would accidentally die?"}]},{"id":745,"hanzi":"面条","part":"Noun","pinyin":"miàntiáo","def":"noodles","ex":[{"zh":"面条是我们的主食。","py":"Miàntiáo shì wǒmen de zhǔshí.","en":"Noodles are one of our staple foods."},{"zh":"我在中国上学的时候，特别喜欢吃面条。","py":"Wǒ zài Zhōngguó shàngxué de shíhou, tèbié xǐhuan chī miàntiáo.","en":"When I studied in China, I really enjoyed eating noodles."}]},{"id":746,"hanzi":"黑","part":"Adj","pinyin":"hēi","def":"black","ex":[{"zh":"我喜欢这件黑色的衣服。","py":"Wǒ xǐhuān zhè jiàn hēisè de yīfú.","en":"I like this black dress."},{"zh":"这个电影是黑色幽默类型的电影。","py":"Zhège diànyǐng shì hēisè yōumò lèixíng de diànyǐng.","en":"This movie is a dark comedy type."}]},{"id":747,"hanzi":"做梦","part":"Verb Object","pinyin":"zuòmèng","def":"to dream","ex":[{"zh":"我最近常常做梦，梦见我在海边晒太阳。","py":"Wǒ zuìjìn chángcháng zuòmèng, mèngjiàn wǒ zài hǎibiān shài tàiyáng.","en":"Recently I've dreamed often, dreaming of tanning on the beach."},{"zh":"同屋说我做梦时都会说梦话。","py":"Tóngwū shuō wǒ zuò mèng shí dōu huì shuō mèng huà。","en":"My roommate says when I dream, I talk in my sleep."}]},{"id":748,"hanzi":"叫","part":"Verb","pinyin":"jiào","def":"to call","ex":[{"zh":"下个星期天把朋友们都叫来一起吃饭。","py":"Xià gè xīngqītiān bǎ péngyoumen dōu jiào lái yìqǐ chīfàn.","en":"Next Sunday, let's gather friends to eat together."},{"zh":"爸爸叫我多跟他们一起出去。","py":"Bà bà jiào wǒ duō gēn tā men yī qǐ chū qù.","en":"My dad told me to go out with them."}]},{"id":749,"hanzi":"没错","part":"Phrase","pinyin":"méicuò","def":"That's right!","ex":[{"zh":"A: 我想他喜欢吃面条和蛋糕。 B: 没错！你都说对了，他喜欢吃面条和蛋糕。","py":"A: Wǒ xiǎng tā xǐhuan chī miàntiáo hé dàngāo. B: Méicuò! Nǐ dōu shuō duìle, tā xǐhuan chī miàntiáo hé dàngāo.","en":"A: I think he likes to eat noodles and cake. B: Yes! You're right, he likes to eat noodles and cakes."},{"zh":"你说的没错，我明天就会搬出去住。","py":"Nǐ shuō de méi cuò ，wǒ míng tiān jiù huì bān chū qù zhù。","en":"You're right, I will move out tomorrow."}]},{"id":750,"hanzi":"小看","part":"Verb","pinyin":"xiǎokàn","def":"to despise, to underestimate","ex":[{"zh":"你不要小看他了，他是会功夫的。","py":"Nǐ búyào xiǎokàn tā le, tā shì huì gōngfu de.","en":"You shouldn't underestimate him, he can do kung fu."},{"zh":"不能小看这一份工作，虽然不难但是非常重要。","py":"Bù néng xiǎo kàn zhè yī fèn gōng zuò，suī rán bù nán dàn shì fēi cháng zhòng yào。","en":"You can't underestimate this job, although not difficult, it is extremely important."}]},{"id":751,"hanzi":"说定了","part":"Phrase","pinyin":"shuō dìng le","def":"deal","ex":[{"zh":"就这么说定了，这个星期六我们一起去海边。","py":"Jiù zhème shuō dìng le, zhègè xīngqīliù wǒmen yìqǐ qù hǎibiān.","en":"It's a deal, let's go to the beach this Saturday."},{"zh":"说定了下一次同学会由你主办。","py":"Shuō dìng le xià yī cì tóng xué huì yóu nǐ zhǔ bàn。","en":"It's done, next classmate meeting will be run by you."}]},{"id":752,"hanzi":"汤","part":"Noun","pinyin":"tāng","def":"soup","ex":[{"zh":"在冬天，喝一碗热汤，能让身体温暖。","py":"Zài dōngtiān, hē yì wǎn rètāng, néng ràng shēntǐ wēnnuǎn.","en":"In the winter, drink a bowl of hot soup to make the body warm."},{"zh":"我的拿手菜是西红柿汤。","py":"Wǒ de náshǒu cài shì xīhóngshìtāng。","en":"My special dish is tomato soup."}]},{"id":753,"hanzi":"露一手","part":"Phrase","pinyin":"lòuyìshǒu","def":"show","ex":[{"zh":"现在换你做饭了，快露一手让我们看看。","py":"Xiànzài huàn nǐ zuòfàn le, kuài lòuyìshǒu ràng wǒmen kànkan.","en":"Now let's switch and have you cook, then we can quickly see first hand."},{"zh":"他跆拳道国手，可以叫他露一手给你看。","py":"Tā táiquándào guóshǒu, kěyǐ jiào tā lòuyīshǒu gěi nǐ kàn.","en":"He's a national Taekwando athlete, you can ask him to show you."}]},{"id":754,"hanzi":"养","part":"Verb","pinyin":"yǎng","def":"to raise, to bring up, to cultivate","ex":[{"zh":"妈妈做的饭很好吃，把妹妹养得白白胖胖的。","py":"Māma zuò de fàn hěn hàochī, bǎ mèimei yǎng de báibái pàng pàng de.","en":"Mother made very delicious meals, making her sister quite fat."},{"zh":"我一直都很想养一只哈士奇。","py":"Wǒ yī zhí dōu hěn xiǎng yǎng yī zhī hā shì qí.","en":"I always wanted to raise a husky dog."}]},{"id":755,"hanzi":"终于","part":"Adv","pinyin":"zhōngyú","def":"finally","ex":[{"zh":"我终于学会开车了。","py":"Wǒ zhōngyú xuéhuì kāichē le.","en":"I finally learned how to drive."},{"zh":"弟弟终于会骑自行车了","py":"Dìdì zhōngyú huì qí zìxíngchē le.","en":"My brother finally can ride a bike."}]},{"id":756,"hanzi":"放心","part":"Verb","pinyin":"fàngxīn","def":"to feel relived, to feel reassured, to be at ease","ex":[{"zh":"你就放心地去旅游吧！我会好好照顾自己的。","py":"Nǐ jiù fàngxīn dì qù lǚyóu ba! Wǒ huì hǎohāo zhàogù zìjǐ de.","en":"Just don't worry and go travel! I will take care of myself!"},{"zh":"请你放心，我会照顾好自己的。","py":"Qǐng nǐ fàngxīn ，wǒ huì zhàogù hǎo zìjǐ de.","en":"Please don't worry, I'll take good care of myself."}]},{"id":757,"hanzi":"报名","part":"Verb","pinyin":"bàomíng","def":"to register, to sign up","ex":[{"zh":"我已经报名学开车了。","py":"Wǒ yǐjīng bàomíng xué kāichē le.","en":"I've already applied for driving lessons."},{"zh":"这场活动的报名费很贵。","py":"Zhè chǎng huódòng de bàomíngfèi hěn guì .","en":"The registration fee for this activity is expensive."}]},{"id":758,"hanzi":"敢","part":"Verb","pinyin":"gǎn","def":"to dare","ex":[{"zh":"你敢吃辣吗？","py":"Nǐ gǎn chī là ma?","en":"Do you dare eat spicy food?"},{"zh":"我不敢一个人睡觉。","py":"Wǒ bù gǎn yī gè rén shuìjiào.","en":"I don't dare to sleep on my own."}]},{"id":759,"hanzi":"害怕","part":"Adj","pinyin":"hàipà","def":"to be afraid","ex":[{"zh":"我很害怕一个人开车。","py":"Wǒ hěn hàipà yígè rén kāichē.","en":"I'm afraid to drive alone."},{"zh":"他不好好学习，所以害怕考试。","py":"Tā bù hǎohāo xuéxí ，suǒyǐ hàipà kǎoshì.","en":"He didn't learn well, so he was afraid of exams."}]},{"id":760,"hanzi":"街道","part":"Noun","pinyin":"jiēdào","def":"street","ex":[{"zh":"今天是假日，街道上都没有人。","py":"Jīntiān shì jiàrì, jiēdào shàng dōu méiyǒu rén.","en":"Today is a holiday, so there's no one on the street."},{"zh":"街道上有很多出租车。","py":"Jiēdào shàng yǒu hěn duō chūzūchē.","en":"There are many taxis on the street."}]},{"id":761,"hanzi":"辆","part":"Measure word","pinyin":"liàng","def":"measure word for car","ex":[{"zh":"他家有两辆汽车。","py":"Tā jiā yǒu liǎng liàng qìchē.","en":"There are two cars in his house."},{"zh":"爸爸买了一辆新车。","py":"Bà ba mǎi le yīliàng xīnchē.","en":"Dad bought a new car."}]},{"id":762,"hanzi":"驾照","part":"Noun","pinyin":"jiàzhào","def":"driver's license","ex":[{"zh":"我才刚考到驾照。","py":"Wǒ cáigāng kǎo dào jiàzhào.","en":"I just got my license."},{"zh":"我是去年拿到汽车驾照的。","py":"Wǒ shì qùnián ná dào qìchē jiàzhào de.","en":"I got my driver's license last year."}]},{"id":763,"hanzi":"原来","part":"Time Word","pinyin":"yuánlái","def":"original, at first","ex":[{"zh":"我原来不喜欢吃辣，现在渐渐地喜欢了。","py":"Wǒ yuánlái bu xǐhuan chī là, xiànzài jiànjiàn de xǐhuan le.","en":"I didn't like to taste spicy food originally, but I gradually like it."},{"zh":"我原来在北京工作，但是现在在美国学习。","py":"Wǒ yuánlái zài běijīng gōngzuò, dànshì xiànzài zài měiguó xuéxí.","en":"I was originally working in Beijing, but now I'm learning in America."}]},{"id":764,"hanzi":"门票","part":"Noun","pinyin":"ménpiào","def":"ticket (for theater, cinema etc)","ex":[{"zh":"电影的门票一张是三百元。","py":"Diànyǐng de ménpiào yì zhāng shì sān bǎi yuán.","en":"The ticket for cinema is 300 dollars."},{"zh":"请问一张门票多少钱?","py":"Qǐngwèn yì zhāng ménpiào duōshǎo qián?","en":"How much does one ticket cost?"}]},{"id":765,"hanzi":"费用","part":"Noun","pinyin":"fèiyòng","def":"cost","ex":[{"zh":"今天晚上旅馆的费用是五百元。","py":"Jīntiān wǎnshàng lǚguǎn de fèiyòng shì wǔ bǎi yuán.","en":"The cost for the hotel tonight is 500 dollars."},{"zh":"在这李学习游泳的费用不太便宜。","py":"Zài zhè lǐ xuéxí yóuyǒng de fèiyòng bù tài piányí.","en":"The tuition to learn swimming here is not that cheap."}]},{"id":766,"hanzi":"保险","part":"Noun","pinyin":"bǎoxiǎn","def":"insurance","ex":[{"zh":"我出国都会买保险。","py":"Wǒ chūguó dōu huì mǎi bǎoxiǎn.","en":"I will always buy insurance when I go abroad."},{"zh":"保险虽然有一点儿贵，可是在国外可以不用担心看病的费用。","py":"Bǎoxiǎn suīrán yǒu yìdiǎnr guì, kĕshì zài guówài kěyǐ bú yòng dānxīn kànbìng de fèiyòng.","en":"Although insurance is a bit expensive, we don't need to worry about the cost of seeing a doctor abroad."}]},{"id":767,"hanzi":"游客","part":"Noun","pinyin":"yóukè","def":"traveler, tourist","ex":[{"zh":"中国每年都有很多游客来旅游。","py":"Zhōngguó měi nián dōu yǒu hěnduō yóukè lái lǚyóu.","en":"There are a lot of tourists coming to China every year."},{"zh":"这里的游客太多了，我们下次来吧。","py":"Zhè lǐ de yóukè tài duō le, wǒmen xiàcì lái ba.","en":"There are too many tourists here, let’s come next time."}]},{"id":768,"hanzi":"过期","part":"Verb Object","pinyin":"guòqī","def":"to be overdue, to exceed the time limit, to expire","ex":[{"zh":"买东西的时候，要看一看东西过期了没有。","py":"Mǎi dōngxī de shíhòu, yào kàn yī kàn dōngxī guòqīle méiyǒu.","en":"When you are buying things, you need to check it out if it is expired or not."},{"zh":"这瓶牛奶已经过期了.","py":"Zhè píng niúnǎi yǐjīng guòqīle.","en":"This bottle of milk has expired."}]},{"id":769,"hanzi":"旅行社","part":"Noun","pinyin":"lǚxíngshè","def":"travel agency","ex":[{"zh":"这家旅行社有很多旅游的地方，我们去看一看吧!","py":"Zhè jiā lǚxíngshè yǒu hěnduō lǚyóu de dìfāng, wǒmen qù kànyíkàn ba.","en":"This travel agency has a lot of travelling spots. Let’s check it out!"},{"zh":"这次旅游你打算去旅行社买机票还是上网买?","py":"Zhè cì lǚyóu nǐ dǎsuàn qù lǚxíngshè mǎi jīpiào háishì shàngwǎng mǎi?","en":"For this travel, do you want to buy the ticket through travel agency or online?"}]},{"id":770,"hanzi":"古迹","part":"Noun","pinyin":"gǔjì","def":"places of historic interest, historical sites","ex":[{"zh":"中国有很多漂亮的古迹，你有空的时候得去看一看。","py":"Zhōngguó yǒu hěn duō piàoliang de ɡǔjì, nǐ yǒukòng de shíhou dĕi qù kànyíkàn.","en":"There are a lot of historical sites in China, when you are free, you have to check it out."},{"zh":"我不喜欢念古迹的书，可是我很喜欢去看古迹。","py":"Wǒ bù xǐhuan niàn gǔjī de shū, kěshì wǒ hěn xǐhuan qù kàn ɡǔjì.","en":"I don’t like to read the book about historical sites, but I like to see it."}]},{"id":771,"hanzi":"亚洲","part":"Noun","pinyin":"Yàzhōu","def":"Asia","ex":[{"zh":"中国、日本都在亚洲。","py":"Zhōngguó, Rìběn dōu zài Yàzhōu.","en":"China and Japan are both in Asia."},{"zh":"亚洲不但有很的古迹也有很多也有很多有特色的城市。","py":"Yàzhōu bùdàn yǒu hěn de ɡǔjì yěyǒu hěnduō yěyǒu hěnduō yǒu tèsè de chéngshì.","en":"Asia not only has a lot of historical sites but also many unique cities."}]},{"id":772,"hanzi":"旅行团","part":"Noun","pinyin":"lǚxíng tuán","def":"tour group","ex":[{"zh":"你这次跟旅行团一起去旅游吗?","py":"Nǐ zhè cì gēn lǚxíng tuán yìqǐ qù lǚyóu ma?","en":"Are you going to travel with tour group this time?"},{"zh":"我不喜欢跟旅行团去旅游，我喜欢跟我的家人计划旅游以后一起去。","py":"Wǒ bù xǐhuan gēn lǚxíng tuán qù lǚyóu, wǒ xǐhuan gēn wǒ de jiārén jìhuà lǚyóu yǐhòu yìqǐ qù.","en":"I don’t like to go traveling with tour group. I like to plan with my family about the trip then go together."}]},{"id":773,"hanzi":"地点","part":"Noun","pinyin":"dìdiǎn","def":"place, site, location, venue","ex":[{"zh":"你想要约在哪个地点见面?","py":"Nǐ xiǎng yào yuē zài năge dìdiǎn jiànmiàn?","en":"What place do you want to meet?"},{"zh":"他们想选一个好的地点, 办一场派对。","py":"Tāmen xiǎng xuǎn yīgè hǎo dì dìdiǎn, bàn yī chǎng pàiduì.","en":"They want to choose a great venue for throwing a party."}]},{"id":774,"hanzi":"欧洲","part":"Noun","pinyin":"Ōuzhōu","def":"Europe","ex":[{"zh":"欧洲的风景很漂亮可是也有很多小偷。","py":"Ōuzhōu de fēngjǐng hěn piàoliang kěshì yěyǒu hěnduō xiǎotōu.","en":"The scenery in Europe is very beautiful, but there are also a lot of thief."},{"zh":"我喜欢去欧洲旅行，因为那里有很多古老的古迹。","py":"Wǒ xǐhuan qù Ouzhōu lǚxíng, yīnwèi nàlǐ yǒu hěn duō gǔlǎo de ɡǔjì.","en":"I like to go travel in Europe, because there are a lot of old historical sites."}]},{"id":775,"hanzi":"意大利","part":"Noun","pinyin":"Yìdàlì","def":"Italy","ex":[{"zh":"我是从意大利来的学生，我学习中文两年了。","py":"Wǒ shì cóng Yìdàlì lái de xuéshēng, wǒ xuéxí zhōngwén liǎng nián le.","en":"I am a student from Italy, I have studied Chinese for two years."},{"zh":"很多去欧洲旅游的人喜欢去意大利，因为气候很舒服，不冷也不热。","py":"Hěn duō qù Ōuzhōu lǚyóu de rén xǐhuan qù Yìdàlì yīnwèi qìhòu hěn shūfu, bù lěng yě bú rè.","en":"People like to travel to Italy because it has a comfortable weather, not too cold or too hot."}]},{"id":776,"hanzi":"德国","part":"Noun","pinyin":"Déguó","def":"Germany","ex":[{"zh":"德国的冬天很冷，我不喜欢冬天去德国。","py":"Déguó de dōngtiān hěn lěng, wǒ bù xǐhuan dōngtiān qù Déguó.","en":"The winter in Germany is cold. I don’t like to go there in winter."},{"zh":"德国在欧洲，从中国坐十小时的飞机就到了。","py":"Déguó zài ōuzhōu, cóng Zhōngguó zuò shí xiǎoshí de fēijī jiù dàole.","en":"Germany is in Europe, it takes ten hours to fly from China, and then you are there."}]},{"id":777,"hanzi":"特色","part":"Noun","pinyin":"tèsè","def":"characteristic, distinguishing feature or quality","ex":[{"zh":"欧洲每个国家都很有特色，你得自己去看看才知道。","py":"Ōuzhōu měi gè guójiā dōu hěn yǒu tèsè nǐ dĕi zìjĭ qù kàn kàn cái zhīdào.","en":"Every country in Europe has its own features. You have to go and check it out by yourself."},{"zh":"中国的特色有很多, 万里长城就是之一。","py":"Zhōngguó de tèsè yǒu hěnduō, Wànlǐ Chángchéng jiù shì zhīyī.","en":"China has a lot of features, the great wall is one of them."}]},{"id":778,"hanzi":"安排","part":"Noun/Verb","pinyin":"ānpái","def":"to arrange, to plan, to set up, arrangements, plans","ex":[{"zh":"下星期我安排了我们家人一起去欧洲旅游，所以我想要请假。","py":"Xià xīngqī wǒ ānpái le wǒmen jiārén yìqǐ qù Ōuzhōu lǚyóu suǒyǐ wǒ xiǎng yào qǐngjià.","en":"I arrange to travel in Europe with my family next week. Therefore I would like to take a leave."},{"zh":"麻烦你明天安排开会的时间从十点到十二点。","py":"Máfán nǐ míngtiān ānpái kāihuì de shíjiān cóng shídiǎn dào shíèr diǎn.","en":"Please arrange a meeting tomorrow from ten to twelve."}]},{"id":779,"hanzi":"行程","part":"Noun","pinyin":"xíngchéng","def":"itinerary","ex":[{"zh":"这次去德国的行程很短，可是我们要去的地方很多，所以路上要自己找时间多休息。","py":"Zhècì qù Déguó de xíngchéng hěn duǎn kěshì wǒmen yào qù de dìfang hěn duō suǒyǐ lù shàng yào zìjǐ zhǎo shíjiān duō xiūxi.","en":"The itinerary to Germany this time is really short, but we have a lot of places to go. Therefore you have find time to rest on the road."},{"zh":"我不喜欢这次你安排的行程，太赶太累了。","py":"Wǒ bù xǐhuan zhè cì nǐ ānpái de xíngchéng tài gǎn tài lèi le.","en":"I don’t like the itinerary you arranged this time, it was too rush and too tiring."}]},{"id":780,"hanzi":"气候","part":"Noun","pinyin":"qìhòu","def":"climate","ex":[{"zh":"他不习惯这儿的气候，太常下雨了。","py":"Tā bù xíguàn zhèr de qìhòu, tài cháng xiàyǔ le.","en":"He is not used to the climate here, it rains too much."},{"zh":"今年的气候很奇怪，因为夏天不应该这么冷。","py":"Jīnnián de qìhòu hěn qíguài yīnwèi xiàtiān bù yīnggāi zhème lĕng.","en":"The climate is strange this year,it should not be this cold in summer."}]},{"id":781,"hanzi":"比如说","part":"Prep","pinyin":"bǐrú shuō","def":"for example","ex":[{"zh":"欧洲的国家有很多比如说,德国、意大利。","py":"Ōuzhōu de guójiā yǒu hěn duō bǐrú shuō, Déguó, Yìdàlì.","en":"There are a lot of countries in Europe for example Germany and Italy."},{"zh":"我的工作有很多比如说安排开会、计划行程。","py":"Wǒ de gōngzuò yǒu hěnduō bǐrú shuō ānpái kāihuì, jìhuà xíngchéng.","en":"I have a lot things to do for my job for example arrange meeting, itinerary."}]},{"id":782,"hanzi":"之一","part":"Noun","pinyin":"zhīyī","def":"one of something","ex":[{"zh":"安排开会时间是我的工作之一。","py":"Ān pái kāihuì shíjiān shì wǒ de gōngzuò zhīyī.","en":"Arrange meeting is one of my job."},{"zh":"去万里长城是我们的行程之一。","py":"Qù wànlǐ chángchéng shì wǒmen de xíngchéng zhī yī.","en":"Going to the Great Wall is part of our itinerary."}]},{"id":783,"hanzi":"古老","part":"Adj","pinyin":"gǔlǎo","def":"ancient, old","ex":[{"zh":"罗马是意大利一个古老的城市。","py":"Luómǎ shì Yìdàlì yí gè gǔlǎo de chéngshì.","en":"Rome is an ancient city of Italy."},{"zh":"中国是一个古老的国家，比如说万里长城几千年以前就有了。","py":"Zhōngguó shì yīgè gǔlǎo de guójiā, bǐrú shuō wànlǐ chángchéng jǐ qiān nián yǐqián jiù yǒule.","en":"China is an ancient country, for example, the Great Wall was built thousands of years ago."}]},{"id":784,"hanzi":"参加","part":"Verb","pinyin":"cānjiā","def":"to participate, to attend","ex":[{"zh":"我们要一起参加学校的活动。","py":"Wǒ men yào yī qǐ cān jiā xué xiào de huó dòng.","en":"We are going to the school event together."},{"zh":"我喜欢参加你们每个周末的行程，比如说去爬山、去唱歌还是去海边，我都很喜欢。","py":"Wǒ xǐhuan cānjiā nǐmen měi gè zhōumò de xíngchéng bǐrú shuō qù páshān, qù chànggē háishì qù hǎibiān wǒ dōu hěn xǐhuan.","en":"I like joining your weekend activities, whether it is mountain climbing, going singing, or taking a trip to the beach, I like them all!"}]},{"id":785,"hanzi":"西班牙","part":"Noun","pinyin":"Xībānyá","def":"Spain","ex":[{"zh":"夏天的时候，我喜欢到西班牙去旅游。","py":"Xiàtiān de shíhou, wǒ xǐhuan dào Xībānyá qù lǚyóu.","en":"During the summer, I like to go travel to Spain."},{"zh":"我会说一点西班牙语。","py":"Wǒ huìshuō yīdiǎn xībānyáyǔ.","en":"I can speak a little Spanish."}]},{"id":786,"hanzi":"合同","part":"Noun","pinyin":"hétóng","def":"contract","ex":[{"zh":"请你看看这份合同有没有问题，如果没有请你在这儿签你的名字。","py":"Qǐng nǐ kàn kàn zhè fèn hétóng yǒu méiyǒu wèntí, rúguǒ méiyǒu qǐng nǐ zài zhè'er qiān nǐ de míngzì.","en":"Please check out this contract, if there’s no problem please put your name here."},{"zh":"这是我们公司的合同，你可以看一看。","py":"Zhè shì wǒmen gōngsī de hétóng, nǐ kěyǐ kànyíkàn.","en":"This is the contract from our company, you can check it out."}]},{"id":787,"hanzi":"专业","part":"Noun/Adj","pinyin":"zhuānyè","def":"specialized field, main field of study (at university), major","ex":[{"zh":"我是工程学专业毕业，我有三年的工作经验。","py":"Wǒ shì gōngchéng xué zhuānyè bìyè, wǒ yǒu sān nián de gōngzuò jīngyàn.","en":"I graduated from engineering major. I have three years working experience."},{"zh":"我们公司需要专业的人来做这个工作。","py":"Wǒmen gōngsī xūyào zhuānyè de rén lái zuò zhè gè gōngzuò.","en":"We need a professional person to do this job."}]},{"id":788,"hanzi":"通知","part":"Noun/Verb","pinyin":"tōngzhī","def":"to notify, to inform, notice, notification","ex":[{"zh":"如果公司要用你，我们会再给你通知。","py":"Rúguǒ gōngsī yào yòng nǐ, wǒmen huì zài gěi nǐ tōngzhī.","en":"If our company want to use you, we will notify you."},{"zh":"那家公司今天通知我下星期去工作了!","py":"Nà jiā gōngsī jīntiān tōngzhī wǒ xià xīngqī qù gōngzuò le!","en":"The company notified me to start working next week!"}]},{"id":789,"hanzi":"同意","part":"Verb","pinyin":"tóngyì","def":"to agree, to consent, to approve","ex":[{"zh":"我爸妈同意我出国去读书了。","py":"Wǒ bàmā tóngyì wǒ chūguó qù dúshū le.","en":"My parent agree that I can go study abroad."},{"zh":"请你看一看这份合同，如果你同意里面的工作，请你跟我联系。","py":"Qǐng nǐ kànyíkàn zhè fèn hétóng, rúguǒ nǐ tóngyì lǐmiàn de gōngzuò, qǐng nǐ gēn wǒ liánxì.","en":"Please check out this contract, if you agree to the job inside, please contact me."}]},{"id":790,"hanzi":"当","part":"Verb","pinyin":"dāng","def":"to be, to act as","ex":[{"zh":"我毕业以后，当过老师也当过秘书。","py":"Wǒ bìyè yǐhòu dāng guò lǎoshī yě dāng guò mìshū.","en":"After graduating, I've been a teacher and secretary."},{"zh":"我想当医生，可是医科很难考，我得努力读书才行。","py":"Wǒ xiǎng dāng yīshēng, kěshì yīkē hěn nánkǎo, wǒ dĕi nǔlì dúshū cái xíng.","en":"I want to become a doctor, but medicine is hard to get in, I have to study really hard."}]},{"id":791,"hanzi":"消息","part":"Noun","pinyin":"xiāoxi","def":"news, information","ex":[{"zh":"他出国以后他妈妈都没有他的消息。他很担心，如果你见到他请他给他妈妈打电话。","py":"Tā chūguó yǐhòu tā māma dōu méiyǒu tā de xiāoxi. Tā hěn dānxīn rúguǒ nǐ jiàndào tā qǐng tā gěi tā māma dǎdiànhuà.","en":"His mother never heard from him since he was abroad. She is very worried, if you see him please ask him to call her."},{"zh":"我很久没有听到你的消息了，你最近好吗?","py":"Wǒ hěn jiǔ méiyǒu tīngdào nǐ de xiāoxi le. Nǐ zuìjìn hǎo ma?","en":"I have not heard from you for a long time, how have you been?"}]},{"id":792,"hanzi":"烦恼","part":"Noun/Adj","pinyin":"fánnǎo","def":"to be worried; to be distressed; worries","ex":[{"zh":"看你每天都很累，你是不是有很多烦恼?","py":"Kàn nǐ měi tiān dōu hěn lèi, nǐ shìbúshì yǒu hěn duō fánnǎo?","en":"You seem so tired every day, do you have a lot of worries?"},{"zh":"他最近工作很忙，事情很多，问题也很多，这些都让他烦恼得不得了。","py":"Tā zuìjìn gōngzuò hěn máng, shìqing hěn duō, wèntí yě hěn duō, zhè xiē dōu rang tā fánnǎo de bùdéliǎo.","en":"He is very busy work recently, there are a lot of things and problems that all make him very worried."}]},{"id":793,"hanzi":"发展","part":"Noun/Verb","pinyin":"fāzhǎn","def":"development; growth; to develop; to grow; to expand","ex":[{"zh":"这里交通方便，所以发展得很快。","py":"Zhèlǐ jiāotōng fāngbiàn, suǒyǐ fāzhǎn de hěn kuài.","en":"Transportation is convenient here, so the area has developed quickly."},{"zh":"你不努力念书，以后能有什么发展?","py":"Nǐ bù nǔlì niànshū, yǐhòu néng yǒu shénme fāzhǎn?","en":"If you don’t study hard, what growth can you have in the future?"}]},{"id":794,"hanzi":"感冒","part":"Noun/Verb","pinyin":"gǎnmào","def":"to catch cold; (common) cold","ex":[{"zh":"最近很多人感冒了。","py":"Zuìjìn hěnduō rén gǎnmào le.","en":"Many people have caught a cold recently."},{"zh":"妹妹感冒了，所以不去学校。","py":"Mèimèi gǎnmào le ，suǒyǐ bù qù xuéxiào.","en":"My sister caught a cold, so she's not going to school."}]},{"id":795,"hanzi":"打针","part":"Verb","pinyin":"dǎzhēn","def":"to give or have an injection","ex":[{"zh":"医生给我打针了。","py":"Yīsheng gěi wǒ dǎzhēn le.","en":"The doctor gave me an injection."},{"zh":"我的狗很害怕打针。","py":"Wǒ de gǒu hěn hàipà dǎzhēn.","en":"My dog ​​is very afraid of injections."}]},{"id":796,"hanzi":"严重","part":"Adj","pinyin":"yánzhòng","def":"serious","ex":[{"zh":"她得了严重感冒，要请两天假。","py":"Tā déle yánzhòng gǎnmào, yào qǐng liǎng tiān jià.","en":"She got a serious cold, she has to take two days off."},{"zh":"他不知道这件事是很严重的。","py":"Tā bù zhīdào zhè jiàn shì shì hěn yánzhòng de.","en":"He didn't realize that this is a very serious matter."}]},{"id":797,"hanzi":"发烧","part":"Verb","pinyin":"fāshāo","def":"to have a high temperature (from illness); to have a fever","ex":[{"zh":"她不但感冒，还发烧。","py":"Tā bùdàn gǎnmào, hái fāshāo.","en":"She's not just sick, but also has a fever."},{"zh":"哥哥昨天发烧到三十九度。","py":"Gēgē zuótiān fāshāo dào sānshíjiǔ dù.","en":"My brother had a fever of thirty-nine degrees Celsius."}]},{"id":798,"hanzi":"难受","part":"Adj","pinyin":"nánshòu","def":"to feel unwell; to suffer pain; to be difficult to bear","ex":[{"zh":"感冒了，睡觉的时候也难受。","py":"Gǎnmào le, shuìjiào de shíhou yě nánshòu.","en":"When sick, it's unbearable even to sleep."},{"zh":"天气非常热，我觉得很难受。","py":"Tiānqì fēicháng rè ，wǒ juéde hěn nánshòu.","en":"The weather is too hot, I feel uncomfortable."}]},{"id":799,"hanzi":"检查","part":"Noun/Verb","pinyin":"jiǎnchá","def":"inspection; to examine; to inspect","ex":[{"zh":"医生刚刚给我检查了身体。","py":"Yīsheng gānggāng gěi wǒ jiǎnchá le shēntǐ.","en":"The doctor just gave me a full body checkup."},{"zh":"老师在检查我的作业。","py":"Lǎoshī zài jiǎnchá wǒ de zuòyè.","en":"The teacher is checking my homework."}]},{"id":800,"hanzi":"嗓子","part":"Noun","pinyin":"sǎngzi","def":"throat; voice","ex":[{"zh":"老师嗓子疼，不太方便说话。","py":"Lǎoshī sǎngzi téng, bú tài fāngbiàn shuōhuà.","en":"The teacher has a sore throat so he's not comfortable with speaking."},{"zh":"他生病了，嗓子不舒服，不能说话。","py":"Tā shēngbìng le ，sǎngzǐ bù shūfu，bù néng shuōhuà.","en":"He's sick and his throat is uncomfortable, he can't speak."}]},{"id":801,"hanzi":"晚睡","part":"Verb","pinyin":"wǎnshuì","def":"to stay up late","ex":[{"zh":"你最好别晚睡了，对身体不好。","py":"Nǐ zuìhǎo bié wǎnshuì le, duì shēntǐ bùhǎo.","en":"You'd better not stay up late, it's not good for your health."},{"zh":"他喜欢晚睡，不喜欢运动。","py":"Tā xǐhuān wǎnshuì, bù xǐhuān yùndòng.","en":"He likes to stay up late and doesn't like to exercise."}]},{"id":802,"hanzi":"着急","part":"Verb/Adj","pinyin":"zháojí","def":"to worry; to feel anxious","ex":[{"zh":"妹妹出国以后都没有跟我们联系，爸妈都很着急，希望妹妹赶快跟我们联系。","py":"Ｍèimei chūguó yǐhòu dōu méiyǒu gēn wǒmen liánxì,bà mā dōu hěn zháojí, xīwàng mèimei gǎnkuài gēn wǒmen liánxì.","en":"Ever since my sister was abroad, she didn’t have any contact with us. My parents are really worried, hoping that she can contact us soon."},{"zh":"她的护照不见了，她着急的不得了。","py":"Tā de hùzhào bújiàn le, tā zháojí de bùdéliǎo.","en":"She is really worried since she lost her passport."}]},{"id":803,"hanzi":"打工","part":"Verb Object","pinyin":"dǎgōng","def":"to work a temporary or casual job; (of students) to have a job outside of class time, or during vacation","ex":[{"zh":"我打算下个月去超市打工，赚一点儿钱。","py":"Wǒ dǎsuàn xià gè yuè qù chāoshì dǎgōng, zhuàn yìdiǎnr qián.","en":"I plan to take up a part time job in the supermarket to earn some money."},{"zh":"你曾经在这家公司打工吗？","py":"Nǐ céngjīng zài zhè jiā gōngsī dǎgōng ma?","en":"Did you ever work for this company?"}]},{"id":804,"hanzi":"赚钱","part":"Verb Object","pinyin":"zhuànqián","def":"to earn money","ex":[{"zh":"你为了工作赚钱看起来很忙也很累。","py":"Nǐ wèile gōngzuò zhuànqián kàn qǐlái hěn máng yě hěn lèi.","en":"It looks you are both very busy and tired from working to earn money."},{"zh":"你是什么时候开始赚钱的?","py":"Nǐ shì shénme shíhou kāishǐ zhuànqián de?","en":"When did you start to earn the money?"}]},{"id":805,"hanzi":"学历","part":"Noun","pinyin":"xuélì","def":"educational background; academic qualifications","ex":[{"zh":"最近这公司找了很多高学历的人进去工作。","py":"zuì jìn zhè gōng sī zhǎo le hěn duō gāo xué lì de rén jìnqù gōng zuò.","en":"These day, this company asked many workers of high educational background to work for them."},{"zh":"如果想要找到好工作，好学历很重要。","py":"Rúguǒ xiǎng yào zhǎodào hǎo gōngzuò, hǎo xuélì hěn zhòngyào.","en":"If you want to get a good job, a good qualification is important."}]},{"id":806,"hanzi":"请","part":"Verb","pinyin":"qǐng","def":"to hire","ex":[{"zh":"我们公司因为事情很多决定要请两个人来帮忙。","py":"Wǒmen gōngsī yīnwèi shìqíng hěn duō juédìng yào qǐng liǎng gè rén lái bāngmáng.","en":"We have a lot to do in the company so we decide hire two more people to help."},{"zh":"夏天到了，我们海边的工作要请个打工的人来帮忙。","py":"Xiàtiān dào le, wǒmen hǎibiān de gōngzuò yào qǐng gè dǎgōng de rén lái bāngmáng.","en":"Summer is here, our beach job need a few part time workers to help."}]},{"id":807,"hanzi":"简单","part":"Adj","pinyin":"jiǎndān","def":"simple; not complicated","ex":[{"zh":"学生的生活很简单，不太需要但心太多事。","py":"Xuéshēng de shēnghuó hěn jiǎndān, bù tài xūyào dānxīn tài duō shì.","en":"Students' life is so simple, no need to worry about too many things."},{"zh":"这件衣服的款式简单, 我很喜欢。","py":"Zhè jiàn yīfú de kuǎnshì jiǎndān, wǒ hěn xǐhuān.","en":"This piece of clothes has a simple style, I like it."}]},{"id":808,"hanzi":"决定","part":"Noun/Verb","pinyin":"juédìng","def":"to decide (to do something); to resolve; decision; certainly","ex":[{"zh":"我决定毕业以后要继续念书不工作了。","py":"Wǒ juédìng bìyè yǐhòu yào jìxù niànshū bù gōngzuò le.","en":"I decide after graduation I will keep study not working."},{"zh":"我已经决定明天要去看什么电影了","py":"Wǒ yǐjīng juédìng míngtiān yào qù kàn shénme diànyǐng le.","en":"I have already decided what movie to watch tomorrow."}]},{"id":809,"hanzi":"吃苦头","part":"Phrase","pinyin":"chī kǔtou","def":"to suffer","ex":[{"zh":"大家都听老板的话，没人想吃苦头","py":"Dàjiā dōu tīng lǎobǎn dehuà, méi rén xiǎng chīkǔ tóu.","en":"Everyone listens to the boss, no one wants to suffer."},{"zh":"你如果不听我的话，一定会吃苦头。","py":"Nǐ rúguǒ bùtīng wǒ de huà, yídìng huì chī kǔtou.","en":"If you don’t listen to me, you will definitely suffer."}]},{"id":810,"hanzi":"做生意","part":"Phrase","pinyin":"zuò shēngyì","def":"do business","ex":[{"zh":"我爸爸在北京做生意，每个月才回家一次。","py":"Wǒ bàba zài Běijīng zuò shēngyì, měi gè yuè cái huíjiā yí cì.","en":"My father does business in Peking, he only comes home once a month."},{"zh":"做生意没有你想的这么容易。","py":"Zuò shēngyì méiyǒu nǐ xiǎng de zhème róngyì.","en":"Doing business is not as easy as you thought."}]},{"id":811,"hanzi":"有意义","part":"Adj","pinyin":"yǒu yìyì","def":"meaningful","ex":[{"zh":"虽然这个工作钱不多，可是对我是一个很有意义的工作。","py":"Suīrán zhège gōngzuò qián bùduō, kěshì duì wǒ shì yíge hěn yǒu yìyì de gōngzuò.","en":"Although this job doesn’t pay much, it means a lot to me."},{"zh":"你应该做一个对你有意义的工作，这样才会快乐。","py":"Nǐ yīnggāi zuò yí ge duì nǐ yǒu yìyì de gōngzuò, zhèyàng cái huì kuàilè","en":"You should do a job that is meaningful so you will be happy."}]},{"id":812,"hanzi":"宅男","part":"Noun","pinyin":"zháinán","def":"male addicted to computers, computer games, adult cartoons etc","ex":[{"zh":"我的男朋友是个宅男，他不喜欢出门只喜欢在家看电视、上网。","py":"Wǒ de nánpéngyou shì gè zháinán, tā bù xǐhuan chūmén zhǐ xǐhuan zài jiā kàn diànshì, shàngwǎng.","en":"My boyfriend is a homebody, he doesn't like to go out but only stay home watching TV and surfing internet."},{"zh":"你觉得做什么事，我们可以说他是宅男?","py":"Nǐ juédé zuò shénme shì ，wǒmen kěyǐ shuō tā shì zháinán?","en":"What has he done that makes you think we can call him a homebody?"}]},{"id":813,"hanzi":"整天","part":"Noun","pinyin":"zhěng tiān","def":"all day long; whole day","ex":[{"zh":"他整天都在工作，等他回到家的时候大家都已经睡了。","py":"Tā zhěng tiān dōu zài gōngzuò děng tā huí dào jiā de shíhou dàjiā dōu yǐjīng shuì le.","en":"He's been working all day long, when he got home, everybody was asleep."},{"zh":"他整天在家上网。","py":"Tā zhěng tiān zài jiā shàng wǎng.","en":"He's surfing on the Internet whole day."}]},{"id":814,"hanzi":"爱好","part":"Noun","pinyin":"àihào","def":"interest; hobby","ex":[{"zh":"我跟他有一样的爱好，我们都喜欢旅游。下次我们打算一起去中国旅游。","py":"Wǒ gēn tā yǒu yíyàng de àihào, wǒmen dōu xǐhuan lǚyóu. Xiàcì wǒmen dǎsuàn yìqǐ qù Zhōngguó lǚyóu.","en":"He and I have the same hobby, we both love to travel. We are planning to travel to China next time."},{"zh":"我的爱好是打乒乓球。","py":"Wǒ de àihào shì dǎ pīngpāngqiú.","en":"My hobby is to play ping-pong."}]},{"id":815,"hanzi":"经常","part":"Adv","pinyin":"jīngcháng","def":"frequently; constantly; regularly; often; day-to-day; everyday; daily","ex":[{"zh":"他经常排队买演唱会的门票。","py":"Tā jīngcháng páiduì mǎi yǎnchànghuì de ménpiào.","en":"He often lines up to buy concert tickets."},{"zh":"我经常去那家饭馆吃饭。","py":"Wǒ jīngcháng qù nà jiā fànguǎn chīfàn.","en":"I often go to that restaurant eating."}]},{"id":816,"hanzi":"外卖","part":"Noun","pinyin":"wàimài","def":"to go; take out (relates to food bought at a restaurant)","ex":[{"zh":"我今天晚上没有时间做饭，我们叫外卖吧!","py":"Wǒ jīntiān wǎnshàng méiyǒu shíjiān zuòfàn wǒmen jiào wàimài ba.","en":"I don't have time to cook tonight, let's call for take out!"},{"zh":"这里有很多饭馆都可以叫外卖。","py":"Zhèlǐ yǒu hěnduō fànguǎn dōu kěyǐ jiào wàimài.","en":"Many restaurants here provide takeaway service."}]},{"id":817,"hanzi":"享受","part":"Verb","pinyin":"xiǎngshòu","def":"to enjoy; to live it up; pleasure","ex":[{"zh":"放假的时候就是要好好享受才行。","py":"Fàngjià de shíhou jiù shì yào hǎohāo xiǎngshòu cái xíng.","en":"You should just enjoy when you're having a vacation."},{"zh":"我喜欢游泳，享受夏天。","py":"Wǒ xǐhuān yóuyǒng ，xiǎngshòu xiàtiān.","en":"I love to swim and enjoy the summer."}]},{"id":818,"hanzi":"活泼","part":"Adj","pinyin":"huópō","def":"lively","ex":[{"zh":"他个性很活泼，所以很容易交到新朋友。","py":"Tā gèxìng hěn huópō, suǒyǐ hěn róngyì jiāodào xīn péngyou.","en":"He has a lively personality so it's easy for him to make new friends."},{"zh":"我的狗非常活泼。","py":"Wǒ de gǒu fēicháng huópō.","en":"My dog is really lively."}]},{"id":819,"hanzi":"户外","part":"Noun","pinyin":"hùwài","def":"outdoor","ex":[{"zh":"多去户外走一走，这对你的身体很好","py":"Duō qù hùwài zǒu yì zǒu, zhè duì nǐ de shēntǐ hěn hǎo.","en":"Go outdoors, it's good for your body."},{"zh":"放假时我们都会到户外走一走","py":"Fàngjià shí wǒmen dōu huì dào hùwài zǒu yī zǒu.","en":"We'll go outdoors when we have holidays."}]},{"id":820,"hanzi":"活动","part":"Noun","pinyin":"huódòng","def":"activity","ex":[{"zh":"我们公司常常有很多活动，希望大家都可以参加。","py":"Wǒmen gōngsī chángcháng yǒu hěnduō huódòng, xīwàng dàjiā dōu kěyǐ cānjiā.","en":"There are many activities in our company, I hope that everyone can join."},{"zh":"这个公园，每个星期天都有活动。","py":"Zhè ge gōngyuán ，měi gè xīng qī tiān dōu yǒu huó dòng.","en":"There are activities held in this park every Sunday."}]},{"id":821,"hanzi":"假日","part":"Noun","pinyin":"jiàrì","def":"holiday, non-working day","ex":[{"zh":"我们假日的时候要不要一起去爬山?","py":"Wǒmen jiàrì de shíhou yàobúyào yìqǐ qù páshān?","en":"What about we go hiking during holidays?"},{"zh":"假日的时候，我总是和朋友去看电影。","py":"Jiǎ rì de shí hòu ，wǒ zǒng shì hé péng yǒu qù kàn diàn yǐng.","en":"During the holidays, I always go watching movies with friends."}]},{"id":822,"hanzi":"同屋","part":"Noun","pinyin":"tóngwū","def":"roommate","ex":[{"zh":"他是我的同屋，他来自日本。","py":"Tā shì wǒ de tóngwū, tā láizì Rìběn.","en":"He's my roommate, he's from Japan."},{"zh":"我和三个同屋一起住。","py":"Wǒ hé sān gè tóngwū yīqǐ zhù.","en":"I live with three roommates."}]},{"id":823,"hanzi":"交","part":"Verb","pinyin":"jiāo","def":"to make friends","ex":[{"zh":"他是我在中国第一个交到的朋友。","py":"Tā shì wǒ zài Zhōngguó dì yī gè jiāo dào de péngyou.","en":"He's the first friend I met in China."},{"zh":"我喜欢交新朋友。","py":"Wǒ xǐ huān jiāo xīn péngyǒu.","en":"I love to make new friends."}]},{"id":824,"hanzi":"遇到","part":"Verb","pinyin":"yùdào","def":"to meet","ex":[{"zh":"我今天已经遇到他三次了。","py":"Wǒ jīntiān yǐjīng yùdào tā sāncì le.","en":"Today, I've run across him three times already."},{"zh":"我上个星期六在公园遇到他。","py":"Wǒ shàng gè xīngqīliù zài gōngyuán yùdào tā.","en":"I met him last Saturday in the park."}]},{"id":825,"hanzi":"好巧","part":"Phrase","pinyin":"hǎo qiǎo","def":"by chance, by coincidence, to happen to","ex":[{"zh":"好巧！没想到会在这里遇到你。","py":"Hǎo qiǎo! Méi xiǎngdào huì zài zhèlǐ yùdào nǐ.","en":"What a coincidence! I didn't expect to meet you here."},{"zh":"好巧，我们的名字都叫锺宛芸。","py":"Hǎoqiǎo ，wǒ men de míngzì dōu jiào zhōng wǎnyún.","en":"What a coincidence! Both of our names are Zhong Wan-Yun."}]},{"id":826,"hanzi":"交换学生","part":"Noun","pinyin":"jiāohuàn xuésheng","def":"exchange students","ex":[{"zh":"你也是今年到中国的交换学生吗？","py":"Nǐ yěshì jīnnián dào Zhōngguó de jiāohuàn xuésheng ma?","en":"Are you also an exchange student to China?"},{"zh":"我希望明年可以到加拿大当交换学生。","py":"Wǒ xīwàng míngnián kěyǐ dào jiānádà dāng jiāohuàn xué shēng.","en":"I hope I can go to Canada as an exchange student."}]},{"id":827,"hanzi":"宿舍","part":"Noun","pinyin":"sùshè","def":"dorm room","ex":[{"zh":"我今天才搬到宿舍。","py":"Wǒ jīntiān cái bāndào sùshè.","en":"I just moved to the dormitory today."},{"zh":"我们的宿舍是六人房。","py":"Wǒmen de sùshè shì liù rén fáng.","en":"Our dormitory is a six room apartment."}]},{"id":828,"hanzi":"熟悉","part":"Verb","pinyin":"shúxī","def":"to be familiar with, to know well","ex":[{"zh":"我对这里的路很熟悉，我带你走吧!","py":"Wǒ duì zhèlǐ de lù hěn shúxī, wǒ dài nǐ zǒu ba.","en":"I'm pretty familiar with this place, let me lead you!"}]},{"id":829,"hanzi":"热情","part":"Noun/Adj","pinyin":"rèqíng","def":"cordial, enthusiastic, passion, passionate, passionately","ex":[{"zh":"他妈妈对做菜很有热情，所以他每天都有很多好吃的菜可以吃","py":"Tā māmā duì zuò cài hěn yǒu rèqíng, suǒyǐ tā měitiān dōu yǒu hěnduō hǎo chī de cài kěyǐ chī.","en":"His mom is very passionate about cooking, so he has a lot of delicious food every day."}]},{"id":830,"hanzi":"穿着","part":"Noun","pinyin":"chuānzhuó","def":"attire, clothes, dress","ex":[{"zh":"你的穿着很可爱，你的男朋友一定会喜欢。","py":"Nǐ de chuānzhuó hěn kěài, nǐ de nánpéngyou yídìng huì xǐhuan.","en":"Your dress is so cute, your boyfriend will definitely like it."}]},{"id":831,"hanzi":"打扮","part":"Verb","pinyin":"dǎbàn","def":"to dress, to make up","ex":[{"zh":"我姐姐很喜欢打扮，每天都要花三十分钟打扮自己才出门。","py":"Wǒ jiějie hěn xǐhuan dǎbàn, měi tiān dōu yào huā sānshí fēnzhōng dǎbàn zìjǐ cái chūmén.","en":"My sister likes to dress up herself. She spends thirty minutes every day dressing up herself before going out."}]},{"id":832,"hanzi":"变","part":"Verb","pinyin":"biàn","def":"to change, to become different, to transform","ex":[{"zh":"天气变冷了，你要多穿一点儿。","py":"Tiānqì biàn lěng le, nǐ yào duō chuān yìdiǎnr.","en":"The weather is getting cold, you should dress warmer."}]},{"id":833,"hanzi":"时髦","part":"Adj","pinyin":"shímáo","def":"fashionable","ex":[{"zh":"这件衣服看起来真时髦，一定很适合你。","py":"Zhè jiàn yīfu kàn qǐlái zhēn shímáo, yídìng hěn shìhé nǐ.","en":"This dress looks so fashionable, it must be suitable for you."}]},{"id":834,"hanzi":"感到","part":"Verb","pinyin":"gǎndào","def":"to feel, to sense, to have the feeling that","ex":[{"zh":"看到你终于毕业了，我感到很开心。","py":"Kàndào nǐ zhōngyú bìyè le, wǒ gǎndào hěn kāixīn.","en":"Seeing you finally graduate makes me feel so happy."},{"zh":"我感到孤独。","py":"Wǒ gǎndào gūdú.","en":"I feel lonely."}]},{"id":835,"hanzi":"价钱","part":"Noun","pinyin":"jiàqián","def":"price","ex":[{"zh":"去美国的机票价钱贵吗?","py":"Qù Měiguó de jīpiào jiàqián guì ma?","en":"Is the flight ticket to America expensive?"},{"zh":"价钱高的东西，不一定好。","py":"Jiàqián gāo de dōngxi ，bù yídìnghǎo.","en":"Pricey things are not necessarily better."}]},{"id":836,"hanzi":"假期","part":"Noun","pinyin":"jiàqī","def":"vacation","ex":[{"zh":"下次假期我想去西班牙，你要一起来吗?","py":"Xiàcì jiàqī wǒ xiǎng qù Xībānyá, nǐ yào yìqǐ lái ma?","en":"I want to go to Spain the next holiday. Do you want to come with me?"},{"zh":"我们下个月有十天的假期。","py":"Wǒmen xià gè yuè yǒu shí tiān de jiàqī.","en":"We have a ten day vacation next month."}]},{"id":837,"hanzi":"沙滩","part":"Noun","pinyin":"shātān","def":"beach, sandy shore","ex":[{"zh":"夏天的时候，他喜欢在沙滩上晒太阳。","py":"Xiàtiān de shíhou tā xǐhuan zài shātān shàng shài tàiyáng.","en":"He likes to get sunbathed on the beach in summer."},{"zh":"我最喜欢金黄色的沙滩。","py":"wǒ zuì xǐhuan jīn huáng sè de shātān.","en":"I love the golden sand shore most."}]},{"id":838,"hanzi":"游泳池","part":"Noun","pinyin":"yóuyǒngchí","def":"swimming pool","ex":[{"zh":"我家附近有一个游泳池，夏天的时候都很多人。","py":"Wǒ jiā fùjìn yǒu yí ge yóuyǒngchí, xiàtiān de shíhou dōu hěnduō rén.","en":"Near my house, there's a swimming pool which always packed with people in summer."},{"zh":"这间酒店有游泳池。","py":"zhèjiān jiǔ diàn yǒu yóuyǒngchí.","en":"There's a swimming pool in this bar."}]},{"id":839,"hanzi":"难忘","part":"Adj","pinyin":"nánwàng","def":"unforgettable","ex":[{"zh":"你应该很久没有出国去玩儿了吧，希望你有一个难忘的假期。","py":"Nǐ yīnggāi hěnjiǔ méiyǒu chūguó qù wánr le ba xīwàng nǐ yǒu yí gè nánwàng de jiàqī.","en":"You haven't been abroad for a long time, have you? Hope you have an unforgettable vacation."},{"zh":"三年前在墨西哥的夏天，是我最难忘假期。","py":"Sān nián qián zài mòxīgē de xiàtiān ，shì wǒ zuì nánwàng jiàqī.","en":"The summer in Mexico three years ago was the most unforgettable vacation I've ever had."}]},{"id":840,"hanzi":"南","part":"Noun","pinyin":"nán","def":"south","ex":[{"zh":"他家在中国的南部，他一年回家一次。","py":"Tā jiā zài Zhōngguó de nánbù, tā yì nián huíjiā yí cì.","en":"His hometown is in southern China, he goes home once a year."},{"zh":"法国南方是最多人去旅行的地方。","py":"Fǎguó nánfāng shì zuìduō rén qù lǚxíng dì dìfāng.","en":"Southern France is the place with most people traveling."}]},{"id":841,"hanzi":"北","part":"Noun","pinyin":"běi","def":"north","ex":[{"zh":"北京在中国的北部。","py":"Běijīng zài Zhōngguó de běibù.","en":"Beijing is in northern China."},{"zh":"墨西哥北部有非常大的沙漠","py":"Mòxīgē běibù yǒu fēicháng dà de shāmò.","en":"There is a very big desert in the north of Mexico."}]},{"id":842,"hanzi":"东","part":"Noun","pinyin":"dōng","def":"east","ex":[{"zh":"美国东部的城市有纽约、华盛顿。","py":"Měiguó dōngbù de chéngshì yǒu Niǔyuē, Huáshèngdùn.","en":"Cities in eastern America include New York and Washington DC."},{"zh":"多伦多在加拿大的东部。","py":"Duōlúnduō zài jiānádà de dōngbù.","en":"Toronto is in eastern Canada."}]},{"id":843,"hanzi":"西","part":"Noun","pinyin":"xi","def":"west","ex":[{"zh":"美国的西南部有一个很漂亮的沙滩。","py":"Měiguó de xīnánbù yǒu yí gè hěn piàoliang de shātān.","en":"There's a beautiful beach in the southwestern United States."},{"zh":"墨西哥西部有非常美的沙滩。","py":"Mòxīgē xi bù yǒu fēicháng měi de shātān.","en":"There's a very beautiful beach in western Mexico."}]},{"id":844,"hanzi":"好处","part":"Noun","pinyin":"hǎochu","def":"benefit, advantage","ex":[{"zh":"多喝水、多运动对健康有好处。","py":"Duō hē shuǐ, duō yùndòng duì jiànkāng yǒu hǎochù.","en":"Drinking more water and doing more exercise is good for your health."},{"zh":"这件事有好处也有坏处。","py":"Zhè jiàn shì yǒu hǎo chù yě yǒu huài chù.","en":"This thing has both pros and cons."}]},{"id":845,"hanzi":"兴趣","part":"Noun","pinyin":"xìngqù","def":"interest, hobby","ex":[{"zh":"你有没有兴趣周末一起去健身房锻炼身体?","py":"Nǐ yǒuméiyǒu xìngqù zhōumò yìqǐ qù jiànshēnfáng duànliàn shēntǐ?","en":"Are you interested in working out at the gym this weekend?"},{"zh":"我对古典音乐没兴趣。","py":"Wǒ duì gǔdiǎn yīnyuè méi xìngqù.","en":"I'm not interested in classical music."}]},{"id":846,"hanzi":"锻炼","part":"Verb","pinyin":"duànliàn","def":"to engage in physical exercise, to work out","ex":[{"zh":"他常常生病，应该多锻炼一下身体。","py":"Tā chángcháng shēngbìng, yīnggāi duō duànliàn yīxià shēntǐ.","en":"He often gets sick, so he should exercise more."},{"zh":"每天十个小时的锻炼，他得到了这次的第一名","py":"Měitiān shí ge xiǎoshí de duànliàn, tā dédàole zhè cì de dì yī míng.","en":"He got the first place due to ten hours working our per day."}]},{"id":847,"hanzi":"健身房","part":"Noun","pinyin":"jiànshēnfáng","def":"gym","ex":[{"zh":"最近越来越多人发现身体健康很重要，所以也越来越多人去健身房锻炼身体。","py":"Zuìjìn yuè lái yuè duō rén fāxiàn shēntǐ jiànkāng hěn zhòngyào, suǒyǐ Yě yuè lái yuè duō rén qù jiànshēnfáng duànliàn shēntǐ.","en":"Recently, more and more people find it very important to be healthy, so more and more people are going to the gym to exercise."},{"zh":"这家健身房的费用，一个月五百人民币。","py":"Zhè jiā jiànshēnfáng de fèiyòng, yīgè yuè wǔbǎi rénmínbì.","en":"The cost of this gym is five hundred RMB a month."}]},{"id":848,"hanzi":"登山","part":"Verb Object","pinyin":"dēngshān","def":"to climb a mountain","ex":[{"zh":"登山对身体很好，虽然很累，可是在山上可以看到漂亮的风景，也可以运动，是一个很好的户外活动。","py":"Dēngshān duì shēntǐ hěn hǎo, suīrán hěn lèi, kěshì zài shānshàng kěyǐ kàn dào piàoliang de fēngjǐng, yě kěyǐ yùndòng, shì yīgè hěn hǎo de hùwài huódòng.","en":"Hiking is very good for your body, although it's tiring, we can see beautiful scenery on the mountain as well exercise. It's a great outdoor activity."},{"zh":"气象报告说明天不适合登山。","py":"Qì xiàng bào gào shuō míng tiān bù shì hé dēng shān。","en":"The weather report says tomorrow is not suitable for mountain climbing."}]},{"id":849,"hanzi":"选择","part":"Noun/Verb","pinyin":"xuǎnzé","def":"to choose, to pick, to select, to elect, choice","ex":[{"zh":"现代人因为工作忙碌很多人都选择上健身房运动，不到户外去运动了。","py":"Xiàndài rén yīnwèi gōngzuò mánglù hěnduō rén dōu xuǎnzé shàng jiànshēnfáng yùndòng, bù dào hùwài qù yùndòng le.","en":"Nowadays people choose to go to the gym for exercise rather than go outdoors due to their busy work."},{"zh":"你有两个选择，一是跟我们一起去看电影，二是在家睡觉。","py":"Nǐ yǒu liǎng gè xuǎn zé ，yī shì gēn wǒ men yī qǐ qù kàn diàn yǐng ，èr shì zài jiā shuì jiào。","en":"You have two options, one is go with us to the movies, the second is to sleep at home."}]},{"id":850,"hanzi":"坏处","part":"Noun","pinyin":"huàichu","def":"harm, disadvantage","ex":[{"zh":"你不要都往坏处想，事情也有可能是好的。","py":"Nǐ búyào dōu wǎng huàichù xiǎng, shìqing yě yǒu kěnéng shì hǎo de.","en":"Don't always think of things in bad ways, they can turn out to be good results."},{"zh":"听爸爸妈妈的话，是没有坏处的。","py":"Tīng bàba māma de huà，shì méiyǒu huàichù de.","en":"There's no disadvantage to listening to your parents' advice."}]},{"id":851,"hanzi":"坚持","part":"Verb","pinyin":"jiānchí","def":"to persevere with, to persist in","ex":[{"zh":"你一定要坚持把这个工作做完。","py":"Nǐ yí dìng yào jiānchí bǎ zhègè gōngzuò zuò wán.","en":"You must persist and finish this job."},{"zh":"哥哥坚持每天锻链身体一个小时。","py":"gē ge jiān chí měi tiān duàn liàn shēn tǐ yī gè xiǎo shí.","en":"My brother persists in exercising one hour every day."}]},{"id":852,"hanzi":"完成","part":"Verb","pinyin":"wánchéng","def":"to complete, to accomplish","ex":[{"zh":"老师说只要完成今天的作业就可以下课了。","py":"Lǎoshī shuō zhǐyào wánchéng jīntiān de zuòyè jiù kěyǐ xiàkè le.","en":"The teacher said the class would be dismissed as long as we finished today's homework."},{"zh":"我今天下午三点就完成工作了。","py":"wǒ jīn tiān xià wǔ sān diǎn jiù wán chéng gōng zuò le.","en":"I finished my work at three o'clock this afternoon."}]},{"id":853,"hanzi":"必须","part":"Noun/Verb","pinyin":"bìxū","def":"must, need to, have to","ex":[{"zh":"如果想要买这个东西就必须努力工作赚钱","py":"Rúguǒ xiǎng yāomǎi zhège dōngxi jiù bìxū nǔlì gōngzuò zhuànqián","en":"If you want to buy this thing you have to work hard to make money"},{"zh":"星期天我必须去学校。","py":"xīng qī tiān wǒ bì xū qù xué xiào.","en":"I have to go to school on Sunday."}]},{"id":854,"hanzi":"不过","part":"Conj","pinyin":"bùguò","def":"but, however, only, merely","ex":[{"zh":"虽然我觉得生病应该多休息，不过如果你已经觉得好多了，就开始工作吧！","py":"Suīrán wǒ juédé shēngbìng yīnggāi duō xiūxí, bùguò rúguǒ nǐ yǐjīng juédé hǎoduōle, jiù kāishǐ gōngzuò ba!","en":"I think you should rest more if you're sick, but since you already felt much better, let's begin to work!"},{"zh":"明天我可一跟你们一起吃晚餐，不过我得先离开。","py":"Míng tiān wǒ kě yī gēn nǐ men yī qǐ chī wǎn cān，bù guò wǒ dé xiān lí kāi 。","en":"I can have dinner with you tomorrow, but I have to leave first."}]},{"id":855,"hanzi":"刚才","part":"Time Word","pinyin":"gāngcái","def":"just now","ex":[{"zh":"你刚才说什么？我没有听到，可以请你再说一次吗？","py":"Nǐ gāngcái shuō shénme? wǒ méiyǒu tīngdào, kěyǐ qǐng nǐzài shuōyí cì ma?","en":"What did you just say? I didn't hear you, can you say that again?"},{"zh":"我刚才买了一本书。","py":"wǒ gāng cái mǎi le yī běn shū.","en":"I just bought a book."}]},{"id":856,"hanzi":"半夜","part":"Time Word","pinyin":"bànyè","def":"midnight","ex":[{"zh":"他的工作常常要工作到半夜，所以他每天看起来都很累。","py":"Tā de gōngzuò chángcháng yào gōngzuò dào bànyè, suǒyǐ tā měi tiān kàn qǐlái dōu hěn lèi.","en":"He often has to work until midnight, so he looks very tired every day."},{"zh":"昨天晚上半夜的时候，我听到很多狗在叫。","py":"Zuó tiān wǎn shàng bàn yè de shí hòu ，wǒ tīng dào hěn duō gǒu zài jiào.","en":"I heard many dogs barking at midnight yesterday."}]},{"id":857,"hanzi":"应征","part":"Verb","pinyin":"yìngzhēng","def":"to apply for job","ex":[{"zh":"我想要应征这份工作，不知道有什么要求？","py":"Wǒ xiǎngyào yìngzhēng zhè fèn gōngzuò, bù zhīdào yǒu shénme yāoqiú?","en":"I want to apply for this job, is there any requirement?"},{"zh":"这份工作有非常多人来应征","py":"Zhè fèn gōng zuò yǒu fēi cháng duō rén lái yīng zhēng.","en":"Many people came to apply for this job."}]},{"id":858,"hanzi":"广告","part":"Noun/Verb","pinyin":"guǎnggào","def":"commercial, advertise","ex":[{"zh":"这家公司应征工作的广告已经在这儿一个月了，看起来是还没找到适合的人。","py":"Zhè jiā gōngsī yìngzhēng gōngzuò de guǎnggào yǐjīng zài zhè'er yīgè yuèle, kàn qǐlái shì hái méi zhǎodào shìhé de rén.","en":"The recruitment advertisement has been here for a month, seems like they haven't found the suitable employee."},{"zh":"你可以帮忙我们广告一下我们公司的新手机吗？","py":"Nǐ kěyǐ bāngmáng wǒmen guǎnggào yí xià wǒmen gōngsī de xīn shǒujī ma?","en":"Can you help us advertise this new cellphone from our company?"}]},{"id":859,"hanzi":"到处","part":"Adv","pinyin":"dàochù","def":"everywhere","ex":[{"zh":"中国到处都是饭馆，不怕找不到东西吃。","py":"Zhōngguó dàochù dōu shì fànguǎn, bùpà zhǎo bù dào dōngxī chī.","en":"There are restaurants everywhere in China, no need to worry having nothing to eat."},{"zh":"我的家到处都是狗毛。","py":"wǒ de jiā dào chù dōu shì gǒu máo.","en":"The dog's fur is everywhere in my house."}]},{"id":860,"hanzi":"容易","part":"Adj","pinyin":"róngyì","def":"easy","ex":[{"zh":"对美国人来说想要学习汉语不容易，除了得学习写汉字，也得记得汉字怎么写。","py":"Duì Měiguó rén láishuō xiǎngyào xuéxí hànyǔ bù róngyì, chúle děi xuéxí xiě hànzì yě děi jìde hànzì zěnme xiě.","en":"For the Americans, it's not easy to learn Chinese. In addition to learning to write Chinese characters, they have to remember how to write Chinese characters as well."},{"zh":"从我家到机场很容易。","py":"Cóng wǒ jiā dào jī chǎng hěn róng yì.","en":"It's easy to get from my home to the airport."}]},{"id":861,"hanzi":"清楚","part":"Verb/Adj","pinyin":"qīngchu","def":"clear, to understand","ex":[{"zh":"我刚才没有听清楚你说什么，可以再说一次吗?","py":"Wǒ gāngcái méiyǒu tīng qīngchǔ nǐ shuō shénme, kěyǐ zàishuō yīcì ma?","en":"I didn't hear well about what you just said, can you say that again?"},{"zh":"我换了新眼镜，看得非常清楚。","py":"Wǒ huàn le xīn yǎn jìng ，kàn dé fēi cháng qīng chǔ.","en":"I switched to new glasses, now I can see very clearly."}]},{"id":862,"hanzi":"第一步","part":"Phrase","pinyin":"dì yībù","def":"the first step, step one","ex":[{"zh":"应征工作的第一步是先看清楚应征工作的要求。","py":"Yìngzhēng gōngzuò de dì yībù shì xiān kàn qīngchǔ yìngzhēng gōngzuò de yāoqiú.","en":"The first step applying the job is to understand the requirements of the job."},{"zh":"运动的第一步是暖身。","py":"yùn dòng de dì yī bù shì nuǎn shēn.","en":"The first step of exercising is to warm up."}]},{"id":863,"hanzi":"下一步","part":"Phrase","pinyin":"xià yī bù","def":"the next step, then","ex":[{"zh":"洗完菜以后，下一步就是准备放到锅子里炒了。","py":"Xǐ wáncài yǐhòu, xià yíbù jiùshì zhǔnbèi fàng dào guōzi lǐ chǎole.","en":"After washing the vegetable, the next step is to cook it in the pan."},{"zh":"我旅行的下一步是哥伦比亚。","py":"Wǒ lǚxíng de xià yībù shì gēlúnbǐyà.","en":"The next step in my traveling is Columbia."}]},{"id":864,"hanzi":"炒","part":"Verb","pinyin":"chǎo","def":"fry (meat, fish, or vegetables) rapidly over a high heat while stirring briskly","ex":[{"zh":"中国菜很多都必须要炒，炒的方法有很多，但是最常见的就是快炒。","py":"Zhōngguó cài hěnduō dōu bìxū yào chǎo, chǎo de fāngfǎ yǒu hěnduō, dànshì zuì chángjiàn de jiùshì kuài chǎo.","en":"Many Chinese dishes need to be fried. There are many kinds of fry, but the most common one is stir-fried."},{"zh":"这道菜在炒的时候，我不小心放入太多的油。","py":"Zhè dào cài zài chǎo de shí hòu，wǒ bù xiǎo xīn fàng rù tài duō de yóu。","en":"When I was frying this dish, I accidentally put in too much oil."}]},{"id":865,"hanzi":"西红柿","part":"Noun","pinyin":"xīhóngshì","def":"tomato","ex":[{"zh":"西红柿是一种很健康的蔬菜。","py":"Xīhóngshì shì yī zhǒng hěn jiànkāng de shūcài.","en":"Tomatoes are a type of healthy vegetable."},{"zh":"墨西哥菜里用了大量的西红柿。","py":"Mò xī gē cài lǐ yòng le dà liàng de xīhóngshì.","en":"Mexican food contains a lot of tomatoes."}]},{"id":866,"hanzi":"食谱","part":"Noun","pinyin":"shípǔ","def":"recipe","ex":[{"zh":"我这里有一本中国菜的食谱，你要拿去看一看吗?","py":"Wǒ zhèlǐ yǒu yì běn Zhōngguó cài de shípǔ, nǐ yào ná qù kànyíkàn ma?","en":"I have a Chinese dish recipe, do you want to take a look?"},{"zh":"这个蛋糕我是看食谱做的。","py":"zhè gè dàn gāo wǒ shì kàn shí pǔ zuò de.","en":"I made this cake from the recipe."}]},{"id":867,"hanzi":"倒","part":"Verb","pinyin":"dào","def":"upside down, pour, collapse, fail","ex":[{"zh":"可以请你把水倒进去里面吗？","py":"Kěyǐ qǐng nǐ bǎ shuǐ dào jìnqù lǐmiàn ma?","en":"Can you please pour the water into it?"},{"zh":"我倒茶给你喝。","py":"wǒ dǎo chá gěi nǐ hē.","en":"I'll serve the tea for you."}]},{"id":868,"hanzi":"油","part":"Noun","pinyin":"yóu","def":"oil, fat","ex":[{"zh":"做中国菜的时候需要用到很多油，有的人喜欢，有的人不喜欢。","py":"Zuò Zhōngguó cài de shíhou xūyào yòng dào hěnduō yóu, yǒude rén xǐhuan, yǒude rén bù xǐhuan.","en":"A lot of oil is needed when making Chinese dishes. Some people like it, some don't."},{"zh":"爸爸做菜时不喜欢加太多的油。","py":"Bàba zuò cài shí bù xǐhuan jiā tài duō de yóu.","en":"My dad doesn't like to put too much oil when cooking."}]},{"id":869,"hanzi":"道","part":"Measure word","pinyin":"dào","def":"courses in a meal","ex":[{"zh":"这道菜是我最喜欢的菜，很容易也很好做，你试试看。","py":"Zhè dào cài shì wǒ zuì xǐhuan de cài, hěn róngyì yě hěn hǎozuò, nǐ shìshìkàn.","en":"This is my favorite dish, it's easy to cook, try it."},{"zh":"西班牙海鲜饭，其实这道菜不难做。","py":"Xībānyá hǎixiān fàn ，qíshí zhè dào cài bù nán zuò.","en":"Spanish paella, this dish is not difficult to cook actually."}]},{"id":870,"hanzi":"油腻","part":"Adj","pinyin":"yóunì","def":"greasy, oily","ex":[{"zh":"很多人觉得中国菜很油腻，可是这是中国菜的特色之一。","py":"Hěnduō rén juédé zhōngguó cài hěn yóunì, kěshì zhè shì Zhōngguó cài de tèsè zhī yī.","en":"Many people think that Chinese cuisine is very oily, but this is one main features of Chinese food."},{"zh":"吃完油腻的东西，我都会喝茶。","py":"Chī wán yóu nì de dōng xī ，wǒ dōu huì hē chá.","en":"I drink tea after eating something greasy."}]},{"id":871,"hanzi":"盐","part":"Noun","pinyin":"yán","def":"salt","ex":[{"zh":"你放太多盐了，下次得放少一点。","py":"Nǐ fàng tài duō yánle, xiàcì dé fàng shǎo yīdiǎn.","en":"You put too much salt. You have to put less next time."},{"zh":"这道菜很咸，是不是放了很多盐?","py":"Zhè dào cài hěn xián, shì bù shì fàng le hěn duō yán ?","en":"This dish is very salty, is it contains a lot of salt?"}]},{"id":872,"hanzi":"清淡","part":"Adj","pinyin":"qīngdàn","def":"light, weak, delicate, mild","ex":[{"zh":"爸爸妈妈年纪大了，吃清淡一点的东西比较好。","py":"bà bà mā mā nián jì dà le ，chī qīng dàn yī diǎn de dōng xī bǐ jiào hǎo.","en":"Dad and mom's ages have increased, mild food is better for them."},{"zh":"我喜欢吃清淡的菜，不喜欢油腻的菜","py":"Wǒ xǐhuān chī qīngdàn de cài, bù xǐhuān yóunì de cài.","en":"I like to eat light dishes, I don't like oily dishes."}]},{"id":873,"hanzi":"切","part":"Verb","pinyin":"qiē","def":"to cut","ex":[{"zh":"切菜的时候要小心一点，不要切到手了。","py":"Qiēcài de shíhou yào xiǎoxīn yìdiǎn, búyào qiē dào shǒu le.","en":"Be careful when you are cutting the vegetable, don't get your fingers cut."},{"zh":"切肉和切水果不能用一样的刀子。","py":"qiē ròu hé qiē shuǐ guǒ bù néng yòng yī yàng de dāo zǐ .","en":"The knife for cutting meat and fruits cannot be the same one."}]},{"id":874,"hanzi":"得","part":"Verb","pinyin":"dé","def":"to get","ex":[{"zh":"你得的是感冒，得吃三天的药才行。","py":"Nǐ dé de shì gǎnmào, děi chī sān tiān de yào cái xíng.","en":"You got a cold, you must take the medicine for three days."},{"zh":"在这次比赛中，她得到了第三名。","py":"zài zhè cì bǐ sài zhōng ，tā dé dào le dì sān míng.","en":"She got the third place in this competition."}]},{"id":875,"hanzi":"症状","part":"Noun","pinyin":"zhèngzhuàng","def":"symtom","ex":[{"zh":"感冒的症状有很多，如果不舒服就要去看医生。","py":"Gǎnmào de zhèngzhuàng yǒu hěnduō, rúguǒ bùshūfu jiùyào qù kàn yīshēng.","en":"There are many symptoms of a cold. If you are not feeling well, go to the doctor."},{"zh":"她有头疼和发烧的症状。","py":"tā yǒu tóu téng hé fā shāo de zhèng zhuàng.","en":"She has symptoms of a headache and fever."}]},{"id":876,"hanzi":"没事","part":"Phrase","pinyin":"méishì","def":"nothing serious, doesn't matter,Never mind","ex":[{"zh":"A: 我听说你生病了，还好吗？ B: 没事，没事。","py":"A: Wǒ tīngshuō nǐ shēngbìng le, háihǎo ma? B: Méishì, méishì.","en":"A: I heard you are sick, you okay? B: It's nothing, I am fine!"},{"zh":"没事，只是有一点累。","py":"Méi shì ，zhǐshì yǒu yī diǎn lèi.","en":"It's nothing, just a little bit tired."}]},{"id":877,"hanzi":"体温","part":"Noun","pinyin":"tǐwēn","def":"(body)temperature","ex":[{"zh":"你的体温有一点儿高，是不是发烧了？","py":"Nǐ de tǐwēn yǒu yìdiǎnr gāo, shìbúshì fāshāo le?","en":"Your temperature is a bit high, have you got a fever?"},{"zh":"她的体温只有三十四度","py":"Tā de tǐwēn zhǐyǒu sānshísì dù.","en":"Her temperature is only thirty-four degrees Celsius."}]},{"id":878,"hanzi":"量","part":"Verb","pinyin":"liáng","def":"to measure","ex":[{"zh":"你生病了，要不要量体温看一看是不是发烧了？","py":"Nǐ shēngbìng le, yàobúyào liáng tǐwēn kànyíkàn shìbúshì fāshāo le?","en":"You are sick, do you want to measure the temperature and see if you are getting a fever?"},{"zh":"中文的量词不太难，我觉得很有趣。","py":"Zhōngwén de liàngcí bú tài nán, wǒ juéde hěn yǒuqù.","en":"The Chinese measure words are not so difficult, I found it interesting."}]},{"id":879,"hanzi":"没用","part":"Adj","pinyin":"méiyòng","def":"useless","ex":[{"zh":"虽然已经吃了一些药，可是我觉得那些药没用，我还是需要去看医生。","py":"Suīrán yǐjīng chī le yìxiē yào, kěshì wǒ juéde nàxiē yào méiyòng, wǒ Háishì xūyào qù kàn yīshēng.","en":"Although I've eaten some medicine, I think they are useless. I still need to see a doctor."},{"zh":"这些东西很没用，不要乱买。","py":"Zhèxiē dōngxī hěn méi yòng, bùyào luàn mǎi.","en":"These things are useless, do not buy them."}]},{"id":880,"hanzi":"要紧","part":"Adj","pinyin":"yàojǐn","def":"serious, important , critical","ex":[{"zh":"我不要紧，只是有一点儿难受。","py":"Wǒ bú yàojǐn, zhǐshì yǒu yìdiǎnr nánshòu.","en":"I'm fine, just a little bit upset."},{"zh":"请问她在吗?我有要紧的是要跟她说。","py":"qǐng wèn tā zài ma ?wǒ yǒu yào jǐn de shì yào gēn tā shuō.","en":"Excuse me, is she there? I have something important to tell her."}]},{"id":881,"hanzi":"必要","part":"Adj","pinyin":"bìyào","def":"necessary","ex":[{"zh":"他很忙，如果没有必要的事就不要去吵他。","py":"Ta hěn máng, rúguǒ méiyǒu bìyào de shì jiù búyào qù chǎo tā.","en":"He's really busy, so don't bother him if not necessary."},{"zh":"你没有必要为这件事生气。","py":"nǐ méi yǒu bì yào wéi zhè jiàn shì shēng qì.","en":"You don't have to be angry about this."}]},{"id":882,"hanzi":"耽误","part":"Verb","pinyin":"dānwù","def":"to delay","ex":[{"zh":"请问这个病很严重吗？会不会耽误我去上班?","py":"Qǐngwèn zhègè bìng hěn yánzhòng ma? huìbúhuì dānwù wǒ qù shàngbān?","en":"Sorry, is this symptom serious? Will it delay my work?"},{"zh":"因为今天下大雨，所以在路上耽误了一点时间。","py":"Yīnwèi jīntiān xià dàyǔ, suǒyǐ zài lùshàng dānwùle yīdiǎn shíjiān.","en":"It's heavy rain today so I delayed on my way."}]},{"id":883,"hanzi":"站住","part":"Verb","pinyin":"zhànzhù","def":"to stop, to halt, to freeze","ex":[{"zh":"小偷，站住！","py":"Xiǎotōu, zhànzhù.","en":"Thief, freeze!"},{"zh":"站住!你怎么可以对妈妈说种些话?","py":"Zhàn zhù !nǐ zěn me kě yǐ duì mā mā shuō zhǒng xiē huà ?","en":"Wait! How could you say something like this to your mother?"}]},{"id":884,"hanzi":"办法","part":"Noun","pinyin":"bànfǎ","def":"solution, method, way","ex":[{"zh":"我没有什么办法，我们再想想吧。","py":"Wǒ méiyǒu shénme bànfǎ, wǒmen zài xiǎngxiǎng ba.","en":"I don't have any solution, let's think about it."},{"zh":"这真是一个好办法。","py":"zhè zhēn shì yī gè hǎo bàn fǎ.","en":"It's really a great idea!"}]},{"id":885,"hanzi":"了解","part":"Verb","pinyin":"liǎojiě","def":"to understand, to find out","ex":[{"zh":"我了解你的困难，但是我不知道怎么帮你。","py":"Wǒ liǎojiě nǐ de kùnnán, dànshì wǒ bù zhīdào zěnme bāng nǐ.","en":"I understand your difficulties, but I don't know how to help you."},{"zh":"我的妈妈很了解我。","py":"Wǒ de māmā hěn liǎojiě wǒ.","en":"My mother knows me very well."}]},{"id":886,"hanzi":"秋天","part":"Noun","pinyin":"qiūtiān","def":"autumn, fall","ex":[{"zh":"我最喜欢的季节是秋天，因为很漂亮。","py":"Wǒ zuì xǐhuan de jìjié shì qiūtiān, yīnwèi hěn piàoliang.","en":"My favorite season is autumn because it is beautiful."},{"zh":"这里的秋天不太冷。","py":"zhè lǐ de qiū tiān bù tài lěng.","en":"The autumn here is not so cold."}]},{"id":887,"hanzi":"年轻","part":"Adj","pinyin":"niánqīng","def":"young","ex":[{"zh":"你还年轻，不要这么快就决定以后要做什么。","py":"Nǐ hái niánqīng, búyào zhème kuài jiù juédìng yǐhòu yào zuò shénme.","en":"You are still young, don't make the decisions about what you're going to do in your future too soon."},{"zh":"她看起来非常年轻。","py":"tā kàn qǐ lái fēi cháng nián qīng.","en":"She seems very young."}]},{"id":888,"hanzi":"问题","part":"Noun","pinyin":"wèntí","def":"problem, question, issue, matter","ex":[{"zh":"请问你有时间吗？我有些问题想要问你。","py":"Qǐngwèn nǐ yǒu shíjiān ma? Wǒ yǒuxiē wèntí xiǎng yào wèn nǐ.","en":"Excuse, do you have time? I have some questions."},{"zh":"这真是一个很大的问题。","py":"Zhè zhēn shì yī gè hěn dà de wèn tí.","en":"This is really a big issue."}]},{"id":889,"hanzi":"解决","part":"Verb","pinyin":"jiějué","def":"to solve, to settle","ex":[{"zh":"你有解决这个问题的办法吗？","py":"Nǐ yǒu jiějué zhège wèntí de bànfǎ ma?","en":"Do you have any idea to solve this problem?"},{"zh":"哭是解决不了问题的。","py":"Kū shì jiě jué bù le wèn tí de.","en":"Crying can not solve the problem."}]},{"id":890,"hanzi":"生意人","part":"Noun","pinyin":"shēngyì rén","def":"businessman","ex":[{"zh":"我爸爸是个生意人，所以常常在外国工作。","py":"Wǒ bàba shì gè shēngyì rén, suǒyǐ chángcháng zài wàiguó gōngzuò.","en":"My brother is a businessman, so he often works abroad."},{"zh":"她是一个聪明的生意人。","py":"Tā shì yī gè cōng míng de shēng yì rén.","en":"She's a smart businessperson."}]},{"id":891,"hanzi":"黑心","part":"Adj","pinyin":"hēixīn","def":"dirty, dishonest","ex":[{"zh":"现在很多黑心的生意人常常卖不好的东西。","py":"Xiànzài hěnduō hēixīn de shēngyì rén chángcháng mài bùhǎo de dōngxi.","en":"Nowadays there are many dishonest businesspeople selling bad-quality products."},{"zh":"所以我们自己得小心选择我们要买的东西，现在有很多有问题或是黑心的产品。","py":"Suǒyǐ wǒmen zìjǐ děi xiǎoxīn xuǎnzé wǒmen yào mǎi de dōngxi. Xiànzài yǒu hěnduō yǒu wèntí huò shì hēixīn de chǎnpǐn.","en":"Therefore, we must be careful when choosing what we are buying. Nowadays there are many bad-quality products."}]},{"id":892,"hanzi":"全家","part":"Noun","pinyin":"quánjiā","def":"all family","ex":[{"zh":"我们全家昨天晚上一起去阿姨家吃饭。","py":"Wǒmen quánjiā zuótiān wǎnshàng yìqǐ qù āyí jiā chīfàn.","en":"Last night, my family and I had a dinner at my aunt's house."},{"zh":"我全家除了我，其他人都不会游泳。","py":"Wǒ quán jiā chúle wǒ, qí tā rén dōu bù huì yóu yǒng.","en":"All my family members can't swim except me."}]},{"id":893,"hanzi":"报警","part":"Verb Object","pinyin":"bàojǐng","def":"to report（an incident）to the police","ex":[{"zh":"他的邻居看到他家被偷了就赶快报警。","py":"Tā de línjū kàndào tā jiā bèi tōu le jiù gǎnkuài bàojǐng.","en":"Hi neighbors, after seeing his hows had been broken into, reported the incident to the police."},{"zh":"前面有车祸，快点报警。","py":"Qián miàn yǒu chē huò, kuài diǎn bàojǐng.","en":"There's a car accident up ahead, quick, call the police!"}]},{"id":894,"hanzi":"失败","part":"Noun/Verb","pinyin":"shībài","def":"failure, to fail","ex":[{"zh":"虽然她努力工作，可是还是失败了。","py":"Suīrán tā nǔlì gōngzuò, kěshì háishì shībài le.","en":"Although she worked hard, she still failed."},{"zh":"失败是成功之母。","py":"Shībài shì chénggōng zhī mǔ.","en":"Failure is the mother of success."}]},{"id":895,"hanzi":"难得","part":"Adj","pinyin":"nándé","def":"rare, hard","ex":[{"zh":"我难得可以放十天假，我已经订好去西班牙的机票了。","py":"Wǒ nándé kěyǐ fàng shí tiān jià, wǒ yǐjīng dìnghǎo qù Xībānyá de jīpiào le.","en":"How rare for me to take a ten day vacation! I've already booked the flight tickets to Spain."},{"zh":"真难得今天可以六点以前到家。","py":"Zhēn nándé jīntiān kěyǐ liù diǎn yǐqián dào jiā.","en":"How rare that I can arrive home before six today!"}]},{"id":896,"hanzi":"也许","part":"Conj","pinyin":"yěxǔ","def":"maybe","ex":[{"zh":"如果你很用功，也许可以上好大学。","py":"Rúguǒ nǐ hěn yònggōng, yěxǔ kěyǐ shàng hǎo dàxué.","en":"If you study hard, maybe you can get into a good university."},{"zh":"也许明天她会打电话给我。","py":"Yě xǔ míng tiān tā huì dǎdiànhuà gěi wǒ.","en":"Maybe she'll call me tomorrow."}]},{"id":897,"hanzi":"停","part":"Verb","pinyin":"tíng","def":"to park","ex":[{"zh":"我的车停在前面，我们一起走过去吧。","py":"Wǒ de chē tíng zài qiánmiàn, wǒmen yìqǐ zǒuguò qù ba.","en":"My car is parked in front, let's walk there."},{"zh":"我的手表停了。","py":"Wǒ de shǒu biǎo tíng le.","en":"My watch stopped working."}]},{"id":898,"hanzi":"总是","part":"Conj","pinyin":"zǒngshì","def":"always","ex":[{"zh":"我妈妈总是跟说要努力读书以后才会有好工作。","py":"Wǒ māmā zǒng shì gēn shuō yào nǔlì dúshū yǐhòu cái huì yǒu hǎo gōngzuò.","en":"My mother always told me to study hard so that I can get a good job in the future."},{"zh":"爸爸去电影院看电影的时候总是睡着。","py":"Bàba qù diànyǐngyuàn kàn diànyǐng de shíhòu zǒng shì shuì zháo.","en":"Dad always fell asleep when he goes to the cinema for watching movies."}]},{"id":899,"hanzi":"饱","part":"Adj","pinyin":"bǎo","def":"full (to eat till full)","ex":[{"zh":"你做得饭真好吃，我吃得很饱。","py":"Nǐ zuò de fàn zhēn hǎochī, wǒ chī de hěn bǎo.","en":"The dish you made is so delicious, I'm full."},{"zh":"今天早上太忙，早饭没吃饱。","py":"Jīntiān zǎo shàng tài máng, zǎo fàn méi chī bǎo.","en":"I'm too busy this morning, I couldn't eat my breakfast till full."}]},{"id":900,"hanzi":"抽空","part":"Verb","pinyin":"chōukòng","def":"to find time to do something","ex":[{"zh":"他虽然工作很忙，可是每天还是会抽空看书。","py":"Tā suīrán gōngzuò hěnmáng, kěshì měitiān háishì huì chōukòng kànshū.","en":"His work is really busy, but he still finds some time to read every day."},{"zh":"请你抽空参加我们的活动。","py":"Qǐng nǐ chōu kōng cān jiā wǒ men de huó dòng.","en":"Please make some time to attend the activity we hol
