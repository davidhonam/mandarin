我常在家练习做菜。","py":"Wǒ cháng zài jiā liànxí zuòcài.","en":"I often practice cooking at home"},{"zh":"老师说我们要多练习写汉字。","py":"Lǎoshī shuō wǒmen yào duō liànxí xiě hànzì.","en":"Teacher said we should practice Chinese writing more."}]},{"id":235,"hanzi":"说话","part":"Verb Object","pinyin":"shuōhuà","def":"to speak/ to talk","ex":[{"zh":"他喜欢跟美国人说话，练习英语。","py":"Tā xǐhuan gēn Měiguó rén shuōhuà, liànxí yīngyǔ.","en":"He likes to speak with Americans to practice his English."},{"zh":"我喜欢跟中国人说话，练习我的汉语。","py":"Wǒ xǐhuan gēn Zhōngguó rén shuōhuà, liànxí wǒ de hànyǔ.","en":"I like to practice Chinese by talking to Chinese."}]},{"id":236,"hanzi":"为什么","part":"Phrase","pinyin":"wèishénme","def":"why","ex":[{"zh":"现在已经晚上十二点了，你为什么不睡觉?","py":"Xiànzài yǐjīng wǎnshàng shíèrdiǎn le, nǐ wèi shénme bú shuìjiào?","en":"It’s already twelve a.m. now, why are you not sleeping?"},{"zh":"你为什么想学汉语?","py":"Nǐ wèi shénme xiǎng xué hànyǔ?","en":"Why do you learn Chinese?"}]},{"id":237,"hanzi":"有用","part":"Adj","pinyin":"yǒuyòng","def":"useful","ex":[{"zh":"这个东西很有用也很方便。","py":"Zhège dōngxi hěn yǒuyòng yě hěn fāngbiàn.","en":"This thing is useful and convenient."},{"zh":"你觉得学汉语有用吗?","py":"Nǐ juéde xué hànyǔ yǒuyòng ma?","en":"Do you think Chinese is useful?"}]},{"id":238,"hanzi":"放假","part":"Verb Object","pinyin":"fàngjià","def":"to have a vacation","ex":[{"zh":"我明天放假。","py":"Wǒ míngtiān fàngjià.","en":"I'll be on holiday tomorrow."},{"zh":"我从星期一到星期五都放假。","py":"Wǒ cóng xīngqī yī dào xīngqī wǔ dōu fàngjià.","en":"I have break from Monday to Friday."}]},{"id":239,"hanzi":"因为","part":"Conj","pinyin":"yīnwèi","def":"Because","ex":[{"zh":"因为我喜欢吃中国菜，所以我常去中国饭馆。","py":"Yīnwèi wǒ xǐhuan chī Zhōngguó cài, suǒyǐ wǒ cháng qù Zhōngguó fànguǎn.","en":"I like to eat Chinese food, so I go to Chinese restaurant frequently."},{"zh":"因为我放三天假, 所以我想出去玩儿。","py":"Yīnwèi wǒ fàng sān tiān jià, suǒyǐ wǒ xiǎng chūqù wánr.","en":"Because I have three days vacation, so I would like to go out and have fun."}]},{"id":240,"hanzi":"所以","part":"Conj","pinyin":"suǒyǐ","def":"therefore","ex":[{"zh":"因为我喜欢爬山，所以周末我都去。","py":"Yīnwèi wǒ xǐhuan páshān, suǒyǐ zhōumò wǒ dōu qù.","en":"I like to climb the mountain, so I go there on weekends."},{"zh":"他常练习说中文, 所以说得不错。","py":"Tā cháng liànxí shuō Zhōngwén, suǒyǐ shuō de búcuò.","en":"He often practices speaking Chinese, so he speaks well."}]},{"id":241,"hanzi":"刚","part":"Adv","pinyin":"gāng","def":"just","ex":[{"zh":"我刚放假，你想去哪儿玩儿?","py":"Wǒ gāng fàngjià, nǐ xiǎng qù nǎr wánr?","en":"I just have holiday, where do you want to go?"},{"zh":"我刚起床，我们一起去吃早饭吧!","py":"Wǒ gāng qǐchuáng, wǒmen yìqǐ qù chī zǎofàn ba.","en":"I just woke up, let’s go eat breakfast together."}]},{"id":242,"hanzi":"看见","part":"Verb","pinyin":"kànjiàn","def":"to see, to catch sight of","ex":[{"zh":"你昨天看见什么了?","py":"Nǐ zuótiān kànjiàn shénme le?","en":"What did you see yesterday?"},{"zh":"我刚看见他和他的朋友在一起逛街。","py":"Wǒ gāng kànjiàn tā hé tā de péngyǒu zài yìqǐ guàngjiē.","en":"I just saw he and his friend shopping together."}]},{"id":243,"hanzi":"以前","part":"Noun","pinyin":"yǐqián","def":"Noun/ before","ex":[{"zh":"我三年以前不会说汉语，现在说得很好。","py":"Wǒ sān nián yǐqián búhuì shuō Hànyǔ, xiànzài shuō de hěnhǎo.","en":"I couldn’t speak Chinese three years ago, but now I can speak well."},{"zh":"他两天以前还在美国，现在已经在中国了。","py":"Tā liǎngtiān yǐqián háizài Měiguó, xiànzài yǐjīng zài Zhōngguó le.","en":"He was in USA two days ago, now he is in China."}]},{"id":244,"hanzi":"书法","part":"Noun","pinyin":"shūfǎ","def":"calligraphy","ex":[{"zh":"我喜欢写书法。","py":"Wǒ xǐhuan xiě shūfǎ.","en":"I like to write calligraphy."},{"zh":"我妈妈写的书法很漂亮。","py":"Wǒ māma xiě de shūfǎ hěn piàoliang.","en":"My mother’s calligraphy looks really nice."}]},{"id":245,"hanzi":"开始","part":"Verb","pinyin":"kāishǐ","def":"to start","ex":[{"zh":"从明天开始，我不上汉语课了。","py":"Cóng míngtiān kāishǐ, wǒ bú shàng Hànyǔ kè le.","en":"From tomorrow I don’t take Chinese class anymore."},{"zh":"篮球比赛三点开始，你要来看比赛吗?","py":"Lánqiú bǐsài sāndiǎn kāishǐ, nǐ yào lái kàn bǐsài ma?","en":"The basketball game starts at three p.m., are you coming?"}]},{"id":246,"hanzi":"学校","part":"Noun","pinyin":"xuéxiào","def":"school","ex":[{"zh":"这是我的学校，很漂亮吧?","py":"Zhè shì wǒ de xuéxiào, hěn piàoliang ba?","en":"This is my school. It's really pretty, isn't it?"},{"zh":"我弟弟的学校在那条路，往前走右拐就到了。","py":"Wǒ dìdi de xuéxiào zài nà tiáo lù, wǎng qián zǒu yòuguǎi jiù dào le.","en":"My younger brother’s school is on that road, just go forward and turn right."}]},{"id":247,"hanzi":"课","part":"Noun","pinyin":"kè","def":"lesson, class","ex":[{"zh":"你今天上什么课?","py":"Nǐ jīntiān shàng shénme kè?","en":"What class do you have today?"},{"zh":"我明天没课，我们一起去爬山吧。","py":"Wǒ míngtiān méi kè, wǒmen yìqǐ qù páshān ba.","en":"I don’t have class tomorrow, let’s go mountain climbing."}]},{"id":248,"hanzi":"可能","part":"Adv","pinyin":"kěnéng","def":"maybe, might, probably","ex":[{"zh":"我可能不能去他家玩儿。","py":"Wǒ kěnéng bù néng qù tā jiā wánr.","en":"I might not go to his house to hang out."},{"zh":"他可能会迟到，我们等他吧。","py":"Tā kěnéng huì chídào, wǒmen děng tā ba.","en":"He might be late, let’s wait for him."}]},{"id":249,"hanzi":"最近","part":"Noun","pinyin":"zuìjìn","def":"recently","ex":[{"zh":"他最近工作很忙，不常给我打电话。","py":"Tā zuìjìn gōngzuò hěn máng, bù cháng gěi wǒ dǎdiànhuà.","en":"He has been busy recently, only rarely does he call me."},{"zh":"最近我很忙。","py":"Zuìjìn wǒ hěn máng.","en":"Recently, I'm very busy."}]},{"id":250,"hanzi":"喂","part":"Phrase","pinyin":"wéi","def":"Hello (when answer the telephone)","ex":[{"zh":"喂，你好，请问有什么事?","py":"Wéi, nǐhǎo, qǐngwèn yǒu shénme shì?","en":"Hello, how can I help you?"},{"zh":"喂，我现在不方便接电话，你可以三十分钟之后再打吗？","py":"Wéi, wǒ xiànzài bù fāngbiàn jiē diànhuà, nǐ kěyǐ sānshí fēnzhōng zhīhòu zài dǎ ma?","en":"Hello, it's not a good time to talk right now, can you give me a call in thirty minutes?"}]},{"id":251,"hanzi":"开会","part":"Verb Object","pinyin":"kāihuì","def":"to hold a meeting","ex":[{"zh":"我下午一点要开会。","py":"Wǒ xiàwǔ yì diǎn yào kāihuì.","en":"I have meeting at one p.m."},{"zh":"我们公司每个下午都开会。","py":"Wǒmen gōngsī měi ge xiàwǔ dōu kāihuì.","en":"Our company has a meeting every afternoon."}]},{"id":252,"hanzi":"打电话","part":"Verb Object","pinyin":"dǎdiànhuà","def":"to make a phone call","ex":[{"zh":"你晚上可以打电话来我家。","py":"Nǐ wǎnshàng kěyǐ dǎdiànhuà lái wǒ jiā.","en":"You can call me at night."},{"zh":"他喜欢打电话跟朋友聊天。","py":"Tā xǐhuan dǎdiànhuà gēn péngyou liáotiān.","en":"He likes to call his friend and chat."}]},{"id":253,"hanzi":"那","part":"Adv","pinyin":"nà","def":"then, in that case","ex":[{"zh":"A: 今天外面下雨，不能打篮球。 B: 那我们去看电影吧。","py":"A: Jīntiān wàimiàn xiàyǔ, bùnéng dǎ lánqiú. B: Nà wǒmen qù kàn diànyǐng ba.","en":"A: It’s raining outside, we can’t play basketball. B: Then let’s see a movie."},{"zh":"A: 那个东西多少钱？ B: 五十元。A: 那这个东西要多少钱?","py":"A: Nàgè dōngxī duōshǎo qián? B: Wǔ shí yuán. A: Nà zhège dōngxi yào duōshǎo qián?","en":"A: How much does this thing cost? B: Fifty dollars. A: Then how much does this cost?"}]},{"id":254,"hanzi":"桌子","part":"Noun","pinyin":"zhuōzi","def":"table","ex":[{"zh":"我家有三张桌子。","py":"Wǒ jiā yǒu sān zhāng zhuōzi.","en":"I have three tables at home."},{"zh":"他公司有很多桌子和椅子。","py":"Tā gōngsī yǒu hěnduō zhuōzi hé yǐzi.","en":"There are a lot of tables and chairs in his company."}]},{"id":255,"hanzi":"生日会","part":"Noun","pinyin":"shēngrì huì","def":"birthday party","ex":[{"zh":"他的生日会是一月二十五日。","py":"Tā de shēngrì huì shì yī yuè èrshíwǔ rì.","en":"His birthday party is on the twenty-fifth of January."},{"zh":"你会去他的生日会吗?","py":"Nǐ huì qù tā de shēngrì huì ma?","en":"Are you going to his birthday party?"}]},{"id":256,"hanzi":"苹果派","part":"Noun","pinyin":"píngguǒ pài","def":"apple pie","ex":[{"zh":"我不喜欢吃苹果派。","py":"Wǒ bù xǐhuan chī píngguǒ pài.","en":"I don’t like to eat apple pie."},{"zh":"我妈妈做的苹果派很好吃。","py":"Wǒ māma zuò de píngguǒ pài hěn hǎo chī.","en":"The apple pie my mother made is really tasty."}]},{"id":257,"hanzi":"邀请","part":"Verb","pinyin":"yāoqǐng","def":"to invite","ex":[{"zh":"我想邀请你跟你的家人来我的生日会。","py":"Wǒ xiǎng yāoqǐng nǐ gēn nǐ de jiārén lái wǒ de shēngrì huì.","en":"I would like to invite you and your family to my birthday party."},{"zh":"他邀请朋友一起去看篮球比赛。","py":"Tā yāoqǐng péngyou yìqǐ qù kàn lánqiú bǐsài.","en":"He invites his friend to watch the basketball game together."}]},{"id":258,"hanzi":"好久不见","part":"Phrase","pinyin":"hǎojiǔ bújiàn","def":"long time, no see","ex":[{"zh":"好久不见，你好吗?","py":"Hǎojiǔ bújiàn, nǐhǎo ma?","en":"Long time no see, how are you?"},{"zh":"好久不见，你最近新工作怎么样?","py":"Hǎojiǔ bújiàn, nǐ zuìjìn xīn gōngzuò zěnmeyàng?","en":"Long time no see, how’s your new job?"}]},{"id":259,"hanzi":"给","part":"Verb","pinyin":"gěi","def":"to give","ex":[{"zh":"因为我要考试，所以他给我很多书。","py":"Yīnwèi wǒ yào kǎoshì, suǒyǐ tā gěi wǒ hěnduō shū.","en":"He gives me a lot of books because I have a test."},{"zh":"你要给他什么?","py":"Nǐ yào gěi tā shénme?","en":"What are you going to give him?"}]},{"id":260,"hanzi":"礼物","part":"Noun","pinyin":"lǐwù","def":"gift","ex":[{"zh":"我不知道他喜欢什么礼物。","py":"Wǒ bù zhīdào tā xǐhuan shénme lǐwù.","en":"I don’t know what present he likes."},{"zh":"你想要什么礼物?","py":"Nǐ xiǎng yào shénme lǐwù?","en":"What present would you like?"}]},{"id":261,"hanzi":"蓝色","part":"Noun","pinyin":"lánsè","def":"blue","ex":[{"zh":"我有一件蓝色的衣服。","py":"Wǒ yǒu yí jiàn lánsè de yīfú.","en":"I have a blue t-shirt."},{"zh":"我有很多蓝色的杯子。","py":"Wǒ yǒu hěnduō lánsè de bēizi.","en":"I have a lot of blue cups."}]},{"id":262,"hanzi":"饺子","part":"Noun","pinyin":"jiǎozi","def":"dumplings","ex":[{"zh":"饺子是中国菜的一种。","py":"Jiǎozi shì Zhōngguó cài de yì zhǒng.","en":"Dumpling is a kind of Chinese food."},{"zh":"我不喜欢吃饺子。","py":"Wǒ bù xǐhuan chī jiǎozi.","en":"I don’t like to eat dumplings."}]},{"id":263,"hanzi":"旅游","part":"Verb","pinyin":"lǚyóu","def":"travel","ex":[{"zh":"我喜欢和我的朋友一起去旅游。","py":"Wǒ xǐhuan hé wǒ de péngyou yìqǐ qù lǚyóu.","en":"I like to go travelling with my friends."},{"zh":"下个星期我们家要去美国旅游。","py":"Xiàge xīngqī wǒmen jiā yào qù Měiguó lǚyóu.","en":"My family and I are going to travel in America next week."}]},{"id":264,"hanzi":"经验","part":"Noun","pinyin":"jīngyàn","def":"experience","ex":[{"zh":"他的工作经验不多。","py":"Tā de gōngzuò jīngyàn bùduō.","en":"He doesn’t have much working experience."},{"zh":"他的旅游经验很多。","py":"Tā de lǚyóu jīngyàn hěn duō.","en":"He has a lot of traveling experience."}]},{"id":265,"hanzi":"次","part":"Measure word","pinyin":"cì","def":"Measure word for enumerated events, time","ex":[{"zh":"这件事情我说了三次了。","py":"Zhè jiàn shìqing wǒ shuō le sān cì le.","en":"I have told you about this three times."},{"zh":"我们公司每周都开一次会。","py":"Wǒmen gōngsī měi zhōu dōu kāi yí cì huì.","en":"Our company has meeting once a week."}]},{"id":266,"hanzi":"快乐","part":"Adj","pinyin":"kuàile","def":"happy","ex":[{"zh":"旅游是一件很快乐的事情。","py":"Lǚyóu shì yí jiàn hěn kuàilè de shìqing.","en":"Traveling is a very happy thing."},{"zh":"生日快乐! 这是给你的礼物。","py":"Shēngrì kuàilè! Zhè shì gěi nǐ de lǐwù.","en":"Happy Birthday! This present is for you."}]},{"id":267,"hanzi":"最","part":"Adv","pinyin":"zuì","def":"the most, \"-est\"","ex":[{"zh":"我最喜欢的人是我爸爸妈妈。","py":"Wǒ zuì xǐhuan de rén shì wǒ bàba māma.","en":"I like my parents the most."},{"zh":"离我家最远的商店要走一小时。","py":"Lí wǒ jiā zuì yuǎn de shāngdiàn yào zǒu yì xiǎoshí.","en":"The most far away shop from my house take an hour by walking."}]},{"id":268,"hanzi":"有名","part":"Adj","pinyin":"yǒumíng","def":"famous","ex":[{"zh":"这是这儿最有名的饭馆。","py":"Zhè shì zhèr zuì yǒumíng de fànguǎn.","en":"This is the most famous restaurant here."},{"zh":"我家附近的海边很有名，放假的时候常常很多人来玩儿。","py":"Wǒ jiā fùjìn de hǎibiān hěn yǒumíng, fàngjià de shíhou cháng cháng hěn duō rén lái wánr.","en":"The beach nearby my house is really famous, during the holidays there are frequently lots of people."}]},{"id":269,"hanzi":"飞机","part":"Noun","pinyin":"fēijī","def":"airplane","ex":[{"zh":"从美国到中国要坐十几个小时的飞机。","py":"Cóng Měiguó dào Zhōngguó yào zuò shí jǐ ge xiǎoshí de fēijī.","en":"It takes more than ten hours from America to China by plane."},{"zh":"我常坐飞机去旅游。","py":"Wǒ cháng zuò fēijī qù lǚyóu.","en":"I often take travel by plane."}]},{"id":270,"hanzi":"听说","part":"Verb","pinyin":"tīngshuō","def":"to hear (sb. said)","ex":[{"zh":"听说你去过中国很多次？","py":"Tīngshuō nǐ qùguò Zhōngguó hěnduō cì?","en":"I heard that you have been to China many times?"},{"zh":"我听说你弹吉他。","py":"Wǒ tīngshuō nǐ dàn jítā.","en":"I hear you play the guitar."}]},{"id":271,"hanzi":"高兴","part":"Adj","pinyin":"gāoxìng","def":"glad, happy","ex":[{"zh":"很高兴你也喜欢日本菜。","py":"Hěn gāoxìng nǐ yě xǐhuan Rìběn cài.","en":"I'm glad you liked Japanese food."},{"zh":"我太高兴了。","py":"Wǒ tài gāoxìngle.","en":"I'm too happy."}]},{"id":272,"hanzi":"旅馆","part":"Noun","pinyin":"lǚguǎn","def":"hostel, hotel","ex":[{"zh":"你去旅游的时候喜欢住哪种旅馆？","py":"Nǐ qù lǚyóu de shíhou xǐhuan zhù nǎ zhǒng lǚguǎn？","en":"When you travel, which kind of hotel do you like to stay at?"},{"zh":"旅馆在哪里？","py":"Lǚguǎn zài nǎlǐ?","en":"Where is the hotel?"}]},{"id":273,"hanzi":"纪念品","part":"Noun","pinyin":"jìniànpǐn","def":"souvenir","ex":[{"zh":"你会买纪念品给你家人吗？","py":"Nǐ huì mǎi jìniànpǐn gěi nǐ jiārén ma?","en":"Will you buy souvenirs for your family?"},{"zh":"外国人常到这里来买纪念品。","py":"Wàiguó rén cháng dào zhèlǐ lái mǎi jìniànpǐn.","en":"Foreigners often come here to buy souvenirs."}]},{"id":274,"hanzi":"计划","part":"Verb","pinyin":"jìhuà","def":"to plan, to plan to do sth.","ex":[{"zh":"你计划去哪几个国家旅游？","py":"Nǐ jìhuà qù nǎ jǐ ge guójiā lǚyóu?","en":"What countries are you planning to go to?"},{"zh":"他今年有一个旅游的计划。","py":"Tā jīnnián yǒu yí gè lǚyóu de jìhuà.","en":"He has a traveling plan this year."}]},{"id":275,"hanzi":"习惯","part":"Verb","pinyin":"xíguàn","def":"to get used to","ex":[{"zh":"你习惯吃哪国菜？","py":"Nǐ xíguàn chī nǎguó cài?","en":"Which country’s food do you get used to eat?"},{"zh":"我刚到这里的时候, 不习惯的事有很多。","py":"Wǒ gāng dào zhèlǐ de shíhou, bù xíguàn de shì yǒu hěn duō.","en":"There were a lot of things that I didn't get used to when I arrived here."}]},{"id":276,"hanzi":"去年","part":"Noun","pinyin":"qùnián","def":"last year","ex":[{"zh":"你去年去过哪些国家？","py":"Nǐ qùnián qùguò nǎxiē guójiā?","en":"What countries did you visit last year?"},{"zh":"去年她在日本。","py":"Qùnián tā zài rìběn.","en":"Last year she was in Japan."}]},{"id":277,"hanzi":"回国","part":"Verb Object","pinyin":"huíguó","def":"to return to home country","ex":[{"zh":"他二月三日回国。","py":"Tā èr yuè sān rì huíguó.","en":"He will return home on 3rd February."},{"zh":"你什么时候回国?","py":"Nǐ shénme shíhou huíguó?","en":"When will you return to your home country?"}]},{"id":278,"hanzi":"打算","part":"Verb","pinyin":"dǎsuàn","def":"to plan","ex":[{"zh":"我打算三点去图书馆看书。","py":"Wǒ dǎsuàn sān diǎn qù túshūguǎn kànshū.","en":"I plan to go to library to read books at 3pm."},{"zh":"他打算三月回国。","py":"Tā dǎsuàn sān yuè huíguó.","en":"He plans to return home in March."}]},{"id":279,"hanzi":"北京","part":"Noun","pinyin":"běijīng","def":"Peking","ex":[{"zh":"我爸爸的公司在北京，他在那儿工作。","py":"Wǒ bàba de gōngsī zài Běijīng, tā zài nàr gōngzuò.","en":"My dad’s company is in Peking, he is working there."},{"zh":"我们放假的时候打算去北京玩儿。","py":"Wǒmen fàngjià de shíhou dǎsuàn qù Běijīng wánr.","en":"We plan to go to Peking on our vacation."}]},{"id":280,"hanzi":"外国","part":"Noun","pinyin":"wàiguó","def":"abroad/foreign country","ex":[{"zh":"我跟我的朋友放假要去外国旅游。","py":"Wǒ gēn wǒ de péngyou fàngjià yào qù wàiguó lǚyóu.","en":"My friend and I are going abroad during our vacation."},{"zh":"外国的饭馆都很贵，可是很好吃。","py":"Wàiguó de fànguǎn dōu hěn guì, kěshì hěn hǎo chī.","en":"Foreign restaurant is very expensive but very good."}]},{"id":281,"hanzi":"只","part":"Adv","pinyin":"zhǐ","def":"only","ex":[{"zh":"放假的时候，他的家人只喜欢在家休息。","py":"Fàngjià de shíhou tā de jiārén zhǐ xǐhuan zài jiā xiūxi.","en":"His family only like to stay at home during holiday."},{"zh":"我只喜欢去这家饭馆吃饭。","py":"Wǒ zhǐ xǐhuan qù zhè jiā fànguǎn chīfàn.","en":"I only like to eat in this restaurant."}]},{"id":282,"hanzi":"后天","part":"Noun","pinyin":"hòutiān","def":"the day after tomorrow","ex":[{"zh":"因为他后天要去北京工作，所以明天晚上我们一起去酒吧喝酒聊天吧!","py":"Yīnwèi tā hòutiān yào qù Běijīng gōngzuò, suǒyǐ míngtiān wǎnshàng wǒmen yìqǐ qù jiǔbā hējiǔ liáotiān ba.","en":"He is going to work in Peking the day after tomorrow, so let’s go to the bar and have a drink tomorrow night."},{"zh":"你后天有空吗？","py":"Nǐ hòutiān yǒu kòng ma?","en":"Do you have free time the day after tomorrow?"}]},{"id":283,"hanzi":"女朋友","part":"Noun","pinyin":"nǚpéngyou","def":"girlfreind","ex":[{"zh":"我的女朋友是美国人。","py":"Wǒ de nǚpéngyou shì Měiguó rén.","en":"My girlfriend is American."},{"zh":"我的女朋友后天要回国了。","py":"Wǒ de nǚpéngyou hòutiān yào huí guó le.","en":"My girlfriend is leaving back to her country the day after tomorrow."}]},{"id":284,"hanzi":"走","part":"Verb","pinyin":"zǒu","def":"to leave","ex":[{"zh":"真舍不得你走，要常回来看我们。","py":"Zhēn shěbude nǐ zǒu, yào cháng huílái kàn women.","en":"Really don’t want you to go, come back to visit us often."},{"zh":"他要走了，你去说再见吧!","py":"Tā yào zǒu le, nǐ qù shuō zàijiàn ba!","en":"He is leaving, go and say goodbye."}]},{"id":285,"hanzi":"舍不得","part":"Verb","pinyin":"shěbude","def":"to hate to part with","ex":[{"zh":"我们舍不得你回国。","py":"Wǒmen shěbude nǐ huí guó.","en":"We don’t want you to return to your country."},{"zh":"我爸爸妈妈舍不得我到外国去学习。","py":"Wǒ bàba māma shěbude wǒ dào wàiguó qù xuéxi.","en":"My parent don’t want me to go abroad to study."}]},{"id":286,"hanzi":"同学","part":"Noun","pinyin":"tóngxué","def":"classmate","ex":[{"zh":"我汉语课的同学是美国人。","py":"Wǒ Hànyǔ kè de tóngxué shì Měiguó rén.","en":"My classmate from Chinese class is an American."},{"zh":"我同学已经在图书馆等我们了。","py":"Wǒ tóngxué yǐjīng zài túshūguǎn děng wǒmen le.","en":"My classmate is already waiting for us in the library."}]},{"id":287,"hanzi":"想","part":"Verb","pinyin":"xiǎng","def":"to miss","ex":[{"zh":"他到中国去工作三年了，他的家人都很想他。","py":"Tā dào Zhōngguó qù gōngzuò sān nián le, tā de jiārén dōu hěn xiǎng tā.","en":"He was working in China for 3 years, his family miss him a lot."},{"zh":"我女朋友回国了，我很想他。","py":"Wǒ nǚpéngyou huí guó le, wǒ hěn xiǎng tā.","en":"My girlfriend is back to her country, I miss her a lot."}]},{"id":288,"hanzi":"写信","part":"Verb","pinyin":"xiě xìn","def":"to write a letter","ex":[{"zh":"你回国以后要常写信给我。","py":"Nǐ huí guó yǐhòu yào cháng xiěxìn gěi wǒ.","en":"You have to write me a letter more often when you are back home."},{"zh":"我很喜欢写信、看电视。","py":"Wǒ hěn xǐhuan xiěxìn, kàn diànshì.","en":"I like to write letters and watch TV."}]},{"id":289,"hanzi":"搭","part":"Verb","pinyin":"dā","def":"to take (transportation)","ex":[{"zh":"从美国搭飞机到中国要十三个小时。","py":"Cóng Měiguó dā fēijī dào Zhōngguó yào shí sān gè xiǎoshí.","en":"It takes thirteen hours from America to China by plane."},{"zh":"我们要一起搭飞机到日本去玩儿。","py":"Wǒmen yào yìqǐ dā fēijī dào Rìběn qù wánr.","en":"We want to take a plane to Japan together."}]},{"id":290,"hanzi":"回来","part":"Verb","pinyin":"huílái","def":"to come back","ex":[{"zh":"已经很晚了，你妹妹怎么还没回来?","py":"Yǐjīng hěn wǎn le, nǐ mèimei zěnme háiméi huílái?","en":"It’s late, why is your younger sister not back yet?"},{"zh":"我爸爸刚从美国回来。","py":"Wǒ bàba gāng cóng Měiguó huílái.","en":"My father just came back from America."}]},{"id":291,"hanzi":"天气","part":"Noun","pinyin":"tiānqì","def":"weather","ex":[{"zh":"今天天气不错，我们要不要一起出门去玩儿?","py":"Jīntiān tiānqì búcuò, wǒmen yào búyào yìqǐ chūmén qù wánr?","en":"Today’s weather is good, how about go out and play?"},{"zh":"昨天的天气不好，很冷，我们都在家里没有出门。","py":"Zuótiān de tiānqì bù hǎo, hěn lěng, wǒmen dōu zài jiā lǐ méiyǒu chūmén.","en":"Yesterday’s weather was bad, it was cold. We all stayed at home."}]},{"id":292,"hanzi":"冷","part":"Adj","pinyin":"lěng","def":"cold","ex":[{"zh":"今天外面很冷，早一点儿回来。","py":"Jīntiān wàimiàn hěn lěng, zǎo yìdiǎnr huílái.","en":"It’s really cold outside, come back home early."},{"zh":"北京的天气很冷，因为开车出门不方便，所以很多人都搭地铁。","py":"Běijīng de tiānqì hěn lěng, yīnwèi kāichē chūmén bù fāngbiàn, suǒyǐ hěn duō rén dōu dā dìtiě.","en":"The weather in Beijing is cold. Driving is not convenient therefore a lot of people take a subway."}]},{"id":293,"hanzi":"热","part":"Adj","pinyin":"rè","def":"hot","ex":[{"zh":"天气很热，我们去游泳吧!","py":"Tiānqì hěn rè, wǒmen qù yóuyǒng ba!","en":"It’s so hot, let’s go swimming."},{"zh":"我有一点儿热，你可以给我一点儿水吗?","py":"Wǒ yǒu yìdiǎnr rè, nǐ kěyǐ gěi wǒ yìdiǎnr shuǐ ma?","en":"I am a bit warm, can you give me some water?"}]},{"id":294,"hanzi":"滑雪","part":"Verb Object","pinyin":"huáxuě","def":"to ski","ex":[{"zh":"放假的时候，我都跟我的家人去日本滑雪。","py":"Fàngjià de shíhou, wǒ dōu gēn wǒ de jiārén qù Rìběn huáxuě.","en":"During vacation time, I often go to Japan to ski with my family."},{"zh":"滑雪不难，可是很累。","py":"Huáxuě bù nán, kěshì hěn lèi.","en":"Skiing is not hard, but very tired."}]},{"id":295,"hanzi":"游泳","part":"Noun","pinyin":"yóuyǒng","def":"to swim","ex":[{"zh":"天气很热的时候，我们都喜欢去游泳。","py":"Tiānqì hěn rè de shíhou, wǒmen dōu xǐhuan qù yóuyǒng.","en":"When it’s hot, we all like to go swimming."},{"zh":"我游泳之后都会吃很多东西。","py":"Wǒ yóuyǒng zhīhòu dōu huì chī hěnduō dōngxi.","en":"I always eat a lot after swimming."}]},{"id":296,"hanzi":"下雪","part":"Verb Object","pinyin":"xiàxuě","def":"to snow","ex":[{"zh":"外面下雪了，真漂亮。","py":"Wàimiàn xiàxuě le, zhēn piàoliang.","en":"It’s snowing outside, it’s very pretty."},{"zh":"因为下雪的时候，开车不方便，所以很多人会坐地铁上班。","py":"Yīnwèi xiàxuě de shíhou, kāi chē bù fāngbiàn, suǒyǐ hěn duō rén huì zuò dìtiě shàngbān.","en":"It’s not convenient when snowing, so a lot of people will take a subway to go to work."}]},{"id":297,"hanzi":"舒服","part":"Adj","pinyin":"shūfu","def":"comfortable","ex":[{"zh":"今天的天气不冷也不热，很舒服。","py":"Jīntiān de tiānqì bù lěng yě bú rè, hěn shūfu.","en":"Today is not so cold and not so warm. It's comfortable."},{"zh":"他今天不来上汉语课，因为他可能不太舒服。","py":"Tā jīntiān bù lái shàng Hànyǔ kè, yīnwèi tā kěnéng bú tài shūfu.","en":"He is not coming to Chinese class today, because he isn’t feeling well."}]},{"id":298,"hanzi":"岁","part":"Measure word","pinyin":"suì","def":"year old","ex":[{"zh":"你是几岁开始学中文的？","py":"Nǐ shì jǐ suì kāishǐ xué Zhōngwén de?","en":"How old did you start to learn Chinese?"},{"zh":"你几岁开始旅游？","py":"Nǐ jǐ suì kāishǐ lǚyóu?","en":"How old do you start to travel?"}]},{"id":299,"hanzi":"高","part":"Adj","pinyin":"gāo","def":"high；tall","ex":[{"zh":"你的家人都比你高吗？","py":"Nǐ de jiārén dōu bǐ nǐ gāo ma?","en":"Is your family all taller than you?"},{"zh":"这个大楼比那个大楼高吗？","py":"Zhège dàlóu bǐ nàgè dàlóu gāo ma?","en":"Is this building taller than that building?"}]},{"id":300,"hanzi":"那么","part":"Conj","pinyin":"nàme","def":"so then...","ex":[{"zh":"为什么你的中文说得那么好？","py":"Wèishénme nǐ de zhōngwén shuō dé nàme hǎo?","en":"Why do you speak Chinese so well?"},{"zh":"为什么你那么喜欢中国菜？","py":"Wèishénme nǐ nàme xǐhuan Zhōngguó cài?","en":"Why do you like Chinese food so much?"}]},{"id":301,"hanzi":"胖","part":"Adj","pinyin":"pàng","def":"fat","ex":[{"zh":"哪个比较胖？","py":"Nǎge bǐjiào pàng?","en":"Which one is fatter?"},{"zh":"哪个比较不那么胖？","py":"Nǎge bǐjiào bú nàme pàng?","en":"Which one is less fat?"}]},{"id":302,"hanzi":"矮","part":"Adj","pinyin":"ǎi","def":"short","ex":[{"zh":"弟弟比较矮。","py":"Dìdì bǐjiào ǎi.","en":"My younger brother is shorter."},{"zh":"哥哥没有弟弟那么矮。","py":"Gēge méiyǒu dìdi nàme ǎi.","en":"My older brother is not as short as my younger brother."}]},{"id":303,"hanzi":"瘦","part":"Adj","pinyin":"shòu","def":"thin","ex":[{"zh":"瘦的人健康吗？","py":"Shòu de rén jiànkāng ma?","en":"Are thin people healthy?"},{"zh":"你家人没有你那么瘦吗？","py":"Nǐ jiārén méiyǒu nǐ nàme shòu ma?","en":"Your family isn't as skinny as you?"}]},{"id":304,"hanzi":"长","part":"Adj","pinyin":"cháng","def":"long","ex":[{"zh":"那条路不长。","py":"Nà tiáo lù bù cháng.","en":"That road is not long."},{"zh":"他学中文的时间很长。","py":"Tā xué Zhōngwén de shíjiān hěn cháng.","en":"He studied Chinese for a long time."}]},{"id":305,"hanzi":"头发","part":"Noun","pinyin":"tóufà","def":"hair","ex":[{"zh":"他的头发很长吗？","py":"Tā de tóufà hěn cháng ma?","en":"Is his hair very long?"},{"zh":"他的头发没有我的那么长。","py":"Tā de tóufà méiyǒu wǒ de nàme cháng.","en":"His hair is not as long as mine."}]},{"id":306,"hanzi":"医生","part":"Noun","pinyin":"yīshēng","def":"doctor","ex":[{"zh":"我今天不舒服，我想我得去看医生。","py":"Wǒ jīntiān bù shūfu, wǒ xiǎng wǒ dĕi qù kàn yīshēng.","en":"I don’t feel well, I think I need to see a doctor."},{"zh":"我想做医生。","py":"Wǒ xiǎng zuò yīshēng.","en":"I want to be a doctor."}]},{"id":307,"hanzi":"生病","part":"Verb Object","pinyin":"shēngbìng","def":"to be sick","ex":[{"zh":"他生病了。所以今天不来上班。","py":"Tā shēngbìng le, suǒyǐ jīntiān bù lái shàngbān.","en":"He is sick, so he will not come to work today."},{"zh":"我昨天生病了。","py":"Wǒ zuótiān shēngbìngle.","en":"I was sick yesterday."}]},{"id":308,"hanzi":"看病","part":"Verb Object","pinyin":"kànbìng","def":"to see a doctor","ex":[{"zh":"我跟我妹妹今天都不舒服, 所以我们下午的时候就一起去看病了。","py":"Wǒ gēn wǒ mèimei jīntiān dōu bù shūfu, suǒyǐ wǒmen xiàwǔ de shíhou jiù yìqǐ qù kànbìng le.","en":"My younger sister and I both don’t feel well, so we go to see a doctor in the afternoon together."},{"zh":"我们打算今天下午去看病，听说那个医生很有名，可是很早就休息了。","py":"Wǒmen dǎsuàn jīntiān xiàwǔ qù kànbìng. Tīngshuō nàge yīshēng hěn yǒumíng, kěshì hěn zǎo jiù xiūxi le.","en":"We plan to see a doctor this afternoon. We heard that he is famous. But the clinic closed early."}]},{"id":309,"hanzi":"药","part":"Noun","pinyin":"yào","def":"medicine","ex":[{"zh":"这个药每天上午、中午、晚上都要吃一次。","py":"Zhè gè yào měitiān shàngwǔ, zhōngwǔ, wǎnshàng dōu yào chī yícì.","en":"This medicine has to be taken once in the morning, noon and night."},{"zh":"医生说吃完饭要吃药。","py":"Yīshēng shuō chī wánfàn yào chīyào.","en":"The doctor said you have to eat medicine after your meal."}]},{"id":310,"hanzi":"身体","part":"Noun","pinyin":"shēntǐ","def":"body, health","ex":[{"zh":"我爸爸的身体不太好，所以他常常生病。","py":"Wǒ bàba de shēntǐ bú tài hǎo, suǒyǐ tā cháng cháng shēngbìng.","en":"My dad’s health is in bad condition therefore he is often sick."},{"zh":"从外国回来以后，我的身体很好，所以不要担心。","py":"Cóng wàiguó huí lái yǐhòu, wǒ de shēntǐ hěn hǎo, suǒyǐ bú yào dānxīn.","en":"After coming back from abroad, I'm healthy, so don’t worry."}]},{"id":311,"hanzi":"水果","part":"Noun","pinyin":"shuǐguǒ","def":"fruit","ex":[{"zh":"你生病要多吃点儿水果。","py":"Nǐ shēngbìng yào duō chī diǎnr shuǐguǒ.","en":"When you are sick, you should eat more fruit."},{"zh":"我喜欢吃水果，也喜欢吃蔬菜。","py":"Wǒ xǐhuan chī shuǐguǒ yě xǐhuan chī shūcài.","en":"I like to eat fruit and vegetables."}]},{"id":312,"hanzi":"蔬菜","part":"Noun","pinyin":"shūcài","def":"vegetables","ex":[{"zh":"谁都喜欢吃蔬菜水果。","py":"Shéi dōu xǐhuan chī shūcài shuǐguǒ.","en":"Everyone likes to eat vegetables and fruit."},{"zh":"他不太吃蔬菜，所以常生病。","py":"Tā bú tài chī shūcài, suǒyǐ cháng shēngbìng.","en":"He doesn’t eat enough vegetables, that’s why he often gets sick."}]},{"id":313,"hanzi":"医院","part":"Noun","pinyin":"yīyuàn","def":"hospital","ex":[{"zh":"医院离我家不近，坐公交车要一小时。","py":"Yīyuàn lí wǒ jiā bú jìn, zuò gōngjiāochē yào yì xiǎoshí.","en":"The hospital is not close to my house, it takes one hour by bus."},{"zh":"我们这个周末打算去医院看我们的朋友。他因为生病所以住院了。","py":"Wǒmen zhège zhōumò dǎsuàn qù yīyuàn kàn wǒmen de péngyou. Tā yīnwèi shēngbìng suǒyǐ zhùyuàn le.","en":"We plan to visit our friend in the hospital this weekend. He is hospitalized because he is sick."}]},{"id":314,"hanzi":"请假","part":"Verb Object","pinyin":"qǐngjià","def":"to take a leave","ex":[{"zh":"我们后天要去旅游，所以我要请假。","py":"Wǒmen hòutiān yào qù lǚyóu,suǒyǐ wǒ yào qǐngjià.","en":"I'm going to travel for the day after tomorrow, so I need to take the day off."},{"zh":"生病了就请假在家里休息。","py":"Shēngbìng le jiù qǐngjià zài jiālǐ xiūxi.","en":"If you are sick, rest at home."}]},{"id":315,"hanzi":"一","part":"Noun","pinyin":"yī","def":"one, single","ex":[{"zh":"我有一个弟弟。","py":"Wǒ yǒu yíge dìdì.","en":"I have a younger brother."},{"zh":"今天是星期一。","py":"Jīntiān shì xīngqī yī.","en":"Today is Monday."}]},{"id":316,"hanzi":"一点儿","part":"Numeral","pinyin":"yìdiǎnr","def":"a little bit, a bit","ex":[{"zh":"今天有一点儿累。","py":"Jīntiān yǒu yìdiǎnr lèi.","en":"Today I'm a little tired"},{"zh":"水果有一点儿贵。","py":"Shuǐguǒ yǒu yìdiǎnr guì.","en":"The fruit is a little expensive."}]},{"id":317,"hanzi":"七","part":"Numeral","pinyin":"qī","def":"seven","ex":[{"zh":"这有七个人。","py":"Zhè yǒu qī ge rén.","en":"There are seven people."},{"zh":"他七点钟才下班。","py":"Tā qī diǎn zhōng cái xiàbān.","en":"He gets off work at seven o'clock."}]},{"id":318,"hanzi":"三","part":"Numeral","pinyin":"sān","def":"three","ex":[{"zh":"我每天喝三杯咖啡。","py":"Wǒ měitiān hē sān bēi kāfēi.","en":"I drink three cups of coffee a day."},{"zh":"那三杯黑咖啡都是我的。","py":"Nà sān bēi hēi kāfēi dōu shì wǒ de.","en":"Those three cup of black coffee are mine."}]},{"id":319,"hanzi":"上","part":"Noun/Verb","pinyin":"shàng","def":"on, on top of","ex":[{"zh":"桌上有一本书。","py":"Zhuō shàng yǒu yì běn shū.","en":"There is a book on the table."},{"zh":"桌上有二十多本书。","py":"Zhuō shàng yǒu èrshí duō běn shū.","en":"There are more than twenty books on the table."}]},{"id":320,"hanzi":"下","part":"Noun/Verb","pinyin":"xià","def":"under, off, leave","ex":[{"zh":"窗下有一只猫。","py":"Chuāng xià yǒu yì zhī māo.","en":"There is a cat under the window."},{"zh":"我们一起下去搭公交车吧！","py":"Wǒmen yìqǐ xiàqù dā gōngjiāo chē ba!","en":"Let's go down and take a bus!"}]},{"id":321,"hanzi":"不","part":"Adv","pinyin":"bù","def":"do not","ex":[{"zh":"我不吃牛肉。","py":"Wǒ bù chī niúròu.","en":"I do not eat beef."},{"zh":"弟弟不把衣服挂在衣柜里。","py":"Dìdì bù bǎ yīfu guà zài yīguì lǐ.","en":"My little brother doesn't hang his clothes in the closet."}]},{"id":322,"hanzi":"九","part":"Numeral","pinyin":"jiǔ","def":"nine","ex":[{"zh":"我的爸爸有九个姐姐。","py":"Wǒ de bàba yǒu jiǔ ge jiějiě.","en":"My dad has nine sisters."},{"zh":"明天九点从家里出发。","py":"Míngtiān jiǔ diǎn cóng jiā lǐ chūfā.","en":"He departs tomorrow at 9 am from home."}]},{"id":323,"hanzi":"了","part":"Adv","pinyin":"le","def":"past tense","ex":[{"zh":"这件衣服太贵了。","py":"Zhè jiàn yīfu tài guìle.","en":"This piece of clothing is too expensive."},{"zh":"我工作一天了，现在我只想睡觉放松。","py":"Wǒ gōngzuò yìtiān le, xiànzài wǒ zhǐ xiǎng shuìjiào fàngsōng.","en":"I have worked for a whole day long, now I only want to sleep and relax."}]},{"id":324,"hanzi":"二","part":"Numeral","pinyin":"èr","def":"two","ex":[{"zh":"昨天星期二。","py":"Zuótiān xīngqī 'èr.","en":"Yesterday was Tuesday."},{"zh":"这是一张二手沙发，但是看起来很新。","py":"Zhè shì yì zhāng èrshǒu shāfā, dànshì kàn qǐlái hěn xīn.","en":"This is a second hand sofa, but it looks new."}]},{"id":325,"hanzi":"五","part":"Numeral","pinyin":"wǔ","def":"five","ex":[{"zh":"我家有五口人。","py":"Wǒjiā yǒu wǔ kǒu rén.","en":"My family has five people."},{"zh":"这个包是爸爸送给我的，我已经用了五年了。","py":"Zhège bāo shì bàba sòng gěi wǒ de, wǒ yǐjīng yòng le wǔ nián le.","en":"My father presented this backpack for me. I've already used for five years."}]},{"id":326,"hanzi":"人","part":"Noun","pinyin":"rén","def":"people, person","ex":[{"zh":"你是挪威人吗？","py":"Nǐ shì Nuówēi rén ma?","en":"Are you Norwegian?"},{"zh":"这个男人很有魅力，大家都很喜欢他。","py":"Zhège nánrén hěn yǒu mèilì, dàjiā dōu hěn xǐhuan tā.","en":"This man is very attractive, we all like him."}]},{"id":327,"hanzi":"什么","part":"Adj/Adv","pinyin":"shénme","def":"what","ex":[{"zh":"这是什么？","py":"Zhè shì shénme?","en":"What is this?"},{"zh":"在你们国家，什么东西代表着幸运？","py":"Zài nǐmen guójiā, shénme dōngxi dàibiǎo zhe xìngyùn ？","en":"In your country, what object represents good luck?"}]},{"id":328,"hanzi":"会","part":"Verb","pinyin":"huì","def":"to be able to, can do","ex":[{"zh":"我会说一点儿汉语。","py":"Wǒ huì shuō yìdiǎnr hànyǔ.","en":"I can speak a little Chinese."},{"zh":"你几点会做饭？","py":"Nǐ jǐdiǎn huì zuò fàn?","en":"What time will you cook?"}]},{"id":329,"hanzi":"儿子","part":"Noun","pinyin":"érzi","def":"son","ex":[{"zh":"我的儿子叫王阳。","py":"Wǒ de érzi jiào wáng yáng。","en":"My son is called Wang Yang."},{"zh":"我对儿子的教育十分操心。","py":"Wǒ duì érzǐ de jiàoyù shífēn cāoxīn.","en":"I am very worried about my son's education."}]},{"id":330,"hanzi":"八","part":"Numeral","pinyin":"bā","def":"eight","ex":[{"zh":"我有八本中文书。","py":"Wǒ yǒu bā běn zhōngwén shū.","en":"I have eight Chinese books."},{"zh":"我已经说得很明白了，今天八点见，为什么你还是迟到了？","py":"Wǒ yǐjīng shuō de hěn míngbáile, jīntiān bā diǎn jiàn, wèishénme nǐ háishì chídào le?","en":"I had said so clearly that we'll meet at eight o'clock today, why are you still late?"}]},{"id":331,"hanzi":"六","part":"Numeral","pinyin":"liù","def":"six","ex":[{"zh":"中国人喜欢数字六。","py":"Zhōngguó rén xǐhuan shùzì liù.","en":"Chinese people like the number six."},{"zh":"我早上六点起床。","py":"Wǒ zǎoshang liù diǎn qǐchuáng.","en":"I wake up at six in the morning."}]},{"id":332,"hanzi":"写","part":"Verb","pinyin":"xiě","def":"to write","ex":[{"zh":"我会写我的中文名字。","py":"Wǒ huì xiě wǒ de zhōngwén míngzì.","en":"I can write my Chinese name."},{"zh":"这个字我写错了。","py":"Zhège zì wǒ xiě cuòle.","en":"I wrote this character incorrectly."}]},{"id":333,"hanzi":"几","part":"Adj","pinyin":"jǐ","def":"a few","ex":[{"zh":"你要几个苹果?","py":"Nǐ yào jǐ gè píngguǒ?","en":"How many apples do you want?"},{"zh":"这几年世界各地的天气都反常。","py":"Zhè jǐnián shìjiè gèdì de tiānqì dōu fǎncháng.","en":"In recent years the weather around the world has been abnormal."}]},{"id":334,"hanzi":"前面","part":"Noun","pinyin":"qiánmiàn","def":"front, frontside","ex":[{"zh":"我家前面是咖啡店。","py":"Wǒjiā qiánmiàn shì kāfēi diàn.","en":"There's a coffee shop in front of my house."},{"zh":"前面有车祸，快点报警。","py":"Qián miàn yǒu chē huò, kuài diǎn bàojǐng.","en":"There's a car accident up ahead, quick, call the police!"}]},{"id":335,"hanzi":"十","part":"Numeral","pinyin":"shí","def":"ten","ex":[{"zh":"一瓶水十元。","py":"Yì píng shuǐ shí yuán.","en":"A bottle of water is ten yuan."},{"zh":"我今天要跟朋友去演唱会，大概晚上十点回来。","py":"Wǒ jīntiān yào gēn péngyou qù yǎnchànghuì, dàgài wǎnshàng shí diǎn huílái.","en":"I will go to a concert with a friend today, probably will come back at 10pm."}]},{"id":336,"hanzi":"去","part":"Verb","pinyin":"qù","def":"to go","ex":[{"zh":"昨天我没去学校。","py":"Zuótiān wǒ méi qù xuéxiào.","en":"Yesterday, I didn't go to school."},{"zh":"他为什么这么排斥去海边？","py":"Tā wèishénme zhème páichì qù hǎibiān?","en":"Why does he really don't want to go to the beach?"}]},{"id":337,"hanzi":"号","part":"Noun","pinyin":"hào","def":"number","ex":[{"zh":"我的鞋是二十四号。","py":"Wǒ de xié shì èrshísì hào.","en":"My shoes are size twenty-four."},{"zh":"我的生日是二月十八号。","py":"Wǒ de shēngrì shì èr yuè shíbā hào.","en":"My birthday is February eighteenth."}]},{"id":338,"hanzi":"后面","part":"Adj","pinyin":"hòumiàn","def":"behind, backside","ex":[{"zh":"学校后面是山。","py":"Xuéxiào hòumiàn shì shān.","en":"There's a mountain behind the school."},{"zh":"在我家后面以及右边都有新的大楼。","py":"Zài wǒjiā hòumiàn yǐjí yòubiān dōuyǒu xīnde dàlóu.","en":"There is a new building on the back of my house and on the right."}]},{"id":339,"hanzi":"吗","part":"Question Particle","pinyin":"ma","def":"Do you?Is that?","ex":[{"zh":"你好吗？","py":"Nǐ hǎo ma？","en":"How are you?"},{"zh":"你是老师吗？","py":"Nǐ shì lǎoshī ma?","en":"Are you a teacher?"}]},{"id":340,"hanzi":"听","part":"Verb","pinyin":"tīng","def":"to listen, to hear","ex":[{"zh":"我喜欢听音乐。","py":"Wǒ xǐhuan tīng yīnyuè.","en":"I like to listen to music."},{"zh":"过马路的时候玩手机、听音乐都很危险。","py":"Guò mǎlù de shíhou wán shǒujī, tīng yīnyuè dōu hěn wēixiǎn.","en":"Playing mobile phones or listening to music while crossing the road are very dangerous."}]},{"id":341,"hanzi":"呢","part":"Question Particle","pinyin":"ne","def":"","ex":[{"zh":"我要喝咖啡，你呢？","py":"Wǒ yào hē kāfēi, nǐ ne?","en":"I want to drink coffee, how about you?"},{"zh":"身体健康比工作重要，你觉得呢？","py":"Shēntǐ jiànkāng bǐ gōngzuò zhòngyào, nǐ juéde ne?","en":"Health is more important than work, what do you think?"}]},{"id":342,"hanzi":"哪","part":"Question pronoun","pinyin":"nǎ","def":"which","ex":[{"zh":"哪杯咖啡？","py":"Nǎ bēi kāfēi?","en":"Which cup of coffee?"}]},{"id":343,"hanzi":"哪儿","part":"Adj/Adv","pinyin":"nǎ'er","def":"where","ex":[{"zh":"你想把画挂在哪儿？我想把画挂在这儿。","py":"Nǐ xiǎng bǎ huà guà zài nǎr？Wǒ xiǎng bǎ huà guà zài zhèr.","en":"Where do you want to hang the painting? I want to hang the painting here."},{"zh":"我忘了我把刚刚买的衣服放在哪儿了！","py":"Wǒ wàngle wǒ bǎ gānggāng mǎi de yīfu fàng zài nǎr le!","en":"I forget where I put the clothes I just bought."}]},{"id":344,"hanzi":"四","part":"Noun","pinyin":"sì","def":"four","ex":[{"zh":"中国人不喜欢数字四。","py":"Zhōngguó rén bù xǐhuān shùzì sì.","en":"Chinese people do not like the number four."},{"zh":"她的体温只有三十四度","py":"Tā de tǐwēn zhǐyǒu sānshísì dù.","en":"Her temperature is only thirty-four degrees Celsius."}]},{"id":345,"hanzi":"回","part":"Verb","pinyin":"huí","def":"to go back, to return","ex":[{"zh":"我晚上九点回家。","py":"Wǒ wǎnshàng jiǔ diǎn huí jiā.","en":"I go home at nine o'clock."},{"zh":"我想要自由地在国外生活一年再回国。","py":"Wǒ xiǎngyào zìyóu de zài guówài shēnghuó yì nián zài huíguó.","en":"I want to live abroad freely for one year and then come back."}]},{"id":346,"hanzi":"在","part":"Adj/Adv","pinyin":"zài","def":"in","ex":[{"zh":"我有时候会待在图书馆里看书。","py":"Wǒ yǒu shíhou huì dāi zài túshūguǎn lǐ kànshū.","en":"Sometimes I will stay in the library and read books."},{"zh":"你要待在房间里面多久？","py":"Nǐ yào dāi zài fángjiān lǐmiàn duōjiǔ?","en":"How long are you going to stay in the room?"}]},{"id":347,"hanzi":"多少","part":"Phrase","pinyin":"duōshǎo","def":"How many","ex":[{"zh":"这个多少钱?","py":"Zhè gè duōshǎo qián?","en":"How much is this?"},{"zh":"你的水瓶能装多少水？","py":"Nǐ de shuǐpíng néng zhuāng duōshǎo shuǐ?","en":"How much water can you hold in your water bottle?"}]},{"id":348,"hanzi":"太","part":"Adj","pinyin":"tài","def":"too (as in too many)","ex":[{"zh":"这件衣服太贵了。","py":"Zhè jiàn yīfú tài guìle.","en":"This piece of clothing is too expensive."},{"zh":"这附近交通不太方便，我想换房子。","py":"Zhè fùjìn jiāotōng bú tài fāngbiàn, wǒ xiǎng huàn fángzi.","en":"The transportation here is not too convenient, I want to move to another place."}]},{"id":349,"hanzi":"她","part":"Pronoun","pinyin":"tā","def":"she, her","ex":[{"zh":"她的手机很好。","py":"Tā de shǒujī hěn hǎo.","en":"Her cell phone is very good."},{"zh":"她唱得不错。","py":"Tā chàng dé búcuò.","en":"She sings well."}]},{"id":350,"hanzi":"字","part":"Noun","pinyin":"zì","def":"word, character","ex":[{"zh":"写汉字不太难。","py":"Xiě hànzì bù tài nán.","en":"It's not too difficult to write Chinese characters."},{"zh":"汉语老师教我们怎么写字。","py":"Hànyǔ lǎoshī jiào wǒmen zěnme xiě zì.","en":"The Chinese teacher teaches us how to write words."}]},{"id":351,"hanzi":"小","part":"Adj","pinyin":"xiǎo","def":"small","ex":[{"zh":"我要小杯的绿茶。","py":"Wǒ yào xiǎo bēi de lǜchá.","en":"I want a small cup of green tea."},{"zh":"我家很小，没有厨房。","py":"Wǒ jiā hěn xiǎo, méiyǒu chúfáng.","en":"My house is small, there is no kitchen."}]},{"id":352,"hanzi":"小姐","part":"Noun","pinyin":"xiǎojiě","def":"Miss, Ms.","ex":[{"zh":"张小姐，您好。","py":"Zhāng xiǎojiě, nín hǎo.","en":"Hello, Miss Zhang."},{"zh":"工作压力很大的黄小姐，常常在假日去大自然度假，放松自己。","py":"Gōngzuò yālì hěn dà de huáng xiǎojiě, chángcháng zài jiàrì qù dàzìrán dùjià, fàngsōng zìjǐ","en":"Work pressure is great for Miss Huang, she often uses her holidays to go to natural locations, in order to relax."}]},{"id":353,"hanzi":"工作","part":"Noun/Verb","pinyin":"gōngzuò","def":"work, to work, job","ex":[{"zh":"我的工作是医生。","py":"Wǒ de gōngzuò shì yīshēng.","en":"I work as a doctor."},{"zh":"他根本没有工作经验，我觉得他在骗人。","py":"Tā gēnběn méiyǒu gōngzuò jīngyàn，wǒ juédé tā zài piànrén.","en":"He did not have any work experience, I think he was lying."}]},{"id":354,"hanzi":"年","part":"Noun","pinyin":"nián","def":"year","ex":[{"zh":"今年是羊年。","py":"Jīnnián shì yáng nián.","en":"This is the year of the sheep."},{"zh":"新年快乐，干杯！","py":"Xīnnián kuàilè, gānbēi!","en":"Happy New Year, cheers!"}]},{"id":355,"hanzi":"很","part":"Adj","pinyin":"hěn","def":"very, quite","ex":[{"zh":"我今天很累。","py":"Wǒ jīntiān hěn lèi.","en":"I'm so tired today."},{"zh":"他有很多法国朋友。","py":"Tā yǒu hěnduō Fǎguó péngyǒu.","en":"He has a lot of French friends."}]},{"id":356,"hanzi":"怎么样","part":"Phrase","pinyin":"zěnmeyàng","def":"how's this? how is it? how about that?","ex":[{"zh":"今天晚餐吃牛肉，怎么样？","py":"Jīntiān wǎncān chī niúròu, zěnmeyàng?","en":"Let’s have beef for dinner tonight, shall we?"},{"zh":"你觉得这座城市的环境怎么样？","py":"Nǐ juéde zhè zuò chéngshì de huánjìng zěnmeyàng?","en":"What do you think of the city's environment?"}]},{"id":357,"hanzi":"我们","part":"Pronoun","pinyin":"wǒmen","def":"we, us","ex":[{"zh":"我们是姐妹。","py":"Wǒmen shì jiěmèi.","en":"We are sisters."},{"zh":"我们有一只狗, 他叫来福。","py":"Wǒmen yǒu yì zhī gǒu, tā jiào lái fú.","en":"We have a dog, it is called Lucky."}]},{"id":358,"hanzi":"时候","part":"Phrase","pinyin":"shíhòu","def":"when (we were doing sth...), at the time","ex":[{"zh":"七月的时候，我去新加坡。","py":"Qī yuè de shíhòu, wǒ qù xīnjiāpō.","en":"In July, I'll go to Singapore."},{"zh":"你什么时候去看电影?","py":"Nǐ shénme shíhou qù kàn diànyǐng?","en":"When are you going to watch movie?"}]},{"id":359,"hanzi":"有","part":"Verb","pinyin":"yǒu","def":"to have, to own","ex":[{"zh":"他有很多法国朋友。","py":"Tā yǒu hěnduō Fǎguó péngyǒu.","en":"He has a lot of French friends."},{"zh":"我今天晚上没有空。","py":"Wǒ jīntiān wǎnshàng méiyǒu kòng.","en":"I'm not free tonight."}]},{"id":360,"hanzi":"本","part":"Measure word","pinyin":"běn","def":"measure word for books","ex":[{"zh":"这是一本旅游杂志。","py":"Zhè shì yī běn lǚyóu zázhì.","en":"This is a travel magazine."},{"zh":"我忘记带写字的本子了。","py":"Wǒ wàngjì dài xiězì de běnzile.","en":"I forgot to bring my writing notebook."}]},{"id":361,"hanzi":"没有","part":"Verb","pinyin":"méiyǒu","def":"to not have, don't have","ex":[{"zh":"我没有妹妹。","py":"Wǒ méiyǒu mèimei.","en":"I don't have a younger sister."},{"zh":"我没有时间做晚饭。","py":"Wǒ méiyǒu shíjiān zuò wǎnfàn.","en":"I don’t have time for making dinner."}]},{"id":362,"hanzi":"点","part":"Noun","pinyin":"diǎn","def":"point, o'clock","ex":[{"zh":"现在是五点十分。","py":"Xiànzài shì wǔ diǎn shí fēn.","en":"It's ten past five o'clock now."},{"zh":"你中午几点休息?","py":"Nǐ zhōngwǔ jǐdiǎn xiūxi?","en":"What time do you rest at noon?"}]},{"id":363,"hanzi":"电视","part":"Noun","pinyin":"diànshì","def":"television, TV","ex":[{"zh":"我家没电视。","py":"Wǒjiā méi diànshì.","en":"My house doesn't have a TV."},{"zh":"有时候爸爸会打开电视看篮球比赛。","py":"Yǒu shíhou bàba huì dǎkāi diànshì kàn lánqiú bǐsài.","en":"Sometimes father will turn on the TV and watch a basketball game."}]},{"id":364,"hanzi":"的","part":"Adj/Adv","pinyin":"de","def":"of, possessive, belonging to","ex":[{"zh":"她的名字是玛丽。","py":"Tā de míngzi shì Mǎlì.","en":"Her name is Mary."},{"zh":"我的老师不是中国人。","py":"Wǒ de lǎoshī bú shì Zhōngguó rén.","en":"My teacher is not a Chinese."}]},{"id":365,"hanzi":"米饭","part":"Noun","pinyin":"mǐfàn","def":"rice","ex":[{"zh":"我喜欢吃米饭。","py":"Wǒ xǐhuān chī mǐfàn.","en":"I like to eat rice."}]},{"id":366,"hanzi":"苹果","part":"Noun","pinyin":"píngguǒ","def":"apple","ex":[{"zh":"我喜欢苹果口味的甜食。","py":"Wǒ xǐhuan píngguǒ kǒuwèi de tiánshí.","en":"I like apple flavor sweets."},{"zh":"这颗苹果的表面很漂亮。","py":"Zhèkē píngguǒ de biǎomiàn hěn piàoliang.","en":"This apple looks beautiful."}]},{"id":367,"hanzi":"读","part":"Verb","pinyin":"dú","def":"to read","ex":[{"zh":"读中文书不太难。","py":"Dú zhōngwén shū bù tài nán.","en":"It's not too hard to read Chinese books."},{"zh":"熬夜读书对身体不好。","py":"Áoyè dúshū duì shēntǐ bù hǎo.","en":"It’s not healthy to stay up that late reading."}]},{"id":368,"hanzi":"这","part":"Adj","pinyin":"zhè","def":"this","ex":[{"zh":"这是我妈妈。","py":"Zhè shì wǒ māmā.","en":"This is my mother."},{"zh":"这本杂志卖得很好。","py":"Zhè běn zázhì mài de hěn hǎo.","en":"This magazine sells well."}]},{"id":369,"hanzi":"都","part":"Adj/Adv","pinyin":"dōu","def":"all, every","ex":[{"zh":"他们都是我的朋友。","py":"Tāmen dōu shì wǒ de péngyǒu.","en":"They are all my friends."},{"zh":"她笑起来很漂亮，大家都很喜欢她。","py":"Tā xiào qǐlái hěn piàoliang, dàjiā dōu hěn xǐhuan tā.","en":"Her smiles beautifully, everyone really likes her."}]},{"id":370,"hanzi":"里","part":"Adj","pinyin":"lǐ","def":"in, inside","ex":[{"zh":"我的包里有一瓶水。","py":"Wǒ de bāo li yǒuyī píng shuǐ.","en":"There's a bottle of water in my bag."},{"zh":"谁扔了冰箱里的鸡蛋？","py":"Shéi rēng le bīngxiāng lǐ de jīdàn?","en":"Who threw away the eggs in the fridge?"}]},{"id":371,"hanzi":"饭店","part":"Noun","pinyin":"fàndiàn","def":"restaurant","ex":[{"zh":"这是一间新开的饭店。","py":"Zhè shì yī jiàn xīn kāi de fàndiàn.","en":"This is a newly opened hotel."},{"zh":"这家饭店的菜是具有代表性和地方特色的菜。","py":"Zhè jiā fàndiàn de cài shì jùyǒu dàibiǎoxìng hé dìfāng tèsè de cài.","en":"The food in this restaurant is the typical dish with local features."}]},{"id":372,"hanzi":"特别","part":"Adj","pinyin":"tèbié","def":"special","ex":[{"zh":"你是哪国人？你的名字真特别！","py":"Nǐ shì nǎ guórén? Nǐ de míngzì zhēn tèbié!","en":"Where are you from? Your name is so special!"},{"zh":"他喜欢看特别的电影。","py":"Tā xǐhuan kàn tèbié de diànyǐng.","en":"He likes to watch special movies."}]},{"id":373,"hanzi":"演唱会","part":"Noun","pinyin":"yǎnchànghuì","def":"concert","ex":[{"zh":"你今天晚上要跟我们一起去演唱会吗？","py":"Nǐ jīntiān wǎnshàng yào gēn wǒmen yīqǐ qù yǎnchànghuì ma?","en":"Do you want to go to the concert with us tonight?"},{"zh":"我们坐公共汽车去演唱会。","py":"Wǒmen zuò gōnggòng qìchē qù yǎnchànghuì.","en":"We take a bus to the concert."}]},{"id":374,"hanzi":"大家","part":"Noun","pinyin":"dàjiā","def":"everyone","ex":[{"zh":"虽然美美不漂亮，但是大家都很喜欢她。","py":"Suīrán měiměi bú piàoliang, dànshì dàjiā dōu hěn xǐhuan tā.","en":"Although Meimei isn't beautiful, everyone likes her a lot."},{"zh":"大家都觉得这首歌很好听。","py":"Dàjiā dōu juéde zhè shǒu gē hěn hǎotīng.","en":"Everyone thinks this song is good to listen."}]},{"id":375,"hanzi":"开心","part":"Adj","pinyin":"kāixīn","def":"to feel happy, to rejoice, to have a great time","ex":[{"zh":"可以跟你一起逛街，真开心！","py":"Kěyǐ gēn nǐ yìqǐ guàngjiē, zhēn kāixīn!","en":"It is happy to go shopping with you."},{"zh":"今天是他的生日，但是为什么他看起来不太开心？","py":"Jīntiān shì tā de shēngrì, dànshì wèishénme tā kàn qǐlái bú tài kāixīn?","en":"Today is his birthday, so why does he seem unhappy?"}]},{"id":376,"hanzi":"跳舞","part":"Verb Object","pinyin":"tiàowǔ","def":"to dance","ex":[{"zh":"我们一起唱歌跳舞吧！","py":"Wǒmen yìqǐ chànggē tiàowǔ ba!","en":"Let’s sing and dance together!"},{"zh":"昨天我跟他去酒吧跳舞，真好玩儿！","py":"Zuótiān wǒ gēn tā qù jiǔbā tiàowǔ, zhēn hǎowán'er!","en":"I danced in the bar with him yesterday, it was fun!"}]},{"id":377,"hanzi":"有名","part":"Adj","pinyin":"yǒumíng","def":"famous","ex":[{"zh":"这附近有一间有名的饭馆。","py":"Zhè fùjìn yǒu yì jiān yǒumíng de fànguǎn.","en":"There is a famous restaurant nearby."},{"zh":"这位歌手唱歌唱得很好听，但是他不有名。","py":"Zhè wèi gēshǒu chànggē chàng de hěn hǎotīng, dànshì tā bù yǒumíng.","en":"This singer sings well, but he is not famous."}]},{"id":378,"hanzi":"歌手","part":"Noun","pinyin":"gēshǒu","def":"singer","ex":[{"zh":"这位歌手很有名。","py":"Zhè wèi gēshǒu hěn yǒumíng.","en":"This singer is very famous."},{"zh":"他的爸爸是一位歌手。","py":"Tā de bàba shì yí wèi gēshǒu.","en":"His father is a singer."}]},{"id":379,"hanzi":"元","part":"Measure word","pinyin":"yuán","def":"currency unit (esp. Chinese yuan)","ex":[{"zh":"搭地铁比搭出租车便宜，车票只要五十元钱。","py":"Dā dìtiě bǐ dā chūzūchē piányi, chēpiào zhǐyào wǔshí yuán qián.","en":"Taking a subway is cheaper than taxi. It only costs you fifty dollars."},{"zh":"一共是伍佰元钱。","py":"Yígòng shì wǔ bǎi yuán qián.","en":"The total is five hundred dollars."}]},{"id":380,"hanzi":"好像","part":"Adv","pinyin":"hǎoxiàng","def":"as if, to seem like","ex":[{"zh":"好像快下雨了，我们回家吧。","py":"Hǎoxiàng kuài xià yǔ le, wǒmen huí jiā ba.","en":"It seems will rain soon, let’s go home."},{"zh":"这个演唱会好像很好玩。","py":"Zhègè yǎnchànghuì hǎoxiàng hěn hǎowán.","en":"This concert seems really fun."}]},{"id":381,"hanzi":"干杯","part":"Verb Object","pinyin":"gānbēi","def":"bottoms up , Cheers.","ex":[{"zh":"新年快乐，干杯！","py":"Xīnnián kuàilè, gānbēi!","en":"Happy New Year, cheers!"},{"zh":"我们来干杯吧！","py":"Wǒmen lái gānbēi ba!","en":"Let’s cheers!"}]},{"id":382,"hanzi":"待","part":"Verb","pinyin":"dāi","def":"to stay","ex":[{"zh":"我有时候会待在图书馆里看书。","py":"Wǒ yǒu shíhou huì dāi zài túshūguǎn lǐ kànshū.","en":"Sometimes I will stay in the library and read books."},{"zh":"你要待在房间里面多久？","py":"Nǐ yào dāi zài fángjiān lǐmiàn duōjiǔ?","en":"How long are you going to stay in the room?"}]},{"id":383,"hanzi":"放松","part":"Verb","pinyin":"fàngsōng","def":"to relax","ex":[{"zh":"我工作一天了，现在我只想睡觉放松。","py":"Wǒ gōngzuò yītiānle, xiànzài wǒ zhǐ xiǎng shuìjiào fàngsōng.","en":"I have worked for a whole day long, now I only want to sleep and relax."},{"zh":"这周末我们去逛街放松，好吗？","py":"Zhè zhōumò wǒmen qù guàngjiē fàngsōng, hǎo ma?","en":"Let’s go shopping and relax this weekend, shall we?"}]},{"id":384,"hanzi":"毕业","part":"Verb","pinyin":"bìyè","def":"to graduate","ex":[{"zh":"我毕业以后，打算回国。","py":"Wǒ bìyè yǐhòu, dǎsuàn huíguó.","en":"I plan to go back to my country after graduating."},{"zh":"我明年六月毕业。","py":"Wǒ míngnián liù yuè bìyè.","en":"I will graduate next June."}]},{"id":385,"hanzi":"交往","part":"Verb","pinyin":"jiāowǎng","def":"to associate (with), to date, (interpersonal) relationship","ex":[{"zh":"我听说他们交往了！","py":"Wǒ tīngshuō tāmen jiāowǎng le.","en":"I have heard that they are dating!"},{"zh":"大家都想跟美美交往。","py":"Dàjiā dōu xiǎng gēn měiměi jiāowǎng.","en":"Everyone wants to make friends with Meimei."}]},{"id":386,"hanzi":"曾经","part":"Adv","pinyin":"céngjīng","def":"once, previously, ever, (past tense marker used before Verb or clause)","ex":[{"zh":"虽然她曾经很喜欢李强，但是现在她跟一成在交往。","py":"Suīrán tā céngjīng hěn xǐhuan LǐQiáng, dànshì xiànzài tā gēn Yīchéng zài jiāowǎng.","en":"She once liked Liqiang very much, but now she is dating Yicheng."},{"zh":"他曾经是一位老师。","py":"Tā céngjīng shì yí wèi lǎoshī.","en":"He used to be a teacher."}]},{"id":387,"hanzi":"马上","part":"Adv","pinyin":"mǎshàng","def":"at once, right away, immediately","ex":[{"zh":"我到了车站，就马上打电话给你！","py":"Wǒ dào le chēzhàn, jiù mǎshàng dǎdiànhuà gěi nǐ!","en":"I will call you right after I arrive at the station!"},{"zh":"我得马上回家！","py":"Wǒ děi mǎshàng huí jiā!","en":"I need to go home right now!"}]},{"id":388,"hanzi":"房间","part":"Noun","pinyin":"fángjiān","def":"room","ex":[{"zh":"从我的房间可以看见外面漂亮的风景。","py":"Cóng wǒ de fángjiān kěyǐ kànjiàn wàimiàn piàoliang de fēngjǐng.","en":"You can see a very beautiful view out of my room."},{"zh":"我家有四个房间。","py":"Wǒjiā yǒu sì gè fángjiān.","en":"There are four rooms in my house."}]},{"id":389,"hanzi":"阴天","part":"Noun","pinyin":"yīn tiān","def":"cloudy","ex":[{"zh":"今天是阴天。","py":"Jīntiān shì yīn tiān.","en":"Today is cloudy."},{"zh":"明天不会下雨，是阴天。","py":"Míngtiān bú huì xià yǔ, shì yīn tiān.","en":"It won’t rain tomorrow, it will be a cloudy day."}]},{"id":390,"hanzi":"厨房","part":"Noun","pinyin":"chúfáng","def":"kitchen","ex":[{"zh":"妹妹在厨房里做菜。","py":"Mèimei zài chúfáng lǐ zuò cài.","en":"My younger sister is cooking in the kitchen."},{"zh":"我家很小，没有厨房。","py":"Wǒ jiā hěn xiǎo, méiyǒu chúfáng.","en":"My house is small, there is no kitchen."}]},{"id":391,"hanzi":"蛋糕","part":"Noun","pinyin":"dàngāo","def":"cake","ex":[{"zh":"这是我买给你的生日蛋糕！","py":"Zhè shì wǒ mǎi gěi nǐ de shēngrì dàngāo!","en":"This is the birthday cake I bought you!"},{"zh":"这个店的蛋糕很有名, 很好吃！","py":"Zhègè diàn de dàngāo hěn yǒumíng, hěn hǎo chī!","en":"The cake of this store is very famous and delicious!"}]},{"id":392,"hanzi":"饿","part":"Adj","pinyin":"è","def":"to be hungry","ex":[{"zh":"他吃了好几个蛋糕了，他可能很饿。","py":"Tā chī le hǎo jǐ gè dàngāo le, tā kěnéng hěn è.","en":"He has eaten several pieces of cake, he might be really hungry."},{"zh":"我不怎么饿。","py":"Wǒ bù zěnme è.","en":"I am not so hungry."}]},{"id":393,"hanzi":"牛奶","part":"Noun","pinyin":"niúnǎi","def":"milk","ex":[{"zh":"我要去超市买牛奶。","py":"Wǒ yào qù chāoshì mǎi niúnǎi.","en":"I want to go to the supermarket to buy milk."},{"zh":"他不喝牛奶。","py":"Tā bù hē niúnǎi.","en":"He doesn’t drink milk."}]},{"id":394,"hanzi":"出去","part":"Verb","pinyin":"chūqù","def":"to go out","ex":[{"zh":"待在家真无聊，我要出去逛街。","py":"Dāi zàijiā zhēn wúliáo, wǒ yào chūqù guàngjiē.","en":"It is boring to stay at home, I want to go shopping."},{"zh":"外面天气好冷，大家都不想出去。","py":"Wàimiàn tiānqì hǎo lěng, dàjiā dōu bù xiǎng chūqù.","en":"It is so cold outside, no one wants to go out."}]},{"id":395,"hanzi":"游戏","part":"Noun","pinyin":"yóuxì","def":"game","ex":[{"zh":"你常玩手机游戏吗？","py":"Nǐ cháng wán shǒujī yóuxì ma?","en":"Do you often play mobile games?"},{"zh":"听说你很喜欢玩游戏？","py":"Tīngshuō nǐ hěn xǐhuan wán yóuxì?","en":"I heard that you like to play games so much?"}]},{"id":396,"hanzi":"安静","part":"Adj","pinyin":"ānjìng","def":"quiet, peaceful, calm","ex":[{"zh":"因为我家附近车不太多，所以很安静。","py":"Yīnwèi wǒ jiā fùjìn chē bú tài duō, suǒyǐ hěn ānjìng.","en":"Because there are not many cars near my place, it’s quiet."},{"zh":"昨天晚上很安静，我很早就去睡觉了。","py":"Zuótiān wǎnshàng hěn ānjìng, wǒ hěn zǎo jiù qù shuìjiào le.","en":"It was very quiet last night and I went to bed early."}]},{"id":397,"hanzi":"公园","part":"Noun","pinyin":"gōngyuán","def":"park","ex":[{"zh":"你跟家人吃完晚饭后会去公园走走吗？","py":"Nǐ gēn jiārén chī wán wǎnfàn hòu huì qù gōngyuán zǒu zǒu ma?","en":"Do you go to the park after dinner with your family?"},{"zh":"你喜欢去公园做什么？","py":"Nǐ xǐhuan qù gōngyuán zuò shénme?","en":"What do you like to do in the park?"}]},{"id":398,"hanzi":"发现","part":"Verb","pinyin":"fāxiàn","def":"to discover","ex":[{"zh":"我发现我新家附近有医院、博物馆跟电影院，太方便了。","py":"Wǒ fāxiàn wǒ xīn jiā fùjìn yǒu yīyuàn, bówùguǎn gēn diànyǐngyuàn, tài fāngbiàn le.","en":"I found that there is a museum, a hospital and a movie theater near my new home, it’s very convenient."},{"zh":"我发现一个新的手机游戏。","py":"Wǒ fāxiàn yīgè xīn de shǒujī yóuxì.","en":"I found a new mobile phone game."}]},{"id":399,"hanzi":"过马路","part":"Verb Object","pinyin":"guò mǎlù","def":"to cross the street","ex":[{"zh":"过马路的时候不要玩手机。","py":"Guò mǎlù de shíhou búyào wán shǒujī.","en":"Do not play the phone while crossing the road."},{"zh":"一边玩手机一边过马路很危险。","py":"Yìbiān wán shǒujī yìbiān guò mǎlù hěn wēixiǎn.","en":"It’s very dangerous that play the phone and cross the street at the same time."}]},{"id":400,"hanzi":"专心","part":"Adj","pinyin":"zhuānxīn","def":"concentrated","ex":[{"zh":"开车不专心会很危险。","py":"Kāichē bù zhuānxīn huì hěn wēixiǎn.","en":"It’s very dangerous if you do not concentrate on driving."},{"zh":"专心做事,不要一边上网，一边做事。","py":"Zhuānxīn zuòshì, búyào yìbiān shàngwǎng, yìbiān zuòshì.","en":"Be concentrate, do not do things and go on the internet at the same time."}]},{"id":401,"hanzi":"危险","part":"Noun/Adj","pinyin":"wēixiǎn","def":"danger, dangerous","ex":[{"zh":"过马路的时候玩手机、听音乐都很危险。","py":"Guò mǎlù de shíhou wán shǒujī, tīng yīnyuè dōu hěn wēixiǎn.","en":"Playing mobile phones or listening to music while crossing the road are very dangerous."},{"zh":"一边玩手机一边过马路很危险。","py":"Yìbiān wán shǒujī yìbiān guò mǎlù hěn wēixiǎn.","en":"It’s very dangerous that play the phone and cross the street at the same time."}]},{"id":402,"hanzi":"新闻","part":"Noun","pinyin":"xīnwén","def":"news","ex":[{"zh":"你看今天的新闻了吗？","py":"Nǐ kàn jīntiān de xīnwén le ma?","en":"Did you watch the news today?"},{"zh":"我发现今天的新闻很有意思。","py":"Wǒ fāxiàn jīntiān de xīnwén hěn yǒuyìsi.","en":"I found that the news today is very interesting."}]},{"id":403,"hanzi":"景点","part":"Noun","pinyin":"Jǐngdiǎn","def":"Attractions, scenic spot, place of interest (tourism)","ex":[{"zh":"你最喜欢的景点在哪个国家？","py":"Nǐ zuì xǐhuan de jǐngdiǎn zài nǎge guójiā?","en":"Which country has your favorite attraction?"},{"zh":"很多景点我还没去过。","py":"Hěnduō jǐngdiǎn wǒ háiméi qù guò.","en":"There are lots of attractions I have not been to yet."}]},{"id":404,"hanzi":"城市","part":"Noun","pinyin":"chéngshì","def":"city","ex":[{"zh":"你去过的城市,哪个最有意思？","py":"Nǐ qùguò de chéngshì, nǎgè zuì yǒuyìsi?","en":"Which city have you been to is the most interesting?"},{"zh":"我最喜欢的城市是热闹的城市。","py":"Wǒ zuì xǐhuan de chéngshì shì rènào de chéngshì.","en":"My favorite city is the city bustling with activities."}]},{"id":405,"hanzi":"建筑","part":"Noun","pinyin":"jiànzhù","def":"building","ex":[{"zh":"你觉得哪个国家的建筑最漂亮？","py":"Nǐ juéde nǎgè guójiā de jiànzhù zuì piàoliang?","en":"Which country's architecture do you think is the most beautiful?"},{"zh":"这里的建筑很有名。","py":"Zhèlǐ de jiànzhù hěn yǒumíng.","en":"The building here is famous."}]},{"id":406,"hanzi":"季节","part":"Noun","pinyin":"jìjié","def":"season","ex":[{"zh":"你喜欢在哪个季节去旅行？","py":"Nǐ xǐhuan zài nǎgè jìjié qù lǚxíng?","en":"In which season do you like to travel?"},{"zh":"这个季节很舒服，不太热。","py":"Zhège jìjié hěn shūfú, bú tài rè.","en":"This season is comfortable and not too hot."}]},{"id":407,"hanzi":"夏天","part":"Noun","pinyin":"xiàtiān","def":"summer","ex":[{"zh":"夏天的时候你常做什么？","py":"Xiàtiān de shíhou nǐ cháng zuò shénme?","en":"What do you do in summer?"},{"zh":"夏天的时候我喜欢去海边。","py":"Xiàtiān de shíhou wǒ xǐhuan qù hǎibiān.","en":"I like to go to the beach in summer."}]},{"id":408,"hanzi":"排队","part":"Verb Object","pinyin":"páiduì","def":"to line up , queue up","ex":[{"zh":"这家店很有名，常常需要排队。","py":"Zhè jiā diàn hěn yǒumíng, chángcháng xūyào páiduì.","en":"This restaurant is famous, you need to line up often."},{"zh":"夏天的时候，海边附近的商店常常需要排队。","py":"Xiàtiān de shíhou, hǎibiān fùjìn de shāngdiàn chángcháng xūyào páiduì.","en":"In summer time, people need to line up often for the shops near a beach."}]},{"id":409,"hanzi":"热闹","part":"Adj","pinyin":"rènào","def":"bustling with noise and excitement, lively","ex":[{"zh":"你喜欢热闹的地方吗？","py":"Nǐ xǐhuan rènào de dìfang ma?","en":"Do you like the place bustling with activities?"},{"zh":"我想去热闹的地方旅游。","py":"Wǒ xiǎng qù rènào de dìfang lǚyóu.","en":"I would like to travel to the place bustling with activities."}]},{"id":410,"hanzi":"晒太阳","part":"Verb Object","pinyin":"shài tàiyáng","def":"to bask in the sun","ex":[{"zh":"你喜欢去海边晒太阳吗？","py":"Nǐ xǐhuan qù hǎibiān shài tàiyáng ma?","en":"Do you like to have a sunbath on the beach?"},{"zh":"夏天的时候，大家都喜欢去海边晒太阳。","py":"Xiàtiān de shíhou, dàjiā dōu xǐhuan qù hǎibiān shài tàiyáng.","en":"Everyone likes to have a sunbath on the beach in the summer time."}]},{"id":411,"hanzi":"甜食","part":"Noun","pinyin":"tiánshí","def":"dessert；sweet","ex":[{"zh":"你常吃甜食吗？","py":"Nǐ cháng chī tiánshí ma?","en":"Do you eat dessert often?"},{"zh":"我家附近有一家店有很好吃的甜食。","py":"Wǒjiā fùjìn yǒu yījiā diàn yǒu hěn hǎo chī de tiánshí.","en":"There is a shop near my house sells delicious dessert."}]},{"id":412,"hanzi":"健康","part":"Noun/Adj","pinyin":"jiànkāng","def":"health, healthy","ex":[{"zh":"要是吃太多甜食，会不健康。","py":"Yàoshì chī tài duō tiánshí, huì bú jiànkāng.","en":"Eating too many sweets is unhealthy."},{"zh":"要是你要健康的身体，应该要多运动和少吃甜食。","py":"Yàoshi nǐ yào jiànkāng de shēntǐ, yīnggāi yào duō yùndòng hé shǎo chī tiánshí.","en":"If you want to be healthy, you should exercise more and eat sweets less."}]},{"id":413,"hanzi":"垃圾食物","part":"Noun","pinyin":"lājī shíwù","def":"Junk food","ex":[{"zh":"我不常吃垃圾食物。","py":"Wǒ bù cháng chī lājī shíwù.","en":"I do not eat junk food often."},{"zh":"吃太多垃圾食物会不健康。","py":"Chī tài duō lājī shíwù huì bú jiànkāng.","en":"Eating too much junk food is unhealthy."}]},{"id":414,"hanzi":"熬夜","part":"Verb Object","pinyin":"áoyè","def":"to stay up late or all night","ex":[{"zh":"因为工作很多，我每天都得熬夜。","py":"Yīnwèi gōngzuò hěnduō, wǒ měitiān dōu děi áoyè.","en":"Because I have lots of work to do, I have to stay up late every day."},{"zh":"太常熬夜身体会不健康。","py":"Tài cháng áoyè shēntǐ huì bú jiànkāng.","en":"Staying up late often is unhealthy."}]},{"id":415,"hanzi":"去年","part":"Noun","pinyin":"qùnián","def":"last year","ex":[{"zh":"去年夏天我常去海边晒太阳。","py":"Qùnián xiàtiān wǒ cháng qù hǎibiān shài tàiyáng.","en":"I went sunbathing frequently on the beach last summer."},{"zh":"去年因为我有汉语考试，所以我常熬夜学习。","py":"Qùnián yīnwèi wǒ yǒu Hànyǔ kǎoshì, suǒyǐ wǒ cháng áoyè xuéxí.","en":"Because I had Chinese exam last year, I stayed up late often."}]},{"id":416,"hanzi":"爱","part":"Noun/Verb","pinyin":"ài","def":"love, to love","ex":[{"zh":"我很爱看电影，所以周末常跟朋友或家人去电影院看电影。","py":"Wǒ hěn ài kàn diànyǐng, suǒyǐ zhōumò cháng gēn péngyou huò jiārén qù diànyǐngyuàn kàn diànyǐng.","en":"I love watching movies therefore I often watch movies in the theater with my friends or family."},{"zh":"他不爱运动，也不爱吃蔬菜水果，所以身体不健康。","py":"Tā bú ài yùndòng, yě bú ài chī shūcài shuǐguǒ, suǒyǐ shēntǐ bú jiànkāng.","en":"He doesn't like to exercise, eat vegetables and fruits, so he is unhealthy."}]},{"id":417,"hanzi":"减肥","part":"Verb Object","pinyin":"jiǎnféi","def":"to lose weight","ex":[{"zh":"要是你想减肥，多吃健康的食物和多运动。","py":"Yàoshi nǐ xiǎng jiǎnféi, duō chī jiànkāng de shíwù hé duō yùndòng.","en":"If you want to lose weight, you should eat more healthy food and exercise more."},{"zh":"他觉得自己需要减肥，因为吃太多垃圾食物。","py":"Tā juéde zìjǐ xūyào jiǎnféi, yīnwèi chī tài duō lājī shíwù.","en":"He thinks he needs to lose weight, because eating too much junk food."}]},{"id":418,"hanzi":"胖","part":"Adj","pinyin":"pàng","def":"fat","ex":[{"zh":"我不爱运动， 也不爱吃蔬菜水果，现在我胖了。","py":"Wǒ bú ài yùndòng, yě bú ài chī shūcài shuǐguǒ, xiànzài wǒ pàng le.","en":"I don't like to exercise, eat vegetables and fruits. Now I am fat."},{"zh":"我的哥哥最近在减肥，因为他觉得自己太胖了。","py":"Wǒ de gēge zuìjìn zài jiǎnféi, yīnwèi tā juéde zìjǐ tài pàng le.","en":"My older brother is losing weight recently because he thinks he is too fat."}]},{"id":419,"hanzi":"重要","part":"Adj","pinyin":"zhòngyào","def":"important, significant, major","ex":[{"zh":"身体健康比工作重要，你觉得呢？","py":"Shēntǐ jiànkāng bǐ gōngzuò zhòngyào, nǐ juéde ne?","en":"Health is more important than work, what do you think?"},{"zh":"这件事很重要，你不能忘了。","py":"Zhè jiàn shì hěn zhòngyào, nǐ bùnéng wàng le.","en":"This is really important, you can’t forget about it."}]},{"id":420,"hanzi":"留学","part":"Verb Object","pinyin":"liúxué","def":"to study abroad","ex":[{"zh":"现在有很多人想到国外去留学。","py":"Xiànzài yǒu hěnduō rén xiǎngdào guó wài qù liúxué.","en":"Nowadays there are many people want to study abroad."},{"zh":"我的姐姐去年去中国留学，认识很多中国朋友。","py":"Wǒ de jiějie qùnián qù Zhōngguó liúxué, rènshi hěnduō Zhōngguó péngyou.","en":"My older sister studied in China last year and made lots of Chinese friends."}]},{"id":421,"hanzi":"友好","part":"Adj","pinyin":"yǒuhǎo","def":"friendly","ex":[{"zh":"虽然我不太会说汉语，但是我的中国朋友都很友好。","py":"Suīrán wǒ bú tài huì shuō Hànyǔ, dànshì wǒ de Zhōngguó péngyou dōu hěn yǒuhǎo.","en":"My Chinese friends are friendly, even though my Chinese is not very good."},{"zh":"你是一个友好的人吗？","py":"Nǐ shì yīgè yǒuhǎo de rén ma?","en":"Are you a friendly person?"}]},{"id":422,"hanzi":"封","part":"Measure word","pinyin":"fēng","def":"Measure word for sealed objects, esp. letters","ex":[{"zh":"我写了三封信给我的朋友们。","py":"Wǒ xiě le sān fēng xìn gěi wǒ de péngyoumen.","en":"I wrote three letters to my friends."},{"zh":"因为我很想我的爸爸妈妈，所以我常写很多封信给他们。","py":"Yīnwèi wǒ hěn xiǎng wǒ de bàba māma, suǒyǐ wǒ cháng xiě hěnduō fēng xìn gěi tāmen.","en":"I miss my parents very much therefore I wrote many letters to them."}]},{"id":423,"hanzi":"筷子","part":"Noun","pinyin":"kuàizi","def":"chopsticks","ex":[{"zh":"很多人不太会用筷子。","py":"Hěnduō rén bú tài huì yòng kuàizi.","en":"Most of the people don't know how to use chopsticks."},{"zh":"中国人常用筷子吃饭。","py":"Zhōngguó rén chángyòng kuàizi chīfàn.","en":"Chinese eats with chopsticks often."}]},{"id":424,"hanzi":"刀叉","part":"Noun","pinyin":"dāo chā","def":"knife and fork","ex":[{"zh":"西方人习惯用刀叉吃饭。","py":"Xīfāng rén xíguàn yòng dāo chā chīfàn.","en":"Western are used to eat with a knife and fork."},{"zh":"我不习惯用刀叉吃饭，我习惯用筷子。","py":"Wǒ bù xíguàn yòng dāo chā chīfàn, wǒ xíguàn yòng kuàizi.","en":"I don’t get used to eating with fork and knife, I get used to eating with chopsticks."}]},{"id":425,"hanzi":"西方","part":"Noun","pinyin":"xīfāng","def":"Western","ex":[{"zh":"我很喜欢西方的音乐，可是我爸妈不喜欢。","py":"Wǒ hěn xǐhuan xīfāng de yīnyuè, kěshì wǒ bà mā bù xǐhuan.","en":"I like western music very much, but my parents don’t."},{"zh":"现在很多西方人喜欢到中国来旅游。","py":"Xiànzài hěnduō xīfāng rén xǐhuan dào Zhōngguó lái lǚyóu.","en":"Nowadays, many western like to go travel in China."}]},{"id":426,"hanzi":"口味","part":"Noun","pinyin":"kǒuwèi","def":"a person's preferences, tastes (in food), flavor","ex":[{"zh":"中国菜和韩国菜的口味不一样。","py":"Zhōngguó cài hé Hánguó cài de kǒuwèi bù yíyàng.","en":"Chinese and Korean food tastes different."},{"zh":"我喜欢苹果口味的甜食。","py":"Wǒ xǐhuan píngguǒ kǒuwèi de tiánshí.","en":"I like apple flavor sweets."}]},{"id":427,"hanzi":"差不多","part":"Adj","pinyin":"chàbuduō","def":"more or less,about the same","ex":[{"zh":"每个国家的麦当劳都差不多。","py":"Měi gè guójiā de Màidāngláo dōu chàbuduō.","en":"McDonald’s in every country are almost the same."},{"zh":"这家咖啡店和我家附近的咖啡店的咖啡口味差不多。","py":"Zhè jiā kāfēi diàn hé wǒ jiā fùjìn de kāfēi diàn de kāfēi kǒuwèi chàbuduō.","en":"This coffee shop is similar to the coffee shop near my place."}]},{"id":428,"hanzi":"一样","part":"Adj","pinyin":"yíyàng","def":"same, like, equal to, the same as, just like","ex":[{"zh":"他跟他哥哥一样高。","py":"Tā gēn tā gēge yíyàng gāo.","en":"He and his older brother’s height are the same."},{"zh":"中国菜和美国菜一样好吃。","py":"Zhōngguó cài hé Měiguó cài yīyàng hǎo chī.","en":"Chinese food is as delicious as American food."}]},{"id":429,"hanzi":"风","part":"Noun","pinyin":"fēng","def":"wind","ex":[{"zh":"今天雨很大，风也很大。","py":"Jīntiān yǔ hěn dà, fēng yě hěn dà.","en":"It’s windy and raining heavily today."},{"zh":"外面风有点儿大，出门要小心。","py":"Wàimiàn fēng yǒudiǎn'er dà, chūmén yào xiǎoxīn.","en":"It’s windy outside, you should be careful when you go out."}]},{"id":430,"hanzi":"预报","part":"Noun","pinyin":"yùbào","def":"forecast","ex":[{"zh":"你看明天的天气预报了吗？","py":"Nǐ kàn míngtiān de tiānqì yùbào le ma?","en":"Did you watch the weather forecast for tomorrow?"},{"zh":"我看天气预报了，今天会很冷。","py":"Wǒ kàn tiānqì yùbào le, jīntiān huì hěn lěng.","en":"I watched the weather forecast. It will be cold today."}]},{"id":431,"hanzi":"月底","part":"Noun","pinyin":"yuèdǐ","def":"end of the month","ex":[{"zh":"听说这个月月底会很冷。","py":"Tīngshuō zhègè yuè yuèdǐ huì hěn lěng.","en":"I heard that it will be very cold in the end of this month."},{"zh":"每个月底我都会去学校考试。","py":"Měi gè yuèdǐ wǒ dūhuì qù xuéxiào kǎoshì.","en":"At the end of each month, I will have school exam."}]},{"id":432,"hanzi":"湿","part":"Adj","pinyin":"shī","def":"wet","ex":[{"zh":"湿冷的天气非常不舒服。","py":"Shīlěng de tiānqì fēicháng bù shūfu.","en":"The humid and cold weather is uncomfortable."},{"zh":"今天忘了带伞出门，所以衣服都湿了。","py":"Jīntiān wàng le dài sǎn chūmén, suǒyǐ yīfu dōu shī le.","en":"I forgot to bring umbrella today, so my clothes were all wet."}]},{"id":433,"hanzi":"干","part":"Adj","pinyin":"gān","def":"dry","ex":[{"zh":"这儿的冬天很干，没有那么冷。","py":"Zhè'er de dōngtiān hěn gān, méiyǒu nàme lěng.","en":"Winter here is dry and not that cold."},{"zh":"这里的空气很干，我觉得不舒服。","py":"Zhèlǐ de kōngqì hěn gān, wǒ juéde bù shūfu.","en":"The air here is dry and I feel uncomfortable."}]},{"id":434,"hanzi":"讨厌","part":"Verb","pinyin":"tǎoyàn","def":"to dislike, annoying","ex":[{"zh":"我讨厌下雨天，因为去旅游不方便。","py":"Wǒ tǎoyàn xiàyǔtiān, yīnwèi qù lǚyóu bù fānɡbiàn.","en":"I don’t like rainy day, because traveling on rainy days is inconvenient."},{"zh":"我的弟弟讨厌吃蔬菜，只喜欢吃肉。","py":"Wǒ de dìdi tǎoyàn chī shūcài, zhǐ xǐhuan chī ròu.","en":"My younger brother doesn’t like to eat vegetables, he only likes to eat meat."}]},{"id":435,"hanzi":"气温","part":"Noun","pinyin":"qìwēn","def":"temperature","ex":[{"zh":"今天气温几度?","py":"Jīntiān qìwēn jǐdù?","en":"What’s the temperature today?"},{"zh":"今天的气温很舒服，不冷也不热。","py":"Jīntiān de qìwēn hěn shūfú, bù lěng yě bú rè.","en":"The temperature today is comfortable, it’s not cold or hot."}]},{"id":436,"hanzi":"冬天","part":"Noun","pinyin":"dōngtiān","def":"winter","ex":[{"zh":"冬天的时候常常下雨,出门很麻烦！","py":"Dōngtiān de shíhou chángcháng xià yǔ, chūmén hěn máfan!","en":"It rains often in the winter, to go out is so troublesome!"},{"zh":"我讨厌冬天去旅游，因为要带很多衣服。","py":"Wǒ tǎoyàn dōngtiān qù lǚyóu, yīnwèi yào dài hěnduō yīfu.","en":"I don't like go travel in the winter because I need to bring a lot of clothes."}]},{"id":437,"hanzi":"打伞","part":"Verb Object","pinyin":"dǎ sǎn","def":"to hold up an umbrella","ex":[{"zh":"昨天我帮一位老太太打伞。","py":"Zuótiān wǒ bāng yí wèi lǎo tàitài dǎ sǎn.","en":"I helped an old lady hold up an umbrella yesterday."},{"zh":"下雨了！快打伞吧!","py":"Xià yǔ le! Kuài dǎ sǎn ba!","en":"It’s raining, let’s holding up an umbrella!"}]},{"id":438,"hanzi":"带","part":"Verb","pinyin":"dài","def":"to bring","ex":[{"zh":"我带你去附近的海边看看漂亮的风景吧！","py":"Wǒ dài nǐ qù fùjìn de hǎibiān kàn kàn piàoliang de fēngjǐng ba!","en":"Let me bring you to the beach to see the beautiful view."},{"zh":"她有时候会带两个可爱的女儿去公园玩。","py":"Tā yǒushíhou huì dài liǎng gè kěài de nǚér qù gōngyuán wán.","en":"Sometimes she will take her two adorable daughters to the park and play."}]},{"id":439,"hanzi":"欢迎","part":"Phrase","pinyin":"huānyíng","def":"to welcome, welcome","ex":[{"zh":"我们明天要去海边玩，欢迎你一起来！","py":"Wǒmen míngtiān yào qù hǎibiān wán, huānyíng nǐ yìqǐlái!","en":"We are going to the beach tomorrow, we welcome you to join us."},{"zh":"这是我们的新同学，大家一起来欢迎他！","py":"Zhè shì wǒmen de xīn tóngxué, dàjiā yìqǐlái huānyíng tā！","en":"This is our new classmate, let’s welcome him!"}]},{"id":440,"hanzi":"搬","part":"Verb","pinyin":"bān","def":"to move (i.e. relocate oneself), to move (something relatively heavy or bulky)","ex":[{"zh":"我爸爸妈妈下个月要搬到博物馆旁边的大楼。","py":"Wǒ bàba māma xià gè yuè yào bān dào bówù guǎn pángbiān de dàlóu.","en":"My parents are going to move next month to the building next to the museum."},{"zh":"你打算什么时候要搬来北京住？","py":"Nǐ dǎsuàn shénme shíhou yào bān lái Běijīng zhù?","en":"When do you plan to move to Beijing?"}]},{"id":441,"hanzi":"楼","part":"Noun","pinyin":"lóu","def":"storied building, floor","ex":[{"zh":"请拿这些鸡蛋给住在三楼的美美。","py":"Qǐng ná zhèxiē jīdàn gěi zhù zài sān lóu de Měiměi.","en":"Please take these eggs to Meimei, who lives in the third floor."},{"zh":"不好意思，请问真真咖啡店在几楼？","py":"Bù hǎo yìsi, qǐngwèn Zhēnzhēn kāfēi diàn zài jǐ lóu?","en":"Excuse me, which floor is the Zhenzhen coffee shop?"}]},{"id":442,"hanzi":"邻居","part":"Noun","pinyin":"línjū","def":"neighbor, next door","ex":[{"zh":"我的邻居是个中国人，他有两个可爱的女儿。","py":"Wǒ de línjū shìgè Zhōngguó rén, tā yǒu liǎng gè kěài de nǚér.","en":"My neighbor is a Chinese, he has two adorable daughters."},{"zh":"虽然我的邻居八十岁了，但是他还是每年去旅游。","py":"Suīrán wǒ de línjū bāshí suì le, dànshì tā háishì měinián qù lǚyóu.","en":"Although my neighbor is eighty years old, he still travels every year."}]},{"id":443,"hanzi":"帮忙","part":"Verb Object","pinyin":"bāngmáng","def":"to help, to do a favor","ex":[{"zh":"虽然我很想帮忙，但是我现在没空。","py":"Suīrán wǒ hěn xiǎng bāngmáng, dànshì wǒ xiànzài méi kòng.","en":"I really want to help, but I don’t have time now."},{"zh":"这几题好难，我需要你的帮忙。","py":"Zhè jǐ tí hǎo nán, wǒ xūyào nǐ de bāngmáng.","en":"These question is so hard, I need your help."}]},{"id":444,"hanzi":"花","part":"Noun","pinyin":"huā","def":"flower","ex":[{"zh":"我看见山上有很多蓝色的小花。","py":"Wǒ kàn jiàn shānshàng yǒu hěnduō lánsè de xiǎo huā.","en":"I have seen that there are lots of blue flowers on the mountain."},{"zh":"这个商店卖的花最美，但是最贵。","py":"Zhègè shāngdiàn mài de huā zuìměi, dànshì zuì guì.","en":"The flowers which the shop sells are the most beautiful, but most expensive."}]},{"id":445,"hanzi":"扔","part":"Verb","pinyin":"rēng","def":"to throw, to throw away","ex":[{"zh":"谁扔了冰箱里的鸡蛋？","py":"Shéi rēng le bīngxiāng lǐ de jīdàn?","en":"Who threw away the eggs in the fridge?"},{"zh":"因为这些衣服太小了，所以我把他们扔了。","py":"Yīnwèi zhèxiē yīfu tài xiǎo le, suǒyǐ wǒ bǎ tāmen rēng le.","en":"I threw the clothes away because they were too small."}]},{"id":446,"hanzi":"衣柜","part":"Noun","pinyin":"yīguì","def":"wardrobe","ex":[{"zh":"我的衣柜太旧了，我想买一个新的。","py":"Wǒ de yīguì tài jiù le, wǒ xiǎng mǎi yīgè xīn de.","en":"My wardrobe is too old, I want to buy a new one."},{"zh":"我帮我的邻居搬衣柜。","py":"Wǒ bāng wǒ de línjū bān yīguì.","en":"I helped my neighbor carry his wardrobe."}]},{"id":447,"hanzi":"家具店","part":"Noun","pinyin":"jiājù diàn","def":"furniture store","ex":[{"zh":"我听说在地铁站附近有一家不错的家具店。","py":"Wǒ tīngshuō zài dìtiězhàn fùjìn yǒu yì jiā búcuò de jiājù diàn.","en":"I heard that there is a nice furniture store near subway station."},{"zh":"我最喜欢这家家具店，他们的家具质量都很好。","py":"Wǒ zuì xǐhuan zhè jiā jiājù diàn, tāmen de jiājù zhìliàng dōu hěn hǎo.","en":"I like this furniture store, the furniture here have a good quality ."}]},{"id":448,"hanzi":"床","part":"Noun","pinyin":"chuáng","def":"bed","ex":[{"zh":"听说这家家具店卖的床不贵。","py":"Tīngshuō zhè jiā jiājù diàn mài de chuáng bú guì.","en":"I heard that the bed in this furniture store is not expensive."},{"zh":"这张床睡起来很舒服。","py":"Zhè zhāng chuáng shuì qǐlái hěn shūfu.","en":"This bed is comfortable for sleep."}]},{"id":449,"hanzi":"重","part":"Adj","pinyin":"zhòng","def":"heavy","ex":[{"zh":"我的衣柜太重了，得请人来帮我搬上去。","py":"Wǒ de yīguì tài zhòng le, děi qǐng rén lái bāng wǒ bān shàngqù.","en":"My wardrobe is too heavy, so I have to ask someone for help."},{"zh":"这张床太重了，我一个人搬不上去。","py":"Zhè zhāng chuáng tài zhòng le, wǒ yīgè rén bān bú shàngqù.","en":"This bed is too heavy, I can’t move it up by my own."}]},{"id":450,"hanzi":"需要","part":"Noun/Verb","pinyin":"xūyào","def":"to need,to demand, to require, requirement","ex":[{"zh":"如果你需要我帮忙，什么时候都可以打电话给我。","py":"Rúguǒ nǐ xūyào wǒ bāngmáng, shénme shíhou dōu kěyǐ dǎdiànhuà gěi wǒ.","en":"You can call me when you need my help."},{"zh":"我需要一个新的衣柜，这个太小了","py":"Wǒ xūyào yīgè xīn de yīguì, zhège tài xiǎo le.","en":"I need a new wardrobe, this one is too small."}]},{"id":451,"hanzi":"发","part":"Verb","pinyin":"fā","def":"to text, to send","ex":[{"zh":"我妈妈昨天发了一封短信给我。","py":"Wǒ māma zuótiān fā le yīfēng duǎnxìn gěi wǒ.","en":"My mother sent me a text message yesterday."},{"zh":"我很久没给家人发短信了。","py":"Wǒ hěnjiǔ méi gěi jiārén fā duǎnxìn le.","en":"I did not send text messages to my family for a long time."}]},{"id":452,"hanzi":"短信","part":"Noun","pinyin":"duǎnxìn","def":"text message","ex":[{"zh":"我最近不方便接电话，你给我发短信吧！","py":"Wǒ zuìjìn bù fāngbiàn jiē diànhuà,nǐ gěi wǒ fā duǎn xìn ba!","en":"I can’t answer the phone recently, so you can send text messages."},{"zh":"我明天下午要开会，要是你有事，就给我发短信。","py":"Wǒ míngtiān xiàwǔ yào kāihuì, yàoshi nǐ yǒu shì, jiù gěi wǒ fā duǎnxìn.","en":"I have a meeting tomorrow afternoon. If you need me, send me text messages."}]},{"id":453,"hanzi":"质量","part":"Noun","pinyin":"zhìliàng","def":"quality","ex":[{"zh":"这个包包的质量不错。","py":"Zhègè bāobāo de zhìliàng búcuò.","en":"The quality of this bag is not bad."},{"zh":"质量不错的东西会比较贵。","py":"Zhìliàng búcuò de dōngxi huì bǐjiào guì.","en":"High quality things are more expensive."}]},{"id":454,"hanzi":"记","part":"Verb","pinyin":"jì","def":"to record, to note, to memorize","ex":[{"zh":"上课的东西，我都会记在本子上。","py":"Shàngkè de dōngxi, wǒ dōu huì jì zài běnzi shàng.","en":"What we learn in class, I take a notes on in my notebook."},{"zh":"我把重要的事情记在本子上。","py":"Wǒ bǎ zhòngyào de shìqíng jì zài běnzi shàng.","en":"I take note of important matters in my notebook."}]},{"id":455,"hanzi":"笔记本","part":"Noun","pinyin":"bǐjìběn","def":"notebook","ex":[{"zh":"这是我新买的笔记本。","py":"Zhè shì wǒ xīn mǎi de bǐjìběn.","en":"This is a brand new notebook."},{"zh":"这本笔记本质量不错，我也想买。","py":"Zhè běn bǐjìběn zhìliàng búcuò, wǒ yě xiǎng mǎi.","en":"The quality of this notebook is not bad, I also want to buy one."}]},{"id":456,"hanzi":"记得","part":"Verb","pinyin":"jìde","def":"to remember","ex":[{"zh":"你记得今天是什么日子吗？","py":"Nǐ jìde jīntiān shì shénme rìzi ma?","en":"Do you remember what date is today?"},{"zh":"我不记得我什么时候开始学开车的。","py":"Wǒ bú jìde wǒ shénme shíhou kāishǐ xué kāichē de.","en":"I don’t remember when I began to learn driving."}]},{"id":457,"hanzi":"如果","part":"Conj","pinyin":"rúguǒ","def":"if, in case","ex":[{"zh":"如果这个周末你有空，我们就一起出去走走吧！","py":"Rúguǒ zhège zhōumò nǐ yǒu kòng,women jiù yìqǐ chūqù zǒu zǒu ba!","en":"If you have free time this weekend, let’s go out together."},{"zh":"如果你明天去家具店，就给我发短信吧。我也想买床。","py":"Rúguǒ nǐ míngtiān qù jiājù diàn, jiù gěi wǒ fā duǎnxìn ba. Wǒ yě xiǎng mǎi chuáng.","en":"If you will go to furniture store tomorrow, text me. I also want to buy a bed."}]},{"id":458,"hanzi":"建议","part":"Noun/Verb","pinyin":"jiànyì","def":"to propose, to suggest, suggestion, recommendation","ex":[{"zh":"如果你去北京玩， 我建议你去万里长城看看。","py":"Rúguǒ nǐ qù Běijīng wán, wǒ jiànyì nǐ qù wànlǐ chángchéng kàn kàn.","en":"If you travel to Beijing, I recommend that you go the Great Wall."},{"zh":"如果你想买质量好的床，我建议你可以多去看看。","py":"Rúguǒ nǐ xiǎng mǎi zhìliàng hǎo de chuáng, wǒ jiànyì nǐ kěyǐ duō qù kàn kàn.","en":"If you want to buy a good quality bed, I suggest you should do more research."}]},{"id":459,"hanzi":"黑板","part":"Noun","pinyin":"hēibǎn","def":"blackboard","ex":[{"zh":"老师写在黑板上的东西你都记在笔记本上了吗？","py":"Lǎoshī xiě zài hēibǎn shàng de dōngxi nǐ dōu jì zài bǐjìběn shàng le ma?","en":"Did you take a note what teacher wrote on the blackboard?"},{"zh":"我看不到黑板上写的汉字。","py":"Wǒ kànbúdào hēibǎn shàng xiě de hànzì.","en":"I can’t see the Chinese character written on the blackboard."}]},{"id":460,"hanzi":"方法","part":"Noun","pinyin":"fāngfǎ","def":"method, way","ex":[{"zh":"要是你常忘了事情，你会用什么方法试着记得？","py":"Yàoshi nǐ cháng wàng le shìqíng, nǐ huì yòng shénme fāngfǎ shìzhe jìde?","en":"If you forget things often, what kind of method would you use to remember?"},{"zh":"你学习汉语的方法是什么？","py":"Nǐ xuéxí hànyǔ de fāngfǎ shì shénme?","en":"What ways do you use to learning Chinese?"}]},{"id":461,"hanzi":"挂","part":"Verb","pinyin":"guà","def":"to hang or suspend (from a hook etc)","ex":[{"zh":"你知道那里挂着什么吗?","py":"Nǐ zhīdào nàlǐ guàzhe shénme ma?","en":"Do you know what is hanging there?"},{"zh":"你想把画挂在哪里？","py":"Nǐ xiǎng bǎ huà guà zài nǎlǐ?","en":"Where do you want to hang the painting?"}]},{"id":462,"hanzi":"画","part":"Noun/Verb","pinyin":"huà","def":"to draw, painting","ex":[{"zh":"你想把画挂在哪儿？我想把画挂在这儿。","py":"Nǐ xiǎng bǎ huà guà zài nǎr? Wǒ xiǎng bǎ huà guà zài zhèr.","en":"Where do you want to hang the painting? I want to hang the painting here."},{"zh":"这幅画很漂亮，你喜欢吗？","py":"Zhè fú huà hěn piàoliang, nǐ xǐhuān ma?","en":"This painting is very beautiful, do you like it?"}]},{"id":463,"hanzi":"客厅","part":"Noun","pinyin":"kètīng","def":"living room","ex":[{"zh":"她家的客厅很漂亮。","py":"Tā jiā de kètīng hěn piàoliang.","en":"Her living room is very beautiful."},{"zh":"他拿着水，走到客厅了。","py":"Tā názhe shuǐ , zǒu dào kètīng le.","en":"He took the water and went to the living room."}]},{"id":464,"hanzi":"窗户","part":"Noun","pinyin":"chuānghù","def":"window","ex":[{"zh":"我把画挂在窗户旁边。","py":"Wǒ bǎ huà guà zài chuānghù pángbiān.","en":"I put the painting next to the window."},{"zh":"把沙发搬到窗户边!","py":"Bǎ shāfā bāndào chuānghù biān.","en":"Move the sofa next to the window."}]},{"id":465,"hanzi":"沙发","part":"Noun","pinyin":"shāfā","def":"sofa","ex":[{"zh":"可以帮我搬沙发吗？","py":"Kěyǐ bāng wǒ bān shāfā ma?","en":"Can you help me move the sofa?"},{"zh":"这张沙发是你买的吗？","py":"Zhè zhāng shāfā shì nǐ mǎi de ma?","en":"Is that you bought this sofa?"}]},{"id":466,"hanzi":"整齐","part":"Adj","pinyin":"zhěngqí","def":"orderly, neat, even, tidy","ex":[{"zh":"这样看起来整齐多了。","py":"Zhèyàng kàn qǐlái zhěngqí duō le.","en":"This looks much more neat."},{"zh":"请把杯子放整齐。","py":"Qǐng bǎ bēizi fàng zhěngqí.","en":"Please put her cup tidily."}]},{"id":467,"hanzi":"灯","part":"Noun","pinyin":"dēng","def":"lamp, light, lantern","ex":[{"zh":"把画挂在灯下面。","py":"Bǎ huà guàzài dēng xiàmiàn.","en":"Put the painting under the light."},{"zh":"这个灯坏了，怎么办？","py":"Zhège dēng huài le, zěnmebàn?","en":"The lamp is broken, what could we do?"}]},{"id":468,"hanzi":"椅子","part":"Noun","pinyin":"yǐzi","def":"chair","ex":[{"zh":"帮我搬张椅子吧 ! 我拿太多东西了。","py":"Bāng wǒ bān zhāng yǐzi ba! Wǒ ná tàiduō dōngxi le.","en":"Help me move a chair! I took too many things."},{"zh":"这张椅子坏了，把它搬出去。","py":"Zhè zhāng yǐzi huài le, bǎ tā bān chūqù.","en":"The chair is broken, take it out."}]},{"id":469,"hanzi":"放","part":"Verb","pinyin":"fàng","def":"to put, to place","ex":[{"zh":"我忘了我把刚刚买的衣服放在哪儿了！","py":"Wǒ wàngle wǒ bǎ gānggāng mǎi de yīfu fàng zài nǎr le!","en":"I forget where I put the clothes I just bought."},{"zh":"我放了一个蛋糕在厨房的桌子上。要是你饿了，可以拿去吃。","py":"Wǒ fàng le yígè dàngāo zài chúfáng de zhuōzi shàng. Yàoshi nǐ è le, kěyǐ ná qù chī.","en":"I put a cake on the table in the kitchen. If you are hungry, you can have it."}]},{"id":470,"hanzi":"鱼","part":"Noun","pinyin":"yú","def":"fish","ex":[{"zh":"冰箱里的鱼是什么时候买的？","py":"Bīngxiāng lǐ de yú shì shénme shíhou mǎi de?","en":"When did you buy the fish in the fridge?"},{"zh":"他拿了几条鱼给他的猫吃。","py":"Tā nále jǐ tiáo yú gěi tā de māo chī.","en":"He takes some fish to feed his cat."}]},{"id":471,"hanzi":"虾","part":"Noun","pinyin":"xiā","def":"shrimp, prawn","ex":[{"zh":"这些虾好大一只，一定不便宜！","py":"Zhèxiē xiā hǎo dà yìzhǐ, yídìng bù piányi!","en":"These shrimps are so big, they must be expensive!"},{"zh":"请你把这些虾放进锅子里。","py":"Qǐng nǐ bǎ
