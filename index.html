zhèxiē xiā fàng jìn guōzi lǐ.","en":"Please put these shrimps into the pot."}]},{"id":472,"hanzi":"煮","part":"Verb","pinyin":"zhǔ","def":"to cook, to boil","ex":[{"zh":"这道菜真好吃！请问是怎么煮的？","py":"Zhè dào cài zhēn hǎo chī! Qǐngwèn shì zěnme zhǔ de?","en":"This dish tastes so good! May I ask how to cook it?"},{"zh":"因为妈妈生病了，所以今天晚上我煮晚餐。","py":"Yīnwèi māma shēngbìng le, suǒyǐ jīntiān wǎnshàng wǒ zhǔ wǎncān.","en":"My mother is sick, so I will cook dinner tonight."}]},{"id":473,"hanzi":"牛肉","part":"Noun","pinyin":"niúròu","def":"beef","ex":[{"zh":"听说这家饭馆的牛肉煮得很好吃,所以很多人排队！","py":"Tīngshuō zhè jiā fànguǎn de niúròu zhǔ de hěn hǎo chī, suǒyǐ hěn duō rén páiduì!","en":"People say that the beef in this restaurant tastes great, that's why so many people are lining up!"},{"zh":"今天晚餐吃牛肉，怎么样？","py":"Jīntiān wǎncān chī niúròu, zěnmeyàng?","en":"Let’s have beef for dinner tonight, shall we?"}]},{"id":474,"hanzi":"羊肉","part":"Noun","pinyin":"yángròu","def":"mutton, lamb meat","ex":[{"zh":"你运动完后，可以帮我去超市买羊肉吗？","py":"Nǐ yùndòng wán hòu, kěyǐ bāng wǒ qù chāoshì mǎi yángròu ma?","en":"Can you help me buy lamb at the supermarket after you're done exercising?"},{"zh":"今天好冷，晚上我们来吃羊肉火锅吧！","py":"Jīntiān hǎo lěng, wǎnshàng wǒmen lái chī yángròu huǒguō ba!","en":"Today is so cold, let’s have lamb hot pot tonight!"}]},{"id":475,"hanzi":"做法","part":"Noun","pinyin":"zuòfǎ","def":"way of handling something, method for making, work method, recipe,","ex":[{"zh":"这苹果派的做法不难，你可以上网找找。","py":"Zhè píngguǒ pài de zuòfǎ bù nán, nǐ kěyǐ shàngwǎng zhǎo zhǎo.","en":"The way of making this apple pie is not difficult, you can find it on the Internet."},{"zh":"你记得这道菜的做法是什么吗？","py":"Nǐ jìde zhè dào cài de zuòfǎ shì shénme ma?","en":"Do you remember the recipe for this dish?"}]},{"id":476,"hanzi":"桌","part":"Measure word","pinyin":"zhuō","def":"measure word for tables of guests at a banquet etc","ex":[{"zh":"去年新年我们家煮了一桌好吃的菜！","py":"Qùnián xīnnián wǒmen jiā zhǔ le yì zhuō hǎochī de cài!","en":"Last new year we cooked a whole table of good dishes!"},{"zh":"你们昨天晚上做了什么？怎么有一桌的垃圾？","py":"Nǐmen zuótiān wǎnshàng zuò le shénme? Zěnme yǒu yìzhuō de lājī?","en":"What did you do last night? Why is there a table full of trash?"}]},{"id":477,"hanzi":"原因","part":"Noun","pinyin":"yuányīn","def":"reason","ex":[{"zh":"明天他就要回国了，原因是他妈妈生病了。","py":"Míngtiān tā jiù yào huíguó le, yuányīn shì tā māma shēngbìng le.","en":"He is going back to his country tomorrow, the reason is that his mother is sick."},{"zh":"我这次迟到是有特别的原因。","py":"Wǒ zhè cì chídào shì yǒu tèbié de yuányīn.","en":"I have a special reason for being late this time."}]},{"id":478,"hanzi":"夹","part":"Verb","pinyin":"jiá","def":"to pick up food with chopsticks","ex":[{"zh":"中国人和日本人都习惯用筷子夹菜吃。","py":"Zhōngguó rén hé Rìběn rén dōu xíguàn yòng kuàizi jiá cài chī.","en":"Chinese and Japanese are used to use chopsticks to pick up food and eat."},{"zh":"可以帮我夹一些菜吗？","py":"Kěyǐ bāng wǒ jiá yīxiē cài ma?","en":"Can you pick up some food with chopsticks for me?"}]},{"id":479,"hanzi":"装","part":"Verb","pinyin":"zhuāng","def":"to wrap (something in a bag), to load, to pack","ex":[{"zh":"我装了一些牛奶在杯子里。","py":"Wǒ zhuāng le yìxiē niúnǎi zài bēizi lǐ.","en":"I put some milk in the glass."},{"zh":"你装了什么在锅子里？","py":"Nǐ zhuāng le shénme zài guōzi lǐ?","en":"What do you load into the pot?"}]},{"id":480,"hanzi":"打开","part":"Verb","pinyin":"dǎkāi","def":"to open, to turn on, to switch on","ex":[{"zh":"今天天气真好，我们把窗户打开，晒晒太阳吧！","py":"Jīntiān tiānqì zhēn hǎo, wǒmen bǎ chuānghù dǎkāi, shài shài tàiyáng ba!","en":"Today’s weather is so nice, let’s open the window and enjoy the sunshine!"},{"zh":"有时候爸爸会打开电视看篮球比赛。","py":"Yǒu shíhou bàba huì dǎkāi diànshì kàn lánqiú bǐsài.","en":"Sometimes father will turn on the TV and watch a basketball game."}]},{"id":481,"hanzi":"拿","part":"Verb","pinyin":"ná","def":"to hold, to seize, to catch, to take","ex":[{"zh":"请把我的水瓶拿给我，谢谢。","py":"Qǐng bǎ wǒde shuǐpíng ná gěi wǒ, xièxie.","en":"Please give me my water bottle, thank you."},{"zh":"你手上拿的东西是什么？","py":"Nǐ shǒu shàng ná de dōngxi shì shénme?","en":"What is the thing in your hand?"}]},{"id":482,"hanzi":"行李","part":"Noun","pinyin":"xínglǐ","def":"luggage","ex":[{"zh":"请问我可以带多重的行李？","py":"Qǐngwèn wǒ kěyǐ dài duō zhòng de xínglǐ?","en":"What is the maximum weight I can bring in my luggage?"},{"zh":"请问你的行李几公斤？","py":"Qǐngwèn nǐ de xínglǐ jǐ gōngjīn?","en":"How many kilograms is your luggage?"}]},{"id":483,"hanzi":"口袋","part":"Noun","pinyin":"kǒudài","def":"pocket","ex":[{"zh":"安全检查的时候，请把口袋里的东西拿出来。","py":"Ānquán jiǎnchá de shíhou, qǐng bǎ kǒudài lǐ de dōngxi ná chūlái.","en":"When you check through security, please take out the things in your pocket."},{"zh":"我常把重要的东西放在口袋里。","py":"Wǒ cháng bǎ zhòngyào de dōngxi fàng zài kǒudài lǐ.","en":"I often put important things in my pocket."}]},{"id":484,"hanzi":"水瓶","part":"Noun","pinyin":"shuǐpíng","def":"water bottle","ex":[{"zh":"安全检查的时候，不能把水瓶带进去。","py":"Ānquán jiǎnchá de shíhou, bùnéng bǎ shuǐpíng dài jìnqù.","en":"When going through security check, we can not bring water bottles."},{"zh":"你的水瓶能装多少水？","py":"Nǐ de shuǐpíng néng zhuāng duōshǎo shuǐ?","en":"How much water can you hold in your water bottle?"}]},{"id":485,"hanzi":"钱币","part":"Noun","pinyin":"qiánbì","def":"coins","ex":[{"zh":"你喜欢搜集你去过的国家的钱币吗？","py":"Nǐ xǐhuan sōují nǐ qùguò de guójiā de qiánbì ma?","en":"Do you like to collect the coins of the countries you've been to?"},{"zh":"我昨天买东西的时候，店员给我很多钱币。","py":"Wǒ zuótiān mǎi dōngxī de shíhou, diànyuán gěi wǒ hěn duō qiánbì.","en":"After I bought things yesterday, the clerk gave me a lot of coins."}]},{"id":486,"hanzi":"护照","part":"Noun","pinyin":"hùzhào","def":"passport","ex":[{"zh":"出国前，不要忘了带护照。","py":"Chūguó qián, búyào wàng le dài hùzhào.","en":"Before going abroad, do not forget to take your passport."},{"zh":"我忘了我的护照放在哪里，请帮我找一找。","py":"Wǒ wàng le wǒ de hùzhào fàng zài nǎlǐ, qǐng bāng wǒ zhǎo yì zhǎo.","en":"I forgot where my passport was, please help me find it."}]},{"id":487,"hanzi":"钥匙","part":"Noun","pinyin":"yàoshi","def":"key","ex":[{"zh":"出门以前记得要带钥匙。","py":"Chūmén yǐqián jìde yào dài yàoshi.","en":"Remember to bring your keys before going out."},{"zh":"我忘了我把钥匙放在哪里。","py":"Wǒ wàng le wǒ bǎ yàoshi fàng zài nǎlǐ.","en":"I forgot where I put the key."}]},{"id":488,"hanzi":"签证","part":"Noun","pinyin":"qiānzhèng","def":"visa","ex":[{"zh":"我的护照跟签证都在口袋里。","py":"Wǒde hùzhào gēn qiānzhèng dōu zài kǒudài lǐ.","en":"My passport and visa are in my pocket."},{"zh":"出国以前要检查你的护照和签证有没有问题。","py":"Chūguó yǐqián yào jiǎnchá nǐ de hùzhào hé qiānzhèng yǒu méiyǒu wèntí.","en":"Before going abroad, you have to check your passport and visa are without any problems."}]},{"id":489,"hanzi":"机场","part":"Noun","pinyin":"jīchǎng","def":"airport","ex":[{"zh":"出国前要早两到三个小时到机场。","py":"Chūguó qián yào zǎo liǎng dào sānge xiǎoshí dào jīchǎng.","en":"Go to the airport two to three hours before going abroad"},{"zh":"从你家到机场远不远？","py":"Cóng nǐ jiā dào jīchǎng yuǎn bùyuǎn?","en":"Is your home far from the airport?"}]},{"id":490,"hanzi":"看到","part":"Verb","pinyin":"kàndào","def":"to see, to catch sight of","ex":[{"zh":"昨天我在公园里看到他在打球。","py":"Zuótiān wǒ zài gōngyuán lǐ kàndào tā zài dǎqiú.","en":"I saw him playing ball in the park yesterday."},{"zh":"你多久没看到他了？","py":"Nǐ duōjiǔ méi kàndào tā le?","en":"How long haven’t you seen him?"}]},{"id":491,"hanzi":"久","part":"Adj","pinyin":"jiǔ","def":"(long) time, (long) duration of time","ex":[{"zh":"他什么时候回来？他出去很久了。","py":"Tā shénme shíhou huílái? Tā chūqù hěn jiǔ le.","en":"When will he come back? He went out for a long time."},{"zh":"很久以前我去过日本旅游。","py":"Hěn jiǔ yǐqián wǒ qù guò Rìběn lǚyóu.","en":"I have been to Japan a long time ago."}]},{"id":492,"hanzi":"大概","part":"Adv","pinyin":"dàgài","def":"probably, roughly, approximately, about,","ex":[{"zh":"他好像很不舒服，大概是生病了。","py":"Tā hǎoxiàng hěn bù shūfu, dàgài shì shēngbìng le.","en":"He seems not so comfortable, probably he is sick."},{"zh":"我今天要跟朋友去演唱会，大概晚上十点回来。","py":"Wǒ jīntiān yào gēn péngyou qù yǎnchànghuì, dàgài wǎnshàng shí diǎn huílái.","en":"I will go to a concert with a friend today, probably will come back at 10pm."}]},{"id":493,"hanzi":"这么","part":"Adv","pinyin":"zhème","def":"so much, this much","ex":[{"zh":"虽然他住在北京这么久了，但是还是会迷路。","py":"Suīrán tā zhù zài Běijīng zhème jiǔ le, dànshì háishì huì mílù.","en":"Although he lives in Beijing for a long time, but he still gets lost ."},{"zh":"你不是要去朋友家吃火锅？怎么这么快就回来了？","py":"Nǐ búshì yào qù péngyou jiā chī huǒguō? Zěnme zhème kuài jiù huílái le?","en":"Weren’t you going to your friend’s for hot pot? Why did you come back so early?"}]},{"id":494,"hanzi":"一定","part":"Adv","pinyin":"yídìng","def":"surely, certainly","ex":[{"zh":"要是你每天练习汉语，不久以后一定可以说得很好的！","py":"Yàoshi nǐ měitiān liànxí hànyǔ, bùjiǔ yǐhòu yídìng kěyǐ shuō de hěn hǎo de!","en":"If you practice Mandarin every day, you definitely can speak Mandarin fluently in a short time."},{"zh":"要是你不早点睡，明天一定会迟到。","py":"Yàoshi nǐ bù zǎodiǎn shuì, míngtiān yídìng huì chídào.","en":"If you don’t go sleep early, you will definitely be late tomorrow."}]},{"id":495,"hanzi":"接","part":"Verb","pinyin":"jiē","def":"to pick up (the phone), to answer (the phone)","ex":[{"zh":"我刚刚没接到他的电话。","py":"Wǒ gānggāng méi jiē dào tā de diànhuà.","en":"I just missed his phone call."},{"zh":"我在做饭，你可以帮忙接电话吗？","py":"Wǒ zài zuò fàn, nǐ kěyǐ bāngmáng jiē diànhuà ma?","en":"I am cooking, can you pick up the phone?"}]},{"id":496,"hanzi":"空","part":"Adj","pinyin":"kōng","def":"empty","ex":[{"zh":"你家还有没有空的房间？","py":"Nǐ jiā hái yǒu méiyǒu kōng de fángjiān?","en":"Is there any empty room in your home?"},{"zh":"我家已经没有空房间了。","py":"Wǒ jiā yǐjīng méiyǒu kōng fángjiān le.","en":"My home has no empty room."}]},{"id":497,"hanzi":"房东","part":"Noun","pinyin":"fángdōng","def":"landlord","ex":[{"zh":"我不喜欢我的房东，因为我有问题的时候他都不帮我。","py":"Wǒ bù xǐhuān wǒ de fángdōng, yīnwèi wǒ yǒu wèntí de shíhou tā dōu bù bāng wǒ.","en":"I do not like my landlord, because he did not help me when there was a problem."},{"zh":"我的房东常常自己开门进来，我该怎么办？","py":"Wǒ de fángdōng chángcháng zìjǐ kāimén jìnlái, wǒ gāi zěnmebàn?","en":"My landlord often lets himself into my room. How should I deal with it?"}]},{"id":498,"hanzi":"房客","part":"Noun","pinyin":"fángkè","def":"tenant","ex":[{"zh":"我房间旁边的房客是大学生。","py":"Wǒ fángjiān pángbiān de fángkè shì dàxuéshēng .","en":"My room is next to the tenant, who is college students."},{"zh":"我楼上的房客晚上常常唱歌，我都不能睡觉。","py":"Wǒ lóushàng de fángkè wǎnshàng chángcháng chànggē, wǒ dōu bùnéng shuìjiào.","en":"My upstairs tenants often sing at night, I can not sleep."}]},{"id":499,"hanzi":"交通","part":"Noun","pinyin":"jiāotōng","def":"transportation/traffic","ex":[{"zh":"这附近的交通方便吗？","py":"Zhè fùjìn de jiāotōng fāngbiàn ma?","en":"Is the nearby transportation convenient?"},{"zh":"这附近交通不太方便，我想换房子。","py":"Zhè fùjìn jiāotōng bú tài fāngbiàn, wǒ xiǎng huàn fángzi.","en":"The transportation here is not convenient, I want to move to another place."}]},{"id":500,"hanzi":"帮助","part":"Noun/Verb","pinyin":"bāngzhù","def":"assistance, aid, to help, to assist","ex":[{"zh":"你有什么问题我都可以帮助你。","py":"Nǐ yǒu shénme wèntí wǒ dōu kěyǐ bāngzhù nǐ.","en":"I can help if you have any questions."},{"zh":"昨天我的房东帮助我把床搬上去。","py":"Zuótiān wǒ de fángdōng bāngzhù wǒ bǎ chuáng bān shàngqù.","en":"Yesterday my landlord helped me to move the bed up."}]},{"id":501,"hanzi":"合适","part":"Adj","pinyin":"héshì","def":"suitable, fitting","ex":[{"zh":"我最近想换房子，你家附近有没有合适的空房子？","py":"Wǒ zuìjìn xiǎng huàn fángzi, nǐjiā fùjìn yǒu méiyǒu héshì de kōng fángzi?","en":"Recently I have wanted to move to a new house, is there any suitable and empty houses near your home?"},{"zh":"我帮你问问我朋友这附近有没有合适的空房子。","py":"Wǒ bāng nǐ wènwèn wǒ péngyǒu zhè fùjìn yǒu méiyǒu héshì de kōng fángzi.","en":"I will ask my friend is there any suitable and empty houses nearby."}]},{"id":502,"hanzi":"换","part":"Verb","pinyin":"huàn","def":"to change, to switch","ex":[{"zh":"我想换一间交通比较方便的房子。","py":"Wǒ xiǎng huàn yìjiàn jiāotōng bǐjiào fāngbiàn de fángzi.","en":"I want to move to a house which has a more convenient transportation conditions."},{"zh":"我没有硬币了，可以去银行换钱吗？","py":"Wǒ méiyǒu yìngbì le, kěyǐ qù yínháng huànqián ma?","en":"I do not have coins, can I go to the bank to exchange money?"}]},{"id":503,"hanzi":"间","part":"Measure word","pinyin":"jiān","def":"section of a room or lateral space between two pairs of pillars, Measure word for rooms","ex":[{"zh":"听说那间房子交通很方便也很便宜。","py":"Tīngshuō nàjiān fángzi jiāotōng hěn fāngbiàn yě hěn piányi.","en":"I heard that the house is very convenient and very cheap."},{"zh":"这间房间很大也很安静。","py":"Zhèjiān fángjiān hěn dà yě hěn ānjìng.","en":"This room is very large and very quiet."}]},{"id":504,"hanzi":"吵","part":"Verb","pinyin":"chǎo","def":"to make a noise, noisy","ex":[{"zh":"这间房子在火车站附近，所以很吵。","py":"Zhèjiān fángzi zài huǒchēzhàn fùjìn, suǒyǐ hěnchǎo.","en":"The house is near the train station, so it is noisy."},{"zh":"大家都不喜欢住在很吵的地方。","py":"Dàjiā dōu bù xǐhuan zhù zài hěnchǎo de dìfāng.","en":"We do not like to live in a very noisy place."}]},{"id":505,"hanzi":"其他","part":"Pronoun","pinyin":"qítā","def":"other, (something or somebody) else, the rest","ex":[{"zh":"我觉得这间房子不够大，我想看其他间。","py":"Wǒ juéde zhèjiān fángzi búgòu dà, wǒ xiǎng kàn qítā jiān.","en":"This house is not big enough, I want to see another one."},{"zh":"他没有其他朋友。","py":"Tā méiyǒu qítā péngyǒu.","en":"He has no other friends."}]},{"id":506,"hanzi":"平常","part":"Adv","pinyin":"píngcháng","def":"usually","ex":[{"zh":"他平常都自己做饭。","py":"Tā píngcháng dōu zìjǐ zuòfàn.","en":"He usually cooks for himself."},{"zh":"我平常不去很贵的餐厅。","py":"Wǒ píngcháng búqù hěnguì de cāntīng.","en":"I usually do not go to the very expensive restaurant."}]},{"id":507,"hanzi":"洗手间","part":"Noun","pinyin":"xǐshǒujiān","def":"bathroom","ex":[{"zh":"这间房子的洗手间很大。","py":"Zhèjiān fángzi de xǐshǒujiān hěndà.","en":"The house has a large bathroom."},{"zh":"这间学校没有很多洗手间。","py":"Zhèjiān xuéxiào méiyǒu hěnduō xǐshǒujiān.","en":"This school does not have a lot of toilets."}]},{"id":508,"hanzi":"文化","part":"Noun","pinyin":"wénhuà","def":"culture","ex":[{"zh":"用筷子吃饭是中国的文化。","py":"Yòng kuàizi chīfàn shì Zhōngguó de wénhuà.","en":"Eating with chopsticks is part of Chinese culture."},{"zh":"每个国家的文化都有不一样的特色。","py":"Měi gè guójiā de wénhuà dōu yǒu bù yīyàng de tèsè.","en":"Every country's culture has different characteristics."}]},{"id":509,"hanzi":"相信","part":"Verb","pinyin":"xiāngxìn","def":"to be convinced (that something is true), to believe,","ex":[{"zh":"你不应该相信他，他说的话都不是真的。","py":"Nǐ bù yīnggāi xiāngxìn tā, tā shuō de huà dōu búshì zhēnde.","en":"You should not believe him, what he said are all not true."},{"zh":"我相信我会把汉语学好。","py":"Wǒ xiāngxìn wǒ huì bǎ hànyǔ xuéhǎo.","en":"I believe I will improve my Chinese."}]},{"id":510,"hanzi":"机会","part":"Noun","pinyin":"jīhuì","def":"opportunity, chance,","ex":[{"zh":"看中国电影是学习汉语的好机会。","py":"Kàn Zhōngguó diànyǐng shì xuéxí hànyǔ de hǎo jīhuì.","en":"Watching Chinese movies is a good way to learn Chinese."},{"zh":"我很开心有机会到中国去工作。","py":"Wǒ hěn kāixīn yǒu jīhuì dào Zhōngguó qù gōngzuò.","en":"I am happy that I have a chance to work in China."}]},{"id":511,"hanzi":"复习","part":"Verb","pinyin":"fùxí","def":"to review","ex":[{"zh":"你每天复习汉语吗？","py":"Nǐ měitiān fùxí hànyǔ ma?","en":"Do you review Chinese every day?"},{"zh":"老师说我们应该要每天复习汉语。","py":"Lǎoshī shuō wǒmen yīnggāi yào měitiān fùxí hànyǔ.","en":"Teacher said we should review Chinese every day."}]},{"id":512,"hanzi":"下次","part":"Noun","pinyin":"xiàcì","def":"next time","ex":[{"zh":"我们下次一起去看京剧吧！","py":"Wǒmen xiàcì yìqǐ qù kàn jīngjù ba!","en":"Let’s go to see Peking Opera next time!"},{"zh":"下次我想去北京旅游。","py":"Xiàcì wǒ xiǎng qù Běijīng lǚyóu.","en":"I want to go travel in Beijing next time."}]},{"id":513,"hanzi":"懂","part":"Verb","pinyin":"dǒng","def":"to understand, to comprehend","ex":[{"zh":"老师说的话，你都懂吗？","py":"Lǎoshī shuō de huà, nǐ dōu dǒng ma？","en":"Do you understand what did teacher say?"},{"zh":"我看不懂这部电影的意思。","py":"Wǒ kàn bù dǒng zhè bù diànyǐng de yìsi.","en":"I don’t understand the meaning of this movie."}]},{"id":514,"hanzi":"自己","part":"Pronoun","pinyin":"zìjǐ","def":"oneself/myself/ownself","ex":[{"zh":"我常自己一个人去旅游。","py":"Wǒ cháng zìjǐ yígèrén qù lǚyóu.","en":"I go travel by myself often."},{"zh":"放假的时候，我喜欢自己在家看书。","py":"Fàngjià de shíhou, wǒ xǐhuan zìjǐ zàijiā kànshū.","en":"I like to read at home by myself in my day off."}]},{"id":515,"hanzi":"京剧","part":"Noun","pinyin":"jīngjù","def":"Beijing Opera, Peking Opera","ex":[{"zh":"我的房东觉得京剧很有意思。","py":"Wǒ de fángdōng juéde jīngjù hěn yǒuyìsi.","en":"My landlord thinks Peking Opera is interesting."},{"zh":"京剧是中国很重要的文化。","py":"Jīngjù shì Zhōngguó hěn zhòngyào de wénhuà.","en":"Peking Opera is an important part of Chinese culture."}]},{"id":516,"hanzi":"表演","part":"Noun/Verb","pinyin":"biǎoyǎn","def":"performance,perform","ex":[{"zh":"你看楼下有一个表演，看起来很热闹。","py":"Nǐ kàn lóuxià yǒu yígè biǎoyǎn, kàn qǐlái hěn rènào.","en":"Look! There is a show downstairs, it looks exciting."},{"zh":"她表演得很好。","py":"Tā biǎoyǎn de hěn hǎo.","en":"She performs well."}]},{"id":517,"hanzi":"精彩","part":"Adj","pinyin":"jīngcǎi","def":"brilliant, marverlous","ex":[{"zh":"这个演唱会非常精彩。","py":"Zhège yǎnchànghuì fēicháng jīngcǎi.","en":"This concert is amazing."},{"zh":"这么精彩的表演，下次我还要来看。","py":"Zhème jīngcǎi de biǎoyǎn, xiàcì wǒ hái yào lái kàn.","en":"What a brilliant show! I will come to see this show again."}]},{"id":518,"hanzi":"怎么了？","part":"Phrase","pinyin":"zěnmele?","def":"What's up?, What's going on?, What happened?","ex":[{"zh":"怎么了？你的身体不舒服吗？","py":"Zěnmele? Nǐ de shēntǐ bù shūfu ma?","en":"What happened? Are you not feeling well?"},{"zh":"你昨天怎么了？为什么没来学校？","py":"Nǐ zuótiān zěnmele? Wèishénme méi lái xuéxiào?","en":"What happened to you yesterday? Why didn’t you come to school?"}]},{"id":519,"hanzi":"吵架","part":"Verb","pinyin":"chǎojià","def":"to quarrel","ex":[{"zh":"因为他们的做法不一样，所以吵架了。","py":"Yīnwèi tāmen de zuòfǎ bù yíyàng, suǒyǐ chǎojià le.","en":"Their methods were different, so they quarreled."},{"zh":"你知道他们吵架的原因是什么吗？","py":"Nǐ zhīdào tāmen chǎojià de yuányīn shì shénme ma?","en":"Do you know the reason why they quarreled?"}]},{"id":520,"hanzi":"脸色","part":"Noun","pinyin":"liǎnsè","def":"complexion, look","ex":[{"zh":"她生病了，所以脸色不太好。","py":"Tā shēngbìng le, suǒyǐ liǎnsè bú tài hǎo.","en":"She is ill, so she has bad complexion."},{"zh":"你的脸色看起来不错！发生了什么好事吗？","py":"Nǐ de liǎnsè kàn qǐlái bu cuò! Fāshēngle shénme hǎoshì ma?","en":"You look great ! Did something good happen?"}]},{"id":521,"hanzi":"男朋友","part":"Noun","pinyin":"nánpéngyou","def":"boyfriend","ex":[{"zh":"我的男朋友现在在国外工作，我非常想他。","py":"Wǒ de nánpéngyou xiànzài zài guówài gōngzuò, wǒ fēicháng xiǎng tā.","en":"My boyfriend is working abroad, I miss him so much."},{"zh":"她的男朋友虽然胖，但是比你高得多了！","py":"Tā de nánpéngyou suīrán pàng, dànshì bǐ nǐ gāo de duō le!","en":"Although her boyfriend is fat, he is much taller than you!"}]},{"id":522,"hanzi":"哭","part":"Verb","pinyin":"kū","def":"to cry, to weep","ex":[{"zh":"他的女儿因为太饿，所以哭了。","py":"Tā de nǚér yīnwèi tài è, suǒyǐ kū le.","en":"His daughter is hungry, so she cries."},{"zh":"他已经跟你说对不起了，你不要再哭了。","py":"Tā yǐjīng gēn nǐ shuō duìbùqǐ le, nǐ bùyào zài kū le.","en":"He has already apologized to you, don not cry any more."}]},{"id":523,"hanzi":"谈一谈","part":"Verb","pinyin":"tán yī tán","def":"to talk about","ex":[{"zh":"你看起来很难过，要跟我谈一谈吗？","py":"Nǐ kàn qǐlái hěn nánguò, yào gēn wǒ tán yì tán ma?","en":"You look sad, do you want to talk to me ?"},{"zh":"跟我们谈一谈昨天的英语课吧！","py":"Gēn wǒmen tán yì tán zuótiān de yīngyǔ kè ba!","en":"Talk about English class of yesterday with us!"}]},{"id":524,"hanzi":"难看","part":"Adj","pinyin":"nánkàn","def":"ugly, unsightly","ex":[{"zh":"你的脸色真难看，要不要休息一下？","py":"Nǐ de liǎnsè zhēn nánkàn, yào búyào xiūxí yí xià?","en":"Your complexion is bad, do you need a rest?"},{"zh":"你写的字好难看，你要多练习！","py":"Nǐ xiě de zì hǎo nánkàn, nǐ yào duō liànxí!","en":"Your writing is unsightly, you need to practice more."}]},{"id":525,"hanzi":"发生","part":"Verb","pinyin":"fāshēng","def":"happen, occur, take place","ex":[{"zh":"为什么你们都不跟他说话？可以告诉我发生了什么事吗？","py":"Wèishénme nǐmen dōu bù gēn tā shuōhuà? Kěyǐ gàosù wǒ fāshēngle shénme shì ma?","en":"Why don’t you talk with him? Can you tell me what happened?"},{"zh":"要是你不专心过马路，危险的事就会发生。","py":"Yàoshì nǐ bù zhuānxīn guò mǎlù, wēixiǎn de shì jiù huì fāshēng.","en":"If you don’t cross the road carefully, something dangerous may happen."}]},{"id":526,"hanzi":"误会","part":"Noun/Verb","pinyin":"wùhuì","def":"misunderstanding, misunderstand","ex":[{"zh":"你们误会他了，他没有迟到。","py":"Nǐmen wùhuì tā le, tā méiyǒu chídào.","en":"You misunderstood him, he wasn’t late."},{"zh":"对不起，我们误会你了！","py":"Duìbùqǐ, wǒmen wùhuì nǐ le!","en":"I am sorry, we misunderstood you!"}]},{"id":527,"hanzi":"电脑","part":"Noun","pinyin":"diànnǎo","def":"computer","ex":[{"zh":"这台电脑是谁的？你知道吗？","py":"Zhè tái diànnǎo shì shéi de? Nǐ zhīdào ma?","en":"Whose computer is this? Do you know?"},{"zh":"我想买电脑，你有什么想法？","py":"Wǒ xiǎng mǎi diànnǎo, nǐ yǒu shénme xiǎngfǎ?","en":"I want to buy a computer, what do you think?"}]},{"id":528,"hanzi":"台","part":"Measure word","pinyin":"tái","def":"Measure word for vehicles or machines","ex":[{"zh":"这台电视是他的，但是坏了。","py":"Zhè tái diànshì shì tā de, dànshì huài le.","en":"This is his TV, but it’s broken."},{"zh":"他买了一台电脑，是新的。","py":"Tā mǎi le yī tái diànnǎo, shì xīn de.","en":"He bought a computer, which is brand new."}]},{"id":529,"hanzi":"打折","part":"Verb Object","pinyin":"dǎzhé","def":"to give a discount","ex":[{"zh":"今天百货公司在打折。","py":"Jīntiān bǎihuò gōngsī zài dǎzhé.","en":"It’s sales today in the department store."},{"zh":"打折以后是三百人民币。","py":"Dǎzhé yǐhòu shì sānbǎi rénmínbì.","en":"After the discount, it is three hundred RMB."}]},{"id":530,"hanzi":"陪","part":"Verb","pinyin":"péi","def":"to accompany, to keep somebody company","ex":[{"zh":"今天谢谢你陪我回家。","py":"Jīntiān xièxiè nǐ péi wǒ huí jiā.","en":"Thank you for walking me home today."},{"zh":"今天天气很好，他陪我走去学校。","py":"Jīntiān tiānqì hěn hǎo, tā péi wǒ zǒu qù xuéxiào.","en":"It was nice weather today and he accompanied with me to the school."}]},{"id":531,"hanzi":"银行","part":"Noun","pinyin":"yínháng","def":"bank","ex":[{"zh":"我明天会把钱拿去银行。","py":"Wǒ míngtiān huì bǎ qián ná qù yínháng.","en":"I'll bring the money to the bank tomorrow."},{"zh":"今天早上我去银行，发现银行没开门。","py":"Jīntiān zǎoshang wǒ qù yínháng, fāxiàn yínháng méi kāimén.","en":"I went to the bank this morning and found that it did not open."}]},{"id":532,"hanzi":"父母","part":"Noun","pinyin":"fùmǔ","def":"parents","ex":[{"zh":"这是我的父母，他们第一次来这间餐厅。","py":"Zhè shì wǒ de fùmǔ, tāmen dì yī cì lái zhè jiān cāntīng.","en":"They are my parents, it is their first time to come to this restaurant."},{"zh":"我的父母一直都很忙，我们很少一起吃饭。","py":"Wǒ de fùmǔ yīzhí dōu hěn máng, wǒmen hěn shǎo yīqǐ chīfàn.","en":"My parents are always busy, we rarely eat together."}]},{"id":533,"hanzi":"百货公司","part":"Noun","pinyin":"bǎihuò gōngsī","def":"department store","ex":[{"zh":"明天一起去百货公司看看。","py":"Míngtiān yīqǐ qù bǎihuò gōngsī kàn kàn.","en":"Let’s go to department store and look around tomorrow."},{"zh":"这间百货公司有很多日本商店。","py":"Zhè jiān bǎihuò gōngsī yǒu hěnduō rìběn shāng diàn.","en":"There are a lot of Japanese shops in this department store ."}]},{"id":534,"hanzi":"冰箱","part":"Noun","pinyin":"bīngxiāng","def":"refrigerator","ex":[{"zh":"冰箱里有很多牛奶，你可以喝。","py":"Bīngxiāng li yǒu hěnduō niúnǎi, nǐ kěyǐ hē.","en":"There are a lot of milk in the fridge, you can drink."},{"zh":"明天下午要去百货公司买冰箱。","py":"Míngtiān xiàwǔ yào qù bǎihuò gōngsī mǎi bīngxiāng.","en":"We will buy a fridge in department store tomorrow afternoon."}]},{"id":535,"hanzi":"二手","part":"Adj","pinyin":"èrshǒu","def":"second-hand (information, equipment etc)","ex":[{"zh":"这是一张二手沙发，但是看起来很新。","py":"Zhè shì yī zhāng èrshǒu shāfā, dànshì kàn qǐlái hěn xīn.","en":"This is a second hand sofa, but it looks new."},{"zh":"在哪里可以买二手冰箱？","py":"Zài nǎlǐ kěyǐ mǎi èrshǒu bīngxiāng?","en":"Where can I buy second-hand refrigerators?"}]},{"id":536,"hanzi":"原来","part":"Adj/Adv","pinyin":"yuánlái","def":"original, former","ex":[{"zh":"我原来的电脑坏了，所以买新的。","py":"Wǒ yuánlái de diànnǎo huài le, suǒyǐ mǎi xīn de.","en":"My old computer is broken, so I bought a new one."},{"zh":"原来放在这里的冰箱去哪里了？","py":"Yuánlái fàng zài zhèlǐ de bīngxiāng qù nǎlǐ le?","en":"Where is the refrigerator that I put here?"}]},{"id":537,"hanzi":"轻松","part":"Adj","pinyin":"qīngsōng","def":"relaxed,to relaxed","ex":[{"zh":"他的工作很轻松。","py":"Tā de gōngzuò hěn qīngsōng.","en":"His work is simple."},{"zh":"他觉得夏天旅游比冬天旅游轻松多了。","py":"Tā juéde xiàtiān lǚyóu bǐ dōngtiān lǚyóu qīngsōng duō le.","en":"He thinks traveling in summer is more relaxed than in winter."}]},{"id":538,"hanzi":"出发","part":"Verb","pinyin":"chūfā","def":"to set off, to start (on a journey)","ex":[{"zh":"明天九点从家里出发。","py":"Míngtiān jiǔ diǎn cóng jiā lǐ chūfā.","en":"He departs tomorrow at 9 am from home."},{"zh":"你要几点出发去公司呢？","py":"Nǐ yào jǐdiǎn chūfā qù gōngsī ne?","en":"What time do you want to go to the company?"}]},{"id":539,"hanzi":"历史","part":"Noun","pinyin":"lìshǐ","def":"history","ex":[{"zh":"这座城市有许多历史古迹。","py":"Zhè zuò chéngshì yǒu xǔduō lìshǐ ɡǔjì.","en":"The city has many historical monuments."},{"zh":"你听过哪些历史故事？","py":"Nǐ tīngguò nǎxiē lìshǐ gùshì.","en":"Which historical stories you’ve heard?"}]},{"id":540,"hanzi":"现代","part":"Noun/Adj","pinyin":"xiàndài","def":"modern times, modern age, modern era","ex":[{"zh":"你了解现代艺术吗？","py":"Nǐ liǎojiě xiàndài yìshù ma?","en":"Do you know about modern art?"},{"zh":"这座城市有很多现代风格的大楼。","py":"Zhè zuò chéngshì yǒu hěnduō xiàndài fēnggé de dàlóu.","en":"The city has many modern buildings."}]},{"id":541,"hanzi":"市中心","part":"Noun","pinyin":"shì zhōngxīn","def":"city center, downtown","ex":[{"zh":"明天十点我们出发去市中心。","py":"Míngtiān shí diǎn wǒmen chūfā qù shì zhōngxīn","en":"Tomorrow at ten a.m. we'll set off to the city center."},{"zh":"他家住在市中心里。","py":"Tā jiā zhù zài shì zhōngxīn lǐ.","en":"He lives in the city center."}]},{"id":542,"hanzi":"禁止","part":"Verb","pinyin":"jìnzhǐ","def":"to prohibit, to forbid, to ban","ex":[{"zh":"这里禁止吃东西。","py":"Zhèlǐ jìnzhǐ chī dōngxi.","en":"Eating is forbidden here."},{"zh":"公车里禁止大声说话。","py":"Gōngchē li jìnzhǐ dà shēng shuōhuà.","en":"Speaking loudly is forbidden on the bus."}]},{"id":543,"hanzi":"逛","part":"Verb","pinyin":"guàng","def":"to stroll, to visit","ex":[{"zh":"我最喜欢出门逛逛。","py":"Wǒ zuì xǐhuan chūmén guàng guàng.","en":"I like to go shopping."},{"zh":"明天我会去市场逛逛。","py":"Míngtiān wǒ huì qù shìchǎng guàng guàng.","en":"I will go to the market tomorrow."}]},{"id":544,"hanzi":"风格","part":"Noun","pinyin":"fēnggé","def":"style","ex":[{"zh":"这件衣服有中国的风格。","py":"Zhè jiàn yīfu yǒu Zhōngguó de fēnggé.","en":"This outfit is Chinese style."},{"zh":"我很喜欢现代风格的大楼。","py":"Wǒ hěn xǐhuan xiàndài fēnggé de dàlóu.","en":"I like the building with modern style."}]},{"id":545,"hanzi":"当然","part":"Adv","pinyin":"dāngrán","def":"certainly, of course","ex":[{"zh":"A: 我们可以谈一谈吗？ B: 当然！","py":"A: Wǒmen kěyǐ tán yī tán ma? B: Dāngrán!","en":"A: Can we talk? B: Of course."},{"zh":"我们当然要去美美的生日会啊！","py":"Wǒmen dāngrán yào qù Měiměi de shēngrì huì a!","en":"We certainly will go Meimei’s birthday party."}]},{"id":546,"hanzi":"迷路","part":"Verb Object","pinyin":"mílù","def":"to lose the way, lost,","ex":[{"zh":"因为我迷路，所以迟到了。","py":"Yīnwèi wǒ mílù, suǒyǐ chídàole.","en":"Because I was lost, I was late."},{"zh":"他昨天在百货公司里迷路。","py":"Tā zuótiān zài bǎihuò gōngsī lǐ mílù.","en":"He was lost in the department store yesterday."}]},{"id":547,"hanzi":"上车","part":"Verb Object","pinyin":"shàng chē","def":"to get on or into (a bus, train, car etc)","ex":[{"zh":"上车吧！我开车带你去公司。","py":"Shàng chē ba! Wǒ kāichē dài nǐ qù gōngsī.","en":"Get in the car, I will drive you to the office."},{"zh":"他上车以后发现坐错车了。","py":"Tā shàng chē yǐhòu fāxiàn zuò cuòchēle.","en":"He found out that he took a wrong bus only after got on the bus."}]},{"id":548,"hanzi":"晴天","part":"Noun","pinyin":"qíngtiān","def":"sunny day","ex":[{"zh":"你喜欢晴天还是雨天呢？","py":"Nǐ xǐhuan qíngtiān háishì yǔtiān ne?","en":"Do you like sunny or rainy days?"},{"zh":"今天是晴天，我们一起去走走吧！","py":"Jīntiān shì qíngtiān, wǒmen yīqǐ qù zǒu zǒu ba!","en":"Today is a sunny day. Let's go for a walk!"}]},{"id":549,"hanzi":"来不及","part":"Phrase","pinyin":"láibují","def":"there's not enough time (to do something), it's too late (to do something)","ex":[{"zh":"来不及了，快一点儿，要迟到了。","py":"Láibujíle, kuài yìdiǎnr, yào chídào le.","en":"It is too late. Hurry up. We are going to be late."},{"zh":"上班来不及了，快上车。","py":"Shàngbān láibujíle, kuài shàng chē.","en":"It’s almost late for work, get on the car quickly."}]},{"id":550,"hanzi":"然后","part":"Adv","pinyin":"ránhòu","def":"then, after that","ex":[{"zh":"煮火锅的方法不难。先把火打开，再把蔬菜、肉放进去锅子里，然后等一会儿就可以吃了。","py":"Zhǔ huǒguō de fāngfǎ bù nán. Xiān bǎ huǒ dǎkāi, zài bǎ shūcài, ròu fàng jìnqù guōzi lǐ, ránhòu děng yìhuǐr jiù kěyǐ chī le.","en":"It is not difficult to make hotpot. First, turn on the stove, then put vegetables and meats in the pot. After waiting for a while, you can eat it."},{"zh":"我喜欢先喝汽水跟汤，然后再吃饭。","py":"Wǒ xǐhuan xiān hē qìshuǐ gēn tāng, ránhòu zài chīfàn.","en":"I like to first drink soft drinks and soup, and then eat."}]},{"id":551,"hanzi":"赶快","part":"Adv","pinyin":"gǎnkuài","def":"at once, immediately","ex":[{"zh":"我们赶快走吧！要下雨了。","py":"Wǒmen gǎnkuài zǒu ba! Yào xià yǔle.","en":"Let's go! It is going to rain soon."},{"zh":"你看！公共汽车来了，赶快跑。","py":"Nǐ kàn! Gōnggòng qìchē lái le, gǎnkuài pǎo.","en":"Look! The bus is coming, run quickly."}]},{"id":552,"hanzi":"下车","part":"Verb Object","pinyin":"xiàchē","def":"to get off or out of (a bus, train, car etc)","ex":[{"zh":"你下车以后，往右拐。医院就在那儿。","py":"Nǐ xiàchē yǐhòu, wǎng yòu guǎi. Yīyuàn jiù zài nà'er.","en":"After you get off the bus, turn right. The hospital is right there."},{"zh":"赶快下车，大家都在等你呢！","py":"Gǎnkuài xià chē, dàjiā dōu zài děng nǐ ne!","en":"Get off quickly. Everyone is waiting for you!"}]},{"id":553,"hanzi":"急","part":"Adj","pinyin":"jí","def":"hurried, to make (somebody) anxious","ex":[{"zh":"这件事很急，我今天一定要做完。","py":"Zhè jiàn shì hěn jí, wǒ jīntiān yídìng yào zuò wán.","en":"This is urgent, I have to finish it today."},{"zh":"今天早上太晚起床，急得把衣服穿错了","py":"Jīntiān zǎoshang tài wǎn qǐchuáng, jí de bǎ yīfu chuān cuòle.","en":"I woke up too late today, I wore wrong clothes because i was in the hurry."}]},{"id":554,"hanzi":"弄","part":"Verb","pinyin":"nòng","def":"to do, to manage, to handle, to play with, to fool with, to mess with, to fix, to toy with","ex":[{"zh":"妈妈弄了一碗面。","py":"Māmā nòngle yī wǎn miàn.","en":"Mom made a bowl of noodles."},{"zh":"她把画弄坏了。","py":"Tā bǎ huà nòng huài le.","en":"She broke the painting."}]},{"id":555,"hanzi":"坏","part":"Adj","pinyin":"huài","def":"bad, spoiled, broken, to break down","ex":[{"zh":"他把东西弄坏了，妈妈很生气。","py":"Tā bǎ dōngxi nòng huài le, māma hěn shēngqì.","en":"He broke something, Mom is very angry."},{"zh":"这台电脑坏了，已经不能用了。","py":"Zhè tái diànnǎo huài le, yǐjīng bùnéng yòng le.","en":"This computer is broken. It can not work any more."}]},{"id":556,"hanzi":"生气","part":"Adj","pinyin":"shēngqì","def":"to get angry, angry","ex":[{"zh":"他看起来很生气，发生什么事了？","py":"Tā kàn qǐlái hěn shēngqì, fāshēng shénme shì le?","en":"He looks very angry. What happened?"},{"zh":"东西坏了，他很生气。","py":"Dōngxi huài le, tā hěn shēngqì.","en":"Something is broken, he is very angry."}]},{"id":557,"hanzi":"不小心","part":"Adj/Adv","pinyin":"bù xiǎoxīn","def":"heedless, careless","ex":[{"zh":"我不小心把东西打破了。","py":"Wǒ bù xiǎoxīn bǎ dōngxi dǎpò le.","en":"I accidentally broke something."},{"zh":"他不小心弄坏了椅子，妈妈很生气。","py":"Tā bù xiǎoxīn nòng huài le yǐzi,māma hěn shēngqì.","en":"He accidentally broke the chair. His mother was super angry."}]},{"id":558,"hanzi":"搬家","part":"Verb Object","pinyin":"bānjiā","def":"to move (house)","ex":[{"zh":"我昨天刚搬家，现在想去二手商店买一些东西。","py":"Wǒ zuótiān gāng bānjiā, xiànzài xiǎng qù èrshǒu shāngdiàn mǎi yīxiē dōngxi.","en":"I just moved yesterday, and now want to go to the second-hand shop to buy something."},{"zh":"谢谢你帮我搬家，我请你吃东西吧！","py":"Xièxiè nǐ bāng wǒ bānjiā, wǒ qǐng nǐ chī dōngxi ba!","en":"Thank you for helping me move. Let me treat you to a meal!"}]},{"id":559,"hanzi":"请客","part":"Verb Object","pinyin":"qǐngkè","def":"to treat, to invite to dinner","ex":[{"zh":"今天我请客，你想吃什么呢？","py":"Jīntiān wǒ qǐngkè, nǐ xiǎng chī shénme ne?","en":"Today is my treat, what do you want to eat?"},{"zh":"他昨天请客吗？你们去哪间餐厅吃呢？","py":"Tā zuótiān qǐngkè ma? Nǐmen qù nǎ jiān cāntīng chī ne?","en":"Did he treat yesterday? Which restaurant did you go to?"}]},{"id":560,"hanzi":"整理","part":"Verb","pinyin":"zhěnglǐ","def":"to arrange, to tidy up","ex":[{"zh":"把房间整理好，就可以吃晚餐。","py":"Bǎ fángjiān zhěnglǐ hǎo, jiù kěyǐ chī wǎncān.","en":"After tidying up the room, you can eat dinner."},{"zh":"你赶快整理东西，妈妈要回家了。","py":"Nǐ gǎnkuài zhěnglǐ dōngxi, māmā yào huí jiā le.","en":"Quickly tidy up your room, Mom is coming back home."}]},{"id":561,"hanzi":"扫地","part":"Verb Object","pinyin":"sǎodì","def":"to sweep the floor,","ex":[{"zh":"他喜欢扫地和整理房间。","py":"Tā xǐhuan sǎodì hé zhěnglǐ fángjiān.","en":"He likes to sweep and clean the room."},{"zh":"弟弟每个星期都帮妈妈扫地。","py":"Dìdi měi ge xīngqī dōu bāng māma sǎodì.","en":"My younger brother helps mother sweeping floor every week."}]},{"id":562,"hanzi":"打破","part":"Verb","pinyin":"dǎpò","def":"to break, to smash","ex":[{"zh":"他把我最喜欢的杯子打破了。","py":"Tā bǎ wǒ zuì xǐhuan de bēizi dǎpò le.","en":"My favorite mug was broken by him."},{"zh":"整理房间的时候，他不小心打破了东西。","py":"Zhěnglǐ fángjiān de shíhou, tā bù xiǎoxīn dǎpòle dōngxi.","en":"When cleaning the room, he accidentally broke something."}]},{"id":563,"hanzi":"丢","part":"Verb","pinyin":"diū","def":"to lose","ex":[{"zh":"我的手机丢了，我好难过。","py":"Wǒ de shǒujī diū le, wǒ hǎo nánguò.","en":"My cell phone is lost, I am so sad."},{"zh":"他怕丢钱。","py":"Tā pà diū qián.","en":"He is afraid of losing his money."}]},{"id":564,"hanzi":"出事","part":"Verb Object","pinyin":"chūshì","def":"to have an accident, to meet with a mishap","ex":[{"zh":"出事了，快打电话回家。","py":"Chūshì le, kuài dǎdiànhuà huí jiā.","en":"Something happened! Call home!"},{"zh":"为什么都不接电话，是不是出事了？","py":"Wèishénme dōu bù jiē diànhuà, shì búshì chūshì le?","en":"Why did you all not pick up the phone? Did something happen?"}]},{"id":565,"hanzi":"奇怪","part":"Adj","pinyin":"qíguài","def":"strange, odd","ex":[{"zh":"真奇怪，今天他没有来上班。","py":"Zhēn qíguài, jīntiān tā méiyǒu lái shàngbān.","en":"Really strange, today he did not come to work."},{"zh":"今天的天气很奇怪，刚是雨天，现在是晴天。","py":"Jīntiān de tiānqì hěn qíguài, gāng shì yǔtiān, xiànzài shì qíngtiān.","en":"The weather today is weird, It was just raining, and now is sunny day."}]},{"id":566,"hanzi":"糊涂","part":"Adj","pinyin":"hútú","def":"muddled, silly, confused","ex":[{"zh":"你真糊涂，手机不是在你的包包里吗？","py":"Nǐ zhēn hútú, shǒujī bùshì zài nǐ de bāo bāo lǐ ma?","en":"You're so confused, isn't your phone in your bag?"},{"zh":"我的弟弟很糊涂，常忘了带钱包出门。","py":"Wǒ de dìdì hěn hútú, cháng wàngle dài qiánbāo chūmén.","en":"My younger brother is very careless, he often forget to bring his wallet when go out."}]},{"id":567,"hanzi":"不见","part":"Adj","pinyin":"bújiàn","def":"to have disappeared, to be missing","ex":[{"zh":"我的手机不见了，快帮我找一找。","py":"Wǒ de shǒujī bújiànle, kuài bāng wǒ zhǎo yī zhǎo.","en":"My cell phone is gone, help me find it."},{"zh":"我买的鱼怎么不见了？","py":"Wǒ mǎi de yú zěnme bùjiàn le?","en":"Where's the fish I bought?"}]},{"id":568,"hanzi":"难过","part":"Adj","pinyin":"nánguò","def":"to feel sad, to feel unwell","ex":[{"zh":"我最喜欢的杯子被打破了，我很难过。","py":"Wǒ zuì xǐhuan de bēizi bèi dǎpòle, wǒ hěn nánguò.","en":"My favorite cup was broken, so I was very sad."},{"zh":"我的手机不见了，所以我很难过。","py":"Wǒ de shǒujī bùjiànle, suǒyǐ wǒ hěn nánguò.","en":"My cellphone is missing, so I am sad."}]},{"id":569,"hanzi":"好在","part":"Adv","pinyin":"hǎo zài","def":"luckily, fortunately","ex":[{"zh":"好在你找到了手机，没有手机真不方便。","py":"Hǎo zài nǐ zhǎodàole shǒujī, méiyǒu shǒujī zhēn bù fāngbiàn.","en":"Fortunately, you found your cell phone. It's really inconvenient without it."},{"zh":"好在我今天没出门，外面现在下大雨。","py":"Hǎo zài wǒ jīntiān méi chūmén, wàimiàn xiànzài xià dàyǔ.","en":"Luckily I didn’t go out today, it’s raining heavily outside."}]},{"id":570,"hanzi":"别急","part":"Phrase","pinyin":"bié jí","def":"Dont rush, dont be anxious","ex":[{"zh":"别急！时间还没到呢！你可以慢慢来。","py":"Bié jí! Shíjiān hái méi dào ne! Nǐ kěyǐ màn man lái.","en":"Do not worry! Time is not yet up! You can do slowly."},{"zh":"别急，你的汉语会慢慢进步的。","py":"Bié jí, nǐ de hànyǔ huì màn man jìnbù de.","en":"Don’t worry, your Chinese will improve gradually."}]},{"id":571,"hanzi":"小偷","part":"Noun","pinyin":"xiǎotōu","def":"thief","ex":[{"zh":"我看到小偷跑了，快打电话给警察。","py":"Wǒ kàn dào xiǎotōu pǎole, kuài dǎdiànhuà gěi jǐngchá.","en":"I saw the thief gone, call the police right now!"},{"zh":"昨天我家的东西都让小偷给偷了。","py":"Zuótiān wǒjiā de dōngxi dōu ràng xiǎotōu gěi tōule.","en":"My things are all stolen by thief yesterday."}]},{"id":572,"hanzi":"偷","part":"Verb","pinyin":"tōu","def":"to steal","ex":[{"zh":"我家的电视让小偷给偷了。","py":"Wǒjiā de diànshì ràng xiǎotōu gěi tōule.","en":"The thief stole my TV."},{"zh":"我放在桌上的电脑被偷了。","py":"Wǒ fàng zài zhuō shàng de diànnǎo bèi tōule.","en":"The computer I placed on the table was stolen."}]},{"id":573,"hanzi":"戴","part":"Verb","pinyin":"dài","def":"to put on or wear (glasses, hat, gloves etc)","ex":[{"zh":"那个人戴着红色的帽子，走得很快，太奇怪了。","py":"Nà gèrén dàizhe hóngsè de màozi, zǒu de hěn kuài, tài qíguài le.","en":"The man, who wore a red hat, walked very quickly. It was so strange."},{"zh":"如果不戴眼镜，我看不到老师写在黑板的字。","py":"Rúguǒ bú dài yǎnjìng, wǒ kàn bú dào lǎoshī xiě zài hēibǎn de zì.","en":"If I don’t wear glasses, I can’t see the words on the blackboard that are written by teacher."}]},{"id":574,"hanzi":"背","part":"Verb","pinyin":"bēi","def":"to carry on the back or shoulder","ex":[{"zh":"我背了太多东西，好重，你可以帮我吗？","py":"Wǒ bēi le tài duō dōngxi, hǎo zhòng, nǐ kěyǐ bāng wǒ ma?","en":"I'm carrying too many things with me. They are so heavy. Can you help me?"},{"zh":"今天我哥哥背着昨天买的新书包。","py":"Jīntiān wǒ gēgē bēi zhe zuótiān mǎi de xīn shūbāo.","en":"My brother is carrying the bag which he bought yesterday."}]},{"id":575,"hanzi":"帽子","part":"Noun","pinyin":"màozi","def":"hat, cap","ex":[{"zh":"这是我最喜欢的帽子，是我妈妈送给我的。","py":"Zhè shì wǒ zuì xǐhuan de màozi, shì wǒ māmā sòng gěi wǒ de.","en":"This is my favorite hat. My mother gave me this hat."},{"zh":"我每天都戴着帽子去上课。","py":"Wǒ měitiān dōu dàizhe màozi qù shàngkè.","en":"I wear hat to class every day."}]},{"id":576,"hanzi":"眼镜","part":"Noun","pinyin":"yǎnjìng","def":"spectacles, eyeglasses","ex":[{"zh":"这副眼镜，很漂亮，我很喜欢。","py":"Zhè fù yǎnjìng, hěn piàoliang, wǒ hěn xǐhuan.","en":"This glasses is beautiful. I like it so much."},{"zh":"放在洗手间的眼镜是谁的？","py":"Fàng zài xǐshǒujiān de yǎnjìng shì shéi de?","en":"Whose are the glasses left in the restroom?"}]},{"id":577,"hanzi":"背包","part":"Noun","pinyin":"bèibāo","def":"knapsack,backpack","ex":[{"zh":"这个背包是爸爸送给我的，我已经用了五年了。","py":"Zhège bēibāo shì bàba sòng gěi wǒ de, wǒ yǐjīng yòng le wǔ nián le.","en":"My father presented this backpack for me. I've already used for five years."},{"zh":"这个背包很大，能装很多东西。","py":"Zhège bēibāo hěn dà, néng zhuāng hěnduō dōngxi.","en":"This bag is really big, you can put a lot of things in it."}]},{"id":578,"hanzi":"鞋","part":"Noun","pinyin":"xié","def":"shoes","ex":[{"zh":"明天你陪我去百货公司买鞋吧！","py":"Míngtiān nǐ péi wǒ qù bǎihuò gōngsī mǎi xié ba!","en":"Tomorrow accompany me to the department store to buy shoes!"},{"zh":"穿这双鞋去公司不太合适。","py":"Chuān zhè shuāng xié qù gōngsī bù tài héshì.","en":"It’s not appropriate to wearing this shoes to the office."}]},{"id":579,"hanzi":"衬衫","part":"Noun","pinyin":"chènshān","def":"shirt, blouse","ex":[{"zh":"这件衬衫我在百货公司买的。","py":"Zhè jiàn chènshān wǒ zài bǎihuò gōngsī mǎi de.","en":"This shirt I bought in the department store."},{"zh":"我真糊涂，今天穿错衬衫去公司。","py":"Wǒ zhēn hútú, jīntiān chuān cuò chènshān qù gōngsī.","en":"How silly I am. I wore the wrong shirts to the office."}]},{"id":580,"hanzi":"裤子","part":"Noun","pinyin":"kùzi","def":"trousers, pants","ex":[{"zh":"这件裤子被他弄破了，妈妈很生气。","py":"Zhè jiàn kùzi bèi tā nòng pòle, māmā hěn shēngqì.","en":"This pants were broken by him, so my mother was very angry."},{"zh":"我昨天整理房间的时候，发现小时候穿过的裤子。","py":"Wǒ zuótiān zhěnglǐ fángjiān de shíhou, fāxiàn xiǎoshíhou chuānguò de kùzi.","en":"When I cleaned the room yesterday, I found the pants I had worn when I was little."}]},{"id":581,"hanzi":"双","part":"Measure word","pinyin":"shuāng","def":"a pair of","ex":[{"zh":"这里有好多鞋子，你喜欢哪一双鞋呢？","py":"Zhèlǐ yǒu hǎoduō xiézi, nǐ xǐhuan nǎ yī shuāng xié ne?","en":"There are a lot of shoes here, which pair of shoes do you like?"},{"zh":"这双筷子是我在北京买的。","py":"Zhè shuāng kuàizi shì wǒ zài běijīng mǎi de.","en":"I bought this pair of chopsticks in Beijing."}]},{"id":582,"hanzi":"跑","part":"Verb","pinyin":"pǎo","def":"to run","ex":[{"zh":"公共汽车要来了，快跑，上班来不及了。","py":"Gōnggòng qìchē yào láile, kuài pǎo, shàngbān láibují le.","en":"Bus is coming, we’re going to be late, run faster!"},{"zh":"晴天的时候，我喜欢到我家附近的公园跑一跑。","py":"Qíngtiān de shíhou, wǒ xǐhuan dào wǒjiā fùjìn de gōngyuán pǎo yī pǎo.","en":"In sunny day, I like to go running in the park where near my home."}]},{"id":583,"hanzi":"警察","part":"Noun","pinyin":"jǐngchá","def":"police, police officer","ex":[{"zh":"我迷路了，好在有警察的帮忙。","py":"Wǒ mílùle, hǎo zài yǒu jǐngchá de bāngmáng.","en":"I was lost, but fortunately, a police helped me."},{"zh":"警察先生，请问这附近的历史博物馆在哪儿？","py":"Jǐngchá xiānshēng, qǐngwèn zhè fùjìn de lìshǐ bówùguǎn zài nǎ'er?","en":"Police officer, May I ask where the nearby history museum is?"}]},{"id":584,"hanzi":"怪不得","part":"Phrase","pinyin":"guàibùdé","def":"no wonder!, so that's why!","ex":[{"zh":"原来今天是他的生日，怪不得他这么开心。","py":"Yuánlái jīntiān shì tā de shēngrì, guàibùdé tā zhème kāixīn.","en":"It is his birthday today. No wonder he is so happy."},{"zh":"我昨天喝酒喝太多，怪不得今天早上头痛。","py":"Wǒ zuótiān hējiǔ hē tài duō, guàibùdé jīntiān zǎoshang tóutòng.","en":"I drank too much yesterday, no wonder I have headache this morning."}]},{"id":585,"hanzi":"左右","part":"Adv","pinyin":"zuǒyòu","def":"approximately","ex":[{"zh":"我昨天十二点左右才睡。","py":"Wǒ zuótiān shí'èr diǎn zuǒyòu cái shuì.","en":"I slept at about twelve o'clock yesterday."},{"zh":"我学了三个月左右的汉语。","py":"Wǒ xuéle sān gè yuè zuǒyòu de hànyǔ.","en":"I have learned Chinese for about three months."}]},{"id":586,"hanzi":"比赛","part":"Noun","pinyin":"bǐsài","def":"competition (sports etc), match","ex":[{"zh":"今天晚上是足球比赛，你要一起看吗？","py":"Jīntiān wǎnshàng shì zúqiú bǐsài, nǐ yào yīqǐ kàn ma?","en":"Tonight is a football match, do you want to see it together?"},{"zh":"明天晚上比赛才开始，下班以后一起去酒吧看吧！","py":"Míngtiān wǎnshàng bǐsài cái kāishǐ, xiàbān yǐhòu yīqǐ qù jiǔbā kàn ba!","en":"The competition will begin tomorrow night. Let’s go watch the game at the bar after work!"}]},{"id":587,"hanzi":"赢","part":"Verb","pinyin":"yíng","def":"to beat, to win","ex":[{"zh":"我最喜欢的球队赢了，我太高兴了。","py":"Wǒ zuì xǐhuan de qiú duì yíngle, wǒ tài gāoxìngle.","en":"My favorite team won, I'm so happy"},{"zh":"我相信他们一定会赢。","py":"Wǒ xiāngxìn tāmen yídìng huì yíng.","en":"I believe they will win!"}]},{"id":588,"hanzi":"进球","part":"Verb Object","pinyin":"jìn qiú","def":"to score a goal","ex":[{"zh":"是他踢进球的，真的是太厉害了。","py":"Shì tā tī jìn qiú de, zhēn de shì tài lìhàile.","en":"It was his goal, he's really quite skilled."},{"zh":"进球了，我们赢了！","py":"Jìn qiúle, wǒmen yíngle!","en":"He scored the goal, we won!"}]},{"id":589,"hanzi":"秃","part":"Adj","pinyin":"tū","def":"bald","ex":[{"zh":"他的头有点儿秃，但是很帅。","py":"Tā de tóu yǒudiǎnr tū, dànshì hěn shuài.","en":"His head is a bit bald, but he is still handsome."},{"zh":"我的爸爸头有点儿秃。","py":"Wǒ de bàba tóu yǒudiǎn er tū.","en":"My father is a little bald."}]},{"id":590,"hanzi":"魅力","part":"Noun","pinyin":"mèilì","def":"charming","ex":[{"zh":"这个男人很有魅力，大家都很喜欢他。","py":"Zhège nánrén hěn yǒu mèilì, dàjiā dōu hěn xǐhuan tā.","en":"This man is very attractive, we all like him."},{"zh":"他笑起来很有魅力。","py":"Tā xiào qǐlái hěn yǒu mèilì.","en":"He is very charming when he smiles."}]},{"id":591,"hanzi":"球星","part":"Noun","pinyin":"qiúxīng","def":"sports star (ball sport)","ex":[{"zh":"这是我最喜欢的球星，他很厉害。","py":"Zhè shì wǒ zuì xǐhuan de qiúxīng, tā hěn lìhài.","en":"This is my favorite star, he is very powerful."},{"zh":"虽然这位球星不高，可是非常有魅力。","py":"Suīrán zhè wèi qiúxīng bù gāo, kěshì fēicháng yǒu mèilì.","en":"He is not tall, but he is very attractive."}]},{"id":592,"hanzi":"经过","part":"Verb","pinyin":"jīngguò","def":"to pass","ex":[{"zh":"昨天经过学校的时候，我看见美美在打篮球。","py":"Zuótiān jīngguò xuéxiào de shíhou, Wǒ kànjiàn Měiměi zài dǎ lánqiú.","en":"I saw Meimei playing basketball when I passing our school yesterday."},{"zh":"我每天去学校都会经过一家很漂亮的咖啡店。","py":"Wǒ měitiān qù xuéxiào dūhuì jīngguò yījiā hěn piàoliang de kāfēi diàn.","en":"I pass a beautiful coffee shop every day on the way to school."}]},{"id":593,"hanzi":"圆","part":"Adj","pinyin":"yuán","def":"round shape","ex":[{"zh":"这张桌子是圆的，我很喜欢。","py":"Zhè zhāng zhuōzi shì yuán de, wǒ hěn xǐhuan.","en":"This table is round shape and I like it."},{"zh":"他的脸圆圆的，很好看。","py":"Tā de liǎn yuán yuán de, hěn hǎokàn.","en":"His face is round and nice-looking."}]},{"id":594,"hanzi":"丈夫","part":"Noun","pinyin":"zhàngfu","def":"husband","ex":[{"zh":"那位穿白衬衫的是我的丈夫。","py":"Nà wèi chuān bái chènshān de shì wǒ de zhàngfu.","en":"That man with white shirts is my husband."},{"zh":"我的丈夫是导游。","py":"Wǒ de zhàngfu shì dǎoyóu.","en":"My husband is a tour guide."}]},{"id":595,"hanzi":"位","part":"Measure word","pinyin":"wèi","def":"measure word for people (honorific)","ex":[{"zh":"那位戴红色的帽子的男生是我的弟弟。","py":"Nà wèi dài hóngsè de màozi de nánshēng shì wǒ de dìdi.","en":"That man who is wearing a red hat is my younger brother."},{"zh":"今天有几位同事要一起去看电影呢？","py":"Jīntiān yǒu jǐ wèi tóngshì yào yīqǐ qù kàn diànyǐng ne?","en":"How many colleagues are going to watch movies today?"}]},{"id":596,"hanzi":"眼睛","part":"Noun","pinyin":"yǎnjīng","def":"eye","ex":[{"zh":"他的眼睛圆圆的，很漂亮。","py":"Tā de yǎnjīng yuán yuán de, hěn piàoliang.","en":"His eyes are round and pretty."},{"zh":"他的眼睛是蓝色的。","py":"Tā de yǎnjīng shì lánsè de.","en":"His eyes are blue."}]},{"id":597,"hanzi":"妻子","part":"Noun","pinyin":"qīzi","def":"wife","ex":[{"zh":"我的妻子喜欢吃蛋糕。","py":"Wǒ de qīzi xǐhuan chī dàngāo.","en":"My wife likes to eat cakes."},{"zh":"我的妻子是长头发。","py":"Wǒ de qīzi shì zhǎng tóufǎ .","en":"My wife is long hair."}]},{"id":598,"hanzi":"脸","part":"Noun","pinyin":"liǎn","def":"face","ex":[{"zh":"这位脸红红的，笑得很开心的是谁？","py":"Zhè wèi liǎnhóng hóng de, xiào de hěn kāixīn de shì shéi?","en":"Who is this with a red and laughing face?"},{"zh":"你的脸怎么了？","py":"Nǐ de liǎn zěnmele?","en":"What's wrong with your face?"}]},{"id":599,"hanzi":"个子","part":"Noun","pinyin":"gèzi","def":"height, stature","ex":[{"zh":"爸爸的个子高高的，脸胖胖的。","py":"Bàba de gèzi gāo gāo de, liǎn pàng pàng de.","en":"Daddy is tall, and his face is fat."},{"zh":"他的个子好高。","py":"Tā de gèzi hào gāo.","en":"He is tall."}]},{"id":600,"hanzi":"先生","part":"Noun","pinyin":"xiānsheng","def":"Mr., husband","ex":[{"zh":"我的先生在医院工作。","py":"Wǒ de xiānshēng zài yīyuàn gōngzuò.","en":"My husband works in the hospital."},{"zh":"这位先生瘦瘦的，头发长长的。","py":"Zhè wèi xiānshēng shòu shòu de, tóufà zhǎng zhǎng de.","en":"The gentleman is thin and long hair."}]},{"id":601,"hanzi":"差不多","part":"Adv","pinyin":"chàbùduō","def":"almost, nearly","ex":[{"zh":"从我家到历史博物馆走路差不多十分钟。","py":"Cóng wǒjiā dào lìshǐ bówùguǎn zǒulù chàbùduō shí fēnzhōng.","en":"It takes about ten minutes walk from my home to history museum."},{"zh":"你的哥哥跟你差不多高。","py":"Nǐ dí gēgē gēn nǐ chàbùduō gāo.","en":"Your brother is almost as tall as you."}]},{"id":602,"hanzi":"厉害","part":"Adj","pinyin":"lìhài","def":"tremendous, awesome","ex":[{"zh":"他学汉语才三个月，就这么厉害了。","py":"Tā xué hànyǔ cái sān gè yuè, jiù zhème lìhàile.","en":"He learned Chinese only three months but he is good at it."},{"zh":"你很厉害，这么难的汉字都会写。","py":"Nǐ hěn lìhài, zhème nán de hànzì dūhuì xiě.","en":"It's so amazing that you could write such a difficult Chinese character."}]},{"id":603,"hanzi":"听力","part":"Noun","pinyin":"tīnglì","def":"listening skill/ hearing","ex":[{"zh":"我的听力不好，也很怕跟中国人说话。","py":"Wǒ de tīnglì bù hǎo, yě hěn pà gēn Zhōngguó rén shuōhuà.","en":"My hearing is not good, and very afraid to talk with Chinese people."},{"zh":"你平常怎么练习听力的？","py":"Nǐ píngcháng zěnme liànxí tīnglì de?","en":"How do you practice your listening?"}]},{"id":604,"hanzi":"努力","part":"Adj/Adv","pinyin":"nǔlì","def":"great effort, to try hard","ex":[{"zh":"因为想去中国，所以他每天都努力学习汉语。","py":"Yīnwèi xiǎng qù Zhōngguó, suǒyǐ tā měitiān dū nǔlì xuéxí hànyǔ.","en":"Because he wanted to go to China, so he worked hard every day to learn Chinese."},{"zh":"每天努力学习，多练习就会很厉害了。","py":"Měitiān nǔlì xuéxí, duō liànxí jiù huì hěn lìhàile.","en":"Study hard and practice every day then you will be good at it."}]},{"id":605,"hanzi":"进步","part":"Verb","pinyin":"jìnbù","def":"to improve, to get ahead","ex":[{"zh":"你的汉语怎么进步这么快？跟谁学的？","py":"Nǐ de hànyǔ zěnme jìnbù zhème kuài? Gēn shéi xué de?","en":"How did your Chinese improve so fast? Who did you study with?"},{"zh":"每天努力学习，就会进步很快了，不要担心。","py":"Měitiān nǔlì xuéxí, jiù huì jìnbù hěn kuàile, bùyào dānxīn.","en":"You will make progress quickly if you study hard every day, don't worry."}]},{"id":606,"hanzi":"紧张","part":"Adj","pinyin":"jǐnzhāng","def":"nervous","ex":[{"zh":"你不要紧张，妈妈很快就会来接你了。","py":"Nǐ búyào jǐnzhāng, māmā hěn kuài jiù huì lái jiē nǐle.","en":"You shouldn't be nervous, Mom will come to pick you up soon."},{"zh":"我每次跟中国人说话都会紧张，你会吗？","py":"Wǒ měi cì gēn Zhōngguó rén shuōhuà dūhuì jǐnzhāng, nǐ huì ma?","en":"Every time I talk to the Chinese people, I get nervous. how 'bout you?"}]},{"id":607,"hanzi":"难","part":"Adj","pinyin":"nán","def":"difficult","ex":[{"zh":"这个汉字很难，我写了好久还是不会。","py":"Zhège hànzì hěn nán, wǒ xiěle hǎojiǔ háishì bú huì.","en":"This Chinese character is very difficult, I've been writing it for a long time but I can't master it."},{"zh":"你觉得汉语难吗？为什么？","py":"Nǐ juéde hànyǔ nán ma? Wèishénme?","en":"Do you think Chinese is difficult? Why?"}]},{"id":608,"hanzi":"容易","part":"Adj","pinyin":"róngyì","def":"easy","ex":[{"zh":"这个汉字非常容易，你一定也会写。","py":"Zhège hànzì fēicháng róngyì, nǐ yídìng yě huì xiě.","en":"This character is very easy, you definitely could write it."},{"zh":"这个字真不容易写。","py":"Zhège zì zhēn bù róngyì xiě.","en":"The word is not easy to write."}]},{"id":609,"hanzi":"过","part":"Verb","pinyin":"guò","def":"to pass","ex":[{"zh":"你每天多看多听和多说，过不久汉语就会进步了。","py":"Nǐ měitiān duō kàn duō tīng hé duō shuō,guò bu jiǔ hànyǔ jiù huì jìnbùle.","en":"If you read more, listen more and speak more every day, soon your Chinese will progress."},{"zh":"时间过得真慢，现在才三点","py":"Shíjiānguò de zhēn màn, xiànzài cái sān diǎn.","en":"Time pass so slowly that now is only three o'clock."}]},{"id":610,"hanzi":"明白","part":"Verb","pinyin":"míngbái","def":"to understand, to realize","ex":[{"zh":"你听明白老师说什么了吗？请再说一次。","py":"Nǐ tīng míngbái lǎoshī shuō shénmeliǎo ma? Qǐng zàishuō yīcì.","en":"Did you understand what the teacher said? Please say that again."},{"zh":"我已经说得很明白了，今天八点见，为什么你还是迟到了？","py":"Wǒ yǐjīng shuō de hěn míngbáile, jīntiān bā diǎn jiàn, wèishénme nǐ háishì chídào le?","en":"I had said so clear that we meet at eight o'clock today, why are you still late?"}]},{"id":611,"hanzi":"认为","part":"Verb","pinyin":"rènwéi","def":"to believe, to think","ex":[{"zh":"在中国认为八是吉利的数字，所以大家都喜欢。","py":"Zài Zhōngguó rènwéi bā shì jílì de shùzì, suǒyǐ dàjiā dōu xǐhuān.","en":"In China, eight is an auspicious number, so we all like it."},{"zh":"你认为在哪儿学汉语最好？","py":"Nǐ rènwéi zài nǎ'er xué hànyǔ zuì hǎo?","en":"Where do you think is the best place to learn Chinese?"}]},{"id":612,"hanzi":"吉利","part":"Adj","pinyin":"jílì","def":"auspicious, lucky, propitious","ex":[{"zh":"我很喜欢九，因为长长久久，听起来很吉利。","py":"Wǒ hěn xǐhuan jiǔ, yīnwèi cháng cháng jiǔ jiǔ, tīng qǐlái hěn jílì.","en":"I like ''nine'' very much. Because it has the same sound as the word ''long'' in Chinese, it sounds very lucky."},{"zh":"妈妈认为打破杯子很不吉利。","py":"Māmā rènwéi dǎpò bēizi hěn bù jílì.","en":"Mom thought it was unlucky when the cup be broken."}]},{"id":613,"hanzi":"发财","part":"Verb Object","pinyin":"fācái","def":"to get rich","ex":[{"zh":"他每天只想着发财，但是不努力工作。","py":"Tā měitiān zhǐ xiǎngzhe fācái, dànshì bù nǔlì gōngzuò.","en":"He only wants to make a fortune every day, but he does not work hard."},{"zh":"在中国，数字八听起来就跟发财的意思是一样的。","py":"Zài Zhōngguó, shùzì bā tīng qǐlái jiù gēn fācái de yìsi shì yīyàng de.","en":"In China, the number eight has the similar sound as the word ''making a fortune'' in Chinese, so people regard the number eight as the meaning of fortunate."}]},{"id":614,"hanzi":"数字","part":"Noun","pinyin":"shùzì","def":"number","ex":[{"zh":"你看得到那张纸上的数字是三还是二吗？","py":"Nǐ kàn dédào nà zhāng zhǐ shàng de shùzì shì sān háishì èr ma?","en":"Can you see that number on the sheet is three or two?"},{"zh":"我最喜欢数字九，你喜欢那个数字呢？","py":"Wǒ zuì xǐhuan shùzì jiǔ, nǐ xǐhuan nàgè shùzì ne?","en":"I like the number nine, do you like that number?"}]},{"id":615,"hanzi":"意思","part":"Noun","pinyin":"yìsi","def":"meaning","ex":[{"zh":"你知道这个汉字的意思吗？请说一说。","py":"Nǐ zhīdào zhège hànzì de yìsi ma? Qǐng shuō yì shuō.","en":"Do you know the meaning of this Chinese character? Please talk about it."},{"zh":"你明白他说的意思吗?","py":"Nǐ míngbái tā shuō de yìsi ma?","en":"Do you understand what he meant?"}]},{"id":616,"hanzi":"友谊","part":"Noun","pinyin":"yǒuyì","def":"friendship","ex":[{"zh":"你认为友谊重要吗？","py":"Nǐ rènwéi yǒuyì zhòngyào ma?","en":"Do you think friendship is important?"},{"zh":"友谊对我很重要。","py":"Yǒuyì duì wǒ hěn zhòngyào.","en":"Friendship is important to me."}]},{"id":617,"hanzi":"活","part":"Verb","pinyin":"huó","def":"to live, alive","ex":[{"zh":"这只猫活了十多年了，到现在身体还很好。","py":"Zhè zhī māo huó le shí duō nián le, dào xiànzài shēntǐ hái hěn hǎo.","en":"The cat lived for more than a decade, and still now its health is good."},{"zh":"中国人喜欢九，因为希望活得很久。","py":"Zhōngguó rén xǐhuan jiǔ, yīnwèi xīwàng huó de hěnjiǔ.","en":"Chinese people like the number nine, because they hope to live a long time."}]},{"id":618,"hanzi":"约会","part":"Verb Object","pinyin":"yuēhuì","def":"to have a date","ex":[{"zh":"你昨天跟女朋有去哪儿约会呢？","py":"Nǐ zuótiān gēn nǚ péng yǒu qù nǎ‘er yuēhuì ne？","en":"Did you have a date with your girlfriend?"},{"zh":"情人节你去哪儿约会？","py":"Qíngrén jié nǐ qù nǎ'er yuēhuì?","en":"Where do you go to on Valentine's Day?"}]},{"id":619,"hanzi":"预订","part":"Verb","pinyin":"yùdìng","def":"to place an order, to book ahead","ex":[{"zh":"你打电话预订餐厅了吗？","py":"Nǐ dǎdiànhuà yùdìng cāntīngle ma?","en":"Have you ordered a meal at the restaurant?"},{"zh":"我已经预订餐厅了，七点去接你。","py":"Wǒ yǐjīng yùdìng cāntīngle, qī diǎn qù jiē nǐ.","en":"I have booked the restaurant, I'll pick you up at seven."}]},{"id":620,"hanzi":"餐厅","part":"Noun","pinyin":"cāntīng","def":"restaurant","ex":[{"zh":"这家餐厅在这座城市很有名。","py":"Zhè jiā cāntīng zài zhè zuò chéngshì hěn yǒumíng.","en":"This restaurant is famous in the city."},{"zh":"我们今天去餐厅吃美食。","py":"Wǒmen jīntiān qù cāntīng chī měishí.","en":"We went to the restaurant for a meal today."}]},{"id":621,"hanzi":"准时","part":"Adj/Adv","pinyin":"zhǔnshí","def":"on time, punctual, on schedule","ex":[{"zh":"他每天都准时七点钟出门。","py":"Tā měitiān dū zhǔnshí qī diǎn zhōng chūmén.","en":"He goes out every day at seven o'clock."},{"zh":"今天晚上八点请准时到百货公司门口。","py":"Jīntiān wǎnshàng bā diǎn qǐng zhǔnshí dào bǎihuò gōngsī ménkǒu.","en":"Please arrive the department store at eight o'clock this evening."}]},{"id":622,"hanzi":"笑","part":"Verb","pinyin":"xiào","def":"to laugh, to smile","ex":[{"zh":"她笑起来很漂亮，大家都很喜欢她。","py":"Tā xiào qǐlái hěn piàoliang, dàjiā dōu hěn xǐhuan tā.","en":"Her smiles beautifully, everyone really likes her."},{"zh":"他很喜欢笑，人也很好。","py":"Tā hěn xǐ huān xiào, rén yě hěn hǎo.","en":"He likes to laugh, and he is friendly."}]},{"id":623,"hanzi":"门口","part":"Noun","pinyin":"ménkǒu","def":"doorway, gate","ex":[{"zh":"我在餐厅门口等你很久了，你怎么还不来？","py":"Wǒ zài cāntīng ménkǒu děng nǐ hěnjiǔ le, nǐ zěnme hái bù lái?","en":"I am waiting for you at the door of the restaurant for a long time, why don't you come?"},{"zh":"今天五点在银行门口见。","py":"Jīntiān wǔ diǎn zài yínháng ménkǒu jiàn.","en":"See you at the door of the bank at five o'clock today."}]},{"id":624,"hanzi":"家","part":"Measure word","pinyin":"jiā","def":"Measure word for families or businesses,","ex":[{"zh":"这家餐厅的蛋糕很好吃。","py":"Zhè jiā cāntīng de dàngāo hěn hǎochī.","en":"The cake of this restaurant is delicious."},{"zh":"这家百货公司的美食很有名。","py":"Zhè jiā bǎihuò gōngsī de měishí hěn yǒumíng.","en":"The food of this department store is famous."}]},{"id":625,"hanzi":"情人节","part":"Noun","pinyin":"qíngrén jié","def":"Valentine's Day","ex":[{"zh":"你知道中国的情人节是几月几号吗？","py":"Nǐ zhīdào Zhōngguó de qíngrén jié shì jǐ yuè jǐ hào ma?","en":"Do you know what date is Chinese Valentine’s day?"},{"zh":"今天是情人节，我们去吃饭吧！","py":"Jīntiān shì qíngrén jié, wǒmen qù chīfàn ba!","en":"Today is Valentine's Day, let’s have a meal!"}]},{"id":626,"hanzi":"一下儿","part":"Phrase","pinyin":"yīxià er","def":"(used after a verb) in a while, give it a try","ex":[{"zh":"因为今天你生日，所以我们去酒吧庆祝一下儿吧！","py":"Yīnwèi jīntiān nǐ shēngrì, suǒyǐ wǒmen qù jiǔbā qìngzhù yīxiàr ba!","en":"Because today's your birthday, let’s go to a bar to celebrate a bit!"},{"zh":"你等一下儿，我现在就从百货公司出来。","py":"Nǐ děng yīxiàr, wǒ xiànzài jiù cóng bǎihuò gōngsī chūlái.","en":"Wait a minute, now I come out from the department store."}]},{"id":627,"hanzi":"庆祝","part":"Verb","pinyin":"qìngzhù","def":"to celebrate","ex":[{"zh":"今年的生日，你想要怎么庆祝呢？","py":"Jīnnián de shēngrì, nǐ xiǎng yào zěnme qìngzhù ne?","en":"For your birthday this year, how do you want to celebrate?"},{"zh":"我找到工作了，一起出来庆祝吧！","py":"Wǒ zhǎodào gōngzuò le, yìqǐ chūlái qìngzhù ba!","en":"I got a job. Let's celebrate!"}]},{"id":628,"hanzi":"同事","part":"Noun","pinyin":"tóngshì","def":"colleague, co-worker","ex":[{"zh":"这是我的新同事，他是中国人。","py":"Zhè shì wǒ de xīn tóngshì, tā shì Zhōngguó rén.","en":"This is my new colleague, he is Chinese."},{"zh":"今天我和同事一起去酒吧庆祝生日。","py":"Jīntiān wǒ hé tóngshì yìqǐ qù jiǔbā qìngzhù shēngrì.","en":"Today I went to the bar with my colleagues to celebrate my birthday."}]},{"id":629,"hanzi":"找到","part":"Verb","pinyin":"zhǎodào","def":"to find","ex":[{"zh":"我找到新工作了，明天就开始上班。","py":"Wǒ zhǎodào xīn gōngzuò le, míngtiān jiù kāishǐ shàngbān.","en":"I found a new job and will start working tomorrow."},{"zh":"我好不容易找到这张特别的椅子，别再弄坏了。","py":"Wǒ hǎobù róngyì zhǎodào zhè zhāng tèbié de yǐzi, bié zài nòng huài le.","en":"It's not easy to find this chair, please do not break it again."}]},{"id":630,"hanzi":"恭喜","part":"Phrase","pinyin":"gōngxǐ","def":"congratulations","ex":[{"zh":"恭喜你买到最喜欢的电脑了。","py":"Gōngxǐ nǐ mǎi dào zuì xǐhuan de diànnǎo le.","en":"Congratulations on buying your favorite computer."},{"zh":"恭喜你找到工作了。","py":"Gōngxǐ nǐ zhǎodào gōngzuò le.","en":"Congratulations! You found a job!"}]},{"id":631,"hanzi":"下班","part":"Verb Object","pinyin":"xiàbān","def":"to finish work, to get off work","ex":[{"zh":"今天下班后，我们一起去百货公司吧！","py":"Jīntiān xiàbān hòu, wǒmen yīqǐ qù bǎihuò gōngsī ba!","en":"Today after work, let's go to a department store together!"},{"zh":"你昨天下班以后，去了哪里？","py":"Nǐ zuótiān xiàbān yǐhòu, qù le nǎlǐ?","en":"Where did you go after work yesterday?"}]},{"id":632,"hanzi":"环境","part":"Noun","pinyin":"huánjìng","def":"environment, circumstances, surroundings","ex":[{"zh":"这间公司的环境很好，我很喜欢。","py":"Zhè jiān gōngsī de huánjìng hěn hǎo, wǒ hěn xǐhuan.","en":"The company's environment is very good, I like it."},{"zh":"你觉得这座城市的环境怎么样？","py":"Nǐ juéde zhè zuò chéngshì de huánjìng zěnmeyàng?","en":"What do you think of the city's environment?"}]},{"id":633,"hanzi":"导游","part":"Noun","pinyin":"dǎoyóu","def":"tour guide","ex":[{"zh":"他的工作是导游。","py":"Tā de gōngzuò shì dǎoyóu.","en":"His job is a tour guide."},{"zh":"导游的工作不容易做。","py":"Dǎoyóu de gōngzuò bù róngyì zuò.","en":"Guide work is not easy to do."}]},{"id":634,"hanzi":"美食","part":"Noun","pinyin":"měishí","def":"culinary delicacy, fine food","ex":[{"zh":"我喜欢吃美食。","py":"Wǒ xǐhuan chī měishí.","en":"I like to eat fine foods."},{"zh":"你喜欢吃美食吗？","py":"Nǐ xǐhuan chī měishí ma?","en":"Do you like delicacies?"}]},{"id":635,"hanzi":"读书","part":"Verb Object","pinyin":"dúshū","def":"to read a book, to study, to attend school","ex":[{"zh":"熬夜读书对身体不好。","py":"Áoyè dúshū duì shēntǐ bù hǎo.","en":"It’s not healthy to stay up that late reading."},{"zh":"我喜欢在图书馆读书，家里太吵了。","py":"Wǒ xǐhuan zài túshūguǎn dúshū, jiā lǐ tài chǎo le.","en":"I like to read in library, my house is too noisy."}]},{"id":636,"hanzi":"杂志","part":"Noun","pinyin":"zázhì","def":"magazine","ex":[{"zh":"我的妈妈喜欢读健康杂志。","py":"Wǒ de māma xǐhuan dú jiànkāng zázhì.","en":"My mom likes to read health magazine."},{"zh":"这本杂志卖得很好。","py":"Zhè běn zázhì mài de hěn hǎo.","en":"This magazine sells well."}]},{"id":637,"hanzi":"躺","part":"Verb","pinyin":"tǎng","def":"to recline, to lie down","ex":[{"zh":"我有点儿不舒服，我躺下来休息一会儿吧。","py":"Wǒ yǒu diǎn'er bù shūfu, wǒ tǎng xiàlái xiūxí yìhuǐr ba.","en":"I am not feeling well, let me lie down and take a break."},{"zh":"别躺着用手机，对身体不好。","py":"Bié tǎng zhe yòng shǒujī, duì shēntǐ bù hǎo.","en":"Don’t use your phone while lying down, it’s bad for your health."}]},{"id":638,"hanzi":"睡着","part":"Verb","pinyin":"shuìzháo","def":"to fall asleep","ex":[{"zh":"昨天上课的时候，我不小心睡着了。","py":"Zuótiān shàngkè de shíhou, wǒ bù xiǎoxīn shuìzháo le.","en":"When taking class yesterday, I accidentally fell asleep."},{"zh":"今天喝太多咖啡，凌晨三点才睡着。","py":"Jīntiān hē tài duō kāfēi, língchén sān diǎn cái shuìzháo.","en":"I drank too much coffee today, so I was only able to sleep at three in the morning."}]},{"id":639,"hanzi":"咳嗽","part":"Verb","pinyin":"késou","def":"to cough","ex":[{"zh":"医生，我有点儿咳嗽。","py":"Yīshēng, wǒ yǒudiǎn'er késou.","en":"Doctor, I have a bit of a cough."},{"zh":"我咳嗽得很厉害。","py":"Wǒ késou de hěn lìhài.","en":"I have a really bad cough."}]},{"id":640,"hanzi":"结果","part":"Conj","pinyin":"jiéguǒ","def":"in the end","ex":[{"zh":"我今天喝太多茶了，结果晚上都睡不着。","py":"Wǒ jīntiān hē tài duō chá le, jiéguǒ wǎnshàng dōu shuì bù zháo.","en":"I drank too many cups of tea today, I couldn’t fall asleep at night."},{"zh":"我昨天熬夜念书，结果今天迟到了。","py":"Wǒ zuótiān áoyè niànshū, jiéguǒ jīntiān chídào le.","en":"I stayed up late for studying yesterday, I end up being late today."}]},{"id":641,"hanzi":"整个","part":"Measure word","pinyin":"zhěnggè","def":"whole","ex":[{"zh":"因为今天要考试，我昨天整个晚上都在念书。","py":"Yīnwèi jīntiān yào kǎoshì, wǒ zuótiān zhěnggè wǎnshàng dōu zài niànshū.","en":"Because there is an exam today, I studied whole night yesterday."},{"zh":"她整个月都不在中国。","py":"Tā zhěnggè yuè dōu búzài Zhōngguó.","en":"She is not in China this whole month."}]},{"id":642,"hanzi":"糟糕","part":"Phrase","pinyin":"zāogāo","def":"how terrible, what bad luck, terrible, bad","ex":[{"zh":"真糟糕，我忘记带钱，不能买晚餐了。","py":"Zhēn zāogāo, wǒ wàngjì dài qián, bùnéng mǎi wǎncān le.","en":"It's too bad! I forgot to bring money with me so that I can not buy dinner."},{"zh":"他迟到了，真是太糟糕了。","py":"Tā chídào le, zhēnshi tài zāogāo le.","en":"He was late, is really too bad."}]},{"id":643,"hanzi":"感动","part":"Adj","pinyin":"gǎndòng","def":"to be touched (somebody emotionally)","ex":[{"zh":"他收到你的礼物，一定会很感动。","py":"Tā shōudào nǐ de lǐwù, yídìng huì hěn gǎndòng.","en":"He will be very touched by the gift you prepared."},{"zh":"谢谢你的蛋糕，我太感动了。","py":"Xièxiè nǐ de dàngāo, wǒ tài gǎndòng le.","en":"Thank you for your cake, I was so touched."}]},{"id":644,"hanzi":"遗憾","part":"Adj","pinyin":"yíhàn","def":"regret, to regret, to be sorry that","ex":[{"zh":"没和他一起去中国玩，我觉得有点儿遗憾。","py":"Méi hé tā yìqǐ qù Zhōngguó wán, wǒ juéde yǒudiǎn'er yíhàn.","en":"I did not go China with him, I feel a little regret."},{"zh":"来到中国，没吃到美食，真是太遗憾了。","py":"Lái dào Zhōngguó, méi chī dào měishí, zhēnshi tài yíhàn le.","en":"It's really regretful that I didn't eat the Chinese delicacy in China."}]},{"id":645,"hanzi":"见面","part":"Verb Object","pinyin":"jiànmiàn","def":"to meet, to see each other","ex":[{"zh":"明天一点在银行门口见面，不要忘了。","py":"Míngtiān yìdiǎn zài yínháng ménkǒu jiànmiàn, búyào wàngle.","en":"Meet tomorrow at the bank door, do not forget."},{"zh":"我跟他约在百货公司见面。","py":"Wǒ gēn tā yuē zài bǎihuò gōngsī jiànmiàn.","en":"I told him about the department store."}]},{"id":646,"hanzi":"聚会","part":"Noun/Verb","pinyin":"jùhuì","def":"party, gathering","ex":[{"zh":"他的生日聚会你会来吗？","py":"Tā de shēngrì jùhuì nǐ huì lái ma?","en":"Will you come from his birthday party?"},{"zh":"下个星期天，我有一个聚会。","py":"Xià gè xīngqītiān, wǒ yǒu yīgè jùhuì.","en":"Next Sunday, I have a party."}]},{"id":647,"hanzi":"联系","part":"Verb","pinyin":"liánxì","def":"to get in touch with, to contact, to link","ex":[{"zh":"我跟他已经三年没有联系了。","py":"Wǒ gēn tā yǐjīng sānnián méiyǒu liánxìle.","en":"I have not been in contact with him for three years."},{"zh":"要记得联系大家，下个星期天到餐厅聚会。","py":"Yào jìde liánxì dàjiā, xià gè xīngqītiān dào cāntīng jùhuì.","en":"Remember to contact everyone and meet the restaurant next Sunday."}]},{"id":648,"hanzi":"抱歉","part":"Phrase","pinyin":"bàoqiàn","def":"to be sorry, to feel apologetic","ex":[{"zh":"非常抱歉我迟到了，这一餐我请客。","py":"Fēicháng bàoqiàn wǒ chídàole, zhè yìcān wǒ qǐngkè.","en":"I'm sorry I'm late for this meal."},{"zh":"真是抱歉，弄坏你的画。","py":"Zhēnshi bàoqiàn, nòng huài nǐ de huà.","en":"I'm sorry to have broken your picture."}]},{"id":649,"hanzi":"准备","part":"Verb","pinyin":"zhǔnbèi","def":"to prepare","ex":[{"zh":"他的生日会你都准备好了吗？","py":"Tā de shēngrì huì nǐ dōu zhǔnbèi hǎole ma?","en":"Will you be ready for your birthday?"},{"zh":"今天的晚餐我都准备好了。","py":"Jīntiān de wǎncān wǒ dōu zhǔnbèi hǎole.","en":"I'm ready for dinner today."}]},{"id":650,"hanzi":"惊喜","part":"Adj","pinyin":"jīngxǐ","def":"surprise","ex":[{"zh":"我想要给他一个生日惊喜。","py":"Wǒ xiǎng yào gěi tā yígè shēngrì jīngxǐ.","en":"I want to give him a birthday surprise."},{"zh":"好久不见，没想到你会来，真是让我太惊喜了。","py":"Hǎojiǔ bújiàn, méi xiǎngdào nǐ huì lái, zhēnshi ràng wǒ tài jīngxǐle.","en":"Long time no see, did not think you will come, really makes me too pleasantly surprised."}]},{"id":651,"hanzi":"钱包","part":"Noun","pinyin":"qiánbāo","def":"purse, wallet","ex":[{"zh":"我的钱包不见了，快帮我找一找。","py":"Wǒ de qiánbāo bújiànle, kuài bāng wǒ zhǎo yì zhǎo.","en":"My wallet is gone, help me find it."},{"zh":"这是我新买的钱包，很漂亮吧！","py":"Zhè shì wǒ xīn mǎi de qiánbāo, hěn piàoliang ba!","en":"This is my new wallet, it is beautiful !"}]},{"id":652,"hanzi":"颜色","part":"Noun","pinyin":"yánsè","def":"color","ex":[{"zh":"这件衣服有很多颜色，你想要哪一种颜色？","py":"Zhè jiàn yīfu yǒu hěnduō yánsè, nǐ xiǎng yào nǎ yìzhǒng yánsè?","en":"This dress has a lot of colors, which color do you want?"},{"zh":"这张桌子有三种颜色，你想要哪种？","py":"Zhè zhāng zhuōzi yǒu sān zhǒng yánsè, nǐ xiǎng yào nǎ zhǒng?","en":"This table has three colors, which color do you want?"}]},{"id":653,"hanzi":"服务台","part":"Noun","pinyin":"fúwùtái","def":"service desk, information desk, reception desk","ex":[{"zh":"你去服务台问一问，有没有人看见你的钱包。","py":"Nǐ qù fúwùtái wèn yí wèn, yǒu méiyǒu rén kànjiàn nǐ de qiánbāo.","en":"You go to the desk to ask, have not seen your wallet."},{"zh":"我把东西放在服务台，你晚一点去拿。","py":"Wǒ bǎ dōngxi fàng zài fúwùtái, nǐ wǎn yìdiǎn qù ná.","en":"I put something on the desk, you get it later."}]},{"id":654,"hanzi":"证件","part":"Noun","pinyin":"zhèngjiàn","def":"ID","ex":[{"zh":"我的钱包里有证件还有信用卡。","py":"Wǒ de qiánbāo li yǒu zhèngjiàn háiyǒu xìnyòngkǎ.","en":"There are documents in my wallet and a credit card."},{"zh":"你的钱包里面会放证件吗？","py":"Nǐ de qiánbāo lǐmiàn huì fàng zhèngjiàn ma?","en":"Will your wallet put your documents?"}]},{"id":655,"hanzi":"现金","part":"Noun","pinyin":"xiànjīn","def":"cash","ex":[{"zh":"你有现金吗？还是要用信用卡买东西呢？","py":"Nǐ yǒu xiànjīn ma? Háishì yào yòng xìnyòngkǎ mǎi dōngxi ne?","en":"Do you have cash? Or use a credit card to buy things?"},{"zh":"出门要记得带现金，买东西比较方便。","py":"Chūmén yào jìde dài xiànjīn, mǎi dōngxi bǐjiào fāngbiàn.","en":"Go out to remember with cash, buy things only convenient."}]},{"id":656,"hanzi":"拿走","part":"Verb","pinyin":"názǒu","def":"to take away","ex":[{"zh":"我的电脑被妹妹拿走了，今天不能写作业了。","py":"Wǒ de diànnǎo bèi mèimei názǒu le, jīntiān bùnéng xiě zuòyè le.","en":"My computer was taken away by her sister, and today I cannot write homework."},{"zh":"这件衣服不要拿走，我等一会儿要穿。","py":"Zhè jiàn yīfu búyào názǒu, wǒ děng yìhuǐr yào chuān.","en":"Do not take this dress, I will wait for a while to wear."}]},{"id":657,"hanzi":"信用卡","part":"Noun","pinyin":"xìnyòngkǎ","def":"credit card","ex":[{"zh":"你喜欢用现金买东西，还是用信用卡？","py":"Nǐ xǐhuan yòng xiànjīn mǎi dōngxi, háishì yòng xìnyòngkǎ?","en":"Do you like to buy things in cash, or use credit cards?"},{"zh":"我有三张信用卡，但是每张都不能用。","py":"Wǒ yǒusān zhāng xìnyòngkǎ, dànshì měi zhāng dōu bùnéng yòng.","en":"I have three credit cards, but each can not be used.."}]},{"id":658,"hanzi":"收到","part":"Verb","pinyin":"shōudào","def":"to receive","ex":[{"zh":"你收到我寄给你的礼物了吗？","py":"Nǐ shōudào wǒ jì gěi nǐ de lǐwù le ma?","en":"Did you receive the gift I sent you?"},{"zh":"今天我收到他寄给我的照片了。","py":"Jīntiān wǒ shōudào tā jì gěi wǒ de zhàopiàn le.","en":"Today I received the photo he sent me."}]},{"id":659,"hanzi":"地址","part":"Noun","pinyin":"dìzhǐ","def":"address","ex":[{"zh":"我不知道你家的地址，你可以写给我吗？","py":"Wǒ bù zhīdào nǐ jiā de dìzhǐ, nǐ kěyǐ xiě gěi wǒ ma?","en":"I do not know your home address, can you write to me?"},{"zh":"我写错他家的地址了，所以他没有收到信。","py":"Wǒ xiě cuò tā jiā de dìzhǐ le, suǒyǐ tā méiyǒu shōudào xìn.","en":"I wrote the address of his home, so he did not receive the letter."}]},{"id":660,"hanzi":"寄","part":"Verb","pinyin":"jì","def":"to send","ex":[{"zh":"我想把这张照片寄给在外国工作的爸爸。","py":"Wǒ xiǎng bǎ zhè zhāng zhàopiàn jì gěi zài wàiguó gōngzuò de bàba.","en":"I would like to send this photo to a dad in a foreign country."},{"zh":"今天下午我会把信寄出去。","py":"Jīntiān xiàwǔ wǒ huì bǎ xìn jì chūqù.","en":"I'll send the letter this afternoon."}]},{"id":661,"hanzi":"包裹","part":"Noun","pinyin":"bāoguǒ","def":"package","ex":[{"zh":"这个包裹是谁的？放在这里已经十天了。","py":"Zhègè bāoguǒ shì shéi de? Fàng zài zhèlǐ yǐjīng shítiān le.","en":"Who is this parcel? It's been ten days here."},{"zh":"你收到我寄给你的包裹了吗？","py":"Nǐ shōudào wǒ jì gěi nǐ de bāoguǒ le ma?","en":"Did you receive the package that I sent to you?"}]},{"id":662,"hanzi":"毛衣","part":"Noun","pinyin":"máoyī","def":"sweater","ex":[{"zh":"这件毛衣你穿起来一定很好看。","py":"Zhè jiàn máoyī nǐ chuān qǐlái yídìng hěn hǎokàn.","en":"This sweater you wear it must look good."},{"zh":"这件毛衣太小件了。","py":"Zhè jiàn máoyī tài xiǎo jiànle.","en":"This sweater is too small."}]},{"id":663,"hanzi":"试","part":"Verb","pinyin":"shì","def":"to test, to try","ex":[{"zh":"我这里有一台新的电脑，你要不要试试看？","py":"Wǒ zhèli yǒu yìtái xīn de diànnǎo, nǐ yào bùyào shìshì kàn?","en":"I have a new computer here, do you want to try to see?"},{"zh":"这件裤子我试穿了，我非常喜欢。","py":"Zhè jiàn kùzi wǒ shìchuān le, wǒ fēicháng xǐhuan.","en":"I try this pants, I like it very much."}]},{"id":664,"hanzi":"盒子","part":"Noun","pinyin":"hézi","def":"case/box","ex":[{"zh":"这个盒子很漂亮，你可以给我吗？","py":"Zhègè hézi hěn piàoliang, nǐ kěyǐ gěi wǒ ma?","en":"This box is very beautiful, can you give me?"},{"zh":"这个盒子里面有什么？","py":"Zhègè hézi lǐmiàn yǒu shénme?","en":"What's inside this box?"}]},{"id":665,"hanzi":"注意","part":"Verb","pinyin":"zhùyì","def":"to take note of, to pay attention to","ex":[{"zh":"你要注意身体，早点儿睡觉。","py":"Nǐ yào zhùyì shēntǐ, zǎodiǎnr shuìjiào.","en":"You have to pay attention to the body, to sleep earlier"},{"zh":"过马路的时候，要注意有没有车。","py":"Guò mǎlù de shíhou, yào zhùyì yǒu méiyǒu chē.","en":"When crossing the road, pay attention to whether there is no car."}]},{"id":666,"hanzi":"照顾","part":"Verb","pinyin":"zhàogù","def":"to take care of, to show consideration, to attend to, to look after","ex":[{"zh":"爸爸生病了，我要回家照顾他。","py":"Bàba shēngbìngle, wǒ yào huíjiā zhàogù tā.","en":"Dad is sick, I want to take home to take care of him."},{"zh":"你要自己照顾自己，不要让妈妈担心。","py":"Nǐ yào zìjǐ zhàogù zìjǐ, búyào ràng māma dānxīn.","en":"You have to take care of yourself, do not let my mother worry."}]},{"id":667,"hanzi":"精神","part":"Noun/Adj","pinyin":"jīngshen","def":"vigor, vitality, drive, spiritual","ex":[{"zh":"你看起来精神不好，发生什么事了？","py":"Nǐ kàn qǐlái jīngshén bùhǎo, fāshēng shénme shì le?","en":"Do you look so badly that what happened?"},{"zh":"他每天都运动，所以看起来精神很好。","py":"Tā měitiān dōu yùndòng, suǒyǐ kàn qǐlái jīngshén hěn hǎo.","en":"He moves every day, so it looks good."}]},{"id":668,"hanzi":"体力","part":"Noun","pinyin":"tǐlì","def":"physical strength, physical power","ex":[{"zh":"他的体力很好，游泳游了三个小时也不会累。","py":"Tā de tǐlì hěn hǎo, yóuyǒng yóule sān gè xiǎoshí yě búhuì lèi.","en":"His physical strength is good, swimming for three hours will not be tired"},{"zh":"他每天吃很多东西也不运动，所以体力很差。","py":"Tā měitiān chī hěnduō dōngxi yě bú yùndòng, suǒyǐ tǐlì hěn chà.","en":"He does not exercise a lot of things every day, so poor physical strength."}]},{"id":669,"hanzi":"影响","part":"Noun/Verb","pinyin":"yǐngxiǎng","def":"influence, effect, to influence, to affect (usually adversely), to disturb","ex":[{"zh":"不要让其他事影响到你的心情。","py":"Búyào ràng qítā shì yǐngxiǎng dào nǐ de xīnqíng.","en":"Do not let other things affect your feelings."},{"zh":"每天精神不好，已经影响到我上课了。","py":"Měitiān jīngshén bùhǎo, yǐjīng yǐngxiǎng dào wǒ shàngkè le.","en":"Every day the spirit is not good, has affected my class."}]},{"id":670,"hanzi":"作业","part":"Noun","pinyin":"zuòyè","def":"school assignment, homework,","ex":[{"zh":"我今天的作业很多，已经写了三个小时了，还没写完。","py":"Wǒ jīntiān de zuòyè hěnduō, yǐjīng xiěle sān gè xiǎoshí le, háiméi xiěwán.","en":"I have a lot of work today, has been three hours, not finished."},{"zh":"你会写今天的汉语作业吗？我觉得很难。","py":"Nǐ huì xiě jīntiān de hànyǔ zuòyè ma? Wǒ juéde hěn nán.","en":"Can you write today's Chinese homework? I find it hard"}]},{"id":671,"hanzi":"功夫","part":"Noun","pinyin":"gōngfu","def":"kung fu","ex":[{"zh":"我最近想学功夫，你有什么建议吗？","py":"Wǒ zuìjìn xiǎng xué gōngfu, nǐ yǒu shénme jiànyì ma?","en":"I recently wanted to study martial arts. Do you have any suggestions?"}]},{"id":672,"hanzi":"起来","part":"Verb","pinyin":"qǐlái","def":"to wake up, to get up","ex":[{"zh":"你快起来，不要一直睡觉。","py":"Nǐ kuài qǐlái, búyào yìzhí shuìjiào.","en":"You are up, do not always sleep.."},{"zh":"我今天下午才起来，因为昨天太晚睡了。","py":"Wǒ jīntiān xiàwǔ cái qǐlái, yīnwèi zuótiān tài wǎn shuìle.","en":"I got up this afternoon because it was too late for yesterday."}]},{"id":673,"hanzi":"希望","part":"Noun/Verb","pinyin":"xīwàng","def":"to wish for, to desire, hope","ex":[{"zh":"希望你的汉语越来越好。","py":"Xīwàng nǐ de hànyǔ yuè lái yuè hǎo.","en":"I hope your Chinese is getting better and better."},{"zh":"希望你回家以后，快写作业。","py":"Xīwàng nǐ huí jiā yǐhòu, kuài xiě zuòyè.","en":"Hope you go home later, fast write homework."}]},{"id":674,"hanzi":"趁","part":"Prep","pinyin":"chèn","def":"to avail oneself of, to take advantage of","ex":[{"zh":"我要趁妈妈不在家的时候，把房子整理好。","py":"Wǒ yào chèn māma bú zàijiā de shíhòu, bǎ fángzi zhěnglǐ hǎo.","en":"I want to take care of the house when my mother is not at home."},{"zh":"我要趁他不在中国的这些日子，好好学习汉语。","py":"Wǒ yào chèn tā bùzài Zhōngguó de zhèxiē rìzi, hǎohāo xuéxí hànyǔ.","en":"I want to take advantage of these days in China, learn Chinese well."}]},{"id":675,"hanzi":"日子","part":"Noun","pinyin":"rìzi","def":"day, a (calendar) date, days of one's life","ex":[{"zh":"非常谢谢这些日子，有你的照顾。","py":"Fēicháng xièxie zhèxiē rìzi, yǒu nǐ de zhàogù.","en":"Thank you very much for these days and have your care."},{"zh":"你去中国旅行的这些日子，这里发生了很多事。","py":"Nǐ qù Zhōngguó lǚxíng de zhèxiē rìzi, zhèlǐ fāshēngle hěnduō shì.","en":"You traveled to China these days, there have been a lot of things here."}]},{"id":676,"hanzi":"继续","part":"Verb","pinyin":"jìxù","def":"to continue, to proceed with, to go on with","ex":[{"zh":"我回到美国后，还要继续学习汉语。","py":"Wǒ huí dào měiguó hòu, hái yào jìxù xuéxí hànyǔ.","en":"When I return to the United States, I will continue to study Chinese."},{"zh":"等我吃完饭了，再继续写作业。","py":"Děng wǒ chī wán fànle, zài jìxù xiě zuòyè.","en":"When I had finished my meal, I kept writing homework."}]},{"id":677,"hanzi":"这样","part":"Pronoun","pinyin":"zhèyàng","def":"like this, this way","ex":[{"zh":"我们一起去买菜吧！这样也可以一起做饭。","py":"Wǒmen yìqǐ qù mǎi cài ba! Zhèyàng yě kěyǐ yìqǐ zuò fàn.","en":"Let's go shopping together! This can also be cooked together."},{"zh":"他有你这样的朋友，一定很开心。","py":"Tā yǒu nǐ zhèyàng de péngyǒu, yídìnghěn kāixīn.","en":"He has such a friend, you must be very happy."}]},{"id":678,"hanzi":"告别","part":"Verb","pinyin":"gàobié","def":"to leave, to bid farewell to, to say good-bye to","ex":[{"zh":"我要回美国了，所以今天要向汉语老师告别。","py":"Wǒ yào huí měiguóle, suǒyǐ jīntiān yào xiàng hànyǔ lǎoshī gàobié.","en":"I want to return to the United States, so today to the Chinese teacher farewell."},{"zh":"我今天是来向你告别的，因为明天我要去旅行了。","py":"Wǒ jīntiān shì lái xiàng nǐ gàobié de, yīnwèi míngtiān wǒ yào qù lǚxíngle.","en":"I am coming to you today, because tomorrow I am going to travel."}]},{"id":679,"hanzi":"有的","part":"Pronoun","pinyin":"yǒude","def":"(there are) some (who are...), some (exist)","ex":[{"zh":"我喜欢美食，但是有的食物我不喜欢吃。","py":"Wǒ xǐhuān měishí, dànshì yǒude shíwù wǒ bù xǐhuān chī.","en":"I like food, but some food I do not like to eat."},{"zh":"我喜欢读汉语书，但是有的字我不认识，所以看不懂。","py":"Wǒ xǐhuān dú hànyǔ shū, dànshì yǒude zì wǒ bù rènshì, suǒyǐ kàn bù dǒng.","en":"I like to read Chinese books, but some words I do not know, so do not understand."}]},{"id":680,"hanzi":"送","part":"Verb","pinyin":"sòng","def":"to see off","ex":[{"zh":"我的老师要回中国了，我们去机场送他。","py":"Wǒ de lǎoshī yào huí Zhōngguó le, wǒmen qù jīchǎng sòng tā.","en":"My teacher to return to China, we went to the airport to send him."},{"zh":"今天我爸爸送我来学校。","py":"Jīntiān wǒ bàba sòng wǒ lái xuéxiào.","en":"Today my dad took me to school."}]},{"id":681,"hanzi":"向","part":"Prep","pinyin":"xiàng","def":"towards","ex":[{"zh":"他向我学习英语，我向他学习汉语。","py":"Tā xiàng wǒ xuéxí yīngyǔ, wǒ xiàng tā xuéxí hànyǔ.","en":"He learns English from me and I learn Chinese from him."},{"zh":"你很会做菜，我可以向你学习吗？","py":"Nǐ hěn huì zuò cài, wǒ kěyǐ xiàng nǐ xuéxí ma?","en":"You will cook, can I learn from you?"}]},{"id":682,"hanzi":"欢送会","part":"Noun","pinyin":"huānsònghùi","def":"farewell party, going away party","ex":[{"zh":"因为他要回国了，所以这个周末有一个欢送会。","py":"Yīnwèi tā yào huíguó le, suǒyǐ zhègè zhōumò yǒu yīgè huānsònghuì.","en":"Because he wants to return home, there is a farewell party this weekend."},{"zh":"我想为他办一场欢送会，你想一起来吗？","py":"Wǒ xiǎng wèi tā bàn yī chǎng huānsòng huì, nǐ xiǎng yī qǐlái ma?","en":"I want to do a farewell party for him, do you want to come together?"}]},{"id":683,"hanzi":"结婚","part":"Verb Object","pinyin":"jiéhūn","def":"to marry, to get married","ex":[{"zh":"我明年要结婚了。","py":"Wǒ míngnián yào jiéhūn le.","en":"I am getting married next year."},{"zh":"现在的年轻人很晚结婚。","py":"Xiànzài de niánqīng rén hěn wǎn jiéhūn.","en":"Young people nowadays get married later in life."}]},{"id":684,"hanzi":"完全","part":"Adv","pinyin":"wánquán","def":"totally, entirely","ex":[{"zh":"他完全不会说汉语。","py":"Tā wánquán búhuì shuō hànyǔ.","en":"He completely doesn’t know how to speak Chinese."},{"zh":"他完全不知道我在说什么。","py":"Tā wánquán bù zhīdào wǒ zài shuō shénme.","en":"He totally doesn’t know what I am saying."}]},{"id":685,"hanzi":"倒","part":"Verb","pinyin":"dǎo","def":"to fall, to collapse,","ex":[{"zh":"杯子被妹妹弄倒了。","py":"Bēizi bèi mèimei nòng dào le.","en":"The cup was knocked over by my younger sister."},{"zh":"我不小心跌倒了。","py":"Wǒ bù xiǎoxīn diēdǎo le.","en":"I accidentally fell down."}]},{"id":686,"hanzi":"传说","part":"Noun","pinyin":"chuánshuō","def":"legend, folklore, tradition","ex":[{"zh":"今天老师告诉我们中国很有意思的传说。","py":"Jīntiān lǎoshī gàosu wǒmen Zhōngguó hěn yǒuyìsi de chuánshuō.","en":"Today, the teacher told us an interesting Chinese legend."},{"zh":"中国每一个节日都有传说。","py":"Zhōngguó měi yīgè jiérì dōu yǒu chuánshuō.","en":"Every Chinese festival has a legend."}]},{"id":687,"hanzi":"建","part":"Verb","pinyin":"jiàn","def":"to build, to construct","ex":[{"zh":"图书馆旁边建了一个新的大楼。","py":"Túshūguǎn pángbiān jiànle yígè xīn de dàlóu.","en":"The building is built next to the library."},{"zh":"我买的新房子建好了。","py":"Wǒ mǎi de xīn fángzi jiàn hǎo le.","en":"The house I bought is built."}]},{"id":688,"hanzi":"抓","part":"Verb","pinyin":"zhuā","d
