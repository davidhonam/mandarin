<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>Mandarin Pinyin SRS</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0f1115">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pinyin SRS">
<style>
  :root{
    --bg:#0f1115; --panel:#1a1d24; --panel2:#222632; --ink:#e8eaf0; --muted:#9aa3b2;
    --accent:#5b8cff; --good:#3ecf8e; --hard:#f2c14e; --again:#ff6b6b; --easy:#4cc9f0;
    --line:#2a2f3a; --shadow:0 10px 40px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 600px at 50% -10%, #1b2030 0%, var(--bg) 60%);
    color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    display:flex; flex-direction:column; min-height:100%;}
  header{display:flex; align-items:center; gap:14px; position:sticky; top:0; z-index:5;
    padding:calc(14px + env(safe-area-inset-top)) calc(20px + env(safe-area-inset-right)) 14px calc(20px + env(safe-area-inset-left));
    border-bottom:1px solid var(--line); background:rgba(15,17,21,.7); backdrop-filter:blur(8px);}
  header h1{font-size:16px; margin:0; font-weight:600; letter-spacing:.3px}
  header .sub{color:var(--muted); font-size:12px}
  .spacer{flex:1}
  .pill{font-size:12px; color:var(--muted); background:var(--panel2); border:1px solid var(--line);
    padding:5px 10px; border-radius:999px; white-space:nowrap}
  .pill b{color:var(--ink)}
  button{font-family:inherit; cursor:pointer; border:none; border-radius:10px; transition:.12s transform,.12s filter; }
  button:active{transform:translateY(1px)}
  .iconbtn{background:var(--panel2); color:var(--muted); border:1px solid var(--line); padding:7px 11px; font-size:13px; border-radius:9px}
  .iconbtn:hover{color:var(--ink); filter:brightness(1.15)}
  main{flex:1; display:flex; align-items:center; justify-content:center; padding:24px 16px}
  .card{width:min(620px,94vw); background:linear-gradient(180deg,var(--panel) 0%, #161922 100%);
    border:1px solid var(--line); border-radius:20px; box-shadow:var(--shadow); overflow:hidden}
  .cardtop{padding:34px 30px 8px; text-align:center}
  .part{display:inline-block; font-size:12px; color:var(--accent); background:rgba(91,140,255,.12);
    border:1px solid rgba(91,140,255,.3); padding:3px 10px; border-radius:999px; margin-bottom:18px; letter-spacing:.4px}
  .word{font-size:46px; font-weight:700; line-height:1.15; letter-spacing:.5px}
  .word .tap{display:block; font-size:12px; color:var(--muted); font-weight:400; margin-top:14px; letter-spacing:.5px}
  .def{font-size:22px; color:var(--ink); margin:6px 30px 4px; text-align:center; font-weight:500}
  .hanziline{text-align:center; color:var(--muted); font-size:14px; margin-top:6px; min-height:18px}
  .hanziline.hidden{visibility:hidden}
  .divider{height:1px; background:var(--line); margin:20px 0 0}
  .examples{padding:8px 22px 20px}
  .ex{display:flex; gap:12px; align-items:flex-start; padding:16px 8px; border-bottom:1px solid var(--line)}
  .ex:last-child{border-bottom:none}
  .play{flex:0 0 auto; width:40px; height:40px; border-radius:50%; background:var(--panel2);
    border:1px solid var(--line); color:var(--accent); font-size:16px; display:flex; align-items:center; justify-content:center; margin-top:2px}
  .play:hover{filter:brightness(1.25)}
  .play.playing{background:var(--accent); color:#fff; border-color:var(--accent)}
  .extxt{flex:1; min-width:0}
  .ex .py{font-size:18px; font-weight:600; color:var(--ink)}
  .ex .en{font-size:14px; color:var(--muted); margin-top:4px}
  .ex .zh{font-size:13px; color:#6b7384; margin-top:3px}
  .ex .zh.hidden{display:none}
  .controls{display:flex; gap:10px; padding:16px 22px 22px; justify-content:center; flex-wrap:wrap}
  .show{background:var(--accent); color:#fff; font-size:16px; font-weight:600; padding:14px 40px; border-radius:12px}
  .grade{flex:1; min-width:120px; max-width:150px; padding:13px 8px; font-size:14px; font-weight:600; color:#0f1115; text-align:center}
  .grade small{display:block; font-weight:500; opacity:.8; font-size:11px; margin-top:2px}
  .g-again{background:var(--again)} .g-hard{background:var(--hard)} .g-good{background:var(--good)} .g-easy{background:var(--easy)}
  .empty{text-align:center; color:var(--muted)}
  .empty h2{color:var(--ink); font-weight:600}
  footer{display:flex; gap:14px; align-items:center; justify-content:center; padding:10px; color:var(--muted); font-size:12px; border-top:1px solid var(--line)}
  footer a{color:var(--muted); cursor:pointer; text-decoration:underline}
  .toolbar{display:flex; gap:8px; align-items:center}
  select{background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-family:inherit; font-size:12px}
  .toast{position:fixed; bottom:20px; left:50%; transform:translateX(-50%); background:var(--panel2);
    border:1px solid var(--line); color:var(--ink); padding:10px 16px; border-radius:10px; box-shadow:var(--shadow); font-size:13px; opacity:0; pointer-events:none; transition:.2s}
  .toast.show{opacity:1}
  kbd{background:var(--panel2); border:1px solid var(--line); border-bottom-width:2px; border-radius:5px; padding:1px 6px; font-size:11px; color:var(--muted)}
  /* ---- overlay / modal ---- */
  .overlay{position:fixed; inset:0; background:rgba(8,10,14,.72); backdrop-filter:blur(4px); display:none; align-items:flex-start; justify-content:center; z-index:20; padding:40px 16px; overflow:auto}
  .overlay.open{display:flex}
  .modal{width:min(760px,96vw); background:var(--panel); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow); overflow:hidden; margin:auto}
  .modal h2{margin:0; font-size:17px; font-weight:600}
  .modalhead{display:flex; align-items:center; gap:12px; padding:16px 20px; border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--panel); z-index:2}
  .modalhead .spacer{flex:1}
  .closex{background:var(--panel2); color:var(--muted); border:1px solid var(--line); width:32px; height:32px; border-radius:8px; font-size:16px; line-height:1}
  .closex:hover{color:var(--ink)}
  .modalbody{padding:18px 20px 22px}
  /* ---- stats ---- */
  .statgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(120px,1fr)); gap:12px; margin-bottom:8px}
  .stat{background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px}
  .stat .n{font-size:26px; font-weight:700}
  .stat .l{font-size:12px; color:var(--muted); margin-top:2px}
  .stat .n.good{color:var(--good)} .stat .n.warn{color:var(--hard)} .stat .n.acc{color:var(--easy)}
  .secttitle{font-size:13px; color:var(--muted); text-transform:uppercase; letter-spacing:.6px; margin:22px 0 10px}
  .bars{display:flex; align-items:flex-end; gap:4px; height:90px; padding-top:6px}
  .bar{flex:1; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; gap:4px; height:100%}
  .bar .fill{width:100%; background:var(--accent); border-radius:4px 4px 0 0; min-height:2px; transition:.2s}
  .bar.future .fill{background:var(--panel2); border:1px solid var(--accent)}
  .bar .cap{font-size:9px; color:var(--muted); white-space:nowrap}
  .bar .val{font-size:10px; color:var(--ink); font-weight:600}
  .matbar{display:flex; height:22px; border-radius:6px; overflow:hidden; border:1px solid var(--line)}
  .matbar > div{display:flex; align-items:center; justify-content:center; font-size:11px; color:#0f1115; font-weight:600}
  /* ---- settings ---- */
  .setrow{display:flex; align-items:center; gap:14px; padding:14px 0; border-bottom:1px solid var(--line)}
  .setrow:last-child{border-bottom:none}
  .setrow .lbl{flex:1}
  .setrow .lbl b{display:block; font-size:14px}
  .setrow .lbl span{font-size:12px; color:var(--muted)}
  .setrow input[type=range]{width:160px}
  .setrow .num{font-size:18px; font-weight:700; min-width:42px; text-align:right; color:var(--accent)}
  /* ---- browse ---- */
  .browsebar{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  .browsebar input[type=text]{flex:1; min-width:160px; background:var(--panel2); border:1px solid var(--line); color:var(--ink); border-radius:9px; padding:9px 12px; font-family:inherit; font-size:14px}
  .browsecount{font-size:12px; color:var(--muted); margin:0 0 10px}
  .blist{display:flex; flex-direction:column; gap:6px; max-height:none}
  .brow{background:var(--panel2); border:1px solid var(--line); border-radius:10px; padding:11px 13px; cursor:pointer}
  .brow:hover{filter:brightness(1.12)}
  .browtop{display:flex; align-items:center; gap:10px}
  .browtop .bpy{font-size:16px; font-weight:600}
  .browtop .bdef{color:var(--muted); font-size:13px; flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .badge{font-size:10px; padding:2px 8px; border-radius:999px; border:1px solid var(--line); white-space:nowrap}
  .badge.new{color:var(--accent); border-color:rgba(91,140,255,.4)}
  .badge.learn{color:var(--hard); border-color:rgba(242,193,78,.4)}
  .badge.mature{color:var(--good); border-color:rgba(62,207,142,.4)}
  .badge.due{color:var(--again); border-color:rgba(255,107,107,.4)}
  .bdetail{margin-top:10px; padding-top:10px; border-top:1px solid var(--line); display:none}
  .brow.open .bdetail{display:block}
  .bex{display:flex; gap:10px; align-items:flex-start; padding:7px 0}
  .bex .py{font-weight:600; font-size:14px} .bex .en{font-size:12px; color:var(--muted)}
  .miniplay{flex:0 0 auto; width:30px; height:30px; border-radius:50%; background:var(--panel); border:1px solid var(--line); color:var(--accent); font-size:12px}
  .wplay{vertical-align:middle; margin-left:12px; width:38px; height:38px; border-radius:50%; background:var(--panel2); border:1px solid var(--line); color:var(--accent); font-size:16px}
  .wplay:hover{filter:brightness(1.25)}
  .wplay.playing{background:var(--accent); color:#fff; border-color:var(--accent)}
  .browtop .wplay{width:30px; height:30px; font-size:13px; margin-left:0}
  .cramwrap{text-align:center}
  /* button icon/label: text on desktop, icon-only on mobile */
  .iconbtn .bi{display:none} .iconbtn .bl{display:inline}
  /* ---------- mobile ---------- */
  @media (max-width:680px){
    header{gap:8px 10px; flex-wrap:wrap;
      padding:calc(9px + env(safe-area-inset-top)) calc(12px + env(safe-area-inset-right)) 9px calc(12px + env(safe-area-inset-left))}
    header h1{font-size:15px}
    .sub{font-size:11px}
    .pill{font-size:11px; padding:4px 9px; order:3; flex-basis:100%}
    .toolbar{gap:8px}
    .iconbtn{min-height:42px; min-width:46px; padding:8px 12px; font-size:18px; display:flex; align-items:center; justify-content:center}
    .iconbtn .bi{display:inline} .iconbtn .bl{display:none}
    main{padding:14px 10px}
    .card{border-radius:16px}
    .cardtop{padding:26px 18px 6px}
    .word{font-size:34px}
    .word[style]{font-size:28px !important}
    .wplay{width:42px; height:42px}
    .def{font-size:20px; margin:6px 14px 4px}
    .examples{padding:6px 12px 14px}
    .ex{padding:14px 2px; gap:10px}
    .ex .py{font-size:17px}
    .play{width:46px; height:46px}
    .controls{gap:8px; padding:14px 12px 20px}
    .show{width:100%; padding:16px}
    .grade{min-width:0; max-width:none; flex:1 1 calc(50% - 5px); padding:15px 6px; font-size:15px}
    footer{display:none}             /* keyboard hints irrelevant on touch */
    /* full-screen modals on phones */
    .overlay{padding:0; align-items:stretch}
    .modal{width:100%; min-height:100%; border-radius:0; border:none; margin:0}
    .modalhead{padding:calc(14px + env(safe-area-inset-top)) 16px 14px}
    .modalbody{padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
    .closex{width:40px; height:40px; font-size:20px}
    .statgrid{grid-template-columns:repeat(2,1fr); gap:10px}
    .stat .n{font-size:22px}
    .browsebar{gap:8px}
    .browsebar input[type=text]{flex-basis:100%}
    .setrow input[type=range]{width:130px}
    .brow{padding:13px}
    .miniplay,.browtop .wplay{width:38px; height:38px}
  }
  @media (hover:none){ .iconbtn, .play, .wplay, .miniplay, .grade, .show{ -webkit-tap-highlight-color:transparent } }
</style>
</head>
<body>
<header>
  <h1>Mandarin <span style="color:var(--accent)">Pinyin</span></h1>
  <div class="pill" id="stats"></div>
  <div class="sub" id="streak"></div>
  <div class="spacer"></div>
  <div class="toolbar">
    <button class="iconbtn" id="browseBtn" title="Browse & search all words"><span class="bi">🔍</span><span class="bl">Browse</span></button>
    <button class="iconbtn" id="statsBtn" title="Statistics"><span class="bi">📊</span><span class="bl">Stats</span></button>
    <button class="iconbtn" id="settingsBtn" title="Settings"><span class="bi">⚙</span><span class="bl">Settings</span></button>
  </div>
  <input type="file" id="importFile" accept="application/json" style="display:none">
</header>

<main id="main"></main>

<footer>
  <span class="kbdhint"><kbd>Space</kbd> flip · <kbd>1</kbd>-<kbd>4</kbd> grade · <kbd>W</kbd> word audio · <kbd>R</kbd> replay</span>
</footer>

<div class="overlay" id="overlay"><div class="modal" id="modalBox"></div></div>
<div class="toast" id="toast"></div>

},{"id":8,"hanzi":"美国","part":"Noun","pinyin":"Měiguó","def":"United States","ex":[{"zh":"他是美国人吗？","py":"Tā shì Měiguó rén ma?","en":"Is he an American?"},{"zh":"A: 你是哪国人？B: 我是美国人。","py":"A: Nǐ shì nǎ guó rén? B: Wǒ shì Měiguó rén.","en":"A: What country are you from? B: I am American."}]},{"id":9,"hanzi":"中国","part":"Noun","pinyin":"Zhōngguó","def":"China","ex":[{"zh":"我不是中国人。","py":"Wǒ bú shì Zhōngguó rén.","en":"I'm not Chinese."},{"zh":"你是中国人吗？","py":"Nǐ shì Zhōngguó rén ma?","en":"Are you Chinese?"}]},{"id":10,"hanzi":"忙","part":"Adj","pinyin":"máng","def":"busy","ex":[{"zh":"你忙吗？","py":"Nǐ máng ma?","en":"Are you busy?"},{"zh":"我很忙。","py":"Wǒ hěn máng.","en":"I am so busy."}]},{"id":11,"hanzi":"累","part":"Adj","pinyin":"lèi","def":"tired , tiring","ex":[{"zh":"我很累。","py":"Wǒ hěn lèi.","en":"I am tired."},{"zh":"我不累。","py":"Wǒ bú lèi.","en":"I am not tired."}]},{"id":12,"hanzi":"好","part":"Adj","pinyin":"hǎo","def":"good","ex":[{"zh":"你好吗？","py":"Nǐ hǎo ma?","en":"How are you?"},{"zh":"我很好。","py":"Wǒ hěn hǎo.","en":"I am pretty good."}]},{"id":13,"hanzi":"你们","part":"Pronoun","pinyin":"nǐmen","def":"you (plural), y'all","ex":[{"zh":"你们都是学生吗？","py":"Nǐmen dōu shì xuéshēng ma?","en":"Are you all students?"},{"zh":"你们是美国人吗？","py":"Nǐmen shì Měiguó rén ma?","en":"Are you all Americans?"}]},{"id":14,"hanzi":"学生","part":"Noun","pinyin":"xuéshēng","def":"student, students","ex":[{"zh":"我不是学生。","py":"Wǒ bú shì xuéshēng.","en":"I am not a student."},{"zh":"他是学生。","py":"Tā shì xuéshēng.","en":"He is a student."}]},{"id":15,"hanzi":"老师","part":"Noun","pinyin":"lǎoshī","def":"teacher","ex":[{"zh":"我的老师不是中国人。","py":"Wǒ de lǎoshī bú shì Zhōngguó rén.","en":"My teacher is not Chinese."},{"zh":"我不是老师。","py":"Wǒ bú shì lǎoshī.","en":"I am not a teacher."}]},{"id":16,"hanzi":"再见","part":"Phrase","pinyin":"zàijiàn","def":"goodbye","ex":[{"zh":"再见！","py":"Zàijiàn.","en":"Goodbye."},{"zh":"再见.明天见!","py":"Zàijiàn. Míngtiān jiàn!","en":"Goodbye. See you tomorrow!"}]},{"id":17,"hanzi":"日本","part":"Noun","pinyin":"Rìběn","def":"Japan","ex":[{"zh":"他不是日本人。","py":"Tā bú shì Rìběn rén.","en":"He is not a Japanese."},{"zh":"我的老师是日本人。","py":"Wǒ de lǎoshī shì Rìběn rén.","en":"My teacher is a Japanese."}]},{"id":18,"hanzi":"他","part":"Pronoun","pinyin":"tā","def":"He, him","ex":[{"zh":"他累不累?","py":"Tā lèi búlèi?","en":"Is he tired or not?"},{"zh":"他不累。","py":"Tā búlèi.","en":"He is not tired."}]},{"id":19,"hanzi":"要","part":"Verb","pinyin":"yào","def":"to want","ex":[{"zh":"我要喝咖啡。","py":"Wǒ yào hē kāfēi.","en":"I want to drink coffee."},{"zh":"你要喝中国茶吗？","py":"Nǐ yào hē Zhōngguó chá ma?","en":"Do you want to drink Chinese tea?"}]},{"id":20,"hanzi":"喜欢","part":"Verb","pinyin":"xǐhuan","def":"to like","ex":[{"zh":"我喜欢中国茶。","py":"Wǒ xǐhuan Zhōngguó chá.","en":"I like Chinese tea"},{"zh":"我喜欢美国咖啡。","py":"Wǒ xǐhuan Měiguó kāfēi.","en":"Ｉlike American coffee."}]},{"id":21,"hanzi":"喝","part":"Verb","pinyin":"hē","def":"to drink","ex":[{"zh":"我很喜欢喝中国茶。","py":"Wǒ hěn xǐhuan hē Zhōngguó chá.","en":"I really like to drink Chinese tea."},{"zh":"你喜欢喝日本茶吗？","py":"Nǐ xǐhuan hē Rìběn chá ma?","en":"Do you like to drink Japanese tea?"}]},{"id":22,"hanzi":"吃","part":"Verb","pinyin":"chī","def":"to eat","ex":[{"zh":"你喜欢吃什么？","py":"Nǐ xǐhuan chī shénme?","en":"What do you like to eat?"},{"zh":"你喜不喜欢吃美国菜？","py":"Nǐ xǐ bùxǐhuan chī Měiguó cài?","en":"Do you like American food?"}]},{"id":23,"hanzi":"咖啡","part":"Noun","pinyin":"kāfēi","def":"coffee","ex":[{"zh":"你喜不喜欢喝咖啡？","py":"Nǐ xǐ bùxǐhuan hē kāfēi?","en":"Do you like to drink coffee?"},{"zh":"你要喝咖啡吗？","py":"Nǐ yào hē kāfēi ma?","en":"Do you want to drink coffee?"}]},{"id":24,"hanzi":"菜","part":"Noun","pinyin":"cài","def":"dish, cuisine","ex":[{"zh":"你喜欢哪国菜？","py":"Nǐ xǐhuan nǎ guó cài?","en":"Which country's food do you like?"},{"zh":"你喜欢日本菜吗？","py":"Nǐ xǐhuan Rìběn cài ma?","en":"Do you like Japanese food?"}]},{"id":25,"hanzi":"茶","part":"Noun","pinyin":"chá","def":"tea","ex":[{"zh":"我很喜欢喝茶。","py":"Wǒ hěn xǐhuan hē chá.","en":"I really like to drink tea."},{"zh":"我喜欢中国茶.","py":"Wǒ xǐhuan Zhōngguó chá.","en":"I like Chinese tea."}]},{"id":26,"hanzi":"口","part":"Measure word","pinyin":"kǒu","def":"measure word for family members","ex":[{"zh":"我家有三口人","py":"Wǒ jiā yǒu sān kǒu rén.","en":"There are three people in my family."},{"zh":"他家有五口人。","py":"Tā jiā yǒu wǔ kǒu rén.","en":"There are five people in his family."}]},{"id":27,"hanzi":"个","part":"Measure word","pinyin":"gè","def":"general measure word, measure word for people","ex":[{"zh":"我有两个妹妹。","py":"Wǒ yǒu lǐang gè mèimei.","en":"I have two younger sisters."},{"zh":"我有一个妹妹和一个弟弟。","py":"Wǒ yǒu yí gè mèimei hé yí gè dìdi.","en":"I have one younger sister and one younger brother."}]},{"id":28,"hanzi":"爸爸","part":"Noun","pinyin":"bàba","def":"father","ex":[{"zh":"我的爸爸有一个姐姐。","py":"Wǒ de bàba yǒu yí gè jiějie.","en":"My father has an older sister."},{"zh":"我的爸爸是中国人。","py":"Wǒ de bàba shì Zhōngguó rén.","en":"My father is Chinese."}]},{"id":29,"hanzi":"妈妈","part":"Noun","pinyin":"māma","def":"mother","ex":[{"zh":"他的妈妈是玛丽。","py":"Tā de māma shì Mǎlì.","en":"His mother is Mary."},{"zh":"他的妈妈和爸爸都是老师。","py":"Tā de māma hé bàba dōu shì lǎoshī.","en":"His mother and father are both teachers."}]},{"id":30,"hanzi":"哥哥","part":"Noun","pinyin":"gēge","def":"older brother","ex":[{"zh":"我有两个哥哥。","py":"Wǒ yǒu liǎng gè gēge.","en":"I have two older brothers."},{"zh":"我的哥哥喜欢喝日本茶。","py":"Wǒ de gēge xǐhuan hē Rìběn chá.","en":"My older brother likes to drink Japanese tea."}]},{"id":31,"hanzi":"姐姐","part":"Noun","pinyin":"jiějie","def":"older sister","ex":[{"zh":"他的姐姐叫玛丽。","py":"Tā de jiějie jiào Mǎlì.","en":"His older sister is called Mary."},{"zh":"他有两个姐姐。","py":"Tā yǒu liǎng gè jiějie.","en":"He has two older sisters."}]},{"id":32,"hanzi":"弟弟","part":"Noun","pinyin":"dìdi","def":"younger brother","ex":[{"zh":"你有没有弟弟？","py":"Nǐ yǒu méiyǒu dìdi?","en":"Do you have younger brothers?"},{"zh":"我和我弟弟都喜欢吃日本菜。","py":"Wǒ hé wǒ dìdi dōu xǐhuan chī Rìběn cài.","en":"My brother and I both like Japanese dish."}]},{"id":33,"hanzi":"妹妹","part":"Noun","pinyin":"mèimei","def":"younger sister","ex":[{"zh":"你的妹妹叫什么名字?","py":"Nǐ de mèimei jiào shénme míngzì?","en":"What is your younger sister's name?"},{"zh":"他的妹妹很好看。","py":"Tā de mèimei hěn hǎokàn.","en":"His younger sister is good-looking."}]},{"id":34,"hanzi":"家","part":"Noun","pinyin":"jiā","def":"home, family","ex":[{"zh":"我家有三口人。","py":"Wǒ jiā yǒu sān kǒu rén.","en":"There are three people in my family."},{"zh":"你家有几口人？","py":"Nǐ jiā yǒu jǐ kǒu rén?","en":"How many people are there in your family?"}]},{"id":35,"hanzi":"和","part":"Conj","pinyin":"hé","def":"and","ex":[{"zh":"我有一个哥哥和一个姐姐。","py":"Wǒ yǒu yí gè gēge hé yí gè jiějie.","en":"I have an older brother and an older sister."},{"zh":"我和小程都有姐姐。","py":"Wǒ hé xiǎo chéng dōu yǒu jiějie.","en":"Little Cheng and I both have older sisters."}]},{"id":36,"hanzi":"谁","part":"Pronoun","pinyin":"shéi","def":"who","ex":[{"zh":"他是谁?","py":"Tā shì shéi?","en":"Who is he?"},{"zh":"谁是你的老师？","py":"Shéi shì nǐ de lǎoshī?","en":"Who is your teacher?"}]},{"id":37,"hanzi":"狗","part":"Noun","pinyin":"gǒu","def":"dog","ex":[{"zh":"平安的狗叫奶茶。","py":"Píng'ān de gǒu jiào nǎichá.","en":"Ping An's dog is called Milk Tea."},{"zh":"我们有一只狗, 他叫来福。","py":"Wǒmen yǒu yì zhī gǒu, tā jiào lái fú.","en":"We have a dog, it is called Lucky."}]},{"id":38,"hanzi":"好看","part":"Adj","pinyin":"hǎokàn","def":"good-looking","ex":[{"zh":"我的房子很好看","py":"Wǒ de fángzi hěn hǎokàn.","en":"My house is good-looking."},{"zh":"他很好看。","py":"Tā hěn hǎokàn.","en":"He is good-looking."}]},{"id":39,"hanzi":"书","part":"Noun","pinyin":"shū","def":"book, books","ex":[{"zh":"我有一本书。","py":"Wǒ yǒu yìběn shū.","en":"I have a book."},{"zh":"我喜欢看书。","py":"Wǒ xǐhuan kàn shū.","en":"I like to read books."}]},{"id":40,"hanzi":"兄弟姐妹","part":"Noun","pinyin":"xiōngdì jiěmèi","def":"siblings","ex":[{"zh":"美美有三个兄弟姐妹。","py":"Měiměi yǒu sān gè xiōngdì jiěmèi.","en":"Meimei has there siblings."},{"zh":"你的兄弟姐妹都喜欢吃日本菜吗?","py":"Nǐ de xiōngdì jiěmèi dōu xǐhuan chī Rìběn cài ma?","en":"Do your siblings all like to eat Japanese cuisine?"}]},{"id":41,"hanzi":"房子","part":"Noun","pinyin":"fángzi","def":"house","ex":[{"zh":"他喜欢他爸爸妈妈的房子。","py":"Tā xǐhuan tā bàba māma de fángzi.","en":"He likes his parent’s house."},{"zh":"你的爸爸妈妈的房子很好看。","py":"Nǐ de bàba māma de fángzi hěn hǎokàn.","en":"The house of your father and mother is really good-looking."}]},{"id":42,"hanzi":"家人","part":"Noun","pinyin":"jiārén","def":"family member","ex":[{"zh":"我和我的家人都喜欢喝咖啡。","py":"Wǒ hé wǒ de jiārén dōu xǐhuan hē kāfēi.","en":"My family and I all like to drink coffee."},{"zh":"你的家人喜欢什么？","py":"Nǐ de jiārén xǐhuan shénme?","en":"What do your family members like?"}]},{"id":43,"hanzi":"介绍","part":"Verb","pinyin":"jièshào","def":"to introduce","ex":[{"zh":"请你介绍你的家人。","py":"Qǐng nǐ jièshào nǐ de jiārén.","en":"Please introduce your family."},{"zh":"请介绍你自己。","py":"Qǐng jièshào nǐ zìjǐ.","en":"Please introduce yourself."}]},{"id":44,"hanzi":"漂亮","part":"Adj","pinyin":"piàoliàng","def":"beautiful","ex":[{"zh":"你姐姐很漂亮。","py":"Nǐ jiějie hěn piàoliàng.","en":"Your older sister is really beautiful."},{"zh":"他有很多漂亮的照片。","py":"Tā yǒu hěnduō piàoliàng de zhàopiàn.","en":"She has many beautiful pictures."}]},{"id":45,"hanzi":"张","part":"Measure word","pinyin":"zhāng","def":"a measure word for photograph, picture, paper, table etc.","ex":[{"zh":"我有很多张照片。","py":"Wǒ yǒu hěn duō zhāng zhàopiàn.","en":"I have many pictures."},{"zh":"我很喜欢这张照片。","py":"Wǒ hěn xǐhuan zhè zhāng zhàopiàn.","en":"I really like this picture."}]},{"id":46,"hanzi":"女儿","part":"Noun","pinyin":"nǚér","def":"daughter","ex":[{"zh":"我有一个漂亮的女儿。","py":"Wǒ yǒu yí gè piàoliàng de nǚér.","en":"I have a beautiful daughter."},{"zh":"这是我哥哥女儿的猫。","py":"Zhè shì wǒ gēge nǚér de māo.","en":"This cat belongs to the daughter of my older brother."}]},{"id":47,"hanzi":"猫","part":"Noun","pinyin":"māo","def":"cat","ex":[{"zh":"他有很多只猫。","py":"Tā yǒu hěnduō zhī māo.","en":"He has many cats."},{"zh":"我妹妹有猫也有狗。","py":"Wǒ mèimei yǒu māo yě yǒu gǒu.","en":"My younger sister has cats and also has dogs."}]},{"id":48,"hanzi":"照片","part":"Noun","pinyin":"zhàopiàn","def":"pictures, photos","ex":[{"zh":"我有很多照片。","py":"Wǒ yǒu hěn duō zhàopiàn.","en":"I have many pictures."},{"zh":"这是谁的照片? 很好看!","py":"Zhè shì shéi de zhàopiàn? Hěn hǎokàn!","en":"Whose picture is it? It’s really good-looking."}]},{"id":49,"hanzi":"多","part":"Adj","pinyin":"duō","def":"many, more","ex":[{"zh":"我有很多书。","py":"Wǒ yǒu hěn duō shū.","en":"I have many books."},{"zh":"我没有很多照片。","py":"Wǒ méiyǒu hěn duō zhàopiàn.","en":"I don't have many pictures."}]},{"id":50,"hanzi":"两","part":"Numeral","pinyin":"liǎng","def":"two","ex":[{"zh":"我有两个女儿。","py":"Wǒ yǒu liǎng gè nǚér.","en":"I have two daughters."},{"zh":"他有两张很漂亮的照片。","py":"Tā yǒu liǎng zhāng hěn piàoliàng de zhàopiàn.","en":"He has two very beautiful photos."}]},{"id":51,"hanzi":"可爱","part":"Adj","pinyin":"kěài","def":"cute,lovely","ex":[{"zh":"他很可爱。","py":"Tā hěn kěài.","en":"She is cute."},{"zh":"他的狗很可爱。","py":"Tā de gǒu hěn kěài.","en":"His dog is really cute."}]},{"id":52,"hanzi":"块","part":"Measure word","pinyin":"kuài","def":"piece； dollar","ex":[{"zh":"我有两块钱。","py":"Wǒ yǒu liǎng kuài qián.","en":"I have two dollars."},{"zh":"这杯咖啡五十块。","py":"Zhè bēi kāfēi wǔshí kuài.","en":"This cup of coffee is fifty dollars."}]},{"id":53,"hanzi":"杯","part":"Measure word","pinyin":"bēi","def":"cup, cups","ex":[{"zh":"我有一杯咖啡。","py":"Wǒ yǒu yì bēi kāfēi.","en":"I have a cup of coffee."},{"zh":"那杯茶三十块。","py":"Nà bēi chá sānshí kuài.","en":"That cup of tea is thirty dollars."}]},{"id":54,"hanzi":"瓶","part":"Measure word","pinyin":"píng","def":"bottle, bottles","ex":[{"zh":"我有一瓶牛奶。","py":"Wǒ yǒu yì píng niúnǎi.","en":"I have a bottle of milk."},{"zh":"一瓶水,多少钱？","py":"Yì píng shuǐ, duōshǎo qián?","en":"How much does a bottle of water cost?"}]},{"id":55,"hanzi":"买","part":"Verb","pinyin":"mǎi","def":"buy","ex":[{"zh":"我们去买东西。","py":"Wǒmen qù mǎi dōngxi.","en":"Let's go to buy some things."},{"zh":"他买什么东西？","py":"Tā mǎi shénme dōngxi?","en":"What does he buy?"}]},{"id":56,"hanzi":"钱","part":"Noun","pinyin":"qián","def":"money","ex":[{"zh":"那个东西多少钱?","py":"Nà gè dōngxi duōshǎo qián?","en":"How much does that thing cost?"},{"zh":"这些不是我的钱。","py":"Zhèxiē búshì wǒ de qián.","en":"Those is not my money."}]},{"id":57,"hanzi":"东西","part":"Noun","pinyin":"dōngxi","def":"thing, things, stuff","ex":[{"zh":"这不是我的东西。","py":"Zhè búshì wǒ de dōngxi.","en":"This is not my stuff."},{"zh":"这些东西一共多少钱？","py":"Zhèxiē dōngxi yígòng duōshǎo qián?","en":"How much do those stuff cost?"}]},{"id":58,"hanzi":"谢谢","part":"Phrase","pinyin":"xièxie","def":"Thank you","ex":[{"zh":"谢谢你!","py":"Xièxie nǐ!","en":"Thank you!"},{"zh":"A: 你的家很漂亮。 B: 谢谢你！","py":"A: Nǐ de jiā hěn piàoliang. B: Xièxie nǐ!","en":"A: Your house is beautiful. B: Thank you!"}]},{"id":59,"hanzi":"不客气","part":"Phrase","pinyin":"búkèqì","def":"You're welcome","ex":[{"zh":"A: 谢谢你帮忙检查我的文章。 B: 不客气，随时都乐意！","py":"A: Xièxiè nǐ bāngmáng jiǎnchá wǒ de wénzhāng. B: Bù kèqì, suíshí dōu lèyì!","en":"A: Thanks for checking my essay. B: No problem! Happy to anytime!"}]},{"id":60,"hanzi":"些","part":"Measure word","pinyin":"xiē","def":"some","ex":[{"zh":"这些东西是谁的?","py":"Zhè xiē dōngxi shì shéi de?","en":"Whose things are these?"},{"zh":"这些东西一共多少钱?","py":"Zhè xiē dōngxi yígòng duōshǎo qián?","en":"How much do these things cost all together?"}]},{"id":61,"hanzi":"百","part":"Noun","pinyin":"bǎi","def":"hundred","ex":[{"zh":"这个东西一百块钱。","py":"Zhègè dōngxi yìbǎi kuài qián.","en":"This thing is one hundred dollars."},{"zh":"你有一百块吗？","py":"Nǐ yǒu yìbǎi kuài ma?","en":"Do you have one hundred dollars?"}]},{"id":62,"hanzi":"一共","part":"Adv","pinyin":"yígòng","def":"altogether","ex":[{"zh":"三杯咖啡和一杯茶,一共多少钱？","py":"Sān bēi kāfēi hé yì bēi chá, yígòng duōshǎo qián？","en":"How much for 3 cups of coffee and one cup of tea?"},{"zh":"这些东西一共两百块。","py":"Zhè xiē dōngxi yígòng liǎng bǎi kuài.","en":"Those things are 200 dollars altogether."}]},{"id":63,"hanzi":"今天","part":"Noun","pinyin":"jīntiān","def":"today","ex":[{"zh":"我今天晚上看电影。","py":"Wǒ jīntiān wǎnshàng kàn diànyǐng.","en":"I'll watch a movie tonight."},{"zh":"我们今天七点看电影。","py":"Wǒmen jīntiān qīdiǎn kàn diànyǐng.","en":"We'll watch a movie at 7pm today."}]},{"id":64,"hanzi":"几点","part":"Phrase","pinyin":"jǐdiǎn","def":"What time","ex":[{"zh":"现在几点?","py":"Xiànzài jǐdiǎn？","en":"What time is it?"},{"zh":"你今天几点做饭？","py":"Nǐ jīntiān jǐdiǎn zuòfàn?","en":"What time do you cook today?"}]},{"id":65,"hanzi":"分","part":"Noun","pinyin":"fēn","def":"minute","ex":[{"zh":"现在是两点十分。","py":"Xiànzài shì liǎng diǎn shí fēn.","en":"It is ten past two o'clock now."},{"zh":"我今天九点十分有中文课。","py":"Wǒ jīntiān jiǔ diǎn shí fēn yǒu Zhōngwén kè.","en":"I have Chinese class at nine ten this morning."}]},{"id":66,"hanzi":"看","part":"Verb","pinyin":"kàn","def":"to read, to watch","ex":[{"zh":"他喜欢看电影。","py":"Tā xǐhuan kàn diànyǐng.","en":"He likes to watch movies."},{"zh":"你喜欢看什么书？","py":"Nǐ xǐhuan kàn shénme shū?","en":"What books do you like to read?"}]},{"id":67,"hanzi":"电影","part":"Noun","pinyin":"diànyǐng","def":"movie","ex":[{"zh":"你喜欢看什么电影？","py":"Nǐ xǐhuan kàn shénme diànyǐng?","en":"What movie do you like to watch?"},{"zh":"妹妹喜欢看电影。","py":"Mèimei xǐhuan kàn diànyǐng.","en":"My younger sister likes to watch movies."}]},{"id":68,"hanzi":"上网","part":"Verb Object","pinyin":"shàngwǎng","def":"Surf Internet","ex":[{"zh":"我喜欢上网。","py":"Wǒ xǐhuan shàngwǎng.","en":"I like to surf the Internet."},{"zh":"我不常上网,可是我常看书。","py":"Wǒ bùcháng shàngwǎng, kěshì wǒ cháng kànshū.","en":"I don't surf the Internet often, but I often read books."}]},{"id":69,"hanzi":"现在","part":"Noun","pinyin":"xiànzài","def":"now","ex":[{"zh":"现在是一点五十五分。","py":"Xiànzài shì yì diǎn wǔshí wǔ fēn.","en":"It’s one fifty-five now."},{"zh":"现在几点?","py":"Xiànzài jǐdiǎn？","en":"What time is it?"}]},{"id":70,"hanzi":"半","part":"Noun","pinyin":"bàn","def":"half","ex":[{"zh":"现在是六点半。","py":"Xiànzài shì liù diǎn bàn.","en":"Now it is six thirty."},{"zh":"我早上九点半去上课。","py":"Wǒ zǎoshàng jiǔ diǎn bàn qù shàngkè.","en":"I go to class at nine thirty in the morning."}]},{"id":71,"hanzi":"做","part":"Verb","pinyin":"zuò","def":"to do","ex":[{"zh":"你喜欢做什么?","py":"Nǐ xǐhuān zuò shénme?","en":"What do you like to do?"},{"zh":"你和你的家人喜欢做什么?","py":"Nǐ hé nǐ de jiārén xǐhuān zuò shénme?","en":"What do you and your family like to do?"}]},{"id":72,"hanzi":"做饭","part":"Verb Object","pinyin":"zuòfàn","def":"to cook","ex":[{"zh":"你喜欢做饭吗？","py":"Nǐ xǐhuan zuò fàn ma?","en":"Do you like to cook?"},{"zh":"你几点会做饭？","py":"Nǐ jǐdiǎn huì zuò fàn?","en":"What time will you cook?"}]},{"id":73,"hanzi":"吃饭","part":"Verb Object","pinyin":"chīfàn","def":"to eat","ex":[{"zh":"你今天几点吃饭？","py":"Nǐ jīntiān jǐdiǎn chīfàn?","en":"What time do you eat today?"},{"zh":"他今天十二点吃饭。","py":"Tā jīntiān shí'èr diǎn chīfàn.","en":"He has dinner at twelve o'clock today."}]},{"id":74,"hanzi":"请问","part":"Phrase","pinyin":"qǐngwèn","def":"Excuse me, may I ask…","ex":[{"zh":"请问这个东西多少钱?","py":"Qǐngwèn zhège dōngxi duōshǎo qián?","en":"May I ask about how much does this thing cost?"},{"zh":"请问现在几点？","py":"Qǐngwèn xiànzài jǐdiǎn?","en":"Excuse me, what time is it now?"}]},{"id":75,"hanzi":"饭馆","part":"Noun","pinyin":"fànguǎn","def":"restaurant","ex":[{"zh":"这间饭馆好不好？","py":"Zhè jiān fànguǎn hǎo bùhǎo?","en":"Is this restaurant good or not?"},{"zh":"我和我的家人都喜欢这个饭馆。","py":"Wǒ hé wǒ de jiārén dōu xǐhuan zhège fànguǎn.","en":"My family and I all like this restaurant ."}]},{"id":76,"hanzi":"服务员","part":"Noun","pinyin":"fúwùyuán","def":"waiter, waitress","ex":[{"zh":"这家饭馆的服务员，人很好。","py":"Zhè jiā fànguǎn de fúwùyuán, rén hěnhǎo.","en":"The waiter/ waitress from this restaurant is very nice."},{"zh":"这个服务员很漂亮。","py":"Zhège fúwùyuán hěn piàoliang.","en":"This waitress is very pretty."}]},{"id":77,"hanzi":"杯子","part":"Noun","pinyin":"bēizi","def":"cup","ex":[{"zh":"我们要两个杯子。","py":"Wǒmen yào liǎng gè bēizi.","en":"We would like to have two cups."},{"zh":"这个杯子多少钱?","py":"Zhège bēizi duōshǎo qián?","en":"How much is this cup?"}]},{"id":78,"hanzi":"真","part":"Adv","pinyin":"zhēn","def":"really","ex":[{"zh":"你妹妹真漂亮。","py":"Nǐ mèimei zhēn piàoliang.","en":"Your younger sister is really pretty."},{"zh":"这个东西真贵。","py":"Zhège dōngxi zhēn guì.","en":"This thing is really expensive."}]},{"id":79,"hanzi":"点菜","part":"Verb Object","pinyin":"diǎncài","def":"to order food","ex":[{"zh":"请服务员来帮我们点菜。","py":"Qǐng fúwùyuán lái bāng wǒmen diǎn cài.","en":"Please ask the waiter to take our order."},{"zh":"请你帮我点菜。","py":"Qǐng nǐ bāng wǒ diǎncài.","en":"Please order for me."}]},{"id":80,"hanzi":"好吃","part":"Adj","pinyin":"hǎochī","def":"tasty/delicious","ex":[{"zh":"我妈妈做的饭很好吃。","py":"Wǒ māma zuò de fàn hěn hǎochī.","en":"The dish made from my mother is tasty."},{"zh":"中国菜很好吃。","py":"Zhōngguó cài hěn hǎochī.","en":"Chinese food is tasty."}]},{"id":81,"hanzi":"水","part":"Noun","pinyin":"shuǐ","def":"water","ex":[{"zh":"我有一杯水。","py":"Wǒ yǒu yì bēi shuǐ.","en":"I have a cup of water."},{"zh":"请问一杯水多少钱?","py":"Qǐngwèn yì bēi shuǐ duōshǎo qián?","en":"How much does a cup of water cost?"}]},{"id":82,"hanzi":"少","part":"Adj","pinyin":"shǎo","def":"few","ex":[{"zh":"我们家书很少。","py":"Wǒmen jiā shū hěn shǎo.","en":"We have very few books at home."},{"zh":"我们的照片很少。","py":"Wǒmen de zhàopiàn hěn shǎo.","en":"We have very few photos."}]},{"id":83,"hanzi":"买单","part":"Verb Object","pinyin":"mǎidān","def":"to pay","ex":[{"zh":"服务员，请买单。","py":"Fúwùyuán, qǐng mǎidān.","en":"Waiter, we want to pay."},{"zh":"这儿买单。","py":"Zhèr mǎidān.","en":"Pay here."}]},{"id":84,"hanzi":"昨天","part":"Noun","pinyin":"zuótiān","def":"yesterday","ex":[{"zh":"昨天我跟我妈妈去看电影。","py":"Zuótiān wǒ gēn wǒ māma qù kàn diànyǐng.","en":"I went to watch a movie with my mother yesterday."},{"zh":"我们昨天去那家饭馆吃饭。","py":"Wǒmen zuótiān qù nà jiā fànguǎn chīfàn.","en":"We went to that restaurant having a meal yesterday."}]},{"id":85,"hanzi":"明天","part":"Noun","pinyin":"míngtiān","def":"tomorrow","ex":[{"zh":"明天要不要去吃饭?","py":"Míngtiān yàobúyào qù chīfàn?","en":"Do you want to go and eat tomorrow?"},{"zh":"我们明天去买东西。","py":"Wǒmen míngtiān qù mǎi dōngxi","en":"Tomorrow we will go and buy things."}]},{"id":86,"hanzi":"什么时候","part":"Phrase","pinyin":"shénme shíhou","def":"when","ex":[{"zh":"你什么时候去看电影?","py":"Nǐ shénme shíhou qù kàn diànyǐng?","en":"When are you going to watch movie?"},{"zh":"你什么时候起床?","py":"Nǐ shénme shíhou qǐchuáng?","en":"When do you get up?"}]},{"id":87,"hanzi":"上午","part":"Noun","pinyin":"shàngwǔ","def":"morning","ex":[{"zh":"我上午要上课。","py":"Wǒ shàngwǔ yào shàngkè","en":"I have classes in the morning."},{"zh":"他上午跟妹妹做菜。","py":"Tā shàngwǔ gēn mèimei zuòcài.","en":"He cooks with his younger sister in the morning."}]},{"id":88,"hanzi":"星期","part":"Noun","pinyin":"xīngqī","def":"Week, day of the week","ex":[{"zh":"星期一我们要上课。","py":"Xīngqī yī wǒmen yào shàngkè.","en":"We have class on Monday."},{"zh":"这个星期我们要去看电影。","py":"Zhège xīngqī wǒmen yào qù kàn diànyǐng.","en":"This week we are going to watch a movie."}]},{"id":89,"hanzi":"起床","part":"Verb Object","pinyin":"qǐchuáng","def":"wake up","ex":[{"zh":"我八点起床。","py":"Wǒ bādiǎn qǐchuáng.","en":"I wake up at eight."},{"zh":"他七点起床，十点睡觉。","py":"Tā qīdiǎn qǐchuáng, shídiǎn shuìjiào.","en":"He wakes up at seven and goes to sleep at ten."}]},{"id":90,"hanzi":"早饭","part":"Noun","pinyin":"zǎofàn","def":"breakfast","ex":[{"zh":"我们九点吃早饭。","py":"Wǒmen jiǔdiǎn chī zǎofàn.","en":"We eat breakfast at nine."},{"zh":"我不吃早饭。","py":"Wǒ bù chī zǎofàn.","en":"I don’t eat breakfast."}]},{"id":91,"hanzi":"睡觉","part":"Verb Object","pinyin":"shuìjiào","def":"sleep","ex":[{"zh":"我爸爸十点睡觉。","py":"Wǒ bàba shídiǎn shuìjiào.","en":"My dad sleeps at ten."},{"zh":"他不睡觉也不吃饭。","py":"Tā bú shuìjiào yě bù chīfàn.","en":"He doesn’t sleep or eat."}]},{"id":92,"hanzi":"上课","part":"Verb Object","pinyin":"shàngkè","def":"go to class,attend class","ex":[{"zh":"我们明天要上课。","py":"Wǒmen míngtiān yào shàngkè.","en":"We have class tomorrow."},{"zh":"昨天我们去上课也去看电影。","py":"Zuótiān wǒmen qù shàngkè yě qù kàn diànyǐng.","en":"We went to class and also went to watch a movie yesterday."}]},{"id":93,"hanzi":"想","part":"Verb","pinyin":"xiǎng","def":"to want to ,to plan to/to think","ex":[{"zh":"我想跟你看电影。","py":"Wǒ xiǎng gēn nǐ kàn diànyǐng.","en":"I want to watch a movie with you."},{"zh":"我今天想吃中国菜。","py":"Wǒ jīntiān xiǎng chī Zhōngguó cài.","en":"I want to eat Chinese food today."}]},{"id":94,"hanzi":"月","part":"Measure word","pinyin":"yuè","def":"month","ex":[{"zh":"明天是十二月六日。","py":"Míngtiān shì shíèr yuè liù rì.","en":"Tomorrow is December 6th."},{"zh":"三月七日是我的生日,我想请你来我家。","py":"Sānyuè qīrì shì wǒ de shēngrì, wǒ xiǎng qǐng nǐ lái wǒ jiā.","en":"My birthday is on the seventh of March, I would like to invite you to my home."}]},{"id":95,"hanzi":"日","part":"Measure word","pinyin":"rì","def":"day","ex":[{"zh":"今天是十二月五日。","py":"Jīntiān shì shíèr yuè wǔ rì.","en":"Today is December 5th."},{"zh":"圣诞节是十二月二十五日","py":"Shèngdàn jié shì shí'èr yuè èrshíwǔ rì","en":"Christmas is December 25th"}]},{"id":96,"hanzi":"下午","part":"Noun","pinyin":"xiàwǔ","def":"afternoon","ex":[{"zh":"你明天下午做什么?","py":"Nǐ míngtiān xiàwǔ zuò shénme?","en":"What are you going to do tomorrow afternoon?"},{"zh":"你今天下午想做什么？","py":"Nǐ jīntiān xiàwǔ xiǎng zuò shénme?","en":"What do you want to do this afternoon?"}]},{"id":97,"hanzi":"晚上","part":"Noun","pinyin":"wǎnshàng","def":"evening","ex":[{"zh":"你明天晚上看电影吗?","py":"Nǐ míngtiān wǎnshàng kàn diànyǐng ma?","en":"Do you want to watch a movie tomorrow night?"},{"zh":"我今天晚上没有空。","py":"Wǒ jīntiān wǎnshàng méiyǒu kòng.","en":"I'm not free tonight."}]},{"id":98,"hanzi":"请","part":"Verb","pinyin":"qǐng","def":"to treat, to invite","ex":[{"zh":"明天我请你去中国饭馆吃饭。","py":"Míngtiān wǒ qǐng nǐ qù Zhōngguó fànguǎn chīfàn.","en":"Tomorrow I'll treat you to a meal at a Chinese restaurant."},{"zh":"他想请你看电影。","py":"Tā xiǎng qǐng nǐ kàn diànyǐng.","en":"He wants to treat you to a movie."}]},{"id":99,"hanzi":"来","part":"Verb","pinyin":"lái","def":"to come","ex":[{"zh":"他来我家吃饭。","py":"Tā lái wǒ jiā chīfàn.","en":"He came to my house and had a meal."},{"zh":"你什么时候来我家？","py":"Nǐ shénme shíhou lái wǒ jiā?","en":"When do you come to my place?"}]},{"id":100,"hanzi":"有空","part":"Verb","pinyin":"yǒukòng","def":"have free time, to be free","ex":[{"zh":"你有空吗?","py":"Nǐ yǒukòng ma?","en":"Are you free?"},{"zh":"他今天下午没有空。","py":"Tā jīntiān xiàwǔ méiyǒu kòng.","en":"He is not free this afternoon."}]},{"id":101,"hanzi":"对不起","part":"Phrase","pinyin":"duìbùqǐ","def":"sorry","ex":[{"zh":"A: 对不起。 B: 没关系 。","py":"A: Duìbùqǐ. B: Méiguānxi.","en":"A: I am sorry. B: It’s ok."},{"zh":"我只想说对不起。","py":"Wǒ zhǐ xiǎng shuō duìbùqǐ.","en":"I only want to say I'm sorry."}]},{"id":102,"hanzi":"没关系","part":"Phrase","pinyin":"méiguānxi","def":"that's ok, no problem","ex":[{"zh":"A: 对不起。 B: 没关系。","py":"A: Duìbùqǐ. B: Méiguānxi.","en":"A: I am sorry. B: It’s ok."},{"zh":"A: 对不起，今天晚上我没空。 B: 没关系。","py":"A: Duìbùqǐ，jīntiān wǎnshàng wǒ méi kòng. B: Méiguānxi.","en":"A: I am sorry, I don't have free time tonight. B: It’s ok."}]},{"id":103,"hanzi":"生日","part":"Noun","pinyin":"shēngrì","def":"birthday","ex":[{"zh":"我的生日是二月十八号。","py":"Wǒ de shēngrì shì èr yuè shíbā hào.","en":"My birthday is February eighteenth."},{"zh":"今天是你的生日，我请你吃饭。","py":"Jīntiān shì nǐ de shēngrì, wǒ qǐng nǐ chīfàn.","en":"It's your birthday today, I will treat you to a meal."}]},{"id":104,"hanzi":"打球","part":"Verb Object","pinyin":"dǎqiú","def":"to play ball games, ball sports","ex":[{"zh":"每个周末我都会跟朋友去打球","py":"Měi gè zhōumò wǒ dūhuì gēn péngyou qù dǎqiú","en":"I play basketball with my friends every weekend."},{"zh":"我周末常打球。","py":"Wǒ zhōumò cháng dǎqiú.","en":"I often play ball on weekends."}]},{"id":105,"hanzi":"篮球","part":"Noun","pinyin":"lánqiú","def":"basketball","ex":[{"zh":"你打篮球吗?","py":"Nǐ dǎ lánqiú ma?","en":"Do you play basketball?"},{"zh":"我们明天早起去打篮球，好不好?","py":"Wǒmen míngtiān zǎoqǐ qù dǎ lánqiú, hǎo bùhǎo?","en":"Let’s wake up early tomorrow to play basketball, okay?"}]},{"id":106,"hanzi":"球赛","part":"Noun","pinyin":"qiúsài","def":"match, ball games","ex":[{"zh":"你喜欢看球赛吗?","py":"Nǐ xǐhuan kàn qiúsài ma?","en":"Do you like to watch sports matches?"},{"zh":"你昨天看什么球赛?","py":"Nǐ zuótiān kàn shénme qiúsài?","en":"What ball game did you watch last night?"}]},{"id":107,"hanzi":"逛街","part":"Verb Object","pinyin":"guàngjiē","def":"shopping","ex":[{"zh":"他喜欢去逛街。","py":"Tā xǐhuan qù guàngjiē.","en":"She likes to go shopping."},{"zh":"你今天晚上有空去逛街吗？","py":"Nǐ jīntiān wǎnshàng yǒu kòng qù guàngjiē ma?","en":"Do you have time to go shopping tonight?"}]},{"id":108,"hanzi":"周末","part":"Noun","pinyin":"zhōumò","def":"weekend","ex":[{"zh":"周末他做什么?","py":"Zhōumò tā zuò shénme?","en":"What does he do on weekends?"},{"zh":"星期五晚上运动的人很多，周末呢?","py":"Xīngqī wǔ wǎnshàng yùndòng de rén hěnduō, zhōumò ne?","en":"A lot of people exercise on Friday evenings, how about the weekend?"}]},{"id":109,"hanzi":"早起","part":"Verb","pinyin":"zǎoqǐ","def":"to wake up early","ex":[{"zh":"我喜欢早起去打球。","py":"Wǒ xǐhuan zǎoqǐ qù dǎ qiú.","en":"I like to wake up early to play the ball."},{"zh":"你是早起的人。","py":"Nǐ shì zǎoqǐ de rén.","en":"You are a person who always wakes up early."}]},{"id":110,"hanzi":"觉得","part":"Verb","pinyin":"juéde","def":"to feel,to think,to consider","ex":[{"zh":"我觉得做饭很好玩儿。","py":"Wǒ juéde zuòfàn hěn hǎowánr.","en":"I think cooking is fun."},{"zh":"你觉得学习中文好不好玩？","py":"Nǐ juéde xuéxí Zhōngwén hǎo bùhǎo wán?","en":"Do you think learning Chinese is fun or not?"}]},{"id":111,"hanzi":"好玩儿","part":"Adj","pinyin":"hǎowán'er","def":"interesting, fun, enjoyable","ex":[{"zh":"打篮球很好玩儿。","py":"Dǎ lánqiú hěn hǎowánr.","en":"It’s fun to play basketball."},{"zh":"这个电脑游戏很好玩儿。","py":"Zhège diànnǎo yóuxì hěn hǎowánr。","en":"This computer game is fun."}]},{"id":112,"hanzi":"运动","part":"Noun","pinyin":"yùndòng","def":"exercise, to exercise","ex":[{"zh":"你喜欢什么运动?","py":"Nǐ xǐhuan shénme yùndòng?","en":"What sports do you like?"},{"zh":"他常运动。","py":"Tā cháng yùndòng.","en":"He exercises often."}]},{"id":113,"hanzi":"电影院","part":"Noun","pinyin":"diànyǐngyuàn","def":"cinema","ex":[{"zh":"我现在在电影院看电影。","py":"Wǒ xiànzài zài diànyǐngyuàn kàn diànyǐng.","en":"I am now at the cinema watching a movie."},{"zh":"你想什么时候去电影院？","py":"Nǐ xiǎng shénme shíhou qù diànyǐngyuàn?","en":"When do you want to go to a cinema?"}]},{"id":114,"hanzi":"学习","part":"Verb","pinyin":"xuéxí","def":"to study","ex":[{"zh":"他在中国学习中文。","py":"Tā zài Zhōngguó xuéxí Zhōngwén.","en":"He studies Chinese in China."},{"zh":"我喜欢在图书馆学习。","py":"Wǒ xǐhuan zài túshūguǎn xuéxí.","en":"I like to study in the library."}]},{"id":115,"hanzi":"酒吧","part":"Noun","pinyin":"jiǔba","def":"bar","ex":[{"zh":"晚上我们去酒吧喝啤酒。","py":"Wǎnshàng wǒmen qù jiǔbā hē píjiǔ.","en":"We are going to a bar to drink beer at night."},{"zh":"我周末常去酒吧。","py":"Wǒ zhōumò cháng qù jiǔba.","en":"I often go to bars on weekends."}]},{"id":116,"hanzi":"啤酒","part":"Noun","pinyin":"píjiǔ","def":"beer","ex":[{"zh":"我们一起喝啤酒。","py":"Wǒmen yìqǐ hē píjiǔ。","en":"We drink beer together."},{"zh":"那家酒吧的啤酒很不错！","py":"Nà jiā jiǔba de píjiǔ hěn búcuò!","en":"The beer at that bar is very good."}]},{"id":117,"hanzi":"有意思","part":"Adj","pinyin":"yǒuyìsi","def":"interesting, fun","ex":[{"zh":"我觉得出门很有意思! 我喜欢出门去运动。","py":"Wǒ juéde chūmén hěn yǒuyìsi! Wǒ xǐhuan chūmén qù yùndòng.","en":"I think going out is fun! I like to go out to exercise."},{"zh":"我觉得学汉语很有意思。","py":"Wǒ juédé xué hànyǔ hěn yǒuyìsi.","en":"I think it's interesting to learn Chinese."}]},{"id":118,"hanzi":"无聊","part":"Adj","pinyin":"wúliáo","def":"boring,bored","ex":[{"zh":"他觉得出门太麻烦了，也觉得很无聊。","py":"Tā juéde chūmén tài máfán le, yě juéde hěn wúliáo.","en":"He thinks going out is too troublesome and boring."},{"zh":"我觉得看电影很无聊,我喜欢看书。","py":"Wǒ juéde kàn diànyǐng hěn wúliáo, wǒ xǐhuan kàn shū.","en":"I think watching movies is boring, I like to read books."}]},{"id":119,"hanzi":"麻烦","part":"Verb","pinyin":"máfán","def":"be annoyed,to bother, troublesome, annoying","ex":[{"zh":"我是一个麻烦的人。","py":"Wǒ shì yí gè máfán de rén.","en":"I am a troublesome person."},{"zh":"他觉得去电影院看电影很麻烦。","py":"Tā juéde qù diànyǐngyuàn kàn diànyǐng hěn máfán.","en":"He thinks going to watch movies at cinema is bothersome."}]},{"id":120,"hanzi":"出门","part":"Verb Object","pinyin":"chūmén","def":"to go outside","ex":[{"zh":"他早上九点出门去上课。","py":"Tā zǎoshàng jiǔdiǎn chūmén qù shàngkè.","en":"He goes to class at 9 in the morning."},{"zh":"我今天晚上不想出门。","py":"Wǒ jīntiān wǎnshàng bùxiǎng chūmén.","en":"I don't want to go out tonight."}]},{"id":121,"hanzi":"种","part":"Measure word","pinyin":"zhǒng","def":"kind,type","ex":[{"zh":"你喜欢吃哪种菜?","py":"Nǐ xǐhuan chī nǎ zhǒng cài?","en":"What kind of food do you like?"},{"zh":"那种电影很无聊。","py":"Nà zhǒng diànyǐng hěn wúliáo.","en":"That kind of movie is boring."}]},{"id":122,"hanzi":"一起","part":"Adv","pinyin":"yìqǐ","def":"together","ex":[{"zh":"星期二我们一起去吃日本菜。","py":"Xīngqīèr wǒmen yìqǐ qù chī Rìběn cài.","en":"Let's have Japanese food on Tuesday together."},{"zh":"我常跟女朋友一起去看电影。","py":"Wǒ cháng gēn nǚpéngyou yìqǐ qù kàn diànyǐng.","en":"I often watch movies with my girlfriend."}]},{"id":123,"hanzi":"算了","part":"Phrase","pinyin":"suànle","def":"forget about it","ex":[{"zh":"A: 外面下雨，我不能跟你出去。 B: 算了，我跟玛丽去。","py":"A: Wàimiàn xiàyǔ, wǒ bùnéng gēn nǐ chūqù. B: Suànle, wǒ gēn Mǎlì qù.","en":"A: It’s raining outside, I can't go out with you. B: Fine, I'll go out with Mary."},{"zh":"票要是卖完了，就算了。","py":"Piào yàoshi mài wán le, jiù suànle.","en":"If the ticket was sold out, then just forget it."}]},{"id":124,"hanzi":"下雨","part":"Verb Object","pinyin":"xiàyǔ","def":"raining","ex":[{"zh":"今天, 明天都下雨。","py":"Jīntiān, míngtiān dōu xiàyǔ.","en":"Today and tomorrow it will rain."},{"zh":"明天会下雨吗？","py":"Míngtiān huì xià yǔ ma?","en":"Will it rain tomorrow?"}]},{"id":125,"hanzi":"外面","part":"Noun","pinyin":"wàimiàn","def":"outside","ex":[{"zh":"他现在在外面,不在家。","py":"Tā xiànzài zài wàimiàn , bú zài jiā.","en":"He is out now, he's not at home."},{"zh":"电影院外面有很多人。","py":"Diànyǐngyuàn wàimiàn yǒu hěnduō rén.","en":"There are a lot of people outside of the theater."}]},{"id":126,"hanzi":"没问题","part":"Phrase","pinyin":"méi wèntí","def":"no problem","ex":[{"zh":"A: 你有空吗？我们一起去打球，好不好？ B: 没问题。","py":"A: Nǐ yǒu kòng ma? Wǒmen yīqǐ qù dǎqiú, hǎo bùhǎo? B: Méi wèntí.","en":"A: Do you have free time? Let's go play ball games, what do you think? B: No problem."},{"zh":"A: 能请你和我一起去买东西吗? B: 没问题。什么时候去?","py":"A: Néng qǐng nǐ hé wǒ yīqǐ qù mǎi dōngxī ma? B: Méi wèntí. Shénme shíhòu qù?","en":"A: Can I take you out to buy things with me? B: Sure, when?"}]},{"id":127,"hanzi":"可是","part":"Conj","pinyin":"kěshì","def":"but","ex":[{"zh":"我想出去, 可是外面下雨。","py":"Wǒ xiǎng chūqù,kěshì wàimiàn xiàyǔ.","en":"I want to go out, but it's raining outside."},{"zh":"很多人喜欢那个电影，可是我觉得很无聊。","py":"Hěnduō rén xǐhuan nàgè diànyǐng, kěshì wǒ jué​​de hěn wúliáo.","en":"Many people like that movie, but I think it is boring."}]},{"id":128,"hanzi":"做菜","part":"Verb","pinyin":"zuòcài","def":"cooking","ex":[{"zh":"妹妹喜欢做菜。","py":"Mèimei xǐhuan zuò cài。","en":"My younger sister likes to cook."},{"zh":"他做菜, 做得不错。","py":"Tā zuò cài,zuò de búcuò.","en":"He cooks well."}]},{"id":129,"hanzi":"唱歌","part":"Verb","pinyin":"chànggē","def":"to sing","ex":[{"zh":"我们一起去唱歌，好吗？","py":"Wǒmen yīqǐ qù chànggē, hǎo ma?","en":"How about we go sing together?"},{"zh":"你唱歌唱的真好听","py":"Nǐ chànggē chàng de zhēn hǎotīng.","en":"You sing very beautifully."}]},{"id":130,"hanzi":"说","part":"Verb","pinyin":"shuō","def":"say,speak a language","ex":[{"zh":"请您再说一次。","py":"Qǐng nín zài shuō yīcì.","en":"Can you please say it one more time?"},{"zh":"他说英文, 说得怎么样？","py":"Tā shuō Yīngwén , shuō de zěnmeyàng?","en":"How well can he speak English?"}]},{"id":131,"hanzi":"汉语","part":"Noun","pinyin":"hànyǔ","def":"Mandarin","ex":[{"zh":"我明天有汉语课。","py":"Wǒ míngtiān yǒu hànyǔ kè.","en":"I have Chinese class tomorrow."},{"zh":"他想学汉语。","py":"Tā xiǎng xué hànyǔ.","en":"He wants to learn Chinese."}]},{"id":132,"hanzi":"英语","part":"Noun","pinyin":"yīngyǔ","def":"English","ex":[{"zh":"我不会说英语。","py":"Wǒ bú huì shuō yīngyǔ.","en":"I can't speak English."},{"zh":"我会说法语、英语和汉语","py":"Wǒ huì shuō fǎyǔ, yīngyǔ hé hànyǔ.","en":"I speak French, English and Chinese."}]},{"id":133,"hanzi":"不错","part":"Adj","pinyin":"búcuò","def":"pretty good, not bad","ex":[{"zh":"她唱得不错。","py":"Tā chàng dé búcuò.","en":"She sings well."},{"zh":"你说中文， 说得不错。","py":"Nǐ shuō zhōngwén, shuō de búcuò.","en":"You speak Chinese well."}]},{"id":134,"hanzi":"教","part":"Verb","pinyin":"jiāo","def":"to teach","ex":[{"zh":"你可以教我怎么说英语吗?","py":"Nǐ kěyǐ jiāo wǒ zěnme shuō yīngyǔ ma?","en":"Can you teach me how to say English?"},{"zh":"大学打工的时候我在一家补习班教德语。","py":"Dàxué dǎgōng de shíhou wǒ zài yījiā bǔxí bān jiào déyǔ.","en":"When I was in college, I taught German in a cram school."}]},{"id":135,"hanzi":"写字","part":"Verb Object","pinyin":"xiězì","def":"to write","ex":[{"zh":"汉语老师教我们怎么写字。","py":"Hànyǔ lǎoshī jiào wǒmen zěnme xiě zì.","en":"The Chinese teacher teach us how to write words."},{"zh":"我忘记带写字的本子了。","py":"Wǒ wàngjì dài xiězì de běnzile.","en":"I forgot to bring my writing notebook."}]},{"id":136,"hanzi":"快","part":"Adj","pinyin":"kuài","def":"fast, quick","ex":[{"zh":"他走得很快。","py":"Tā zǒu de hěn kuài.","en":"He walks fast."},{"zh":"我写汉字， 写得不快。","py":"Wǒ xiě hànzì, xiě de bú kuài.","en":"I write Chinese words at a slow speed."}]},{"id":137,"hanzi":"功课","part":"Noun","pinyin":"gōngkè","def":"homework","ex":[{"zh":"我今天有很多功课。","py":"Wǒ jīntiān yǒu hěn duō gōngkè.","en":"I have a lot of homework today."},{"zh":"我的朋友每天都有中文功课。","py":"Wǒ de péngyǒu měitiān dōu yǒu Zhōngwén gōngkè.","en":"My friend has Chinese homework every day."}]},{"id":138,"hanzi":"图书馆","part":"Noun","pinyin":"túshūguǎn","def":"library","ex":[{"zh":"他星期一去图书馆看书。","py":"Tā xīngqī yī qù túshūguǎn kànshū.","en":"He goes to library on Mondays to read books."},{"zh":"他在图书馆上网。","py":"Tā zài túshūguǎn shàngwǎng.","en":"He surfed the Internet at the library."}]},{"id":139,"hanzi":"中饭","part":"Noun","pinyin":"zhōngfàn","def":"lunch","ex":[{"zh":"我们一起吃中饭吧!","py":"Wǒmen yìqǐ chī zhōngfàn ba!","en":"Let’s eat lunch together."},{"zh":"你吃中饭了吗？","py":"Nǐ chī zhōngfàn le ma?","en":"Have you eaten lunch?"}]},{"id":140,"hanzi":"晚饭","part":"Noun","pinyin":"wǎnfàn","def":"dinner","ex":[{"zh":"我没有时间做晚饭。","py":"Wǒ méiyǒu shíjiān zuò wǎnfàn.","en":"I don’t have time for making dinner."},{"zh":"我昨天没有吃晚饭。","py":"Wǒ zuótiān méiyǒu chī wǎnfàn.","en":"I didn't have dinner yesterday."}]},{"id":141,"hanzi":"中午","part":"Noun","pinyin":"zhōngwǔ","def":"noon","ex":[{"zh":"我中午上英语课。","py":"Wǒ zhōngwǔ shàng yīngyǔ kè.","en":"I have English class at noon."},{"zh":"他中午不在家, 也没去图书馆。","py":"Tā zhōngwǔ bú zài jiā, yě méi qù túshūguǎn.","en":"He wasn't at home this morning and he didn't go to library either."}]},{"id":142,"hanzi":"非常","part":"Adv","pinyin":"fēicháng","def":"very,extremely","ex":[{"zh":"他非常喜欢看书, 也喜欢运动。","py":"Tā fēicháng xǐhuan kànshū, yě xǐhuan yùndòng.","en":"He really likes to read books, he also likes to do sports."},{"zh":"他做饭，做得非常好吃。","py":"Tā zuòfàn, zuò de fēicháng hǎochī.","en":"He cooks, the food he cooks is very delicious."}]},{"id":143,"hanzi":"题","part":"Noun","pinyin":"tí","def":"question","ex":[{"zh":"这题好难，我不会。","py":"Zhè tí hǎo nán, wǒ bú huì.","en":"This question is so hard, I don’t know how to do it."},{"zh":"这题非常简单。","py":"Zhè tí fēicháng jiǎndān.","en":"This question is pretty easy."}]},{"id":144,"hanzi":"难","part":"Adj","pinyin":"nán","def":"difficult","ex":[{"zh":"写汉字很难，说汉语也很难!","py":"Xiě hànzì hěn nán, shuō hànyǔ yě hěn nán.","en":"Writing Chinese is difficult, speaking Chinese is also difficult."},{"zh":"我不会做饭，我觉得很难。","py":"Wǒ bú huì zuò fàn, wǒ juéde hěn nán.","en":"I don't know how to cook, I think it is difficult."}]},{"id":145,"hanzi":"新","part":"Adj","pinyin":"xīn","def":"new","ex":[{"zh":"这是一支新手机.","py":"Zhè shì yìzhī xīn shǒujī.","en":"This is a new cell phone."},{"zh":"这是我的新车。","py":"Zhè shì wǒ de xīnchē.","en":"This is my new car."}]},{"id":146,"hanzi":"旧","part":"Adj","pinyin":"jiù","def":"old, used, worn","ex":[{"zh":"我有一支旧手机","py":"Wǒ yǒu yìzhī jiù shǒujī","en":"I have an old cell phone"},{"zh":"我的旧手机坏了！","py":"Wǒ de jiù shǒujī huài le!","en":"My old cell phone is broken!"}]},{"id":147,"hanzi":"大","part":"Adj","pinyin":"dà","def":"big","ex":[{"zh":"这支手机有一点大, 我不喜欢。","py":"Zhè zhī shǒujī yǒu yìdiǎn dà, wǒ bù xǐhuan.","en":"This phone is a bit big, I don't like it."},{"zh":"我家很大。","py":"Wǒjiā hěn dà.","en":"My house is big."}]},{"id":148,"hanzi":"支","part":"Measure word","pinyin":"zhī","def":"Measure word (for a cell phone etc)","ex":[{"zh":"我有一支新手机","py":"Wǒ yǒuyìzhī xīn shǒujī","en":"I have a new cell phone"},{"zh":"我有一支旧手机","py":"Wǒ yǒu yìzhī jiù shǒujī","en":"I have an old cell phone"}]},{"id":149,"hanzi":"商店","part":"Noun","pinyin":"shāngdiàn","def":"shop, store","ex":[{"zh":"这家商店卖一些手机。","py":"Zhè jiā shāngdiàn mài yì xiē shǒujī.","en":"This store sells some cell phones."},{"zh":"我想去商店。","py":"Wǒ xiǎng qù shāngdiàn.","en":"I want to go to the store."}]},{"id":150,"hanzi":"手机","part":"Noun","pinyin":"shǒujī","def":"cell phone","ex":[{"zh":"这不是我的手机。","py":"Zhè bú shì wǒ de shǒujī.","en":"This is not my cell phone."},{"zh":"我想买手机！","py":"Wǒ xiǎng mǎi shǒujī!","en":"I want to buy a cell phone!"}]},{"id":151,"hanzi":"看一看","part":"Phrase","pinyin":"kànyíkàn","def":"look, have a look","ex":[{"zh":"我去商店看一看。","py":"Wǒ qù shāngdiàn kànyíkàn.","en":"Let me go to the store and have a look."},{"zh":"看一看这封信。","py":"Kàn yī kàn zhè fēng xìn.","en":"Take a look at this letter."}]},{"id":152,"hanzi":"万","part":"Numeral","pinyin":"wàn","def":"ten thousand","ex":[{"zh":"我有一万三千元","py":"Wǒ yǒu yí wàn sān qiān yuán","en":"I have thirteen thousand dollars"},{"zh":"我有三万四千元","py":"Wǒ yǒu sān wàn sì qiān yuán","en":"I have thirty-four thousand dollars"}]},{"id":153,"hanzi":"千","part":"Numeral","pinyin":"qiān","def":"thousand","ex":[{"zh":"我有四千元","py":"Wǒ yǒu sì qiān yuán","en":"I have four thousand dollars"},{"zh":"我有两千元。","py":"Wǒ yǒu liǎng qiān yuán.","en":"I have two thousand dollars."}]},{"id":154,"hanzi":"能","part":"Verb","pinyin":"néng","def":"to express ability","ex":[{"zh":"哪支手机能上网？","py":"Nǎ zhī shǒujī néng shàngwǎng?","en":"Which mobile phone can access the Internet?"},{"zh":"这里能上网吗？","py":"Zhèlǐ néng shàngwǎng ma?","en":"Can I go online here?"}]},{"id":155,"hanzi":"上面","part":"Noun","pinyin":"shàngmiàn","def":"on top of","ex":[{"zh":"你的猫在我的房子上面!","py":"Nǐ de māo zài wǒ de fángzi shàngmiàn.","en":"Your cat is on top of my house."},{"zh":"我家上面是图书馆，下面是饭馆，常常有很多人。","py":"Wǒ jiā shàngmiàn shì túshūguǎn, xiàmiàn shì fànguǎn, chángcháng yǒu hěn duō rén.","en":"There is a library above my house and a restaurant below, so there are often a lot of people."}]},{"id":156,"hanzi":"下面","part":"Noun","pinyin":"xiàmiàn","def":"down/under","ex":[{"zh":"照片在杯子下面。","py":"Zhàopiàn zài bēizi xiàmiàn.","en":"The photo is under the cup."},{"zh":"你的手机在书的下面。","py":"Nǐ de shǒujī zài shū de xiàmiàn.","en":"Your cellphone is under the book."}]},{"id":157,"hanzi":"旁边","part":"Noun","pinyin":"pángbiān","def":"next to/beside","ex":[{"zh":"饭馆旁边是图书馆。","py":"Fànguǎn pángbiān shì túshūguǎn.","en":"The library is next to the restaurant."},{"zh":"电影院旁边有商店。","py":"Diànyǐngyuàn pángbiān yǒu shāngdiàn.","en":"There is a shop next to the theater."}]},{"id":158,"hanzi":"里面","part":"Noun","pinyin":"lǐmiàn","def":"inside","ex":[{"zh":"图书馆里面有很多书。","py":"Túshūguǎn lǐmiàn yǒu hěn duō shū.","en":"There are a lot of books inside the library."},{"zh":"酒吧里面有很多人。","py":"Jiǔbā lǐmiàn yǒu hěnduō rén.","en":"There are a lot of people in the bar."}]},{"id":159,"hanzi":"大楼","part":"Noun","pinyin":"dàlóu","def":"building","ex":[{"zh":"我家旁边有很多大楼。","py":"Wǒ jiā pángbiān yǒu hěn duō dàlóu.","en":"There are a lot of buildings next to my house."},{"zh":"我住在那个大楼。","py":"Wǒ zhù zài nàgè dàlóu.","en":"I live in that building."}]},{"id":160,"hanzi":"海边","part":"Noun","pinyin":"hǎibiān","def":"beach","ex":[{"zh":"我们一起去海边玩儿吧!","py":"Wǒmen yìqǐ qù hǎibiān wánr ba!","en":"Let’s go to the beach together and have fun!"},{"zh":"他有一个房子, 那个房子在海边。","py":"Tā yǒu yígè fángzi, nà gè fángzi zài hǎibiān.","en":"He has a house, that house is at the beach."}]},{"id":161,"hanzi":"住","part":"Verb","pinyin":"zhù","def":"to live","ex":[{"zh":"我住在那个大楼里面。","py":"Wǒ zhù zài nàge dàlóu lǐmiàn.","en":"I live inside that building."},{"zh":"你想住在山上还是海边？","py":"Nǐ xiǎng zhù zài shānshàng háishì hǎibiān?","en":"Do you want to live in the mountains or along the seaside?"}]},{"id":162,"hanzi":"知道","part":"Verb","pinyin":"zhīdào","def":"to know","ex":[{"zh":"我知道他家在哪儿!","py":"Wǒ zhīdào tā jiā zài nǎr.","en":"I know where his house is."},{"zh":"你知道他是谁吗?","py":"Nǐ zhīdào tā shì shéi ma?","en":"Do you know who he is?"}]},{"id":163,"hanzi":"欢迎","part":"Noun/Verb","pinyin":"huānyíng","def":"to welcome, welcome","ex":[{"zh":"欢迎你来我家玩儿。","py":"Huānyíng nǐ lái wǒ jiā wánr.","en":"You are welcome to come to my house to hang out."},{"zh":"明天是一成的生日，欢迎你一起跟我去他家喝啤酒!","py":"Ｍíngtiān shì Yīchéng de shēngrì, huānyíng nǐ yìqǐ gēn wǒ qù tā jiā hē píjiǔ","en":"Tomorrow is Yicheng’s birthday, you are welcome to come with me to his place to drink beer!"}]},{"id":164,"hanzi":"玩儿","part":"Verb","pinyin":"wánr","def":"to play, have fun","ex":[{"zh":"我喜欢去海边玩儿。","py":"Wǒ xǐhuan qù hǎibiān wánr.","en":"I like to go to the beach and have fun."},{"zh":"我明年想要去中国玩儿。","py":"Wǒ míngnián xiǎng yào qù Zhōngguó wánr.","en":"I want to go China and have fun there next year."}]},{"id":165,"hanzi":"公共汽车","part":"Noun","pinyin":"gōnggòng qìchē","def":"bus","ex":[{"zh":"我每个星期都坐公共汽车去上汉语课。","py":"Wǒ měige xīngqī dōu zuò gōnggòng qìchē qù shàng Hànyǔ kè.","en":"I take the bus every week to Chinese class."},{"zh":"我不喜欢坐公共汽车。","py":"Wǒ bù xǐhuan zuò gōnggòng qìchē.","en":"I don't like to take the bus."}]},{"id":166,"hanzi":"自行车","part":"Noun","pinyin":"zìxíngchē","def":"bicycle/bike","ex":[{"zh":"我喜欢骑自行车。","py":"Wǒ xǐhuan qí zìxíngchē.","en":"I like to ride a bicycle."},{"zh":"我没有自行车。","py":"Wǒ méiyǒu zìxíngchē.","en":"I don't have a bike."}]},{"id":167,"hanzi":"走路","part":"Verb Object","pinyin":"zǒulù","def":"to walk","ex":[{"zh":"我的朋友每天都走路去学校。","py":"Wǒ de péngyǒu měitiān dōu zǒulù qù xuéxiào.","en":"My friend walks to school every day."},{"zh":"他女朋友每天走路去上课。","py":"Tā nǚpéngyǒu měitiān zǒulù qù shàngkè.","en":"His girlfriend goes to class by walking every day."}]},{"id":168,"hanzi":"站","part":"Measure word","pinyin":"zhàn","def":"stations, stops","ex":[{"zh":"从我家到图书馆坐公共汽车要三站。","py":"Cóng wǒ jiā dào túshūguǎn zuò gōnggòng qìchē yào sān zhàn.","en":"It takes 3 stations to get from my house to the library."},{"zh":"从邮局到图书馆要坐五站。","py":"Cóng yóujú dào túshūguǎn yào zuò wǔ zhàn.","en":"It takes 5 stations to get from the post office to library."}]},{"id":169,"hanzi":"椅子","part":"Noun","pinyin":"yǐzi","def":"chair","ex":[{"zh":"你家有几把椅子?","py":"Nǐ jiā yǒu jǐ bǎ yǐzi?","en":"How many chairs do you have at home?"},{"zh":"我想买两把椅子。","py":"Wǒ xiǎng mǎi liǎng bǎ yǐzi.","en":"I want to buy two chairs."}]},{"id":170,"hanzi":"休息","part":"Verb","pinyin":"xiūxí","def":"to take a rest","ex":[{"zh":"你中午几点休息?","py":"Nǐ zhōngwǔ jǐdiǎn xiūxi?","en":"What time do you rest at noon?"},{"zh":"我们可以休息到几点?","py":"Wǒmen kěyǐ xiūxi dào jǐdiǎn?","en":"How long can we take a rest? Until what time?"}]},{"id":171,"hanzi":"上班","part":"Verb Object","pinyin":"shàngbān","def":"to go to work","ex":[{"zh":"你在哪儿上班?","py":"Nǐ zài nǎr shàngbān?","en":"Where do you work?"},{"zh":"我在邮局上班。","py":"Wǒ zài yóujú shàngbān.","en":"I work in the post office."}]},{"id":172,"hanzi":"坐","part":"Verb","pinyin":"zuò","def":"to take (a bus, airplane etc)","ex":[{"zh":"我坐公共汽车去电影院。","py":"Wǒ zuò gōnggòng qìchē qù diànyǐngyuàn.","en":"I go to cinema by bus."},{"zh":"我坐公共汽车来上汉语课。","py":"Wǒ zuò gōnggòng qìchē lái shàng Hànyǔ kè.","en":"I take the bus to the Chinese class."}]},{"id":173,"hanzi":"骑","part":"Verb","pinyin":"qí","def":"to ride","ex":[{"zh":"我常骑自行车去上课。","py":"Wǒ cháng qí zìxíngchē qù shàngkè.","en":"I often go to class by bike."},{"zh":"骑自行车能运动。","py":"Qí zìxíngchē néng yùndòng.","en":"You can exercise by riding a bike."}]},{"id":174,"hanzi":"超市","part":"Noun","pinyin":"chāoshì","def":"supermarket","ex":[{"zh":"我想去超市买鸡蛋。","py":"Wǒ xiǎng qù chāoshì mǎi jīdàn.","en":"I want to buy eggs in the supermarket."},{"zh":"我家旁边有超市和邮局。","py":"Wǒ jiā pángbiān yǒu chāoshì hé yóujú.","en":"There’s a supermarket and a post office next to my house."}]},{"id":175,"hanzi":"件","part":"Measure word","pinyin":"jiàn","def":"Measure word (for events, things, clothes etc)","ex":[{"zh":"这件衣服是我妹妹的。","py":"Zhè jiàn yīfú shì wǒ mèimei de.","en":"This cloth is my younger sister's."},{"zh":"这件衣服很好看!","py":"Zhè jiàn yīfú hěn hǎokàn.","en":"This shirt looks nice."}]},{"id":176,"hanzi":"衣服","part":"Noun","pinyin":"yīfú","def":"clothes","ex":[{"zh":"他昨天买了很多漂亮的衣服。","py":"Tā zuótiān mǎi le hěn duō piàoliàng de yīfú.","en":"He bought a lot of nice cloth yesterday."},{"zh":"我有一件漂亮的衣服。","py":"Wǒ yǒu yí jiàn piàoliang de yīfú.","en":"I have a beautiful clothes."}]},{"id":177,"hanzi":"对了","part":"Phrase","pinyin":"duìle","def":"by the way","ex":[{"zh":"对了，他昨天告诉我他不来学校。","py":"Duìle, tā zuótiān gàosù wǒ tā bù lái xuéxiào.","en":"By the way, he told me yesterday that he is not coming to school."},{"zh":"A: 明天会有三个人去上课。 B: 对了，美美说他也来。一共四个人去上课。","py":"A: Míngtiān huì yǒu sān ge rén qù shàngkè. B: Duìle, Měiměi shuō tā yě lái. Yígòng sì gè rén qù shàngkè.","en":"A: There will be three people to the class tomorrow. B: By the way, Měiměi said she will also come. Four people altogether."}]},{"id":178,"hanzi":"告诉","part":"Verb","pinyin":"gàosù","def":"to tell","ex":[{"zh":"她没有告诉我这件事情。","py":"Tā méiyǒu gàosù wǒ zhè jiàn shìqíng.","en":"She didn't tell me this thing."},{"zh":"他告诉我从他家到超市往前走十分钟就到了。","py":"Tā gàosù wǒ cóng tā jiā dào chāoshì wǎng qián zǒu shí fēnzhōng jiù dào le.","en":"He told me from his house to the supermarket only needs to walk for ten minutes."}]},{"id":179,"hanzi":"鸡蛋","part":"Noun","pinyin":"jīdàn","def":"egg","ex":[{"zh":"我的早餐是鸡蛋和牛奶。","py":"Wǒ de zǎocān shì jīdàn hé niúnǎi.","en":"My breakfast was eggs and milk."},{"zh":"请你去超市买鸡蛋和牛奶。","py":"Qǐng nǐ qù chāoshì mǎi jīdàn hé niúnǎi.","en":"Please go to the supermarket and buy eggs and milk."}]},{"id":180,"hanzi":"忘了","part":"Verb","pinyin":"wàngle","def":"to forget","ex":[{"zh":"我昨天忘了去超市。","py":"Wǒ zuótiān wàngle qù chāoshì.","en":"I forgot to go supermarket yesterday."},{"zh":"对不起，我忘了买你的鸡蛋了。","py":"Duìbùqǐ, wǒ wàngle mǎi nǐ de jīdàn le.","en":"I am sorry, I forgot to buy your eggs."}]},{"id":181,"hanzi":"牛奶","part":"Noun","pinyin":"niúnǎi","def":"milk","ex":[{"zh":"我每天早上都喝一杯咖啡和一瓶牛奶。","py":"Wǒ měitiān zǎoshàng dōu he yì bēi kāfēi hé yì píng niúnǎi.","en":"I drink a cup of coffee and a bottle of milk every morning."},{"zh":"我家有三瓶牛奶。","py":"Wǒ jiā yǒu sān píng niúnǎi.","en":"I have three bottles of milk at home."}]},{"id":182,"hanzi":"怎么","part":"Adv","pinyin":"zěnme","def":"how to...?","ex":[{"zh":"这个字非常难,我不知道怎么写。","py":"Zhè gè zì fēicháng nán. Wǒ bù zhīdào zěnme xiě.","en":"This word is so difficult. I don't know how to write it."},{"zh":"你知道他家怎么走吗？","py":"Nǐ zhīdào tā jiā zěnme zǒu ma?","en":"Do you know how to get to his place?"}]},{"id":183,"hanzi":"走","part":"Verb","pinyin":"zǒu","def":"to get there,walk","ex":[{"zh":"从这儿往前走就到他家了。","py":"Cóng zhèr wǎng qián zǒu jiù dào tā jiā le.","en":"Go forward from here, you'll go right to his house."},{"zh":"我想去邮局, 可是我不知道怎么走。","py":"Wǒ xiǎng qù yóujú, kěshì wǒ bù zhīdào zěnme zǒu.","en":"I would like to go to post office, but I don't know how to get there."}]},{"id":184,"hanzi":"前","part":"Noun","pinyin":"qián","def":"front/forward/ahead","ex":[{"zh":"往前走就是我家。","py":"Wǎng qián zǒu jiù shì wǒ jiā.","en":"Go forward and that's my house."},{"zh":"往前看,可以看到我的房子。","py":"Wǎng qián kàn, kěyǐ kàndào wǒ de fángzi.","en":"Look forward, you can see my house."}]},{"id":185,"hanzi":"就","part":"Adv","pinyin":"jiù","def":"then,right away","ex":[{"zh":"图书馆，往前走右拐就到了。","py":"Túshūguǎn, wǎng qián zǒu yòuguǎi jiù dào le.","en":"Go forward and turn right, the library is there."},{"zh":"就等一会儿。","py":"Jiù děng yìhuǐr.","en":"Just wait a moment."}]},{"id":186,"hanzi":"邮局","part":"Noun","pinyin":"yóujú","def":"post office","ex":[{"zh":"图书馆在邮局的旁边。","py":"Túshūguǎn zài yóujú de pángbiān.","en":"The post office is next to the library."},{"zh":"这个大楼里面有邮局。","py":"Zhège dàlóu lǐmiàn yǒu yóujú.","en":"There is a post office in this building."}]},{"id":187,"hanzi":"认识","part":"Verb","pinyin":"rènshì","def":"to know, to recognise","ex":[{"zh":"我不认识那个人。","py":"Wǒ bú rènshì nàge rén.","en":"I don’t know that person."},{"zh":"你认识这条路吗？","py":"Nǐ rènshì zhè tiáo lù ma?","en":"Do you know this road?"}]},{"id":188,"hanzi":"路","part":"Noun","pinyin":"lù","def":"road","ex":[{"zh":"我知道这条路的名字!","py":"Wǒ zhīdào zhè tiáo lù de míngzì.","en":"I know the name of this road."},{"zh":"从这条路往前走, 就到了。","py":"Cóng zhè tiáo lù wǎng qián zǒu, jiù dào le.","en":"Go forward on this road and you will get there."}]},{"id":189,"hanzi":"左拐","part":"Verb","pinyin":"zuǒguǎi","def":"to turn left","ex":[{"zh":"那条路左拐就到我家。","py":"Nà tiáo lù zuǒguǎi jiù dào wǒ jiā.","en":"Turn left on that road and you'll arrive at my house."},{"zh":"这条路往左拐不是邮局，是我家。","py":"Zhè tiáo lù wǎng zuǒguǎi bú shì yóujú, shì wǒjiā.","en":"Taking a left on this road isn't the post office, it's my house."}]},{"id":190,"hanzi":"右拐","part":"Verb","pinyin":"yòuguǎi","def":"to turn right","ex":[{"zh":"邮局在前面那条路右拐。","py":"Yóujú zài qiánmiàn nà tiáo lù yòuguǎi.","en":"Post office is at the road ahead, turn right."},{"zh":"我往右拐的。","py":"Wǒ wǎng yòu guǎi de.","en":"I turned right."}]},{"id":191,"hanzi":"从","part":"Prep","pinyin":"cóng","def":"from","ex":[{"zh":"从这儿往左走就是邮局。","py":"Cóng zhèr wǎng zuǒ zǒu jiùshì yóujú.","en":"Turn left from here and there is the post office."},{"zh":"他从杭州来。","py":"Tā cóng Hángzhōu lái.","en":"He comes from Hangzhou."}]},{"id":192,"hanzi":"到","part":"Verb","pinyin":"dào","def":"to arrive, arrive","ex":[{"zh":"从这里往前走, 就到了。","py":"Cóng zhèlǐ wǎng qián zǒu, jiù dào le.","en":"Go straight from here, then you will arrive."},{"zh":"从我家到学校需要五十分钟。","py":"Cóng wǒjiā dào xuéxiào xūyào wǔshí fēnzhōng.","en":"It takes fifty minutes from my home to school."}]},{"id":193,"hanzi":"事情","part":"Noun","pinyin":"shìqíng","def":"Affair,matter,thing","ex":[{"zh":"这件事情很难也很麻烦。","py":"Zhè jiàn shìqing hěn nán yě hěn máfán.","en":"This thing is very difficult and troublesome."},{"zh":"你今天下午有事情吗?","py":"Nǐ jīntiān xiàwǔ yǒu shìqíng ma?","en":"Do you have things to do this afternoon?"}]},{"id":194,"hanzi":"得","part":"Adv","pinyin":"děi","def":"must,have to","ex":[{"zh":"我得出门去上课!","py":"Wǒ děi chū mén qù shàng kè.","en":"I have to go out to go to class."},{"zh":"我明天有考试，我得学习。","py":"Wǒ míngtiān yǒu kǎoshì, wǒ děi xuéxí.","en":"I have test tomorrow, I have to study."}]},{"id":195,"hanzi":"时间","part":"Noun","pinyin":"shíjiān","def":"time","ex":[{"zh":"我有很多时间写功课。","py":"Wǒ yǒu hěn duō shíjiān xiě gōngkè.","en":"I have a lot of time to write homework."},{"zh":"这个周末我有一些时间, 我想出门做一些有意思的事情。","py":"Zhège zhōumò wǒ yǒu yīxiē shíjiān, wǒ xiǎng chūmén zuò yīxiē yǒuyìsi de shìqíng.","en":"This weekend I have some free time, I want to go out and do something interesting."}]},{"id":196,"hanzi":"怕","part":"Verb","pinyin":"pà","def":"to fear, to be afraid of","ex":[{"zh":"学生都很怕老师。","py":"Xuéshēng dōu hěn pà lǎoshī","en":"The students are all afraid of teacher."},{"zh":"我想试试看四川菜,可是我怕辣。","py":"Wǒ xiǎng shìshì kàn sìchuān cài, kěshì wǒ pà là.","en":"I would like to try Sichuan's cuisine, but I'm afraid of the spice."}]},{"id":197,"hanzi":"担心","part":"Verb","pinyin":"dānxīn","def":"anxious,worried\nto worry","ex":[{"zh":"我很担心今年的汉语考试考得不好。","py":"Wǒ hěn dānxīn jīnnián de Hànyǔ kǎoshì kǎo de bù hǎo","en":"I am really worried that I did bad on this year's Chinese test."},{"zh":"我担心他。","py":"Wǒ dānxīn tā.","en":"I worry about him."}]},{"id":198,"hanzi":"考试","part":"Noun","pinyin":"kǎoshì","def":"to test, test, exam","ex":[{"zh":"你明天考试考什么？","py":"Nǐ míngtiān kǎoshì kǎo shénme?","en":"What are your exams tomorrow?"},{"zh":"明天有汉语考试。","py":"Míngtiān yǒu Hànyǔ kǎoshì.","en":"There’s a Chinese test tomorrow."}]},{"id":199,"hanzi":"今年","part":"Noun","pinyin":"jīnnián","def":"this year","ex":[{"zh":"今年我要跟家人去中国玩儿。","py":"Jīnnián wǒ yào gēn jiārén qù Zhōngguó wánr.","en":"I am going to China with my family this year."},{"zh":"他今年二十八岁。","py":"Tā jīnnián èrshíbā suì.","en":"He is twenty eight years old this year."}]},{"id":200,"hanzi":"不好意思","part":"Phrase","pinyin":"bùhǎoyìsi","def":"excuse me, to be sorry","ex":[{"zh":"不好意思，请问这儿可以照相吗?","py":"Bùhǎo yìsi, qǐngwèn zhèr kěyǐ zhàoxiàng ma?","en":"Excuse me, can we take pictures here?"},{"zh":"不好意思，请问这儿可以吃东西吗?","py":"Bùhǎo yìsi, qǐngwèn zhèr kěyǐ chī dōngxi ma?","en":"Excuse me, can we eat here?"}]},{"id":201,"hanzi":"听音乐","part":"Verb Object","pinyin":"tīng yīnyuè","def":"to listen to music","ex":[{"zh":"我喜欢听音乐。","py":"Wǒ xǐhuan tīng yīnyuè.","en":"I like to listen to music."},{"zh":"你跑步时听音乐吗？","py":"Nǐ pǎobù shí tīng yīnyuè ma?","en":"Do you listen to music when you go jogging?"}]},{"id":202,"hanzi":"附近","part":"Adv","pinyin":"fùjìn","def":"nearby","ex":[{"zh":"你家附近有商店吗?","py":"Nǐ jiā fùjìn yǒu shāngdiàn ma?","en":"Is there a shop nearby your house?"},{"zh":"小程住在我家附近, 我们周末常一起去运动。","py":"Xiǎo chéng zhù zài wǒ jiā fùjìn,wǒmen zhōumò cháng yìqǐ qù yùndòng.","en":"Little Cheng lives nearby my place, we often go doing exercise on weekends."}]},{"id":203,"hanzi":"照相","part":"Verb Object","pinyin":"zhàoxiàng","def":"to take a photo","ex":[{"zh":"他周末喜欢去爬山、照相。","py":"Tā zhōumò xǐhuan qù páshān, zhàoxiàng.","en":"He likes to go mountain climbing and take pictures on the weekend."},{"zh":"我可以帮你照相吗？","py":"Wǒ kěyǐ bāng nǐ zhàoxiàng ma?","en":"Do you want me to take your picture?"}]},{"id":204,"hanzi":"博物馆","part":"Noun","pinyin":"bówùguǎn","def":"museum","ex":[{"zh":"博物馆里面不可以照相!","py":"Bówùguǎn lǐmiàn bù kěyǐ zhàoxiàng.","en":"You can't take pictures inside the museum."},{"zh":"博物馆里面有很多有意思的东西。","py":"Bówùguǎn lǐmiàn yǒu hěn duō yǒuyìsi de dōngxi.","en":"There are many interesting things in museums."}]},{"id":205,"hanzi":"朋友","part":"Noun","pinyin":"péngyǒu","def":"friend, friends","ex":[{"zh":"我跟我朋友明天要一起去博物馆。","py":"Wǒ gēn wǒ péngyou míngtiān yào yìqǐ qù bówùguǎn.","en":"I am going to the museum with my friend tomorrow."},{"zh":"我有很多朋友跟我一起学汉语。","py":"Wǒ yǒu hěn duō péngyou gēn wǒ yìqǐ xué Hànyǔ.","en":"I have a lot of friends learning Chinese together with me."}]},{"id":206,"hanzi":"天","part":"Measure word","pinyin":"tiān","def":"day","ex":[{"zh":"一个星期有七天。","py":"Yí ge xīngqī yǒu qī tiān.","en":"There are seven days in a week."},{"zh":"我每天早上都喝一杯咖啡。","py":"Wǒ měitiān zǎoshàng dōu hē yì bēi kāfēi.","en":"I drink a cup of coffee every day in the morning."}]},{"id":207,"hanzi":"等一会儿","part":"Phrase","pinyin":"děng yìhuǐr","def":"Wait a moment, later","ex":[{"zh":"我跟我朋友等一会儿要一起去逛街。","py":"Wǒ gēn wǒ péngyou děng yìhuǐr yào yìqǐ qù guàngjiē.","en":"My friend and I will go shopping later."},{"zh":"我们等一会儿去外面照相。","py":"Wǒmen děng yìhuǐr qù wàimiàn zhàoxiàng.","en":"We will take photos outside later."}]},{"id":208,"hanzi":"地方","part":"Noun","pinyin":"dìfāng","def":"area, place","ex":[{"zh":"那个地方在哪儿?","py":"Nà gè dìfāng zai nǎr?","en":"Where is that place?"},{"zh":"这个地方不可以吃东西。","py":"Zhège dìfāng bù kěyǐ chī dōngxi.","en":"You can't eat here."}]},{"id":209,"hanzi":"远","part":"Adj","pinyin":"yuǎn","def":"far","ex":[{"zh":"图书馆离邮局很远。","py":"Túshūguǎn lí yóujú hěn yuǎn.","en":"The library is far away from the post office."},{"zh":"我的家不远，图书馆往左拐就到了。","py":"Wǒ de jiā bù yuǎn, túshūguǎn wǎng zuǒ guǎi jiù dào le.","en":"My home is not far, turn left after the library and you'll arrive."}]},{"id":210,"hanzi":"近","part":"Adj","pinyin":"jìn","def":"near/close","ex":[{"zh":"图书馆离我家很近!","py":"Túshūguǎn lí wǒ jiā hěn jìn.","en":"The library is close to my house."},{"zh":"你家离电影院近吗？","py":"Nǐ jiā lí diànyǐngyuàn jìn ma?","en":"Is your house close to movie theater?"}]},{"id":211,"hanzi":"小时","part":"Noun","pinyin":"xiǎoshí","def":"hour","ex":[{"zh":"从我家到图书馆要三个小时。","py":"Cóng wǒ jiā dào túshūguǎn yào sān gè xiǎoshí.","en":"It takes three hours from my house to library."},{"zh":"他每天学习两小时的英语","py":"Tā měitiān xuéxí liǎng xiǎoshí de yīngyǔ.","en":"He studied English for two hours a day."}]},{"id":212,"hanzi":"山","part":"Noun","pinyin":"shān","def":"mountain","ex":[{"zh":"我家旁边有一座山。","py":"Wǒ jiā pángbiān yǒu yí zuò shān.","en":"There’s a mountain next to my house."},{"zh":"山的下面是海边。","py":"Shān de xiàmiàn shì hǎibiān.","en":"There is a beach at the foot of the mountain."}]},{"id":213,"hanzi":"爬山","part":"Verb Object","pinyin":"páshān","def":"to climb a mountain, to hike a mountain","ex":[{"zh":"我们这个周末要去爬山。","py":"Wǒmen zhège zhōumò yào qù páshān.","en":"We are going mountain climbing this weekend."},{"zh":"我家附近有一座山, 我的家人常去爬山。","py":"Wǒjiā fùjìn yǒu yí zuò shān, wǒ de jiārén cháng qù páshān.","en":"There is a mountain near my house, my family often go mountain climbing."}]},{"id":214,"hanzi":"公司","part":"Noun","pinyin":"gōngsī","def":"company","ex":[{"zh":"我爸爸的公司离我们家很远。","py":"Wǒ bàba de gōngsī lí wǒmen jiā hěn yuǎn.","en":"My father’s company is far away from our house."},{"zh":"你的公司离你家远不远?","py":"Ｎǐ de gōngsī lí nǐ jiā yuǎn bùyuǎn?","en":"Is your company far away from your house?"}]},{"id":215,"hanzi":"分钟","part":"Noun","pinyin":"fēnzhōng","def":"minute","ex":[{"zh":"从这儿去那儿要走三十分钟。","py":"Cóng zhèr qù nàr yào zǒu sānshí fēnzhōng.","en":"To get from here to there you need to walk thirty minutes."},{"zh":"我的公司离我家很近，走路十分钟就到了。","py":"Wǒ de gōngsī lí wǒ jiā hěn jìn, zǒu lù shí fēnzhōng jiù dào le.","en":"My company is close to my house, you only need to walk for ten mins then you will be there."}]},{"id":216,"hanzi":"要","part":"Verb","pinyin":"yào","def":"to need, require","ex":[{"zh":"从我家到公司要走半小时。","py":"Cóng wǒ jiā dào gōngsī yào zǒu bàn xiǎoshí.","en":"It takes half an hour from my house to the company by foot."},{"zh":"这杯咖啡要一百块钱, 太贵了!","py":"Zhè bēi kāfēi yào yībǎi kuài qián, tài guì le.","en":"This cup of coffee costs one hundred dollars. It is too expensive!"}]},{"id":217,"hanzi":"方便","part":"Adj","pinyin":"fāngbiàn","def":"convenient","ex":[{"zh":"我家旁边有一些餐厅，也有超市和图书馆 ， 住在那里很方便。","py":"Wǒ jiā pángbiān yǒu yìxiē cāntīng, yě yǒu chāoshì hé túshūguǎn. Zhù zài nàlǐ hěn fāngbiàn.","en":"There are some restaurants, supermarkets and libraries near my house. Living there is very convenient."},{"zh":"我的公司附近很方便，饭馆、咖啡店和超市都有。","py":"Wǒ de gōngsī fùjìn hěn fāngbiàn. Fànguǎn, kāfēi diàn hé chāoshì dōu yǒu.","en":"The facilities near my company are very convenient. We have restaurants, coffee shops and supermarkets."}]},{"id":218,"hanzi":"车票","part":"Noun","pinyin":"chēpiào","def":"transportation ticket","ex":[{"zh":"坐公共汽车要买车票。","py":"Zuò gōnggòng qìchē yào mǎi chēpiào.","en":"You need to buy a ticket to take the bus."},{"zh":"中国的车票很便宜。","py":"Zhōngguó de chēpiào hěn piányi.","en":"Train tickets in Chinese are very cheap."}]},{"id":219,"hanzi":"出租车","part":"Noun","pinyin":"chūzūchē","def":"taxi","ex":[{"zh":"中国有很多出租车。","py":"Zhōngguó yǒu hěn duō chūzūchē.","en":"There are a lot of taxis in China."},{"zh":"在美国坐出租车很贵。","py":"Zài Měiguó zuò chūzūchē hěn guì.","en":"Taking a taxi in USA is expensive."}]},{"id":220,"hanzi":"地铁","part":"Noun","pinyin":"dìtiě","def":"subway, metro","ex":[{"zh":"我每天都坐地铁去上班。","py":"Wǒ měitiān dōu zuò dìtiě qù shàngbān.","en":"I go to work by subway every day."},{"zh":"他家附近没有地铁。","py":"Tā jiā fùjìn méiyǒu dìtiě.","en":"There is no subway nearby his house."}]},{"id":221,"hanzi":"载","part":"Verb","pinyin":"zài","def":"to give somebody a ride","ex":[{"zh":"我姐姐载我去超市买东西。","py":"Wǒ jiějie zài wǒ qù chāoshì mǎi dōngxi.","en":"My older sister drives me to buy things in the supermarket."},{"zh":"妈妈载弟弟去上汉语课。","py":"Māma zài dìdi qù shàng Hànyǔ kè.","en":"My mother drives younger brother to Chinese class."}]},{"id":222,"hanzi":"汽车","part":"Noun","pinyin":"qìchē","def":"car","ex":[{"zh":"我有三辆汽车。","py":"Wǒ yǒu sān liàng qìchē.","en":"I have three cars."},{"zh":"这辆新的汽车太贵了！","py":"Zhè liàng xīn de qìchē tài guìle!","en":"This new car is too expensive!"}]},{"id":223,"hanzi":"开","part":"Verb","pinyin":"kāi","def":"to drive ( a machine, car, airplan), to open","ex":[{"zh":"我爸爸每天都开车去上班。","py":"Wǒ bàba měitiān dōu kāi chē qù shàngbān.","en":"My father drives to work every day."},{"zh":"开车的时候，我喜欢听音乐。","py":"Kāichē de shíhou, wǒ xǐhuan tīng yīnyuè.","en":"I like listening to music while driving."}]},{"id":224,"hanzi":"风景","part":"Noun","pinyin":"fēngjǐng","def":"scenery","ex":[{"zh":"这儿的风景很漂亮。","py":"Zhèr de fēngjǐng hěn piàoliang.","en":"The scenery here is pretty."},{"zh":"你比较喜欢山上的风景还是海边的风景？","py":"Nǐ bǐjiào xǐhuan shānshàng de fēngjǐng háishì hǎibiān de fēngjǐng?","en":"Do you prefer scenery in a mountain or at the beach?"}]},{"id":225,"hanzi":"便宜","part":"Adj","pinyin":"piányí","def":"cheap","ex":[{"zh":"汽车在中国很便宜。","py":"Qìchē zài Zhōngguó hěn piányi.","en":"Cars are cheap in China."},{"zh":"在中国去饭馆吃饭很便宜。","py":"Zài Zhōngguó qù fànguǎn chīfàn hěn piányi.","en":"It’s cheap to go to eat at the restaurant in China."}]},{"id":226,"hanzi":"等","part":"Verb","pinyin":"děng","def":"to wait","ex":[{"zh":"请你等我一起去上课。","py":"Qǐng nǐ děng wǒ yìqǐ qù shàngkè.","en":"Please wait for me to go to class together."},{"zh":"可以请你等我吗?","py":"Kěyǐ qǐng nǐ děng wǒ ma?","en":"Can you wait for me?"}]},{"id":227,"hanzi":"迟到","part":"Verb","pinyin":"chídào","def":"to be late","ex":[{"zh":"他上班迟到了。","py":"Tā shàngbān chídào le.","en":"She is late for work."},{"zh":"上汉语课的时候，不可以迟到。","py":"Shàng Hànyǔ kè de shíhou, bù kěyǐ chídào.","en":"You can not be late for Chinese class."}]},{"id":228,"hanzi":"从不","part":"Adv","pinyin":"cóng bù","def":"never","ex":[{"zh":"我从不爬山。","py":"Wǒ cóngbù páshān.","en":"I never go mountain climbing."},{"zh":"他上班从不迟到。","py":"Tā shàngbān cóngbù chídào.","en":"He is never late for work."}]},{"id":229,"hanzi":"约","part":"Verb","pinyin":"yuē","def":"to make an appointment/to invite.","ex":[{"zh":"他朋友约我一起去爬山。","py":"Tā péngyou yuē wǒ yìqǐ qù páshān .","en":"His friend asked me to go mountain climbing together."},{"zh":"老师约我们下课一起去吃饭。","py":"Lǎoshī yuē wǒmen xiàkè yìqǐ qù chīfàn.","en":"The teacher asked us to eat a meal after class."}]},{"id":230,"hanzi":"上次","part":"Noun","pinyin":"shàngcì","def":"last time","ex":[{"zh":"上次我们看电影的时候，他也迟到了。","py":"Shàngcì wǒmen kàn diànyǐng de shíhou, tā yě chídào le.","en":"Last time he was also late for watching a movie,."},{"zh":"你上次已经迟到了，今天还是迟到。","py":"Nǐ shàngcì yǐjīng chídào le, jīntiān háishì chídào","en":"You were late last time, you are still late today."}]},{"id":231,"hanzi":"已经","part":"Adv","pinyin":"yǐjīng","def":"already","ex":[{"zh":"今天早上我去等公交车，我到公车站的时候, 公车已经走了。","py":"Jīntiān zǎoshàng wǒ qù děng gōngjiāochē, wǒ dào gōngchē zhàn de shíhou, gōngchē yǐjīng zǒu le.","en":"This morning I was going to wait for a bus, but when I arrived at the bus stop, the bus had already left."},{"zh":"我已经开车去超市了。","py":"Wǒ yǐjīng kāichē qù chāoshì le.","en":"I have already driven to supermarket."}]},{"id":232,"hanzi":"慢","part":"Adj","pinyin":"màn","def":"slow","ex":[{"zh":"他说中文，说得很慢","py":"Tā shuō zhōngwén,shuō de hěn màn.","en":"He speaks Chinese slowly"},{"zh":"你为什么那么慢？","py":"Nǐ wèishénme nàme màn?","en":"Why are you so slow?"}]},{"id":233,"hanzi":"多久","part":"Phrase","pinyin":"duōjiǔ","def":"how long..?","ex":[{"zh":"请问从超市到邮局要多久?","py":"Qǐngwèn cóng chāoshì dào yóujú yào duōjiǔ?","en":"How long does it take to get from the supermarket to the post office?"},{"zh":"从你家到博物馆坐地铁要多久?","py":"Cóng nǐ jiā dào bówùguǎn zuò dìtiě yào duōjiǔ?","en":"How long does it takes from your house to the museum by subway?"}]},{"id":234,"hanzi":"练习","part":"Verb","pinyin":"liànxí","def":"to practice","ex":[{"zh":"
