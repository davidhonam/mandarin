d."}]},{"id":901,"hanzi":"国王","part":"Noun","pinyin":"guówáng","def":"king","ex":[{"zh":"以前的国王常常会收到很多礼物。","py":"Yǐqián de guówáng chángcháng huì shōudào hěnduō lǐwù.","en":"The ancient kings usually receive many gifts."},{"zh":"以前，在中国的国王我们叫皇帝。","py":"Yǐqián，zài Zhōngguó de guó wáng wǒ men jiào huáng dì.","en":"In the past, the king in China we called the Emperor."}]},{"id":902,"hanzi":"从前","part":"Time Word","pinyin":"cóngqián","def":"previous","ex":[{"zh":"我跟他很久不见，他跟从前都不一样了。","py":"Wǒ gēn tā hěnjiǔ bújiàn, tā gēn cóngqián dōu bù yíyàng le.","en":"I haven't seen him for a very long time, he's not the same as before."},{"zh":"从前，有一个老人住在这里。","py":"Cóngqián, yǒu yī gè lǎo rén zhù zài zhè lǐ.","en":"Before, there's an old man living here."}]},{"id":903,"hanzi":"动物","part":"Noun","pinyin":"dòngwù","def":"animal","ex":[{"zh":"有些小动物很可爱，可是很危险，我们得小心。","py":"Yǒu xiē xiǎo dòngwù hěn kěài, kěshì hěn wēixiǎn, wǒmen děi xiǎoxīn.","en":"Some small animals are cute but they are dangerous. We need to be careful."},{"zh":"熊猫是中国的保育动物。","py":"Xióngmāo shì Zhōngguó de bǎo yù dòng wù.","en":"Panda is a protected animal in China."}]},{"id":904,"hanzi":"大象","part":"Noun","pinyin":"dàxiàng","def":"elephant","ex":[{"zh":"大象是世界上最大的动物。","py":"Dàxiàng shì shìjiè shàng zuì dà de dòngwù.","en":"The elephant is the biggest animal in the world."},{"zh":"大象有长长的鼻子。","py":"Dàxiàng yǒu zhǎng zhǎng de bí zǐ.","en":"The elephant has a long nose."}]},{"id":905,"hanzi":"好奇","part":"Adj","pinyin":"hàoqí","def":"curious","ex":[{"zh":"妈妈常说做人不要太好奇，做好自己的事情就好，才不会有麻烦。","py":"Māma cháng shuō zuò rén búyào tài hàoqí, zuò hǎo zìjǐ de shìqing jiù hǎo, cái búhuì yǒu máfan.","en":"Mom said people shouldn't be too curious, just do our own jobs so that we don't make troubles."},{"zh":"她最近刚来到巴西，所以对很多事情都很好奇。","py":"Tā zuì jìn gāng lái dào bā xī ，suǒ yǐ duì hěn duō shì qíng dōu hěn hǎo qí.","en":"She just moved to Brazil recently so she's curious about many things."}]},{"id":906,"hanzi":"记号","part":"Noun","pinyin":"jìhào","def":"mark","ex":[{"zh":"请你在坏掉的地方做个记号，这样我们才知道哪里有问题。","py":"Qǐng nǐ zài huàidiào de dìfāng zuò gè jìhào, zhèyàng wǒmen cái zhīdào nǎlǐ yǒu wèntí.","en":"Please mark on the broken ones so that we know where the problems are."},{"zh":"我在地图上做了记号，我们不会迷路的。","py":"Wǒ zài dìtúshàng zuò le jì hào, wǒ men bù huì mí lù de.","en":"I marked it on the map, so we won't get lost."}]},{"id":907,"hanzi":"画","part":"Noun/Verb","pinyin":"huà","def":"to draw, painting","ex":[{"zh":"这是图书馆的书，请不要在书上画记号。","py":"Zhè shì túshūguǎn de shū, qǐng búyào zài shūshàng huà jìhào.","en":"This book is from the library, please don't make the mark on it."},{"zh":"下个星期六，在国家博物馆一个画展。","py":"Xià gè xīng qī liù , zài guó jiā bó wù guǎn yī gè huà zhǎn.","en":"Next Saturday, there will be a painting exhibition in the national museum."}]},{"id":908,"hanzi":"船","part":"Noun","pinyin":"chuán","def":"boat","ex":[{"zh":"我不喜欢坐船，因为坐船会让我头痛。","py":"Wǒ bù xǐhuan zuò chuán, yīnwèi zuò chuán huì ràng wǒ tóutòng.","en":"I don't like to travel by boat because travelling by boat gives me a headache."},{"zh":"船上的旅客兴奋地看着海中的鲸鲨。","py":"Chuánshàng de lǚkè xīngfèn de kànzhe hǎizhōng de jīngshā.","en":"The passengers on the boat are watching at the whale shark in the sea excitedly."}]},{"id":909,"hanzi":"主意","part":"Noun","pinyin":"zhǔyi","def":"idea","ex":[{"zh":"这个主意很不错，我们试试看吧。","py":"Zhè gè zhǔyi hěn búcuò, wǒmen shìshì kàn ba.","en":"It's a pretty good idea, let's try it!"},{"zh":"我有一个主意，但不知道好不好。","py":"Wǒ yǒu yī gè zhǔ yì ，dàn bù zhī dào hǎo bù hǎo.","en":"I have an idea but I'm not sure it's good or not."}]},{"id":910,"hanzi":"下沉","part":"Verb","pinyin":"xiàchén","def":"to sink","ex":[{"zh":"大象一上船，船就下沉了。","py":"Dàxiàng yí shàngchuán,chuán jiù xiàchén le.","en":"The boat sink once the elephant goes aboard."},{"zh":"冒险途中他们的小船开始下沉","py":"Mào xiǎn tú zhōng tā men de xiǎo chuán kāi shǐ xià chén.","en":"Their boat started to sink in the middle of their adventure."}]},{"id":911,"hanzi":"流行","part":"Adj","pinyin":"liúxíng","def":"popular, fashionable","ex":[{"zh":"这件衣服是今年流行的款式，你一定会喜欢。","py":"Zhè jiàn yīfu shì jīnnián liúxíng de kuǎnshì, nǐ yídìng huì xǐhuan.","en":"This piece of clothes is the trendy design this year, you'll definitely like it."},{"zh":"医生说小明得了流行性感冒，要好好休息。","py":"Yīshēng shuō xiǎomíng dé le liúxíng xìng gǎnmào, yào hǎohǎo xiūxí.","en":"The doctor said Xiao Ming got the flu, need to take a rest properly."}]},{"id":912,"hanzi":"打扮","part":"Noun/Verb","pinyin":"dǎbàn","def":"to dress up, to make up , dress, way or style of dressing","ex":[{"zh":"日本人影响着每年流行的衣服款式和打扮。","py":"Rìběn rén yǐngxiǎng zhe měi nián liúxíng de yīfu kuǎnshì hé dǎbàn.","en":"Japanese influence the trendy style of clothing and dressing every year."},{"zh":"今天妹妹打扮得非常特别。","py":"Jīn tiān mèi mèi dǎ bàn dé fēi cháng tè bié.","en":"My sister dresses up very special today."}]},{"id":913,"hanzi":"绿","part":"Adj","pinyin":"lǜ","def":"green","ex":[{"zh":"绿衬衫配上蓝裙子真的很好看。","py":"Lǜ chènshān pèi shàng lán qúnzi zhēn de hěnhǎo kàn.","en":"Green shirts and blue skirt are matched beautifully."},{"zh":"在中国，戴绿色的帽子有一种不好的意思。","py":"Zài Zhōngguó，dài lǜsè de màozǐ yǒu yī zhǒng bù hǎo de yìsi.","en":"In China, wearing green hat has a negative meaning."}]},{"id":914,"hanzi":"配","part":"Verb","pinyin":"pèi","def":"to match","ex":[{"zh":"这件衣服配这件裤子很好看。","py":"Zhè jiàn yīfu pèi zhè jiàn kùzi hěn hǎokàn.","en":"This shirt and this pants are matched perfectly."},{"zh":"我喝咖啡的时候喜欢配可乐。","py":"Wǒ hē kā fēi de shí hòu xǐ huān pèi kě lè.","en":"I love to drink coffee with coke."}]},{"id":915,"hanzi":"紫","part":"Noun/Adj","pinyin":"zǐ","def":"purple","ex":[{"zh":"这副紫眼镜是我妹妹送我的生日礼物。","py":"Zhè fù zǐ yǎnjìng shì wǒ mèimei sòng wǒ de shēngrì lǐwù.","en":"This pair of purple glasses is the birthday gift from my sister."},{"zh":"五月的时候，街道开满了小紫花。","py":"Wǔ yuè de shí hòu，jiēdào kāi mǎn le xiǎo zǐ huā.","en":"In May, the street has blossomed with purple flowers."}]},{"id":916,"hanzi":"操心","part":"Verb","pinyin":"cāoxīn","def":"to worry about","ex":[{"zh":"别操心这么多，这样穿起来很好看的。你男朋友一定也会喜欢。","py":"Bié cāoxīn zhème duō, zhèyàng chuān qǐlái hěnhǎo kàn de. Nǐ nánpéngyou yí dìng yě huì xǐhuan.","en":"Don't worry too much, it looks great like this. Your boyfriend would definitely like it, too."},{"zh":"爸爸妈妈对孩子的教育十分操心。","py":"Bà bà mā mā duì hái zǐ de jiàoyù shí fēn cāo xīn.","en":"Parents are very worried about children's education."}]},{"id":917,"hanzi":"魅力","part":"Noun","pinyin":"mèilì","def":"charm","ex":[{"zh":"你的女朋友是一个很有魅力的女生。","py":"Nǐ de nǚpéngyou shì yí gè hěn yǒu mèilì de nǚshēng.","en":"Your girlfriend is a very charming girl."},{"zh":"我觉得去健身房运动的女生非常有魅力。","py":"Wǒ juédé qù jiànshēnfáng yùndòng de nǚshēng fēicháng yǒu mèilì.","en":"I think girls who exercise in the gym very charming."}]},{"id":918,"hanzi":"在乎","part":"Verb","pinyin":"zàihu","def":"to care about","ex":[{"zh":"我不在乎其他人怎么想，我只在乎你怎么想。","py":"Wǒ bú zàihu qítā rén zěnme xiǎng, wǒ zhǐ zàihu nǐ zěnme xiǎng.","en":"I don't care what other people think, I only care what you think."},{"zh":"他怎么想，我不在乎。","py":"Tā zěn me xiǎng, wǒ bù zài hū.","en":"I don't care what he thinks."}]},{"id":919,"hanzi":"理想","part":"Noun","pinyin":"lǐxiǎng","def":"dream, ideal","ex":[{"zh":"我的理想工作是当一个可以帮助别人的医生。","py":"Wǒ de lǐxiǎng gōngzuò shì dāng yīgè kěyǐ bāngzhù biérén de yīshēng.","en":"My ideal job is to become a doctor helping others."},{"zh":"当一名记者是我的理想。","py":"Dāng yī míng jìzhě shì wǒ de lǐ xiǎng.","en":"Being a reporter is my dream."}]},{"id":920,"hanzi":"司机","part":"Noun","pinyin":"sījī","def":"driver","ex":[{"zh":"司机的工作很辛苦，有时候得很早起床去工作。","py":"Sījī de gōngzuò hěn xīnkǔ, yǒu shíhou děi hěn zǎo qǐchuáng qù gōngzuò.","en":"The driver's job can be very tough, sometimes need to wake up early to work."},{"zh":"为了安全，司机都会请我们系安全带。","py":"Wèi le ān quán ，sī jī dōu huì qǐng wǒ men jì ān quán dài.","en":"The driver asks us to fasten our seatbelts for our safety."}]},{"id":921,"hanzi":"外交官","part":"Noun","pinyin":"wàijiāo guān","def":"diplomat","ex":[{"zh":"我以后想当一位有名的外交官。","py":"Wǒ yǐhòu xiǎng dāng yí wèi yǒumíng de wàijiāo guān.","en":"I want to be a famous diplomat in the future."},{"zh":"他的爸爸是外交官，长期在国外工作。","py":"Tā de bàba shì wàijiāo guān, chánɡqī zài guówài gōngzuò.","en":"His father is a diplomat who works abroad for long periods of time."}]},{"id":922,"hanzi":"工资","part":"Noun","pinyin":"gōngzī","def":"pay, wages","ex":[{"zh":"秘书的工资不多可是事情很多。","py":"Mìshū de gōngzī bùduō kěshì shìqing hěnduō.","en":"The secretary doesn't have high wages but does have a lot of things to do."},{"zh":"我理想的工资是一万五人民币。","py":"Wǒ lǐxiǎng de gōngzī shì yī wàn wǔ rénmínbì.","en":"My ideal salary is fifteen thousand RMB."}]},{"id":923,"hanzi":"留","part":"Verb","pinyin":"liú","def":"to stay, leave behind","ex":[{"zh":"你要不要留在这里吃晚饭再回家？","py":"Nǐ yào bùyào liú zài zhèlǐ chī wǎnfàn zài huí jiā?","en":"Do you want to stay here and eat dinner before you go home?"},{"zh":"他刚才给你打了电话, 可是你不在。我请他留言给你。","py":"Tā gāngcái gěi nǐ dǎ le diànhuà, kěshì nǐ bú zài. wǒ qǐng tā liúyán gěi nǐ.","en":"He just called you but you were not here. I asked him to leave a message."}]},{"id":924,"hanzi":"护士","part":"Noun","pinyin":"hùshì","def":"nurse","ex":[{"zh":"护士的工资没有医生多，可是对病人来说他们很重要。","py":"Hùshì de gōngzī méiyǒu yīshēng duō, kěshì duì bìngrén láishuō tāmen hěn zhòngyào.","en":"The nurse's wages are not as much as the doctor's, but patients are very important for the nurse."},{"zh":"这位护士是第一天上班，他看起来很紧张。","py":"Zhè wèi hù shì shì dì yī tiān shàng bān ，tā kàn qǐ lái hěn jǐn zhāng.","en":"The nurse is having his first-day duty, he looks very nervous."}]},{"id":925,"hanzi":"为","part":"Prep","pinyin":"wèi","def":"for","ex":[{"zh":"老师、警察、医生都是为大家服务的工作。","py":"Lǎoshī, jǐngchá, yīshēng dōu shì wéi dàjiā fúwù de gōngzuò.","en":"Teachers, police officer and doctors are jobs that offer service for the people."},{"zh":"他为我写了一首歌。","py":"Tā wèi wǒ xiě le yì shǒu gē.","en":"He wrote a song for me."}]},{"id":926,"hanzi":"服务","part":"Noun","pinyin":"fúwù","def":"service","ex":[{"zh":"这家饭馆的服务很好","py":"Zhè jiā fànguǎn de fúwù hěnhǎo.","en":"This restaurant offers excellent service."},{"zh":"服务员，请给我一杯可乐。","py":"Fú wù yuán, qǐng gěi wǒ yī bēi kě lè.","en":"Waiter, please give me a glass of cola."}]},{"id":927,"hanzi":"愿望","part":"Noun","pinyin":"yuànwàng","def":"desire, wish","ex":[{"zh":"我的愿望是可以到中国学习汉语。","py":"Wǒ de yuànwàng shì kěyǐ dào Zhōngguó xuéxi hànyǔ.","en":"My wish is to go to China and study Chinese."},{"zh":"我小时候的愿望是当一名厨师。","py":"Wǒ xiǎo shí hòu de yuàn wàng shì dāng yī míng chúshī.","en":"My childhood wish is to be a chef."}]},{"id":928,"hanzi":"实现","part":"Verb","pinyin":"shíxiàn","def":"to fulfil, to come true","ex":[{"zh":"如果你希望这个愿望可以实现就要努力。","py":"Rúguǒ nǐ xīwàng zhègè yuànwàng kěyǐ shixiàn jiùyào nǔlì.","en":"If you want this dream to be realized, then you have to work hard."},{"zh":"虽然我的愿望都没实现，但是我还是很快乐，因为我有我的朋友和家人。","py":"Suīrán wǒ de yuànwàng dōu méi shíxiàn, dànshì wǒ háishì hěn kuàilè, yīnwèi wǒ yǒu wǒ de péngyǒu hé jiārén.","en":"Although my dreams didn't come true, I'm still happy because I have my friends and family."}]},{"id":929,"hanzi":"瞒","part":"Verb","pinyin":"mán","def":"to hide the truth from","ex":[{"zh":"如果你有什么事情都可以找我聊一聊，不要瞒着我去做。","py":"Rúguǒ nǐ yǒu shénme shìqíng dōu kěyǐ zhǎo wǒ liáoyìliáo, búyào mán zhe wǒ qù zuò.","en":"If you have any problem you can talk to me, don't do something without me knowing."},{"zh":"我非常了解我的朋友，他没有事可以瞒过我。","py":"Wǒ fēicháng liǎojiě wǒ de péngyǒu, tā méiyǒu shì kěyǐ mánguò wǒ.","en":"I know my friend very well, there's nothing he can hide from me."}]},{"id":930,"hanzi":"独生女","part":"Noun","pinyin":"dúshēngnǚ","def":"only daughter","ex":[{"zh":"我是家里的独生女，从小就很希望有兄弟姐妹。","py":"Wǒ shì jiālǐ de dúshēngnǚ, cóngxiǎo jiù hěn xīwàng yǒu xiōngdì jiěmèi.","en":"I'm the only daughter in my family, I've wished to have siblings since I was a child."},{"zh":"她的个性很像独生女。","py":"Tā de gè xìng hěn xiàng dú shēng nǚ.","en":"Her personality is that of an only child."}]},{"id":931,"hanzi":"自由","part":"Noun/Adj","pinyin":"zìyóu","def":"free, freedom","ex":[{"zh":"我想要自由地在国外生活一年再回国。","py":"Wǒ xiǎngyào zìyóu de zài guówài shēnghuó yì nián zài huíguó.","en":"I want to live abroad freely for one year and then come back."},{"zh":"鸟儿自由的在天空飞翔。","py":"Niǎo ér zì yóu de zài tiān kōng fēi xiáng.","en":"Birds fly in the sky freely."}]},{"id":932,"hanzi":"商量","part":"Verb","pinyin":"shāngliáng","def":"to consult, to discuss","ex":[{"zh":"如果你有什么烦恼的事情都可以找我商量。","py":"Rúguǒ nǐ yǒu shénme fánnǎo de shìqing dōu kěyǐ zhǎo wǒ shāngliáng.","en":"If you have any trouble, feel free to discuss with me."},{"zh":"我已经和我的律师商量过了。","py":"Wǒ yǐ jīng hé wǒ de lǜ shī shāng liàng guò le.","en":"I've discussed with my lawyer already."}]},{"id":933,"hanzi":"实话","part":"Noun","pinyin":"shíhuà","def":"truth","ex":[{"zh":"他说的每一句话都不是实话，你不要相信他。","py":"Tā shuō de měi yījù huà dōu bùshì shíhuà, nǐ bùyào xiāngxìn tā.","en":"Every sentence he said is not true, don't trust him."},{"zh":"在我面前你可以说实话，不用担心。","py":"Zài wǒ miàn qián nǐ kě yǐ shuō shí huà ，bù yòng dān xīn.","en":"You can tell the truth in front of me, don't worry."}]},{"id":934,"hanzi":"离别","part":"Verb","pinyin":"líbié","def":"to leave, to depart","ex":[{"zh":"他想到要跟朋友离别就很难过。","py":"Tā xiǎngdào yào gēn péngyǒu líbié jiù hěn nánguò.","en":"He felt sad thinking of being apart from his friends."},{"zh":"人们说，每一次离别，都是为了下一次相聚。","py":"Rén men shuō，měi yī cì líbié，dōu shì wèile xià yī cì xiāng jù.","en":"People say that every departure is preparation for the next reunion."}]},{"id":935,"hanzi":"网上","part":"Noun","pinyin":"wǎngshàng","def":"online","ex":[{"zh":"我喜欢在网上买衣服，因为比较便宜也比较方便。","py":"Wǒ xǐhuan zài wǎngshàng mǎi yīfu, yīnwèi bǐjiào piányí yě bǐjiào fāngbiàn.","en":"I love to buy clothes online because they are cheaper and more convenient."},{"zh":"网上常常可以找到很多学习西班牙语的资料。","py":"wǎng shàng cháng cháng kě yǐ zhǎo dào hěn duō xué xí xī bān yá yǔ de zī liào.","en":"There are many Spanish learning materials you can find on the internet."}]},{"id":936,"hanzi":"购物","part":"Verb Object","pinyin":"gòuwù","def":"to shop (shopping)","ex":[{"zh":"购物的方法有很多种，有的人喜欢在网上购物，有的人喜欢去店里买。","py":"Gòuwù de fāngfǎ yǒu hěnduō zhǒng, yǒude rén xǐhuan zài wǎng shàng gòuwù, yǒude rén xǐhuan qù diàn lǐ mǎi.","en":"There are many ways of shopping, some people like to shop online and some like to shop in real stores."},{"zh":"在网上购物容易又方便。","py":"zài wǎng shàng gòu wù róng yì yòu fāng biàn","en":"Shopping online is easy and convenient."}]},{"id":937,"hanzi":"退","part":"Verb","pinyin":"tuì","def":"to withdraw (a product)","ex":[{"zh":"一般的网路商店如果尺寸不合，都可以退货。","py":"Yībān de wǎnglù shāngdiàn rúguǒ chǐcùn bù hé, dōu kěyǐ tuìhuò.","en":"You can return your items bought from the internet if the size isn't fit."},{"zh":"我们将会在七天之后退钱到你的信用卡里面。","py":"Wǒ men jiāng huì zài qī tiān zhī hòu tuì qián dào nǐ de xìnyòngkǎ lǐ miàn.","en":"We'll direct the refund to your credit card after seven days."}]},{"id":938,"hanzi":"可靠","part":"Adj","pinyin":"kěkào","def":"reliable, trustworthy","ex":[{"zh":"你是一个可靠的人吗？我可以把这个工作交给你吗？","py":"Nǐ shì yí gè kěkào de rén ma? Wǒ kěyǐ bǎ zhègè gōngzuò jiāo gěi nǐ ma?","en":"Are you a reliable person? Can I give this job to you?"},{"zh":"这个资讯可靠吗?","py":"Zhè gè zī xùn kě kào ma?","en":"Is this information trustworthy?"}]},{"id":939,"hanzi":"牌子","part":"Noun","pinyin":"páizi","def":"brand","ex":[{"zh":"有很多有名的牌子都是来自美国。","py":"Yǒu hěnduō yǒumíng de páizi dōushì láizì Měiguó.","en":"Many prestigious brands come from America."},{"zh":"很多人都说错了这个牌子的念法。","py":"Hěn duō rén dōu shuō cuò le zhè gè pái zǐ de niàn fǎ.","en":"Many people would pronounce the name of this brand wrongly."}]},{"id":940,"hanzi":"试穿","part":"Verb","pinyin":"shìchuān","def":"to try wearing clothes, fitting trial","ex":[{"zh":"我觉得买衣服的时候得自己去买才可以，因为得试穿才知道尺寸合不合适。","py":"Wǒ juéde mǎi yīfu de shíhou děi zìjǐ qù mǎi cái kěyǐ, yīnwèi děi shìchuān cái zhīdào chǐcùn hé bù héshì.","en":"I think one should buy the clothes in person so that they can try them on and see whether the clothes are suitable."},{"zh":"想试穿的话里面有更衣间。","py":"Xiǎng shìchuān de huà lǐ miàn yǒu gēng yī jiān.","en":"There's the fitting room if you want to try them."}]},{"id":941,"hanzi":"用品","part":"Noun","pinyin":"yòngpǐn","def":"products","ex":[{"zh":"这里卖了很多生活用品，价钱都很便宜。","py":"Zhèlǐ màile hěnduō shēnghuó yòngpǐn, jiàqián dōu hěn piányí.","en":"Here sells a lot of daily commodities whose prices are very cheap."},{"zh":"厨房的用品这里都有，可以自己拿去用。","py":"Chúfáng de yòngpǐn zhèlǐ dōu yǒu，kěyǐ zìjǐ ná qù yòng.","en":"Kitchen commodities are provided here, you can use them if you want."}]},{"id":942,"hanzi":"差","part":"Adj","pinyin":"chà","def":"inferior","ex":[{"zh":"这件衣服看起来质量很差，我觉得还是不要买了吧。","py":"Zhè jiàn yīfu kàn qǐlái zhìliàng hěn chà, wǒ juéde háishì búyào mǎi le ba.","en":"The quality of this piece of clothes seems bad, I think we just don't buy it."},{"zh":"她的能力不差，但是需要有人帮她一把。","py":"Tā de néng lì bù chà ，dàn shì xū yào yǒu rén bāng tā yī bǎ.","en":"Her capabilities are okay, but she needs someone to help her a bit."}]},{"id":943,"hanzi":"户头","part":"Noun","pinyin":"hùtóu","def":"bank account","ex":[{"zh":"到中国以后, 我想去开一个户头。","py":"Dào Zhōngguó yǐhòu, wǒ xiǎng qù kāi yīgè hùtóu.","en":"I want to open a bank account after going to China."},{"zh":"我在美国的户头有一点问题，需要打一通电话到美国。","py":"Wǒ zài měiguó de hùtóu yǒu yīdiǎn wèntí, xūyào dǎ yītòng diànhuà dào měiguó.","en":"My bank account in America has some problems, I need to make a call to America."}]},{"id":944,"hanzi":"办","part":"Verb","pinyin":"bàn","def":"to do, to handle, to manage","ex":[{"zh":"我现在赶着要到银行办一些事情。","py":"Wǒ xiànzài gǎnzhe yào dào yínháng bàn yīxiē shìqíng.","en":"I am in rush to go to the bank to do something."},{"zh":"我的护照不见了，明天要去重新办一本。","py":"Wǒ de hùzhào bùjiànle, míngtiān yào qù chóngxīn bàn yī běn.","en":"I lost my passport, I'll apply for a new one tomorrow."}]},{"id":945,"hanzi":"手续","part":"Noun","pinyin":"shǒuxù","def":"procedures","ex":[{"zh":"我想要去中国,可是我不知道办签证有哪些手续。","py":"Wǒ xiǎng yào qù Zhōngguó, kěshì wǒ bù zhīdào bàn qiānzhèng yǒu nǎxiē shǒuxù.","en":"I want to go to China but I don't know the procedures of visa application."},{"zh":"办户头的手续费用是一百人民币。","py":"Bàn hùtóu de shǒuxù fèiyòng shì yībǎi rénmínbì.","en":"The fee of bank account application is one hundred RMB."}]},{"id":946,"hanzi":"转账","part":"Verb Object","pinyin":"zhuǎnzhàng","def":"to transfer account","ex":[{"zh":"现在付款的方式也有很多种, 银行转账也是其中之一。","py":"Xiànzài fùkuǎn de fāngshì yěyǒu hěnduō zhǒng, yínháng zhuǎnzhàng yěshì qízhōng zhī yī.","en":"There are many ways to pay nowadays, bank transfer account is one of them."},{"zh":"今晚我会将之前跟你借的钱转账给你。","py":"Jīn wǎn wǒ huì jiāng zhī qián gēn nǐ jiè de qián zhuǎn zhàng gěi nǐ.","en":"I'll transfer to you the money I borrowed from you tonight."}]},{"id":947,"hanzi":"自动","part":"Adv","pinyin":"zìdòng","def":"automatically","ex":[{"zh":"你可以到银行办自动转帐，这样不用担心电话费是不是又忘了缴。","py":"Nǐ kěyǐ dào yínháng bàn zìdòng zhuǎnzhàng, zhèyàng bùyòng dānxīn diànhuà fèi shì bùshì yòu wàngle jiǎo.","en":"You can go to the bank for auto transfer so that you don't have to worry whether you forget to pay your phone bills."},{"zh":"吃完饭后，请自动把碗洗一洗。","py":"Chī wán fàn hòu, qǐng zì dòng bǎ wǎn xǐ yī xǐ.","en":"Please voluntarily wash the dishes after dinner."}]},{"id":948,"hanzi":"收据","part":"Noun","pinyin":"shōujù","def":"receipt","ex":[{"zh":"我刚刚忘了跟店员要收据, 现在得马上回去。","py":"Wǒ gānggāng wàngle gēn diànyuán yào shōujù, xiànzài de mǎshàng huíqù.","en":"I forgot to ask the clerk for the receipt, I have to go back right now."},{"zh":"收据上的日期写错了，请你重新写一张。","py":"Shōujù shàng de rìqī xiě cuò le, qǐng nǐ chóngxīn xiě yī zhāng.","en":"The date on the receipt is wrong, please write a new one."}]},{"id":949,"hanzi":"缴费","part":"Verb Object","pinyin":"jiǎofèi","def":"to pay a fee","ex":[{"zh":"除了去便利商店缴费, 我们也可以用微信缴费。","py":"Chúle qù biànlì shāngdiàn jiǎofèi, wǒmen yě kěyǐ yòng wēixìn jiǎofèi.","en":"Except pay a fee in the convenience store, we can also pay by WeChat."},{"zh":"缴费时间只到十月三十一日。","py":"Jiǎofèi shíjiān zhǐ dào shí yuè sānshíyī rì.","en":"The due date for paying the fee is October thirty-first."}]},{"id":950,"hanzi":"骂","part":"Verb","pinyin":"mà","def":"to verbally abuse , call names","ex":[{"zh":"我知道了！别骂我了。","py":"Wǒ zhīdàole! Bié mà wǒle.","en":"I got it! Stopping blaming on me."},{"zh":"他上班迟到被骂了。","py":"Tā shàngbān chídào bèi màle.","en":"He was scolded for being late at work."}]},{"id":951,"hanzi":"考虑","part":"Verb","pinyin":"kǎolǜ","def":"to think over, to consider","ex":[{"zh":"你考虑一下，要不要跟我们去海边。","py":"Nǐ kǎolǜ yíxià, yào búyào gēn wǒmen qù hǎibiān.","en":"Just think about it, whether or not to go to the beach with us."},{"zh":"可以给我时间考虑吗？","py":"Kě yǐ gěi wǒ shí jiān kǎo lǜ ma?","en":"Can I have some time to consider?"}]},{"id":952,"hanzi":"推荐","part":"Verb","pinyin":"tuījiàn","def":"to recommend","ex":[{"zh":"我非常推荐这间餐厅的牛肉面。","py":"Wǒ fēicháng tuījiàn zhè jiān cāntīng de niúròu miàn.","en":"I highly recommend the beef noodles in this restaurant."},{"zh":"我想申请这一间大学，请您帮我写一封推荐信。","py":"Wǒ xiǎng shēn qǐng zhè yī jiān dà xué ，qǐng nín bāng wǒ xiě yī fēng tuī jiàn xìn.","en":"I want to apply for this university, please write a recommendation letter for me."}]},{"id":953,"hanzi":"可惜","part":"Adj/Adv","pinyin":"kěxī","def":"it is a pity, what a pity, unfortunately","ex":[{"zh":"真是太可惜了，明天你不能跟我们去吃饭。","py":"Zhēnshì tài kěxī le, míngtiān nǐ bùnéng gēn wǒmen qù chīfàn.","en":"What a pity you can't eat with us tomorrow."},{"zh":"差一点就得到第一名了，真可惜。","py":"Chà yī diǎn jiù dé dào dì yī míng le ，zhēn kě xī.","en":"Almost got the first place, what a pity!"}]},{"id":954,"hanzi":"划算","part":"Adj","pinyin":"huásuàn","def":"worthwhile, value for money, to view as profitable","ex":[{"zh":"今天电脑在打折，现在买很划算。","py":"Jīntiān diànnǎo zài dǎzhé, xiànzài mǎi hěn huásuàn.","en":"The computer is on discount today, it's cost-effective to buy now."},{"zh":"十月一日到十月七日买一送一，非常划算。","py":"Shí yuè yī rì dào shí yuè qī rì mǎi yī sòng yī ，fēi cháng huá suàn.","en":"Buy one, get one free from October first to seventh, that's a steal!"}]},{"id":955,"hanzi":"保证","part":"Verb","pinyin":"bǎozhèng","def":"to guarantee, to assure","ex":[{"zh":"我向你保证，下次不会迟到。","py":"Wǒ xiàng nǐ bǎozhèng, xiàcì bú huì chídào.","en":"I promise you, I will not be late next time."},{"zh":"这是新电视的保证书，如果电视任何有问题，可以带着这本保证书回去，换一台新电视。","py":"Zhè shì xīn diàn shì de bǎo zhèng shū ，rú guǒ diàn shì rèn hé yǒu wèn tí ，kě yǐ dài zhe zhè běn bǎo zhèng shū huí qù, huàn yī tái xīn diàn shì.","en":"This is the warranty of the new television. If there's any problem, you can take this warranty and exchange for a new television."}]},{"id":956,"hanzi":"耳机","part":"Noun","pinyin":"ěrjī","def":"headphones, earphones, telephone receiver","ex":[{"zh":"这副耳机是你的吗？","py":"Zhè fù ěrjī shì nǐ​​de ma?","en":"Is this pair of headphones yours?"},{"zh":"我的耳机坏了，需要去买一副新的。","py":"Wǒ de ěr jī huài le ，xū yào qù mǎi yī fù xīn de.","en":"My headphones are broken, have to buy a new pair."}]},{"id":957,"hanzi":"修","part":"Verb","pinyin":"xiū","def":"to repair, to build","ex":[{"zh":"他可以帮你修电脑。","py":"Tā kěyǐ bāng nǐ xiū diànnǎo.","en":"He can fix the computer for you."},{"zh":"我的好像有一点问题，你能不能帮我看一看，是不是一定要拿去修。","py":"wǒ de hǎo xiàng yǒu yī diǎn wèn tí ，nǐ néng bù néng bāng wǒ kàn yī kàn ，shì bù shì yídìngyào ná qù xiū.","en":"Mine seems to have some problems. Can you take a look for me and decide whether I should take it to be repaired."}]},{"id":958,"hanzi":"防水","part":"Adj","pinyin":"fángshuǐ","def":"waterproof","ex":[{"zh":"这件外套不但防水，还很温暖。","py":"Zhè jiàn wàitào búdàn fángshuǐ, hái hěn wēnnuǎn.","en":"This coat is not only waterproof but warm."},{"zh":"我的手机防水但是在水中不能使用。","py":"Wǒ de shǒu jī fáng shuǐ dàn shì zài shuǐ zhōng bù néng shǐ yòng.","en":"My phone is waterproof but it can't be used in the water."}]},{"id":959,"hanzi":"要求","part":"Noun/Verb","pinyin":"yāoqiú","def":"to request, to require, the other party's wishes and conditions","ex":[{"zh":"你对于食物有什么要求吗？","py":"Nǐ duìyú shíwù yǒu shénme yāoqiú ma?","en":"Do you have any requests for the food?"},{"zh":"我租房子的要求很高，隔音要好，一定要是新房子，邻居必须是上班族。","py":"Wǒ zū fáng zǐ de yào qiú hěn gāo ，gé yīn yào hǎo ，yídìngyào shì xīn fáng zǐ ，lín jū bì xū shì shàng bān zú.","en":"I have a high standard when renting a house. Great soundproof, must be a new house, and my neighbors must be office workers."}]},{"id":960,"hanzi":"意见","part":"Noun","pinyin":"yìjiàn","def":"suggestion","ex":[{"zh":"我的意见是先去吃饭再继续念书。","py":"Wǒ de yìjiàn shì xiān qù chīfàn zài jìxù niànshū.","en":"My suggestion is eat first and then continue studying."},{"zh":"在我不知道怎么办的时候，妈妈会给我她的意见。","py":"Zài wǒ bù zhīdào zěnmebàn de shíhòu, māma huì gěi wǒ tā de yìjiàn.","en":"When I don't know what to do, my mom will give me her advice."}]},{"id":961,"hanzi":"情况","part":"Noun","pinyin":"qíngkuàng","def":"situation","ex":[{"zh":"遇到这样的情况，你会怎么做？","py":"Yùdào zhèyàng de qíngkuàng, nǐ huì zěnme zuò?","en":"If you run into this type of situation, what will you do?"},{"zh":"现在的情况很紧急，必须要赶快离开。","py":"Xiànzài de qíngkuàng hěn jǐnjí, bìxū yào gǎnkuài líkāi.","en":"The current situation is quite urgent, we must leave now."}]},{"id":962,"hanzi":"长辈","part":"Noun","pinyin":"zhǎngbèi","def":"elder family members","ex":[{"zh":"爸爸、妈妈、叔叔和阿姨都是我的长辈。","py":"Bàba, māma, shūshu hé āyí dōu shì wǒ de zhǎngbèi.","en":"Father, mother, uncle and auntie are all my elders."},{"zh":"过年的时候长辈会给我们红包。","py":"Guònián de shíhòu zhǎngbèi huì gěi wǒmen hóngbāo.","en":"At New Years, our elders will give us red envelope."}]},{"id":963,"hanzi":"晚辈","part":"Noun","pinyin":"wǎnbèi","def":"younger family members","ex":[{"zh":"晚辈的意见有时候不被接受。","py":"Wǎnbèi de yìjiàn yǒu shíhòu bú bèi jiēshòu.","en":"Sometimes the opinions of younger generations are not accepted."},{"zh":"过年的时候晚辈要和长辈拜年。","py":"Guònián de shíhòu wǎnbèi yào hé zhǎngbèi bàinián.","en":"On New Year when, the younger generation should bring in the New Year to the older generation"}]},{"id":964,"hanzi":"各","part":"Pronoun","pinyin":"gè","def":"each","ex":[{"zh":"我的数学好，哥哥的体育好，我们各有各的专长。","py":"Wǒ de shùxué hǎo, gēge de tǐyù hǎo, wǒmen gè yǒu gè de zhuāncháng.","en":"I'm good at math, my brother's good at sports, we each have our own talents."},{"zh":"红的书包大，绿的书包美，它们各有各的优点。","py":"Hóng de shūbāo dà, lǜ de shūbāo měi, tāmen gè yǒu gè de yōudiǎn.","en":"The red bags are big, the green bags are beautiful, they each have their own advantage."}]},{"id":965,"hanzi":"上一代","part":"Noun","pinyin":"shàngyídài","def":"last generation","ex":[{"zh":"上一代的人都习惯早睡早起。","py":"Shàngyídài de rén dōu xíguàn zǎo shuì zǎo qǐ.","en":"People from the previous generation were all accustomed to going to bed and getting up early."},{"zh":"上一代的人的想法有时候和我们不同。","py":"Shàngyídài de rén de xiǎngfǎ yǒu shíhòu hé wǒmen bùtóng.","en":"The ideas of the last generation are sometimes different from ours."}]},{"id":966,"hanzi":"背景","part":"Noun","pinyin":"bèijǐng","def":"background","ex":[{"zh":"这个故事的背景很有趣。","py":"Zhège gùshì de bèijǐng hěn yǒuqù.","en":"The background of this story is quite interesting."},{"zh":"他负责画这部漫画的背景。","py":"Tā fùzé huà zhè bù mànhuà de bèijǐng.","en":"He is responsible for painting the background of this comic book."}]},{"id":967,"hanzi":"总之","part":"Adv","pinyin":"zǒngzhī","def":"to sum up, overall","ex":[{"zh":"今天天气热又下雨，总之是一趟不愉快的旅游。","py":"Jīntiān tiānqì rè yòu xiàyǔ, zǒngzhī shì yítàng bù yúkuài de lǚyóu.","en":"Today the weather was both hot and raining, overall it was a bad trip."},{"zh":"这堂课的作业很多又很难，总之是一趟很累的课。","py":"Zhè táng kè de zuòyè hěnduō yòu hěn nán, zǒngzhī shì yī tàng hěn lèi de kè.","en":"This lesson comes with a lot of homework and is very difficult, to sum it up, it's a very tiring lesson."}]},{"id":968,"hanzi":"想法","part":"Noun","pinyin":"xiǎngfǎ","def":"opinion","ex":[{"zh":"以前的老师觉得学生只要读书，不需要有其他想法。","py":"Yǐqián de lǎoshī juédé xuéshēng zhǐyào dúshū, bù xūyào yǒu qítā xiǎngfǎ.","en":"Past teachers thought students only needed to student, didn't need any other ideas."},{"zh":"我的老师会问我们对中文课的想法。","py":"Wǒ de lǎoshī huì wèn wǒmen duì zhōngwén kè de xiǎngfǎ.","en":"My teacher will ask us our opinions about Chinese class."}]},{"id":969,"hanzi":"幸亏","part":"Adv","pinyin":"xìngkuī","def":"fortunately, luckily","ex":[{"zh":"幸亏有你跟我一起旅行。","py":"Xìngkuī yǒu nǐ gēn wǒ yìqǐ lǚxíng.","en":"Fortunately you are traveling with me."},{"zh":"幸亏今天我带了伞，不然就会变成落汤鸡了。","py":"Xìng kuī jīn tiān wǒ dài le sǎn ，bù rán jiù huì biàn chéng luò tāng jī le.","en":"Fortunately I brought the umbrella today, or I'll look like a drowned rat."}]},{"id":970,"hanzi":"严重","part":"Adj","pinyin":"yánzhòng","def":"grave, serious, severe, critical","ex":[{"zh":"这个问题不严重，我们可以慢慢地解决。","py":"Zhège wèntí bù yánzhòng, wǒmen kěyǐ màn man de jiějué.","en":"This is not a serious problem. We can solve it gradually."},{"zh":"他这次生病好像很严重，必须住院一段时间。","py":"Tā zhè cì shēng bìng hǎo xiàng hěn yán zhòng ，bì xū zhù yuàn yī duàn shí jiān.","en":"It seems that he's getting a serious sick this time, he has to be hospitalized for a period of time."}]},{"id":971,"hanzi":"受伤","part":"Verb","pinyin":"shòushāng","def":"to sustain injuries, be wounded, be harmed (in an accident etc)​","ex":[{"zh":"他受伤了，所以今天不来公司了。","py":"Tā shòushāngle, suǒyǐ jīntiān bùlái gōngsī le.","en":"He's injured so he's not coming to the company."},{"zh":"我的手受伤了，不能碰水。","py":"Wǒ de shǒu shòu shāng le ，bù néng pèng shuǐ.","en":"My hand is injured and should keep away from the water."}]},{"id":972,"hanzi":"撞到","part":"Verb","pinyin":"zhuàngdào","def":"to bump into, to hit","ex":[{"zh":"他骑车的时候，不小心撞到树。","py":"Tā qíchē de shíhou, bù xiǎoxīn zhuàngdào shù.","en":"He bumped into a tree when he's riding."},{"zh":"今天太急了，走路撞到一个学生。","py":"Jīn tiān tài jí le ，zǒu lù zhuàng dào yī gè xué shēng.","en":"I bumped into a student when I was walking in a rush today."}]},{"id":973,"hanzi":"树","part":"Noun","pinyin":"shù","def":"tree","ex":[{"zh":"这棵树已经有五百年的历史。","py":"Zhè kē shù yǐjīng yǒu wǔ bǎi nián de lìshǐ.","en":"This tree has a five-hundred year history already."},{"zh":"妈妈想在家门种一棵树。","py":"Mā mā xiǎng zài jiā mén zhǒng yī kē shù.","en":"My mom wants to plant a tree in front of the house."}]},{"id":974,"hanzi":"事故","part":"Noun","pinyin":"shìgù","def":"accident","ex":[{"zh":"学校的门口发生了交通事故。","py":"Xuéxiào de ménkǒu fāshēngle jiāotōng shìgù.","en":"A traffic accident happened at the gate of the school."},{"zh":"由于火车发生事故，所以交通大乱。","py":"Yóu yú huǒ chē fā shēng shì gù ，suǒ yǐ jiāo tōng dà luàn.","en":"The train accident causes the traffic chaos."}]},{"id":975,"hanzi":"救护车","part":"Noun","pinyin":"jiùhùchē","def":"ambulance","ex":[{"zh":"有人受伤了，快叫救护车。","py":"Yǒurén shòushāngle, kuài jiào jiùhùchē.","en":"Someone's injured, call the ambulance!"},{"zh":"救护车的声音从右后方传来，我们应该往左移，给救护车过。","py":"Jiùhùchē de shēng yīn cóng yòu hòu fāng chuán lái ，wǒ men yīng gāi wǎng zuǒ yí , gěi jiù hù chē guò.","en":"The ambulance siren came from the right side behind us, so we should move left and let the ambulance pass."}]},{"id":976,"hanzi":"棵","part":"Measure word","pinyin":"kē","def":"classifier for trees, cabbages, plants etc","ex":[{"zh":"公园里有很多棵树。","py":"Gōngyuán lǐ yǒu hěnduō kē shù.","en":"There are many trees in the park."},{"zh":"地铁站前有一棵樱花树。","py":"Dì tiě zhàn qián yǒu yī kē yīng huā shù.","en":"There's a cherry blossom tree in front of the subway station."}]},{"id":977,"hanzi":"声音","part":"Noun","pinyin":"shēngyīn","def":"voice, sound","ex":[{"zh":"你听见什么声音了吗？","py":"Nǐ tīngjiàn shénme shēngyīn le ma?","en":"Have you heard any sound?"},{"zh":"你听到了吗？那是猫头鹰的声音。","py":"Nǐ tīng dào le ma ？nà shì māo tóu yīng de shēng yīn.","en":"Did you hear? That's the sound of an owl."}]},{"id":978,"hanzi":"染","part":"Verb","pinyin":"rǎn","def":"to dye","ex":[{"zh":"我这个星期想去染头发, 你觉得染什么颜色好？","py":"Wǒ zhège xīngqī xiǎng qù rǎn tóufǎ, nǐ juéde rǎn shénme yánsè hǎo?","en":"I want to dye my hair this week, what color do you think is suitable?"},{"zh":"他四十年来，每天都喝咖啡，牙齿都染黄了。","py":"Tā sìshí niánlái, měitiān dū hē kāfēi, yáchǐ dōu rǎn huángle.","en":"He has drank coffee every day for the past forty years. His teeth are dyed into yellow."}]},{"id":979,"hanzi":"醒目","part":"Adj","pinyin":"xǐngmù","def":"eye-catching","ex":[{"zh":"A: 为什么你要染这个颜色的头发？ B: 因为醒目啊！","py":"A: Wèishénme nǐ yào rǎn zhège yánsè de tóufǎ? B: Yīnwèi xǐngmù ā!","en":"A: Why did you dye your hair into this color? B: Because it's eye-catching!"},{"zh":"你今天穿了一身的荧光绿，真醒目。","py":"Nǐ jīntiān chuānle yīshēn de yíngguāng lǜ, zhēn xǐngmù.","en":"You're dressed all in light green today, how eye-catching!"}]},{"id":980,"hanzi":"私生活","part":"Noun","pinyin":"sī shēnghuó","def":"private life","ex":[{"zh":"有些人不喜欢在公司谈自己的私生活。","py":"Yǒuxiē rén bù xǐhuan zài gōngsī tán zìjǐ de sīshēnghuó.","en":"Some people don't like to talk about private life in the company."},{"zh":"我的私生活很简单，运动和在家休息。","py":"Wǒ de sī shēng huó hěn jiǎn dān, yùn dòng hé zài jiā xiū xī.","en":"My private life is very simple, exercise and take a rest at home."}]},{"id":981,"hanzi":"干涉","part":"Verb","pinyin":"gānshè","def":"to intervene","ex":[{"zh":"我的妈妈有时候会干涉我做的决定, 不过我知道那是因为他在乎我。","py":"Wǒ de māmā yǒu shíhou huì gānshè wǒ zuò de juédìng, Búguò wǒ zhīdào nà shì yīnwèi tā zàihū wǒ.","en":"My mom sometimes intervenes my decisions, but I know that it is because she cares about me."},{"zh":"请不要干涉他人的私事。","py":"Qǐng bùyào gānshè tārén de sīshì","en":"Please do not interfere with the private affairs of others"}]},{"id":982,"hanzi":"让步","part":"Verb","pinyin":"ràngbù","def":"to concede, concession","ex":[{"zh":"他已经让步了, 且接受我的看法。","py":"Tā yǐjīng ràngbùle, qiě jiēshòu wǒ de kànfǎ.","en":"He has already made concession and accepted my opinions."},{"zh":"这个部分你不可以让步，因为不是你的错。","py":"Zhè gè bùfèn nǐ bù kěyǐ ràng bù，yīnwèi bù shì nǐ de cuò.","en":"You cannot concede at this part because it's not your fault."}]},{"id":983,"hanzi":"吃坏肚子","part":"Phrase","pinyin":"chī huài dùzi","def":"to get sick because of bad food","ex":[{"zh":"我想我吃坏肚子了, 今天早上起来肚子一直不太舒服。","py":"Wǒ xiǎng wǒ chī huài dùzile, jīntiān zǎoshang qǐlái dùzi yīzhí bù tài shūfú.","en":"I think I got sick because of bad food. My stomach doesn't feel well from this morning."},{"zh":"到了新的国家，刚开始难免吃坏肚子。","py":"Dào le xīn de guó jiā ，gāng kāi shǐ nán miǎn chī huài dù zǐ.","en":"It's unavoidable to get sick because of bad food when you just went to another country."}]},{"id":984,"hanzi":"新鲜","part":"Adj","pinyin":"xīnxiān","def":"fresh","ex":[{"zh":"趁这些食物还新鲜, 赶快把它吃完。","py":"Chèn zhèxiē shíwù hái xīnxiān, gǎnkuài bǎ tā chī wán.","en":"Finish this food when it's still fresh."},{"zh":"这里的海鲜非常新鲜，爸爸都在这里买鱼。","py":"Zhè lǐ de hǎi xiān fēi cháng xīn xiān ，bà bà dōu zài zhè lǐ mǎi yú.","en":"The seafood here is very fresh, dad always buys fish here."}]},{"id":985,"hanzi":"拉肚子","part":"Verb Object","pinyin":"lādùzi","def":"to have diarrhea","ex":[{"zh":"吃了不新鲜的食物, 你当然拉肚子。","py":"Chī liǎo bù xīnxiān de shíwù, nǐ dāngrán lādùzi.","en":"Of course you had diarrhea, you just ate stale seafood."},{"zh":"我到智利的第一个星期，每天拉肚子。","py":"Wǒ dào zhì lì de dì yī gè xīng qī, měi tiān lādùzǐ.","en":"The first week in Chile, I had diarrhea every day."}]},{"id":986,"hanzi":"疼","part":"Adj","pinyin":"téng","def":"painful","ex":[{"zh":"昨天吃了那个海鲜以后, 我就开始肚子疼了。","py":"Zuótiān chīle nàgè hǎixiān yǐhòu, wǒ jiù kāishǐ dùzi téngle.","en":"I had a stomachache after eating that seafood yesterday."},{"zh":"昨天晚上喝了很多酒，今天头很疼。","py":"Zuótiān wǎnshàng hēle hěnduō jiǔ, jīntiān tóu hěn téng.","en":"I drank too much alcohol, I had a headache today."}]},{"id":987,"hanzi":"急诊","part":"Noun","pinyin":"jízhěn","def":"emergency","ex":[{"zh":"现在这么晚了,现在只能去医院看急诊。","py":"Xiànzài zhème wǎnle, xiànzài zhǐ néng qù yīyuàn kàn jízhěn.","en":"Now it's so late, we can only go to the emergency in the hospital."},{"zh":"星期天晚上，诊所都休息，现在只能看急诊。","py":"Xīngqī tiān wǎnshàng ，zhěnsuǒ dōu xiūxī ，xiànzài zhǐ néng kàn jízhěn.","en":"The clinics would close on Sunday night, now we can only go to the hospital emergency."}]},{"id":988,"hanzi":"打针","part":"Verb Object","pinyin":"dǎzhēn","def":"to inject","ex":[{"zh":"你的病需要打针, 才能快一点好。","py":"Nǐ de bìng xūyào dǎzhēn, cáinéng kuài yīdiǎn hǎo.","en":"You need to get an injection so that your sickness can recover sooner."},{"zh":"他已经三十岁了，但是还是很害怕打针。","py":"Tā yǐjīng sānshí suìle, dànshì háishì hěn hàipà dǎzhēn.","en":"He's thirty years old but is still afraid of getting a shot."}]},{"id":989,"hanzi":"熟","part":"Adj","pinyin":"shú","def":"cooked, done","ex":[{"zh":"这猪肉还没熟,再等一下吧！","py":"Zhè zhūròu hái méi shú, zài děng yīxià ba!","en":"The pork is not yet done, just wait for a bit more."},{"zh":"我喜欢吃五分熟的牛排。","py":"Wǒ xǐhuān chī wǔ fēn shú de niúpái.","en":"I like to eat medium-rare steak."}]},{"id":990,"hanzi":"羊肉","part":"Noun","pinyin":"yángròu","def":"lamb meat","ex":[{"zh":"我不太喜欢这羊肉的味道, 闻起来不新鲜。","py":"Wǒ bù tài xǐhuan zhè yángròu de wèidào, wén qǐlái bu xīnxiān.","en":"I don't like the smell of this lamb meat which is not fresh."},{"zh":"今天的晚餐是羊肉炒饭","py":"Jīntiān de wǎncān shì yángròu chǎofàn.","en":"Today's dinner is lamb fried rice."}]},{"id":991,"hanzi":"海鲜","part":"Noun","pinyin":"hǎixiān","def":"sea food","ex":[{"zh":"A: 你喜欢吃哪些海鲜？ B: 我喜欢吃鱼和螃蟹。","py":"A: Nǐ xǐhuan chī nǎxiē hǎixiān? B: Wǒ xǐhuan chī yú hé pángxiè.","en":"A: What seafood do you like? B: I like to eat fish and crab."},{"zh":"弟弟对海鲜过敏。","py":"Dì dì duì hǎi xiān guòmǐn.","en":"My younger brother is allergic to seafood."}]},{"id":992,"hanzi":"表","part":"Noun","pinyin":"biǎo","def":"watch","ex":[{"zh":"我有一块古老的表。","py":"Wǒ yǒu yíkuài gǔlǎo de biǎo.","en":"I have an old watch."},{"zh":"我的表没电了，等一下要去换电池。","py":"Wǒ de biǎo méi diàn le, děng yī xià yào qù huàn diàn chí.","en":"My watch is running out of battery, I'll go change a new battery later."}]},{"id":993,"hanzi":"块","part":"Measure word","pinyin":"kuài","def":"a unit that calculates blocks or pieces","ex":[{"zh":"这块蛋糕是你吃的吗？","py":"Zhè kuài dàngāo shì nǐ chī de ma?","en":"Did you eat this piece of cake?"},{"zh":"你的衣服有一块污渍，是不是沾到咖啡了？","py":"Nǐ de yī fú yǒu yī kuài wū zì ，shì bù shì zhān dào kā fēi le?","en":"There's a stain on your shirt, is that coffee stain?"}]},{"id":994,"hanzi":"样式","part":"Noun","pinyin":"yàngshì","def":"style, type","ex":[{"zh":"这件衣服的样式很特别，我非常喜欢。","py":"Zhè jiàn yīfu de yàngshì hěn tèbié, wǒ fēicháng xǐhuan.","en":"The style of this shirt is special, I like it very much."},{"zh":"这种样式太旧了，我们想买现代一点的。","py":"Zhè zhǒng yàng shì tài jiù le ，wǒ men xiǎng mǎi xiàn dài yī diǎn de.","en":"This style is too old, we want to buy something more modern."}]},{"id":995,"hanzi":"这边","part":"Noun","pinyin":"zhè biān","def":"here","ex":[{"zh":"请往这边走，有更多的商品可以看。","py":"Qǐng wǎng zhè biān zǒu, yǒu gèng duō de shāngpǐn kěyǐ kàn.","en":"Please come this way, there are more products you can shop."},{"zh":"走这边，那边不是厕所，是厨房。","py":"Zǒu zhè biān ，nà biān bù shì cè suǒ ，shì chú fáng.","en":"This way! That way is not the toilet, that's kitchen."}]},{"id":996,"hanzi":"名贵","part":"Adj","pinyin":"míngguì","def":"famous and valuable, rare, precious","ex":[{"zh":"这双鞋子太名贵，我买不起。","py":"Zhè shuāng xiézi tài míngguì, wǒ mǎi bù qǐ.","en":"This pair of shoes is too expensive, I cannot afford it."},{"zh":"这辆名贵的车是我爸爸的。","py":"Zhè liàng míng guì de chē shì wǒ bà bà de.","en":"This valuable car is my dad's."}]},{"id":997,"hanzi":"包装","part":"Verb","pinyin":"bāozhuāng","def":"to pack, to package","ex":[{"zh":"请帮我把这件礼物包装好。","py":"Qǐng bāng wǒ bǎ zhè jiàn lǐwù bāozhuāng hǎo.","en":"Please wrap this gift for me."},{"zh":"蛋糕我要直接吃，就不需要包装了。","py":"Dàn gāo wǒ yào zhí jiē chī ，jiù bù xū yào bāo zhuāng le.","en":"I'm going to eat that cake directly, so no need to pack it."}]},{"id":998,"hanzi":"产","part":"Verb","pinyin":"chǎn","def":"to produce","ex":[{"zh":"这台电脑是美国产的。","py":"Zhè tái diànnǎo shì Měiguó chǎn de.","en":"This computer is made in America."},{"zh":"墨西哥夏天产仙人掌果。","py":"Mò xī gē xià tiān chǎn xiān rén zhǎng guǒ.","en":"Cactus fruits grow from Mexico's summer."}]},{"id":999,"hanzi":"愿意","part":"Verb","pinyin":"yuànyì","def":"to be willing to","ex":[{"zh":"他不愿意让妹妹一个人出国旅行。","py":"Tā bú yuànyì ràng mèimei yígè rén chūguó lǚxíng.","en":"He's not willing to let my younger sister travel abroad alone."},{"zh":"她不愿意跟我说话。","py":"Tā bù yuàn yì gēn wǒ shuōhuà.","en":"She's not willing to talk to me."}]}]</script>
<script>
"use strict";
const CARDS = JSON.parse(document.getElementById('carddata').textContent);
const STORE_KEY = 'mandarin_srs_v1';
const DAY = 86400000;

// ---------- persistence ----------
let state = load();
function load(){
  try{ const s = JSON.parse(localStorage.getItem(STORE_KEY)); if(s && s.cards) return s; }catch(e){}
  return fresh();
}
function fresh(){
  const cards = {};
  CARDS.forEach(c => cards[c.id] = {id:c.id, ease:2.5, intervalD:0, reps:0, due:0, lapses:0});
  return {cards, showHanzi:false, lastVoice:null, speed:0.7, newPerDay:20, log:{}, streak:{count:0, last:null}, sessionNew:0};
}
function save(){ localStorage.setItem(STORE_KEY, JSON.stringify(state)); }

// ---------- scheduling (SM-2 variant) ----------
function newPerDay(){ return state.newPerDay ?? 20; }   // cap new cards introduced per day
function now(){ return Date.now(); }
function dayKey(ts){ return new Date(ts).toISOString().slice(0,10); }
function isNew(s){ return s.reps === 0; }

function dueQueue(){
  const t = now();
  const due = [], fresh = [];
  for(const c of CARDS){
    const s = state.cards[c.id];
    if(s.reps === 0) fresh.push(c);
    else if(s.due <= t) due.push(c);
  }
  due.sort((a,b)=> state.cards[a.id].due - state.cards[b.id].due);
  const room = Math.max(0, newPerDay() - state.sessionNew);
  return {due, fresh: fresh.slice(0, room), totalNew: fresh.length, totalDue: due.length};
}

function grade(card, q){ // q: 0 again,1 hard,2 good,3 easy
  const s = state.cards[card.id];
  const wasNew = s.reps === 0;
  if(q === 0){
    s.reps = Math.max(1, s.reps); s.lapses++;
    s.ease = Math.max(1.3, s.ease - 0.2);
    s.intervalD = 0; s.due = now() + 60*1000; // see again in 1 min (this session)
  } else {
    if(s.reps === 0){ s.intervalD = q===1?1:q===2?1:3; }
    else if(s.reps === 1){ s.intervalD = q===1?2:q===2?3:5; }
    else { const m = q===1?1.2:q===2?s.ease:s.ease*1.3; s.intervalD = Math.round(s.intervalD * m); }
    if(q===1) s.ease = Math.max(1.3, s.ease - 0.15);
    if(q===3) s.ease = s.ease + 0.15;
    s.intervalD = Math.max(1, s.intervalD);
    s.due = now() + s.intervalD * DAY;
    s.reps++;
  }
  if(wasNew && q!==0){ state.sessionNew++; }
  // review log for stats (retention + reviews/day)
  if(!state.log) state.log = {};
  const k = dayKey(now());
  const d = state.log[k] || (state.log[k] = {reviews:0, again:0});
  d.reviews++; if(q===0) d.again++;
  bumpStreak();
  save();
}
function bumpStreak(){
  const today = new Date().toDateString();
  if(state.streak.last === today) return;
  const y = new Date(Date.now()-DAY).toDateString();
  state.streak.count = (state.streak.last === y) ? state.streak.count+1 : 1;
  state.streak.last = today;
}

// ---------- TTS ----------
let voices = [], chosenVoice = null;
function loadVoices(){   // word audio + fallback only; no header DOM (voice picker lives in Settings)
  voices = speechSynthesis.getVoices().filter(v=>/zh|cmn|chinese|mandarin/i.test(v.lang+v.name));
  let idx = voices.findIndex(v=>v.name===state.lastVoice);
  if(idx<0) idx = voices.findIndex(v=>/CN|Tingting|Ting-Ting|cmn/i.test(v.name+v.lang));
  if(idx<0) idx = 0;
  chosenVoice = voices[idx] || null;
  const vs = document.getElementById('setVoice'); if(vs) fillVoiceSelect(vs);   // refresh if Settings open
}
function fillVoiceSelect(sel){
  if(!voices.length){ sel.innerHTML='<option>No Mandarin voice installed</option>'; return; }
  sel.innerHTML = voices.map((v,i)=>`<option value="${i}"${v===chosenVoice?' selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  sel.onchange = e=>{ chosenVoice = voices[+e.target.value]; if(chosenVoice){ state.lastVoice = chosenVoice.name; save(); } };
}
speechSynthesis.onvoiceschanged = loadVoices;
loadVoices();

let curUtter = null, curAudio = null;
const AUDIO_DIR = 'audio/';   // pre-generated sentence files: audio/s_<id>_<i>.mp3
function stopAudio(){
  speechSynthesis.cancel();
  if(curAudio){ curAudio.pause(); curAudio = null; }
  document.querySelectorAll('.play.playing,.wplay.playing,.miniplay.playing').forEach(b=>b.classList.remove('playing'));
}
// browser TTS (used for words, and as fallback when a file is missing)
function speak(text, btn){
  if(!('speechSynthesis' in window)) return;
  stopAudio();
  const u = new SpeechSynthesisUtterance(text);
  if(chosenVoice){ u.voice = chosenVoice; u.lang = chosenVoice.lang; } else { u.lang='zh-CN'; }
  u.rate = state.speed || 0.7;
  if(btn){ btn.classList.add('playing'); u.onend = u.onerror = ()=>btn.classList.remove('playing'); }
  curUtter = u; speechSynthesis.speak(u);
}
// play a pre-generated sentence file at the chosen speed; fall back to TTS on any error
function playFile(file, fallbackText, btn){
  stopAudio();
  const a = new Audio(AUDIO_DIR + file);
  a.playbackRate = state.speed || 0.7;        // pitch is preserved by default
  if(btn) btn.classList.add('playing');
  const clear = ()=>{ if(btn) btn.classList.remove('playing'); };
  a.onended = clear;
  a.onerror = ()=>{ clear(); if(curAudio===a) curAudio=null; speak(fallbackText, btn); };
  curAudio = a;
  a.play().catch(()=>{ clear(); if(curAudio===a) curAudio=null; speak(fallbackText, btn); });
}

// ---------- view ----------
const main = document.getElementById('main');
let queue = [], current = null, flipped = false;

function refillQueue(){
  const {due, fresh} = dueQueue();
  queue = [...due, ...fresh];
}
function nextCard(){
  flipped = false;
  // pull a card whose due time has arrived (handles 1-min relapses)
  refillQueue();
  const t = now();
  queue = queue.filter(c => state.cards[c.id].reps===0 || state.cards[c.id].due <= t + 1);
  current = queue[0] || null;
  render();
}

function statsLine(){
  const {totalDue, totalNew} = dueQueue();
  const learned = CARDS.filter(c=>state.cards[c.id].reps>0).length;
  document.getElementById('stats').innerHTML =
    'Due <b>'+totalDue+'</b> · New <b>'+Math.max(0,newPerDay()-state.sessionNew)+'</b> · Learned <b>'+learned+'</b>/1000';
  document.getElementById('streak').textContent = state.streak.count>0 ? '🔥 '+state.streak.count+'-day streak' : '';
}

function render(){
  statsLine();
  const hz = state.showHanzi ? '' : 'hidden';
  if(!current){
    main.innerHTML = '<div class="empty"><h2>🎉 All caught up</h2><p>No cards due right now. Come back later, or your relapsed cards will reappear shortly.</p></div>';
    return;
  }
  const c = current;
  if(!flipped){
    main.innerHTML = `
    <div class="card" id="frontCard" style="cursor:pointer">
      <div class="cardtop">
        <span class="part">${esc(c.part||'')}</span>
        <div class="word">${esc(c.pinyin)}<button class="wplay" data-zh="${esc(c.hanzi)}" title="Play word">🔊</button>
          <span class="tap">tap card to reveal · 🔊 hears the word</span>
        </div>
        <div class="hanziline ${hz}">${esc(c.hanzi)}</div>
      </div>
      <div class="controls"><button class="show" id="showBtn">Show answer</button></div>
    </div>`;
    // tap anywhere on the card flips, except the word-audio button
    document.getElementById('frontCard').onclick = e=>{ if(!e.target.closest('.wplay')) flip(); };
    document.querySelectorAll('.wplay').forEach(b=> b.onclick = ()=> speak(b.dataset.zh, b));
  } else {
    const exHtml = c.ex.map((e,i)=>`
      <div class="ex">
        <button class="play" data-zh="${esc(e.zh)}" data-file="s_${c.id}_${i}.mp3" title="Play audio">▶</button>
        <div class="extxt">
          <div class="py">${esc(e.py)}</div>
          <div class="en">${esc(e.en)}</div>
          <div class="zh ${hz}">${esc(e.zh)}</div>
        </div>
      </div>`).join('');
    main.innerHTML = `
    <div class="card">
      <div class="cardtop" style="padding-bottom:18px">
        <span class="part">${esc(c.part||'')}</span>
        <div class="word" style="font-size:34px">${esc(c.pinyin)}<button class="wplay" data-zh="${esc(c.hanzi)}" title="Play word (W)">🔊</button></div>
        <div class="hanziline ${hz}">${esc(c.hanzi)}</div>
      </div>
      <div class="def">${esc(c.def)}</div>
      <div class="divider"></div>
      <div class="examples">${exHtml}</div>
      <div class="controls">
        <button class="grade g-again" data-q="0">Again<small>&lt;1m</small></button>
        <button class="grade g-hard" data-q="1">Hard<small id="iv1"></small></button>
        <button class="grade g-good" data-q="2">Good<small id="iv2"></small></button>
        <button class="grade g-easy" data-q="3">Easy<small id="iv3"></small></button>
      </div>
    </div>`;
    document.querySelectorAll('.play, .wplay').forEach(b=> b.onclick = ()=> playBtn(b));
    document.querySelectorAll('.grade').forEach(b=> b.onclick = ()=>{ grade(c, +b.dataset.q); nextCard(); });
    // interval previews
    setIvPreview(c);
    // auto-play first example
    if(c.ex[0]) playFile('s_'+c.id+'_0.mp3', c.ex[0].zh, document.querySelector('.play'));
  }
}
function setIvPreview(c){
  const fmt = d => d===0?'<1d': d<30? d+'d' : Math.round(d/30)+'mo';
  const s = state.cards[c.id];
  const peek = q=>{ const tmp=JSON.parse(JSON.stringify(s)); // simulate
    let iv; if(q===1){iv = s.reps<=1?(s.reps===0?1:2):Math.round(s.intervalD*1.2);}
    else if(q===2){iv = s.reps===0?1:s.reps===1?3:Math.round(s.intervalD*s.ease);}
    else {iv = s.reps===0?3:s.reps===1?5:Math.round(s.intervalD*s.ease*1.3);}
    return Math.max(1,iv); };
  const e1=document.getElementById('iv1'), e2=document.getElementById('iv2'), e3=document.getElementById('iv3');
  if(e1) e1.textContent=fmt(peek(1)); if(e2) e2.textContent=fmt(peek(2)); if(e3) e3.textContent=fmt(peek(3));
}
function flip(){ flipped = true; render(); }
function esc(s){ return (s||'').replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }
// play a button: prefer its pre-generated file, else browser TTS (words have no file)
function playBtn(b){ if(b.dataset.file) playFile(b.dataset.file, b.dataset.zh, b); else speak(b.dataset.zh, b); }

// ---------- controls ----------
document.addEventListener('keydown', e=>{
  if(e.target.tagName==='SELECT'||e.target.tagName==='INPUT') return;
  if(overlayEl.classList.contains('open')){ if(e.key==='Escape') closeModal(); return; }
  if(e.code==='Space'){ e.preventDefault(); if(current && !flipped) flip(); }
  else if(e.key==='w'||e.key==='W'){ if(current) speak(current.hanzi, document.querySelector('.wplay')); }
  else if(e.key==='r'||e.key==='R'){ if(flipped&&current&&current.ex[0]) playFile('s_'+current.id+'_0.mp3', current.ex[0].zh, document.querySelector('.play')); }
  else if(flipped && current && ['1','2','3','4'].includes(e.key)){ grade(current, +e.key-1); nextCard(); }
});

// export / import / reset (invoked from the Settings panel)
function exportProgress(){
  const blob = new Blob([JSON.stringify(state)], {type:'application/json'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'mandarin-srs-progress-'+new Date().toISOString().slice(0,10)+'.json'; a.click();
  toast('Progress exported');
}
document.getElementById('importFile').onchange = e=>{
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{ try{ const s=JSON.parse(r.result); if(!s.cards) throw 0;
    // merge: ensure all current cards exist
    CARDS.forEach(c=>{ if(!s.cards[c.id]) s.cards[c.id]={id:c.id,ease:2.5,intervalD:0,reps:0,due:0,lapses:0}; });
    state=s; save(); loadVoices(); closeModal(); nextCard(); toast('Progress imported');
  }catch(err){ toast('Invalid file'); } };
  r.readAsText(f); e.target.value='';
};
function importProgress(){ document.getElementById('importFile').click(); }
function resetProgress(){
  if(confirm('Reset all progress? This cannot be undone (export first to keep a backup).')){
    state = fresh(); save(); closeModal(); nextCard(); toast('Progress reset');
  }
}
let toastT;
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),1800); }

// status helper used by browse + stats
function cardStatus(c){
  const s = state.cards[c.id];

  if(s.intervalD >= 21) return {key:'mature', label:'Mature'};

}

// ================= stats dashboard =================
document.getElementById('statsBtn').onclick = ()=>{
  const t=now();
  let learned=0, mature=0, learning=0, neu=0, dueNow=0, lapsesTot=0, easeSum=0, leeches=0;
  for(const c of CARDS){
    const s=state.cards[c.id]; lapsesTot+=s.lapses||0;
    if(s.lapses>=4) leeches++;
    if(s.reps===0){ neu++; continue; }
    learned++; easeSum+=s.ease;
    if(s.due<=t) dueNow++;
    if(s.intervalD>=21) mature++; else learning++;
  }
  // reviews/day last 14 days + retention last 30
  const log=state.log||{};
  const days=[]; for(let i=13;i>=0;i--){ const k=dayKey(t-i*DAY); const d=log[k]||{reviews:0,again:0}; days.push({k,rev:d.reviews}); }
  const maxRev=Math.max(1,...days.map(d=>d.rev));
  let rev30=0, again30=0;
  for(let i=0;i<30;i++){ const d=log[dayKey(t-i*DAY)]; if(d){ rev30+=d.reviews; again30+=d.again; } }
  const retention = rev30? Math.round((1-again30/rev30)*100) : null;
  const revToday = (log[dayKey(t)]||{reviews:0}).reviews;
  // due forecast next 7 days
  const fc=[0,0,0,0,0,0,0];
  for(const c of CARDS){ const s=state.cards[c.id]; if(s.reps===0) continue; const dd=Math.ceil((s.due-t)/DAY); if(dd>=0&&dd<7) fc[dd]++; }
  const maxFc=Math.max(1,...fc);
  const avgEase = learned? (easeSum/learned).toFixed(2) : '–';

  const barsRev = days.map(d=>`<div class="bar"><div class="val">${d.rev||''}</div><div class="fill" style="height:${Math.round(d.rev/maxRev*70)}%"></div><div class="cap">${d.k.slice(5)}</div></div>`).join('');
  const barsFc = fc.map((n,i)=>`<div class="bar future"><div class="val">${n||''}</div><div class="fill" style="height:${Math.round(n/maxFc*70)}%"></div><div class="cap">${i===0?'today':'+'+i+'d'}</div></div>`).join('');
  const pct=n=>learned? (n/CARDS.length*100):0;
  const matbar = `<div class="matbar">
      <div style="background:var(--good);width:${pct(mature)}%" title="Mature">${mature>40?mature:''}</div>
      <div style="background:var(--hard);width:${pct(learning)}%" title="Learning">${learning>40?learning:''}</div>
      <div style="background:var(--panel2);color:var(--muted);width:${neu/CARDS.length*100}%" title="New">${neu>60?neu:''}</div>
    </div>
    <div style="display:flex;gap:14px;font-size:11px;color:var(--muted);margin-top:6px">
      <span><span style="color:var(--good)">■</span> Mature ${mature}</span>
      <span><span style="color:var(--hard)">■</span> Learning ${learning}</span>
      <span><span style="color:var(--muted)">■</span> New ${neu}</span>
    </div>`;

  openModal('Statistics', `
    <div class="statgrid">
      <div class="stat"><div class="n">${learned}<span style="font-size:14px;color:var(--muted)">/1000</span></div><div class="l">Words learned</div></div>
      <div class="stat"><div class="n good">${mature}</div><div class="l">Mature (≥21d)</div></div>
      <div class="stat"><div class="n warn">${dueNow}</div><div class="l">Due now</div></div>
      <div class="stat"><div class="n acc">${retention===null?'–':retention+'%'}</div><div class="l">Retention (30d)</div></div>
      <div class="stat"><div class="n">${revToday}</div><div class="l">Reviews today</div></div>
      <div class="stat"><div class="n">${avgEase}</div><div class="l">Avg ease</div></div>
      <div class="stat"><div class="n">${state.streak.count||0}</div><div class="l">Day streak 🔥</div></div>
      <div class="stat"><div class="n ${leeches?'warn':''}">${leeches}</div><div class="l">Leeches (4+ lapses)</div></div>
    </div>
    <div class="secttitle">Collection</div>
    ${matbar}
    <div class="secttitle">Reviews — last 14 days</div>
    <div class="bars">${barsRev}</div>
    <div class="secttitle">Due forecast — next 7 days</div>
    <div class="bars">${barsFc}</div>
    ${leeches?`<div class="cramwrap" style="margin-top:18px"><button class="iconbtn" id="studyLeeches">Study ${leeches} leech${leeches>1?'es':''} now</button></div>`:''}
  `);
  const lb=document.getElementById('studyLeeches');
  if(lb) lb.onclick=()=>{ const set=CARDS.filter(c=>(state.cards[c.id].lapses||0)>=4); startCram(set,'Leeches'); };
};

const PARTS = [...new Set(CARDS.map(c=>c.part).filter(Boolean))].sort();
document.getElementById('browseBtn').onclick = openBrowse;
function openBrowse(){
  openModal('Browse &amp; Search', `
    <div class="browsebar">
      <input type="text" id="bq" placeholder="Search pinyin, English, or sentence…" autocomplete="off">
      <select id="bpart"><option value="">All parts</option>${PARTS.map(p=>'<option>'+esc(p)+'</option>').join('')}</select>
      <select id="bstatus"><option value="">All status</option><option value="new">New</option><option value="learn">Learning</option><option value="mature">Mature</option><option value="due">Due</option></select>
    </div>
    <div class="browsecount" id="bcount"></div>
    <div class="cramwrap" style="margin-bottom:12px"><button class="iconbtn" id="cramBtn">▶ Cram these (no scheduling)</button></div>
    <div class="blist" id="blist"></div>`);
  const q=document.getElementById('bq'), part=document.getElementById('bpart'), st=document.getElementById('bstatus');
  let shown=[];
  function matches(){
    const term=q.value.trim().toLowerCase(), p=part.value, s=st.value;
    shown = CARDS.filter(c=>{
      if(p && c.part!==p) return false;
      if(s && cardStatus(c).key!==s) return false;
      if(!term) return true;
      if((c.pinyin+' '+c.def).toLowerCase().includes(term)) return true;
      return c.ex.some(e=>(e.py+' '+e.en).toLowerCase().includes(term));
    });
    return shown;
  }
  function draw(){
    const list=matches();
    document.getElementById('bcount').textContent = list.length+' word'+(list.length===1?'':'s');
    document.getElementById('blist').innerHTML = list.slice(0,400).map(c=>{
      const stt=cardStatus(c);
      const ex=c.ex.map((e,i)=>`<div class="bex"><button class="miniplay" data-zh="${esc(e.zh)}" data-file="s_${c.id}_${i}.mp3">▶</button><div><div class="py">${esc(e.py)}</div><div class="en">${esc(e.en)}</div></div></div>`).join('');
      return `<div class="brow" data-id="${c.id}">
        <div class="browtop">
          <button class="miniplay wplay" data-zh="${esc(c.hanzi)}" title="Play word">🔊</button>
          <span class="bpy">${esc(c.pinyin)}</span>
          <span class="bdef">${esc(c.def)}</span>
          <span class="badge ${stt.key}">${stt.label}</span>
        </div>
        <div class="bdetail">${ex}</div>
      </div>`;
    }).join('') + (list.length>400?'<div class="browsecount">Showing first 400 — refine your search.</div>':'');
    document.querySelectorAll('#blist .brow').forEach(r=>{
      r.onclick=e=>{ if(e.target.closest('.miniplay')) return; r.classList.toggle('open'); };
    });
    document.querySelectorAll('#blist .miniplay').forEach(b=> b.onclick=()=> playBtn(b));
  }
  q.oninput=draw; part.onchange=draw; st.onchange=draw;
  document.getElementById('cramBtn').onclick=()=>{ if(shown.length) startCram(shown.slice(),'Cram'); };
  draw(); q.focus();
}

// cram: flip-through of a fixed set, no SRS changes
function startCram(set, label){
  let i=0, flip=false;
  function show(){
    const c=set[i]; const hz = state.showHanzi?'':'hidden';
    if(!flip){
      modalBox.querySelector('#modalBody').innerHTML = `
        <div class="cramwrap" style="color:var(--muted);font-size:12px;margin-bottom:14px">${label} · ${i+1} / ${set.length}</div>
        <div class="card" style="box-shadow:none;border:none;background:transparent">
          <div class="cardtop"><span class="part">${esc(c.part||'')}</span>
            <div class="word">${esc(c.pinyin)}<button class="wplay" data-zh="${esc(c.hanzi)}" title="Play word">🔊</button><span class="tap">tap to reveal</span></div>
            <div class="hanziline ${hz}">${esc(c.hanzi)}</div>
          </div>
          <div class="controls"><button class="show" id="cramShow">Show answer</button></div>
        </div>`;
      modalBox.querySelector('#cramShow').onclick=()=>{ flip=true; show(); };
      modalBox.querySelectorAll('.wplay').forEach(b=> b.onclick=()=> speak(b.dataset.zh,b));
    } else {
      const ex=c.ex.map((e,i)=>`<div class="ex"><button class="play" data-zh="${esc(e.zh)}" data-file="s_${c.id}_${i}.mp3">▶</button><div class="extxt"><div class="py">${esc(e.py)}</div><div class="en">${esc(e.en)}</div><div class="zh ${hz}">${esc(e.zh)}</div></div></div>`).join('');
      modalBox.querySelector('#modalBody').innerHTML = `
        <div class="cramwrap" style="color:var(--muted);font-size:12px;margin-bottom:14px">${label} · ${i+1} / ${set.length}</div>
        <div class="card" style="box-shadow:none;border:none;background:transparent">
          <div class="cardtop" style="padding-bottom:14px"><span class="part">${esc(c.part||'')}</span>
            <div class="word" style="font-size:32px">${esc(c.pinyin)}<button class="wplay" data-zh="${esc(c.hanzi)}" title="Play word">🔊</button></div>
            <div class="hanziline ${hz}">${esc(c.hanzi)}</div></div>
          <div class="def">${esc(c.def)}</div><div class="divider"></div>
          <div class="examples">${ex}</div>
          <div class="controls">
            <button class="iconbtn" id="cramPrev" ${i===0?'disabled':''}>← Prev</button>
            <button class="iconbtn" id="cramNext">${i===set.length-1?'Done':'Next →'}</button>
          </div>
        </div>`;
      modalBox.querySelectorAll('.play, .wplay').forEach(b=> b.onclick=()=> playBtn(b));
      if(c.ex[0]) playFile('s_'+c.id+'_0.mp3', c.ex[0].zh, modalBox.querySelector('.play'));
      modalBox.querySelector('#cramPrev').onclick=()=>{ if(i>0){i--;flip=false;show();} };
      modalBox.querySelector('#cramNext').onclick=()=>{ if(i<set.length-1){i++;flip=false;show();} else openBrowse(); };
    }
  }
  openModal('Cram', '');   // openModal creates the #modalBody container
  show();
}

// new-day session reset of sessionNew counter
(function(){
  const today=new Date().toDateString();
  if(state.streak.last !== today){ state.sessionNew = 0; save(); }
})();

nextCard();
</script>
<script>
// Register the service worker for offline use + home-screen install (no-op on file://)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
</script>
